        for (const q of keys.filter(key => COOL[key].quick)) { const had = S[q]; await roll(0.99, ACTIONS[q]); if (S[q] !== had || S.heat !== 90) fail('a third fast fix worked', q); }
        if (S.lielow && S.trips >= COOL.lielow.trips) { await ACTIONS.lielow(); if (S.heat !== 90 - COOL.lielow.drop[2]) fail('lying low was blocked by fast fixes'); }

    }

    fresh(50, {hp: COOL.acid.hp}); await ACTIONS.acid();
    if (S.acid !== GADGETS.acid[2] || S.hp !== COOL.acid.hp || S.heat !== 50) fail('print remover with no Health to spare');
    fresh(50, {hp: COOL.acid.hp + 1}); await ACTIONS.acid();
    if (S.hp !== 1 || S.heat !== 25) fail('print remover', S.hp, S.heat);
    // The Log Wiper's alarm: Heat goes up instead, it still counts as a fast fix, and it is still used up.
    const fires = coolFires, pots = stat('honeypot');
    for (const heat of [50, 97]) {

    for (let day = 0; day < COOL.vpn.days; day++) {
      S.heat = 20; heatUp(9); heatUp(8); heatUp(1);
      if (S.heat !== 20 + 5 + 4 + 1) fail('VPN did not halve', day, S.heat);
      S.heat = 20; S.fx.vpn = 0; addHeat(100000);
      const plain = S.heat - 20;
      S.heat = 20; S.fx.vpn = COOL.vpn.days - day; addHeat(100000);

    for (let night = 1; night <= COOL.decoy.nights + 1; night++) {

    if (!TEXT('decoy').includes(`${COOL.decoy.nights} nights`) || !TEXT('decoy').includes(`${COOL.decoy.cool}%`)) fail('decoy description');
    // The black market: a few kinds a day, one of each, dearer the hotter you are, and gone when sold.
    for (const heat of [0, 50, 90]) {
      fresh(heat, {loc: GEAR_SPOTS[0], cash: 10000000, day: 1 + heat / 5});
      for (const k of keys) S[k] = 0;
      rollMarket();

      if (kinds.length !== COOL_KINDS || kinds.some(k => !COOL[k] || stock[k] !== COOL_EACH)) fail('stock', stock);
      const scale = 1 + Math.floor(S.day / 10) * 0.5, seen = new Set();
      let cost = 0;
      autoPick = all => {

      };

      if (keys.some(k => S[k] !== (stock[k] || 0)) || S.cash !== 10000000 - cost || !cost || keys.some(k => !stock[k] && seen.has('x' + k)) ||

// Break-ins, step by step: the tables are whole, the odds shown are the odds rolled, the skill starts low and
// rises the way it says, every stage can go each way, loot respects the drive, devices pay later, and saves keep it all.
async function lockSelfTest() {
  const run = S, mine = career, keep = slot, random = Math.random, B = BREAKIN, get = store.get;
  const fail = (what, ...more) => { throw new Error(`Break-in test: ${what} ` + JSON.stringify(more)); };
  // Answer the next dialogs with these, in order (a dialog with one button answers itself); after that, the first thing on offer.
  const steer = list => {
    const q = list.slice();
    autoPick = all => {
      if (all.length === 1 || !q.length) return all.includes(true) ? true : all[0];
      const want = q.shift();
      if (!all.includes(want)) fail('choice not on offer', want, all);
      return want;
    };
  };
  const fixed = async (value, fn) => { Math.random = () => value; try { return await fn(); } finally { Math.random = random; } };
  const fresh = (level, o) => {
    career = newCareer(); fixCareer(); newGame(); setLockSkill(level);
    for (const k of Object.keys(TOOLS)) if (k !== 'clip') S[k] = GADGETS[k][2];
    Object.assign(S, o || {});
  };
  try {
    // The tables: every tool is a gadget with a picture, every break-in is whole, every line has three of them.
    for (const k of Object.keys(TOOLS)) {
      if (!MISC_ART[k] || (k !== 'clip' && !(GADGETS[k] && GADGETS[k][1] > 0 && GADGETS[k][2] > 0)) || !toolName(k)) fail('tool half defined', k);
    }
    for (const [id, H] of Object.entries(HEISTS)) {
      if (!LOCKS[H.lock] || !B.job[H.job] || !(H.tier >= 1 && H.tier <= B.pay.length) || !H.site || !H.inside || !H.prize ||
        (H.at && (!LOCATIONS.includes(H.at) || H.at === BUNKER)) || (H.job === 'plant' && !(GOODS.some(g => g[0] === H.dev) && H.n > 0 && PLANT_WHAT[H.dev])) ||
        !(H.guard === 'sec' || H.guard === 'law' || SYNDICATES[H.guard]) || [H.data, H.swag].some(l => l && !(GOODS.some(g => g[0] === l[0]) && l[1] > 0))) fail('break-in half defined', id);
    }
    for (const [key, chain] of Object.entries(QUESTS)) {
      const ids = chain.filter(m => m[2] === 'heist').map(m => m[4]);
      if (ids.length !== 3 || ids.some(id => !HEISTS[id] || !HEISTS[id].at) || chain.length !== QUEST_PAY.length + 3) fail('line', key, ids);
      career = newCareer(); career.syn = key;
      chain.forEach((m, n) => {
        career.quest = {n, p: 0, v: 3};
        const Q = quest();
        if (!(Q.xp > 0 && Q.cash > 0) || Q.title !== m[0] || !questGoal(Q) || (m[2] === 'heist' && Q.place !== HEISTS[m[4]].at)) fail('mission', key, n);
      });
      // A line from before the break-ins keeps its place: the same mission, by name.
      [0, 1, 2, 3, 4, 5, 6, 7].forEach(old => {
        career.quest = {n: old, p: 1, v: 2}; fixQuest();
        if (chain[career.quest.n][2] === 'heist' || chain.filter(m => m[2] !== 'heist')[old] !== chain[career.quest.n] || career.quest.p !== 1) fail('old place moved', key, old);
      });
      career.quest = {n: 9, p: 0, v: 2}; fixQuest();
      if (career.quest.n !== 12 || quest().title !== 'Standing orders') fail('finished line reopened', key);
    }
    for (const [name, c] of Object.entries(CONTACTS)) if (c[3].filter(g => g[2] === 'breakin' && HEISTS[g[3]]).length !== 1) fail('contact has no break-in', name);

    // The skill starts at level 1, a new run starts with picks, and the first doors open at that level.
    fresh(1);
    if (lockInfo().level !== 1 || career.lockpick !== 0) fail('starting skill', career.lockpick);
    newGame();
    if (S.picks !== START_PICKS || !toolsFor('padlock').includes('picks') || !toolsFor('padlock').includes('clip')) fail('starting tools');
    for (const [id, H] of Object.entries(HEISTS)) {
      if (H.tier === 1 && !(LOCKS[H.lock][2] === 'mech' && lockOdds('picks', H.lock, 0).open >= 40)) fail('first break-ins too hard', id);
    }
    // The odds: better with skill and with the right tool, worse on harder locks, and the wrong tool is no use at all.
    fresh(1);
    const kinds = Object.keys(LOCKS);
    for (const k of Object.keys(TOOLS)) {
      for (const lock of kinds) {
        const type = LOCKS[lock][2], block = toolBlock(k, lock);
        if (!!block !== (TOOLS[k].on !== 'any' && TOOLS[k].on !== type)) fail('wrong tool allowed', k, lock);
        setLockSkill(1); const low = lockOdds(k, lock, 0);
        setLockSkill(LOCK_MAX); const high = lockOdds(k, lock, 0);
        if (high.open < low.open || high.noise > low.noise || high.brk > low.brk || low.open < B.min || high.open > B.max) fail('skill does not help', k, lock, low, high);
        if (!block && !oddsLine(k, low).includes(`opens ${low.open}%`)) fail('odds not shown', k, lock);
        if (lockOdds(k, lock, 10).open < low.open) fail('casing does not help', k, lock);

    }
    setLockSkill(3);
    if (!(lockOdds('picks', 'padlock').open > lockOdds('picks', 'deadbolt').open && lockOdds('picks', 'deadbolt').open > lockOdds('picks', 'cylinder').open) ||
      !(lockOdds('pickgun', 'deadbolt').open > lockOdds('picks', 'deadbolt').open && lockOdds('picks', 'deadbolt').open > lockOdds('clip', 'deadbolt').open) ||
      !(lockOdds('bump', 'padlock').open > lockOdds('pickgun', 'padlock').open && lockOdds('bump', 'cylinder').open < lockOdds('picks', 'cylinder').open)) fail('tool or lock order');
    // What is shown is what is rolled: just under the chance opens, just over does not; and over many real tries it comes out the same.
    for (const [k, lock] of [['picks', 'deadbolt'], ['cloner', 'badge'], ['crowbar', 'maglock'], ['clip', 'padlock']]) {
      const o = lockOdds(k, lock, 0);
      S[k] = 2;
      if (!(await fixed((o.open - 0.5) / 100, () => lockTry(k, lock, 0))).open) fail('did not open under the chance', k, o);

    setLockSkill(1); S.picks = 3;
    const snap = await fixed(0.999, () => lockTry('picks', 'padlock', 0));   // 0.999: a miss, no break
    const snap2 = await (async () => { let n = 0; Math.random = () => [0.999, 0, 0][n++]; try { return lockTry('picks', 'padlock', 0); } finally { Math.random = random; } })();
    if (snap.open || snap.broke || S.picks !== 2 || !snap2.broke || !snap2.jam) fail('snapping', snap, snap2, S.picks);
    if (setLockSkill(99) !== career.lockpick || lockInfo().level !== LOCK_MAX || lockInfo().need !== 0 || gainLock(50) !== '') fail('top of the skill');

    fresh(LOCK_MAX);
    let cash = S.cash, clean = stat('cleanin'), done = stat('breakins');
    steer(['case', 'pickgun', 'careful', 'grab', 'clean']);
    await fixed(0, () => startHeist('ledger1', 0));
    if (S.fh || S.trips !== TRIPS_PER_DAY - 1 || S.heat !== B.heat.seen || S.cash < cash + B.pay[0][1] + B.cash[0] || stat('cleanin') !== clean + 1 ||
      stat('breakins') !== done + 1 || !S.inv['Cracked Accounts'] || S.pickgun !== GADGETS.pickgun[2]) fail('quiet job', S.heat, S.cash - cash, S.inv);
    // A loud one: in blind, crowbar, device taped up fast, out at a run. Less time inside, and the Heat is real.
    fresh(1);
    addItems('Rogue APs', 1, 0);
    steer(['blind', 'crowbar', 'fast', null, 'fast']);
    await fixed(0, () => startHeist('gig_lady', 0));

    if (S.fh || S.inv['Rogue APs'] || S.plants.length !== 1 || !S.plants[0].sloppy || S.plants[0].left !== B.plantDays[1] ||
      S.heat !== B.heat.forced + B.heat.fast[0] + Math.round(alert / B.heat.fast[1]) || stat('forced') < 1 || S.trips !== TRIPS_PER_DAY) fail('loud job', S.heat, S.plants);
    // A taped-up device can be found; a hidden one pays every night until it runs out.
    await fixed(0, () => plantsTick());
    if (S.plants.length || S.heat !== B.heat.forced + B.heat.fast[0] + Math.round(alert / B.heat.fast[1]) + B.heat.found) fail('device not found');
    fresh(LOCK_MAX);
    addItems('USB Droppers', 2, 0);

    await fixed(0, () => startHeist('null2', 0));
    if (S.plants.length !== 1 || S.plants[0].sloppy || S.plants[0].left !== B.plantDays[0] || S.inv['USB Droppers']) fail('careful plant', S.plants);

          Object.values(career.gear).some(it => !it || !RARITY[it.rar] || !Object.keys(it.stats).length) ||
          !Number.isInteger(career.xp) || !Number.isInteger(S.hp) || S.hp < 0 || S.hp > 100 || Object.keys(GADGETS).some(k => !(S[k] >= 0 && S[k] <= GADGETS[k][2])) || S.weapon >= WEAPONS.length || S.proxies > MAX_PROXIES ||
          Object.values(S.grudge).some(g => !(g >= 0)) || !!career.syn !== !!quest() || (career.quest && !(career.quest.p >= 0)) || !Number.isInteger(S.drive) || S.contracts.some(c => !(c.qty > 0 && c.payout > 0)) ||
          (S.gig && !(CONTACTS[S.gig.who] && S.gig.t > 0 && S.gig.p >= 0 && S.gig.cash > 0 && S.gig.xp > 0 && S.gig.due <= DAYS)) ||
          Object.values(career.rep || {}).some(n => !(n >= 0 && n <= TRUST_MAX)) ||
          S.heat < 0 || S.heat > 100 || S.opsec < 0 || S.opsec > 100 || S.day > DAYS || !Number.isInteger(S.heat) ||
          !(Number.isInteger(S.tricks) && S.tricks >= 0 && S.tricks <= QUICK_MAX) || !(Number.isInteger(S.fx.vpn) && S.fx.vpn >= 0 && S.fx.vpn <= COOL.vpn.days) ||
          !(Number.isInteger(S.fx.decoy) && S.fx.decoy >= 0 && S.fx.decoy <= COOL.decoy.nights) ||
          Object.values(S.markets).some(m => m.cool && Object.values(m.cool).some(q => !(q >= 0 && q <= COOL_EACH))) ||
          Object.values(S.inv).some(q => !(q > 0)) || [S.cash, S.wallet, S.debt].some(v => !Number.isInteger(v)) ||
          // Break-ins: the skill is a whole number of points, the practice board keeps count, planted devices are still paying,
          // and anything in progress is at a real stage with its Alert on the meter.
          !Number.isInteger(career.lockpick) || career.lockpick < 0 || !(lockInfo().level >= 1 && lockInfo().level <= LOCK_MAX) ||
          !(Number.isInteger(S.drills) && S.drills >= 0 && S.drills <= BREAKIN.drills) ||
          !Array.isArray(S.plants) || S.plants.some(p => !(Number.isInteger(p.pay) && p.pay > 0 && p.left > 0 && p.site && p.what)) ||
          heistList().some(M => { const st = heistPeek(M); return st && !(st.stage >= 0 && st.stage <= 3 && st.alert >= 0 && st.alert <= 100); });
        if (bad) throw new Error('invariant broken: ' + JSON.stringify(S));
      }
      if (S.over) {
        finished++;
        if (S.dead && !(S.dead === 'dysentery' && S.sick === SICK_DAYS && stuckTotal() && S.hp === 0)) throw new Error('died of nothing');
        if (S.busted) busted++; else if (!S.dead) best = Math.max(best, S.cash + S.wallet - S.debt);
        await finish();
      }
    }
    // A run of any length must have been through the whole of the prison pocket at least once.
    if (games >= 20 && !(pocketTally && stuckTally && extractTally && tagSales && sickTally && deadTally)) {
      throw new Error('prison pocket not exercised: ' + [pocketTally, stuckTally, extractTally, tagSales, sickTally, deadTally]);
    }
    // ...and the bot must have bought Heat items, used them, and used some while the FBI or the NSA wanted it.
    if (games >= 20 && !(coolBuys > coolBase[0] && coolUses > coolBase[1] && coolHot)) {
      throw new Error('Heat items not exercised: ' + [coolBuys - coolBase[0], coolUses - coolBase[1], coolHot]);
    }
    // ...and it must have bought entry tools, practised, and seen every stage of a break-in go well and go badly:
    // cased and blind, picked and forced, misses and snapped picks, alarms and fights, each kind of job done and
    // botched, clean, spotted and running exits, jobs finished and blown, and a planted device paying out.
    const hc = {};
    for (const k of Object.keys(heistTally)) hc[k] = heistTally[k] - (heistBase[k] || 0);
    const must = ['bought', 'drills', 'cased', 'blind', 'quiet', 'forced', 'miss', 'snapped', 'alarm', 'hack', 'rob', 'plant', 'botched',
      'grab', 'clean', 'spotted', 'fast', 'done', 'blown', 'paid'];
    if (games >= 20 && (must.some(k => !hc[k]) || !(hc.won + hc.fled + hc.lost))) {
      throw new Error('break-ins not exercised: ' + JSON.stringify(hc));
    }
    const hsum = ` breakins=${hc.done} blown=${hc.blown} picked=${hc.quiet} forced=${hc.forced} lockmisses=${hc.miss} snapped=${hc.snapped} jammed=${hc.jammed}` +
      ` alarms=${hc.alarm} alarmfights=${hc.won}/${hc.fled}/${hc.lost} noshow=${hc.noshow} hack=${hc.hack} rob=${hc.rob} plant=${hc.plant} botched=${hc.botched}` +
      ` cleanexit=${hc.clean} spotted=${hc.spotted} ranexit=${hc.fast} walked=${hc.walked} plantpaid=${hc.paid} plantfound=${hc.found} drills=${hc.drills} toolsbought=${hc.bought}`;
    // ...and bought rides, swapped them, sold some, paid for fuel in the morning, and travelled on hops only a ride gives.
    const rideDid = [rideBuys, rideSwaps, rideSales, fuelTally, dryTally].map((n, i) => n - rideBase[i]);
    if (games >= 20 && !(rideDid[0] && rideDid[1] && rideDid[2] && rideDid[3] && rideHopTally)) {
      throw new Error('rides not exercised: ' + rideDid.concat(rideHopTally));
    }
    document.title = 'SELFTEST OK';
    document.body.textContent = `SELFTEST OK${hsum} ridebuys=${rideDid[0]} rideswaps=${rideDid[1]} ridesales=${rideDid[2]} fuelpaid=${rideDid[3]} nofuel=${rideDid[4]} ridehops=${rideHopTally} heatitems=${coolUses - coolBase[1]} heatbuys=${coolBuys - coolBase[0]} heatalarms=${coolFires - coolBase[2]} finished=${finished} busted=${busted} best=${best} contracts=${contractsSeen} raids=${raids} quests=${questTally} junkies=${junkTally} achievements=${achTally} gigs=${gigTally} jumps=${jumpTally} bagswaps=${bagSwaps} nobag=${noBag} toofull=${fullTally}` +
      ` pockets=${pocketTally} stuck=${stuckTally} extracted=${extractTally} tagsales=${tagSales} sicknights=${sickTally} dysentery=${deadTally}`;
  } catch (err) {
    document.title = 'SELFTEST FAIL';
    document.body.textContent = 'SELFTEST FAIL ' + (err && err.stack || err);
  }
}

// ---------- save files and the start menu ----------
// Make save file n the one in use and load it. Returns true if it had a run in progress.
function loadSave(n) {
  slot = n;
  career = newCareer();
  pendingLevel = 0; logs = []; notes = [];
  const record = store.get('zdh-career');
  if (record && Number.isInteger(record.xp) && record.xp >= 0) {
    career = {xp: record.xp, syn: SYNDICATES[record.syn] ? record.syn : null, quest: record.quest,
      gear: record.gear && typeof record.gear === 'object' ? record.gear : {},
      bag: Array.isArray(record.bag) ? record.bag : [],
      locker: Array.isArray(record.locker) ? record.locker : [],
      stats: record.stats, ach: record.ach,
      rep: record.rep && typeof record.rep === 'object' ? record.rep : {},
      lockpick: record.lockpick};   // fixCareer() starts it at 0 for a save from before lock picking
    if (record.look && typeof record.look === 'object') career.look = record.look;
    reslotCareer();   // gas masks are face items now, watches and braces go on the wrist
  }
  fixCareer();   // members from before the questlines start at mission 1
  saveCareer();
  const saved = store.get('zdh-save');
  if (!(saved && saved.prices && !saved.over)) { newGame(); return false; }
  S = saved;
  // Fill in anything a save from an older version lacks.
  S.contracts = S.contracts || [];
  S.hp = Number.isInteger(S.hp) ? S.hp : 100;
  S.medkits = S.medkits || 0;
  S.stash = S.stash || {};
  S.markets = S.markets || {};
  if (!Number.isInteger(S.trips)) S.trips = TRIPS_PER_DAY;
  if (S.loc !== BUNKER && S.prices) S.markets[S.loc] = S.markets[S.loc] ||
    {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop};
  S.stashCost = S.stashCost || {};
  starterGear();   // also hands a basic backpack to anyone from before there were backpacks
  if (!S.kit) {
    // A run from before backpacks had a flat drive of 100. Part of that now comes from the bag and the
    // pockets instead, so take it off the drive, but never more than they give back: nobody loads a save
    // and finds they can carry less than before. Nothing is taken out of the inventory either way.
    if (!Number.isInteger(S.drive)) S.drive = OLD_START_DRIVE;
    S.drive -= Math.min(OLD_START_DRIVE - START_DRIVE, bagHolds() + pocketsHold());
    S.kit = 1;
  }
  S.shop = S.shop || [];
  for (const k of ['stuck', 'stuckCost', 'tag', 'stashTag']) S[k] = S[k] && typeof S[k] === 'object' ? S[k] : {};
  S.sick = Number.isInteger(S.sick) ? S.sick : 0;
  fixTags();
  for (const m of [S, ...Object.values(S.markets)]) { reslot(m.shop); reslot(m.store); }
  if (S.armor && !career.gear.body) {
    // The old vest becomes a gear item.
    career.gear.body = {slot: 'body', rar: 1, name: 'Tuned Armoured Vest', stats: {armor: 15}};
  }
  delete S.armor;
  S.weapon = S.weapon || 0;
  for (const k of Object.keys(GADGETS)) S[k] = Number.isInteger(S[k]) && S[k] > 0 ? Math.min(S[k], GADGETS[k][2]) : 0;
  // Heat items arrived in 1.24: an older run has none running and no fast fixes used.
  S.fx = {vpn: Math.max(0, Math.min(COOL.vpn.days, Math.floor(fx().vpn) || 0)), decoy: Math.max(0, Math.min(COOL.decoy.nights, Math.floor(fx().decoy) || 0))};
  S.tricks = Number.isInteger(S.tricks) && S.tricks > 0 ? Math.min(S.tricks, QUICK_MAX) : 0;
  // Break-ins arrived in 1.27: an older run has no devices planted, no practice used and no entry tools.
  S.plants = Array.isArray(S.plants) ? S.plants.filter(p => p && p.pay > 0 && p.left > 0) : [];
  S.drills = Number.isInteger(S.drills) && S.drills > 0 ? Math.min(S.drills, BREAKIN.drills) : 0;
  // The board you are looking at and today's market here are the same list, so a break-in posted on it keeps its place.
  if (S.loc !== BUNKER && S.markets[S.loc]) S.markets[S.loc].contracts = S.contracts;
  // Rides arrived in 1.25: an older run has none and is on foot, with the trips it had.
  S.rides = [...new Set(Array.isArray(S.rides) ? S.rides : [])].filter(id => VEHICLES[id]).slice(0, GARAGE_SIZE);
  S.ride = S.rides.includes(S.ride) ? S.ride : '';
  S.gas = S.gas && typeof S.gas === 'object' ? Object.fromEntries(S.rides.filter(id => S.gas[id]).map(id => [id, true])) : {};
  S.tripDebt = Number.isInteger(S.tripDebt) && S.tripDebt > 0 ? S.tripDebt : 0;
  S.trips = Math.max(0, Math.min(S.trips, tripsMax()));
  S.ammo = Object.assign(noAmmo(), S.ammo);
  if (!AMMO[S.loaded]) S.loaded = 'std';
  S.store = S.store || [];
  S.grudge = Object.assign(noGrudges(), S.grudge);
  S.raided = !!S.raided;
  log('Run resumed.');
  return true;
}

// One line about a save file, read straight from storage without loading it.
function saveCard(n, meta) {
  const c = store.get('zdh-career', n) || {}, r = store.get('zdh-save', n);
  const lvl = levelInfo(Number.isInteger(c.xp) ? c.xp : 0).level;
  const crew = c.syn && SYNDICATES[c.syn] ? ` &middot; ${SYNDICATES[c.syn][0]}` : '';
  const run = r && r.prices && !r.over ? `Day ${r.day}/${DAYS} &middot; ${money((r.cash || 0) + (r.wallet || 0) - (r.debt || 0))} net`
    : 'between runs';
  const earned = c.ach && typeof c.ach === 'object' ? Object.keys(ACH).filter(id => c.ach[id]).length : 0;
  const when = meta.t ? new Date(meta.t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';
  return `<b>${esc(meta.name || 'anon')}</b> <span class="dim">save ${n}${n === slot ? ' &middot; in use' : ''}</span><br>` +
    `<span class="lvl" style="color:var(--magenta)">LVL ${lvl}</span> ${titleFor(lvl)}${crew}<br>` +
    `<span class="dim">${run} &middot; ${earned}/${Object.keys(ACH).length} achievements${when ? ` &middot; ${when}` : ''}</span>`;
}

function introText() {
  return `<p>You have <b>${DAYS} days</b>, ${money(S.cash)} and a ${money(START_DEBT)} debt to the Fixer ` +
    `that grows ${pct(debtRate())}% a day.</p>` +
    '<p>Buy low, sell high, and tunnel between spots. You get ' + TRIPS_PER_DAY + ' trips a day, and prices only change when ' +
    'you go home to the Bunker and sleep. That is the only thing that ends a day.</p>' +
    `<p>A <span class="amber">ride</span> gets you more trips: +1 a day for a skateboard or a unicycle, up to +${MAX_HOPS} for the best helicopter. ` +
    `They are sold at ${Object.values(RIDE_SHOPS).map(([name, spot]) => `${name} (${spot})`).join(', ')}, and you swap between yours at the Bunker's garage. ` +
    'Engines want fuel every day you ride them.</p>' +
    '<p><span class="amber">Freelance jobs</span> use up your goods on a job. If it works it pays more than selling.</p>' +
    '<p>You earn <span class="cyan">XP</span> across runs. At level 10 you can join a syndicate, and its missions are the fastest way to level from there.</p>' +
    '<p><span class="amber">Achievements</span> pay XP too. One of them is a secret, and it opens a door.</p>' +
    '<p>Now and then a junkie will be waiting where you surface, selling tools and gear far below shop prices. ' +
    'Street contacts turn up the same way with <span class="amber">gigs</span>: side jobs with a deadline that pay cash and XP, and more as they come to trust you.</p>' +
    '<p>Big deals raise your <span class="amber">Heat</span>, and Heat decides who hunts you: police, then the FBI, ' +
    'then the NSA. Rival syndicates will try to rob you too, and you can raid them back.</p>' +
    '<p>Sleeping cools Heat. So do the things the black market sells for it: burner phones, log wipers, decoy traffic, a VPN, ' +
    'a week of noodles. Each says what it does and what it costs you. They are in short supply, and none of them work once the fight has started.</p>' +
    '<p>Not everyone waiting where you surface is selling. Sometimes street muscle <span class="red">jumps you</span>: they are there in person, ' +
    'so their hits always land on your Health, and they may get the first swing in. Speed gear makes an ambush less likely to land.</p>' +
    '<p>When cornered you can shoot, hack, run or pay.Shootouts cost <span class="green">Health</span>, hack fights cost ' +
    '<span class="green">OpSec</span>; lose either and you go down. Gear, a street doc and an arms dealer are at the black market; guns, ammo and a clothing store are at the ' + GUN_SPOT + '.</p>' +
    '<p>Firearms need <span class="amber">ammo</span>, and better rounds hit more often.</p>' +
    '<p>Cornered by the law, you can hide a few small goods in your <span class="amber">prison pocket</span>. Sometimes they get stuck. ' +
    'See the street doc before you sleep on it too many times.</p>' +
    '<p>Some work is behind a locked door. <span class="amber">Break-ins</span> come from street contacts, the Local BBS and the syndicates, and play out in stages: ' +
    'case the place, get through the lock, do the job inside, get out. You start with a few lock picks; your <span class="amber">lock picking</span> skill grows with use, ' +
    'and there is a practice board in the Bunker.</p>' +
    '<p>How much you can carry depends on what you wear: a <span class="amber">backpack</span> and anything with pockets. ' +
    'The amount on your Drive takes the colour of the bag on your back.</p>' +
    '<p><span class="cyan">The Bunker</span> is your hideout: stash goods, lock up gear and sleep there. Rival crews cannot ' +
    'reach you at home, but the law can raid it.</p>' +
    '<p class="dim">Only cash and your cold wallet count at the end.</p>';
}

// The start menu: continue, start a new game, load a save or delete one. Returns once a save is in use.
async function startMenu() {
  for (;;) {
    const list = saveList(), ids = Object.keys(list).map(Number).filter(n => n >= 1 && n <= MAX_SAVES).sort((a, b) => a - b);
    const last = Number(store.get('zdh-last')), full = ids.length >= MAX_SAVES;
    const html = '<p class="dim">// UNDERGROUND MARKET UPLINK</p>' +
      (ids.length ? `<p class="dim">SAVES ${ids.length}/${MAX_SAVES}: tap one to load it</p>` +
        ids.map(n => `<div class="syn pickable" data-pick="load:${n}">${saveCard(n, list[n])}</div>`).join('')
        : '<p>No saves yet. Start a new game.</p>') +
      (full ? `<p class="amber">All ${MAX_SAVES} save files are in use. Delete one to start a new game.</p>` : '');
    const buttons = [];
    if (slot && list[slot]) buttons.push(['Back to the game', 'back', 'primary']);
    else if (ids.includes(last)) buttons.push([`Continue: ${list[last].name || 'anon'}`, `load:${last}`, 'primary']);
    if (!full) buttons.push(['New game', 'new', buttons.length ? '' : 'primary']);
    if (ids.length) buttons.push(['Delete a save', 'del', 'small']);
    const choice = await dialog('ZERO DAY HUSTLE', html, buttons);
    if (choice === 'back') return;
    if (choice === 'new') {
      const name = (await askText('New game', `<p>Your handle for this save (${ids.length + 1} of ${MAX_SAVES}):</p>`)) || 'anon';
      slot = [1, 2, 3, 4, 5].find(n => !list[n]);
      career = newCareer();
      pendingLevel = 0; logs = []; notes = [];
      newGame();
      touchSave(name.slice(0, 16));
      saveCareer();
      save();
      render();
      await alertDlg('ZERO DAY HUSTLE', introText());
      if (!career.look) await ACTIONS.look();
      return;
    }
    if (choice === 'del') {
      const pickOne = await dialog('Delete a save', '<p>Which save? Its levels, gear, achievements and run are gone for good.</p>' +
        ids.map(n => `<div class="syn">${saveCard(n, list[n])}</div>`).join(''),
        ids.map(n => [`Delete ${list[n].name || 'anon'} (save ${n})`, n, 'danger']).concat([['Cancel', null, 'primary']]), 'danger');
      if (pickOne && await confirmDlg('Delete a save', `<p>Delete <b>${esc(list[pickOne].name || 'anon')}</b> (save ${pickOne})? This cannot be undone.</p>`,
        'Delete it', 'Keep it')) {
        store.del('zdh-career', pickOne);
        store.del('zdh-save', pickOne);
        delete list[pickOne];
        store.set('zdh-slots', list);
        if (pickOne === slot) slot = 0;   // the game behind the menu no longer exists: pick another or start one
      }
      continue;
    }
    if (String(choice).startsWith('load:')) {
      const n = Number(choice.slice(5));
      if (n !== slot) { if (slot) save(); loadSave(n); }
      touchSave();
      render();
      return;
    }
  }
}

// ---------- boot ----------
(async function boot() {
  // Loading screen: plays for a moment, or tap to skip. The game sets itself up underneath.
  const bootEl = $('#boot');
  const endBoot = () => { bootEl.classList.add('gone'); setTimeout(() => bootEl.remove(), 400); };
  // #selftest plays 200 random games; #selftest=30 plays 30.
  if (location.hash.startsWith('#selftest')) { bootEl.remove(); return selfTest(Number(location.hash.split('=')[1]) || 200); }
  bootEl.onclick = endBoot;
  setTimeout(endBoot, 2600);
  // Web version only: keep a copy for offline play.
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  adoptOldSave();
  newGame();   // something to draw behind the menu; nothing is saved until a save file is chosen
  render();
  busy = true;
  await startMenu();
  render();
  busy = false;
  save();
})();
</script>
