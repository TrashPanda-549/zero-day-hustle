    'Regex', 'Incognito', 'RGB', 'Brute Force', 'Packet Loss'],
  ['Kernel Panic', 'Ping of Death', 'rm -rf', 'sudo', 'Heisenbug', 'Blue Screen', 'DROP TABLE', 'Null Pointer',
    'Friday Deploy', 'l33t', 'Man-in-the-Middle', 'Backdoor'],
  ['God Mode', 'Root Access', 'h4x0r Supreme', 'Its-Always-DNS', 'Turn-It-Off-And-On-Again', '1337 Ultra',
    'Zero-Day', 'Admin/Admin', 'Uncrackable', 'Final_v2_REAL', 'Segmentation Fault Core Dumped', 'Legendary.exe'],
];
// slot: [label, item names, stats this slot can roll]
const SLOTS = {
  // The avatar draws each item type by its position in these lists (see figure()), so only ever
  // add new names at the end, and add the matching drawing in the same change.
  // Moving a name to another slot also needs an entry in MOVED, so gear people already own follows it.
  head: ['Head', ['Beanie', 'Hood', 'AR Visor', 'Neural Band', 'Tinfoil Hat', 'Gamer Headset', 'Mirrorshades'],
    ['firewall', 'hack', 'stealth', 'charm']],
  body: ['Body', ['Denim Jacket', 'Kevlar Hoodie', 'Trench Coat', 'Armoured Vest', 'Biker Jacket', 'Tactical Harness',
    'Bathrobe', 'Hawaiian Shirt'], ['armor', 'storage', 'stealth', 'regen']],
  hands: ['Hands', ['Fingerless Gloves', 'Haptic Gloves', 'Shock Knuckles', 'Data Gauntlets',
    'Oven Mitts', 'Cheese Dust Fingers'], ['aim', 'hack', 'luck']],
  feet: ['Feet', ['Sneakers', 'Combat Boots', 'Courier Runners', 'Foam Clogs', 'Socks and Sandals', 'Rocket Skates',
    'Steel Toecaps', 'Bunny Slippers'], ['speed', 'armor', 'regen']],
  deck: ['Deck', ['Burner Laptop', 'Cyberdeck', 'Mesh Rig', 'Hacked Toaster', 'Graphing Calculator', 'LoRa Pager',
    'Flip Phone', 'Server Backpack'], ['hack', 'firewall', 'storage', 'charm', 'luck']],
  face: ['Face', ['Bandana', 'Surgical Mask', 'Eyepatch', 'Fake Moustache', 'Monocle', 'Clown Nose', 'Hockey Mask', 'LED Mask',
    'Gas Mask'],
    ['stealth', 'charm', 'firewall', 'luck']],
  legs: ['Pants', ['Cargo Pants', 'Ripped Jeans', 'Track Pants', 'Tactical Trousers', 'Pyjama Bottoms', 'Cargo Shorts',
    'Leather Trousers', 'Kilt'], ['storage', 'speed', 'armor', 'regen']],
  wrist: ['Wrist', ['Sweatbands', 'Calculator Watch', 'Spiked Cuffs', 'Friendship Bracelets', 'Wrist Keyboard',
    'Festival Wristbands', 'Slap Bracelets', 'Bootleg Rolex', 'Smart Watches', 'Carpal Tunnel Braces'], ['hack', 'aim', 'luck', 'charm']],
  // Three layers on the torso: a shirt, then the body slot (jackets and armour), then a coat over everything.
  shirt: ['Shirt', ['Band Tee', 'Flannel Shirt', 'Turtleneck', 'Tank Top', 'Shirt and Tie', 'Striped Longsleeve', 'Tie-Dye Tee',
    'Christmas Jumper'], ['charm', 'regen', 'stealth', 'luck']],
  coat: ['Coat', ['Lab Coat', 'Puffer Jacket', 'Duster', 'Rain Poncho', 'Parka', 'Hi-Vis Vest', 'Cape', 'Fur Coat'],
    ['armor', 'storage', 'stealth', 'firewall']],
  // A bag on your back. What it holds comes from POCKETS, not from a rolled stat.
  back: ['Backpack', ['School Backpack', 'Fanny Pack', 'Tote Bag', 'Messenger Bag', 'Duffel Bag', 'Tactical Rucksack',
    'Hiking Pack', 'Guitar Case'], ['speed', 'stealth', 'luck', 'regen']],
};
// How many goods each item type holds at Common, in the same order as the names in SLOTS. Rarer items
// hold more (x RARITY_MULT). Backpacks hold the most; clothes hold what their pockets would.
// It is worked out from the item's type and rarity, so gear from older saves has it too.
const POCKETS = {
  back: [24, 14, 18, 22, 30, 28, 32, 26],
  legs: [10, 4, 3, 9, 1, 7, 2, 3],
  body: [5, 4, 8, 3, 4, 9, 2, 1],
  coat: [6, 5, 9, 2, 8, 4, 0, 5],
  shirt: [1, 3, 1, 0, 2, 1, 1, 2],
};
function carries(it) {
  const table = it && POCKETS[it.slot];
  if (!table) return 0;
  const kind = SLOTS[it.slot][1].findIndex(name => String(it.name).endsWith(name));
  return kind < 0 ? 0 : Math.round(table[kind] * RARITY_MULT[it.rar]);
}
// stat: [what it does, value on a Common item, cap on your total, unit]
const STATS = {
  armor: ['less Health damage', 6, 70, '%'],
  firewall: ['less OpSec damage', 6, 70, '%'],
  aim: ['weapon hit chance', 4, 30, '%'],
  hack: ['hack chance per proxy', 4, 35, '%'],
  speed: ['escape chance', 5, 35, '%'],
  stealth: ['less Heat gained', 6, 60, '%'],
  charm: ['freelance job success', 3, 20, '%'],
  storage: ['drive slots', 10, 150, ''],
  regen: ['Health a day', 1, 15, '%'],
  luck: ['fight loot', 8, 100, '%'],
};
const BAG_SIZE = 12, MAX_MED = 5, MED_HEAL = 40;

function makeItem(rar, slot) {
  slot = slot || pick(Object.keys(SLOTS));
  const [, names, pool] = SLOTS[slot];
  const count = Math.min(pool.length, [1, pick([1, 2]), 2, 3, pick([3, 4])][rar]);
  const stats = {};
  for (const key of pool.slice().sort(() => Math.random() - 0.5).slice(0, count)) {
    stats[key] = Math.max(1, Math.round(STATS[key][1] * RARITY_MULT[rar] * (0.8 + Math.random() * 0.4)));
  }
  return {slot, rar, name: `${pick(GEAR_NAMES[rar])} ${pick(names)}`, stats};
}
// boost shifts the odds toward rarer items
function rollRarity(boost) {
  const r = Math.random() * 100 - boost;
  return r < 1 ? 4 : r < 5 ? 3 : r < 15 ? 2 : r < 40 ? 1 : 0;
}
const itemValue = it => 800 * [1, 3, 8, 20, 60][it.rar];
const scrapValue = it => Math.round(itemValue(it) * 0.25);
const bonus = key => Math.min(STATS[key][2],
  Object.values(career.gear).reduce((sum, it) => sum + ((it && it.stats[key]) || 0), 0));
const statLine = (key, v) => `+${v}${STATS[key][3]} ${STATS[key][0]}`;
// What the backpack and the clothes you are wearing hold between them, and the pieces of that.
const bagHolds = () => carries(career.gear.back);
const pocketsHold = () => Object.values(career.gear).reduce((sum, it) => sum + (it && it.slot !== 'back' ? carries(it) : 0), 0);
// The colour for the amount you can carry: the rarity of the backpack you wear, or plain with no bag.
const bagClass = () => (career.gear.back ? 'r' + career.gear.back.rar : 'dim');
// "holds 24" in the item's rarity colour, then its rolled stats.
const holdsLine = it => (POCKETS[it.slot] ? `<span class="r${it.rar}">holds ${carries(it)}</span> ` +
  `<span class="dim">(${it.slot === 'back' ? 'bag' : 'pockets'})</span>` : '');
const itemStats = it => [holdsLine(it)].concat(Object.entries(it.stats).map(([k, v]) => statLine(k, v))).filter(Boolean).join(', ');
const itemHtml = it => withIcon(gearIcon(it), `<b class="r${it.rar}">${it.name}</b> <span class="dim">${RARITY[it.rar]} &middot; ` +
  `${SLOTS[it.slot][0]}</span><br>${itemStats(it)}`);
const saveCareer = () => { if (!AUTO) store.set('zdh-career', career); };

// Item types that used to belong to another slot: [name, old slot, new slot].
const MOVED = [['Gas Mask', 'head', 'face'], ['Smart Watches', 'hands', 'wrist'], ['Carpal Tunnel Braces', 'hands', 'wrist']];
const movedTo = it => (MOVED.find(([name, from]) => it && it.slot === from && String(it.name).endsWith(name)) || [])[2];
// Re-slot moved items in a list (the bag, the locker, a shop's stock).
function reslot(list) {
  for (const it of Array.isArray(list) ? list : []) if (movedTo(it)) it.slot = movedTo(it);
}
// The same for the career: anything worn in its old slot moves to the new one, or into the bag if that is taken.
function reslotCareer() {
  reslot(career.bag); reslot(career.locker);
  for (const [slot, it] of Object.entries(career.gear)) {
    const to = movedTo(it);
    if (!to) continue;
    delete career.gear[slot];
    it.slot = to;
    if (!career.gear[to]) career.gear[to] = it;
    else if (career.bag.length >= BAG_SIZE && career.locker && career.locker.length < LOCKER_SIZE) career.locker.push(it);
    else career.bag.push(it);   // never thrown away, even if that overfills the bag
  }
}

// Everyone starts with a basic item in every slot except the face and the coat, which stay empty until you find something.
const STARTER = {head: [0, 'firewall'], body: [0, 'armor'], hands: [0, 'aim'], feet: [0, 'speed'], deck: [0, 'hack'],
  legs: [0, 'storage'], wrist: [0, 'luck'], shirt: [0, 'regen'], back: [0, 'regen']};
function starterGear() {
  for (const [slot, [index, stat]] of Object.entries(STARTER)) {
    if (!career.gear[slot]) {
      career.gear[slot] = {slot, rar: 0, name: `n00b ${SLOTS[slot][1][index]}`, stats: {[stat]: STATS[stat][1]}};
    }
  }
  saveCareer();
}

// Put an item in the bag, or scrap it for cash if the bag is full.
function stash(it) {
  if (career.bag.length < BAG_SIZE) return career.bag.push(it);
  S.cash += scrapValue(it);
  log(`Bag full: scrapped ${it.name} for ${money(scrapValue(it))}.`);
}

// Pass an item to hand over that exact one (a mission reward) instead of rolling loot.
async function dropLoot(from, boost, gift) {
  const it = gift || makeItem(rollRarity(boost));
  const worn = career.gear[it.slot];
  SND.play('loot');
  log(`${gift ? 'Reward' : 'Loot'} from ${from}: <span class="r${it.rar}">${it.name}</span> (${RARITY[it.rar]}).`);
  const choice = await dialog(gift ? 'Reward!' : 'Loot!', `<p>${from} ${gift ? 'hands you your cut' : 'left something behind'}:</p><div class="syn">${itemHtml(it)}</div>` +
    (worn ? `<p class="dim">You are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Equip it', 'e', 'primary'], ['Put it in the bag', 'b']]);
  const full = choice === 'e' ? tooFull(it.slot, it) : '';
  if (full) {   // it holds less than what you have on, and you are loaded up: it goes in the bag instead
    stash(it);
    await alertDlg('Too much to carry', full + '<p>It goes in your gear bag for now.</p>');
  } else if (choice === 'e') {
    if (worn) stash(worn);
    career.gear[it.slot] = it;
  } else {
    stash(it);
  }
  saveCareer();
}

// ---------- avatar: a figure that wears your gear and shows the state of the run ----------
const RCOL = ['#c9d1d5', '#39ff7a', '#4da3ff', '#c77dff', '#ff9d2e'];
// Looks the player can choose. They belong to the career, so they carry over between runs.
const SKINS = [['Pale', '#f1c9a5', '#d3a27c'], ['Fair', '#e0ac84', '#bd8760'], ['Tan', '#c98f6b', '#a8704f'],
  ['Brown', '#a56c4a', '#855235'], ['Deep', '#7a4a30', '#5e3722'], ['Dark', '#4f2f20', '#3a2115']];
const HAIRSTYLES = ['Crop', 'Mohawk', 'Long', 'Buzz', 'Bald'];
const HAIRCOLS = [['Violet', '#2b1b3f'], ['Black', '#15131c'], ['Brown', '#4a2c1a'], ['Blonde', '#d9b45a'],
  ['Red', '#a8321f'], ['Silver', '#b9c0d0'], ['Teal', '#0f6f78']];
const STREAKS = [['Magenta', '#ff4fd8'], ['Cyan', '#00e5ff'], ['Yellow', '#fcee0a'], ['Green', '#3dff9a'], ['None', null]];
const SYN_COL = {ghost: '#00e5ff', ledger: '#ffd24a', null: '#3dff9a', red: '#ff3b5c', x404: '#c77dff'};
// Cyberware that appears on the avatar as you level up.
const WARE = [[8, 'optic implant'], [9, 'wired forearm'], [20, 'aura'], [25, 'brighter aura'], [30, 'full aura and halo']];
let avSeq = 0;

// The pixel model. figure() draws a person as shapes; sprite() turns that drawing into a small bitmap with big
// square pixels and chunky proportions (big head, wide body, short legs) and shows it scaled up.
// The bitmap is made in the background, so a figure not seen before appears a moment after the rest of the page.
const PX = 6.25, PXW = 32, PXH = 54;   // one pixel in figure units; the sprite's size in pixels (200 x 337.5 units)
const PXTOP = 250;                  // everything above this line bobs
let pxOff = false;                  // set if the browser will not hand back pixels: figures then stay smooth
let pxSeq = 0;
const pxDone = new Map(), pxWait = new Map();   // drawing -> bitmap URL; drawing -> number of the job making it
const pxOn = () => !pxOff && !AUTO;
// Where a height on the drawing ends up on the sprite: the head nearly doubles, the legs shrink.
const pxY = y => !pxOn() ? y : y <= 78 ? y * 150 / 78 : y <= 190 ? 150 + (y - 78) * 100 / 112 : 250 + (y - 190) * 86 / 146;
const pxSrcY = y => y <= 150 ? y * 78 / 150 : y <= 250 ? 78 + (y - 150) * 112 / 100 : 190 + (y - 250) * 146 / 86;
// How much wider things get at a height on the drawing: the head most of all.
const pxWide = y => y <= 64 ? 2 : y >= 92 ? 1.2 : 2 - (y - 64) / 28 * 0.8;
// Moves something drawn around the old head (centre 100,40) onto the sprite's bigger one.
const pxHead = svg => pxOn() ? `<g transform="translate(100 ${pxY(40)}) scale(1.95) translate(-100 -40)">${svg}</g>` : svg;

function pxMake(markup, job) {
  const SS = 2, W = 200 * SS, H = 352 * SS, img = new Image();
  const finish = url => {
    pxWait.delete(markup);
    pxDone.set(markup, url);
    if (pxDone.size > 80) pxDone.delete(pxDone.keys().next().value);
    const fill = () => document.querySelectorAll(`image[data-px="${job}"]`).forEach(el => {
      if (url) { el.setAttribute('href', url); el.removeAttribute('data-px'); return; }
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');   // no bitmap: fall back to the drawing
      g.innerHTML = markup;
      el.replaceWith(g);
    });
    fill(); setTimeout(fill, 80); setTimeout(fill, 500);
  };
  img.onerror = () => { console.warn('pixel avatar: drawing would not load'); finish(''); };
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d', {willReadFrequently: true});
      g.drawImage(img, 0, 0, W, H);
      const from = g.getImageData(0, 0, W, H).data;
      const to = new Uint8ClampedArray(PXW * PXH * 4), solid = new Uint8Array(PXW * PXH), N = 5;
      for (let py = 0; py < PXH; py++) {
        for (let px = 0; px < PXW; px++) {
          // Look at N x N points inside this pixel and keep the colour most of them agree on.
          const votes = new Map();
          let filled = 0;
          for (let j = 0; j < N; j++) {
            const y = pxSrcY((py + (j + 0.5) / N) * PX), sy = Math.round(y * SS);
            if (sy < 0 || sy >= H) continue;
            const wide = pxWide(y);
            for (let i = 0; i < N; i++) {
              const sx = Math.round((100 + ((px + (i + 0.5) / N) * PX - 100) / wide) * SS);
              if (sx < 0 || sx >= W) continue;
              const at = (sy * W + sx) * 4;
              if (from[at + 3] < 128) continue;
              filled++;
              const key = (from[at] >> 4) << 8 | (from[at + 1] >> 4) << 4 | from[at + 2] >> 4;
              const v = votes.get(key) || [0, 0, 0, 0];
              v[0]++; v[1] += from[at]; v[2] += from[at + 1]; v[3] += from[at + 2];
              votes.set(key, v);
            }
          }
          if (filled * 2 < N * N) continue;
          let best = null;
          for (const v of votes.values()) if (!best || v[0] > best[0]) best = v;
          const o = (py * PXW + px) * 4;
          to[o] = best[1] / best[0]; to[o + 1] = best[2] / best[0]; to[o + 2] = best[3] / best[0]; to[o + 3] = 255;
          solid[py * PXW + px] = 1;
        }
      }
      // Small things a vote would lose: the eyes, and the mouth when it shows.
      const spot = (x, y) => { const at = (Math.round(y * SS) * W + Math.round(x * SS)) * 4; return [from[at], from[at + 1], from[at + 2], from[at + 3]]; };
      const cell = (x, y) => Math.floor(pxY(y) / PX) * PXW + Math.floor((100 + (x - 100) * pxWide(y)) / PX);
      for (const x of [93.4, 107.4]) {
        const [r, g, b, a] = spot(x, 40), i = cell(x, 40);
        if (a > 127 && solid[i]) to.set([r, g, b, 255], i * 4);
      }
      for (const x of [96.5, 100, 103.5]) {
        for (let y = 52; y <= 57.5; y += 0.5) {
          const [r, g, b, a] = spot(x, y), i = cell(x, 55);
          if (a > 127 && solid[i] && Math.abs(r - 138) + Math.abs(g - 74) + Math.abs(b - 60) < 40) { to.set([r, g, b, 255], i * 4); break; }
        }
      }
      // A dark outline, one pixel thick, around the whole figure.
      for (let py = 0; py < PXH; py++) {
        for (let px = 0; px < PXW; px++) {
          const i = py * PXW + px;
          if (solid[i]) continue;
          if ((px > 0 && solid[i - 1]) || (px < PXW - 1 && solid[i + 1]) || (py > 0 && solid[i - PXW]) || (py < PXH - 1 && solid[i + PXW])) {
            to.set([11, 10, 25, 255], i * 4);
          }
        }
      }
      const small = document.createElement('canvas');
      small.width = PXW; small.height = PXH;
      small.getContext('2d').putImageData(new ImageData(to, PXW, PXH), 0, 0);
      finish(small.toDataURL());
    } catch (err) {
      console.warn('pixel avatar: off', err);
      pxOff = true;
      finish('');
    }
  };
  // Blinking eyelids are hidden by the page's stylesheet, which a picture does not see.
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 200 352"><style>.av-blink{display:none}.av-w{stroke-width:.6px}.av-w.av-trim{stroke-width:5.4px}.av-w [fill="none"],.av-w [fill="none"] *{stroke-width:.6px}</style>${markup}</svg>`);
}

// The picture for a drawing made by figure(). bob: let the upper body bob (not for poses).
function sprite(markup, bob) {
  if (!pxOn()) return markup;
  const url = pxDone.get(markup);
  if (url === '') return markup;
  let ref;
  if (url) {
    ref = `href="${url}"`;
  } else {
    let job = pxWait.get(markup);
    if (!job) { job = ++pxSeq; pxWait.set(markup, job); pxMake(markup, job); }
    ref = `data-px="${job}"`;
  }
  const im = `<image class="av-px" ${ref} x="0" y="0" width="${PXW * PX}" height="${PXH * PX}" preserveAspectRatio="none"/>`;
  if (!bob) return im;
  // Two windows onto the same picture: the legs stay put, the rest sinks one pixel onto them and comes back.
  const low = PXH * PX - PXTOP;
  return `<svg x="0" y="${PXTOP}" width="200" height="${low}" viewBox="0 ${PXTOP} 200 ${low}">${im}</svg>` +
    `<g class="av-bob"><svg x="0" y="0" width="200" height="${PXTOP}" viewBox="0 0 200 ${PXTOP}">${im}</svg></g>`;
}
// The breathing animation is for the smooth drawing only.
const figClass = () => pxOn() ? '' : ' class="av-fig"';
// Head-and-shoulders crop of the figure's box.
const bustBox = fill => pxOn() ? (fill ? '30 0 140 210' : '30 0 140 162') : fill ? '50 0 100 150' : '50 0 100 116';

function getLook() {
  const L = career.look || {}, ok = (v, n, d) => Number.isInteger(v) && v >= 0 && v < n ? v : d;
  return {skin: ok(L.skin, SKINS.length, 2), hair: ok(L.hair, HAIRSTYLES.length, 0),
    col: ok(L.col, HAIRCOLS.length, 0), streak: ok(L.streak, STREAKS.length, 0)};
}

// Draws one person in a 200 x 352 box. Used for the player and for everyone who comes after them.
// F: {look, gear: {slot: {kind, c, rar, fill}}, syn, level, weapon, emp, hp, mood, gold, ko, cuffs}
function figure(F) {
  const INK = '#0b0a19', EYE = '#1b1426', GOLD = '#ffd24a', CYAN = '#00e5ff';
  const [, SKIN, SHADE] = SKINS[F.look.skin];
  const HAIR = HAIRCOLS[F.look.col][1], STREAK = STREAKS[F.look.streak][1], hair = F.look.hair;
  const {head, body, hands, feet, deck, face, legs, wrist, shirt, coat, back} = F.gear;
  // One fill colour per name in SLOTS.back, in the same order. The bag itself is drawn behind the body
  // and its straps over the clothes, so each kind has two drawings further down.
  const BAGFILL = ['#a8321f', '#ff4fd8', '#d8c9a8', '#4a3a2c', '#0f6f78', '#5b6b3c', '#c0392b', '#6b4a2c'];
  // Parts of a bag too small to carry the thick rarity trim: `thin` keeps them the colour of the bag,
  // `tint` paints them the rarity colour all over (the bag's own colour for a Common one).
  const thin = shapes => `<g stroke-width=".6">${shapes}</g>`;
  const tint = shapes => `<g stroke-width=".6"${back.rar ? ` fill="${back.c}"` : ''}>${shapes}</g>`;
  const hurt = F.hp <= 35 && !F.ko;
  // A shape and its mirror image, for the left and right side of the body.
  const both = d => `<path d="${d}"/><path d="${d}" transform="translate(200 0) scale(-1 1)"/>`;
  const flip = s => `<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
  const twin = s => s + flip(s);   // any shapes plus their mirror image
  // A piece of clothing: solid material colour, thin trim in the rarity colour.
  // Rare glows, Epic pulses, Legendary shimmers.
  const wear = (p, fill, shapes) => `<g class="av-w${p.c === RCOL[0] ? '' : ' av-trim'}${p.rar >= 3 ? (p.rar === 4 ? ' av-leg' : ' av-epic') : ''}" ` +
    `fill="${p.fill || fill}" stroke="${p.c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"` +
    `${p.rar >= 2 ? ` style="--rc:${p.c};filter:drop-shadow(0 0 3px ${p.c})"` : ''}>${shapes}</g>`;
  const SLEEVE = 'M70 76 Q56 80 52 96 Q46 140 42 196 L57 199 Q60 160 67 118 Z';
  const TORSO = 'M70 75 Q100 68 130 75 L137 84 L139 120 Q134 160 132 190 L68 190 Q66 160 61 120 L63 84 Z';
  let out = '';

  // --- behind the body ---
  if (deck && deck.kind === 2) {   // Mesh Rig: backpack with an antenna array
    out += wear(deck, '#232638', '<path d="M66 84 h68 v70 q-34 10 -68 0 z"/>' +
      '<path d="M74 86 L58 34 M126 86 L142 34 M100 80 V22" fill="none" stroke-width="2"/>' +
      `<circle cx="58" cy="32" r="4" fill="${deck.c}"/><circle cx="142" cy="32" r="4" fill="${deck.c}"/>` +
      `<circle cx="100" cy="20" r="4" fill="${deck.c}"/>`);
  }
  if (deck && deck.kind === 7) {   // Server Backpack: a rack unit towering over the shoulders
    out += wear(deck, '#232638', '<rect x="56" y="58" width="88" height="104" rx="4"/>' +
      '<path d="M56 72 h88 M56 86 h88 M56 100 h88" fill="none"/>' +
      `<g fill="${deck.c}" stroke="none"><circle cx="62" cy="65" r="2"/><circle cx="69" cy="65" r="2"/>` +
      '<circle cx="62" cy="79" r="2"/><circle cx="138" cy="65" r="2"/><circle cx="131" cy="79" r="2"/>' +

  }
  if (back) {
    // The part of the bag that shows round the body. One drawing per name in SLOTS.back, in the same order.
    // Seen from the front a pack on the back is nearly all hidden: only its top shows, between the neck and the
    // shoulders. Keep it narrower than the shoulders and below the chin. The pixel model doubles the width of
    // anything up here (see pxWide), so a shape that reaches past the shoulders turns into a pair of wings.
    const pack = [
      // School Backpack: a rounded top with a grab handle
      thin('<path d="M81 80 V70 Q81 65 87 65 H113 Q119 65 119 70 V80 Z"/><path d="M95 65 q5 -5 10 0" fill="none"/>'),
      '',   // Fanny Pack: all of it is in front
      '',   // Tote Bag: hangs at the side, in front
      '',   // Messenger Bag: hangs at the hip, in front
      '',   // Duffel Bag: hangs at the hip, in front
      // Tactical Rucksack: a square lid
      thin('<path d="M81 80 V61 H119 V80 Z"/><path d="M81 68 H119" fill="none"/>'),
      // Hiking Pack: a lid with a rolled-up sleeping mat strapped across the top
      thin('<path d="M81 80 V66 H119 V80 Z"/><rect x="78" y="57" width="44" height="11" rx="5.5" fill="#e8c53a"/>' +
        '<path d="M83 57 h4 v11 h-4 z M113 57 h4 v11 h-4 z" stroke="none"/>'),
      // Guitar Case: the neck and headstock stick up over one shoulder and the bottom of the case shows at the
      // other hip. Nobody has ever seen the guitar.
      `<g stroke="${INK}" stroke-width=".6"><path d="M108.8 76.5 L115.2 79.5 L141.2 23.5 L134.8 20.5 Z"/>` +
        '<path d="M72 178 Q50 182 50 206 Q52 232 76 234 Z"/><path d="M131.7 19.1 L144.3 24.9 L151.9 8.6 L139.3 2.8 Z"/></g>',
    ][back.kind];
    // The guitar neck is too thin to glow: beside the head the glow breaks up into stray dots.
    if (pack) out += wear(back.kind === 7 ? {c: back.c, rar: 0, fill: back.fill} : back, BAGFILL[back.kind], pack);
  }
  if (hair === 2) {   // long hair falls behind the shoulders
    out += `<path d="M81 30 Q74 62 79 90 L121 90 Q126 62 119 30 Z" fill="${HAIR}" stroke="${INK}" stroke-width="1"/>`;
  }
  if (head && head.kind === 1) {   // back of the hood

  }

  // --- legs and shoes ---
  out += `<g fill="#27314f" stroke="${INK}" stroke-width="1" stroke-linejoin="round">` +
    '<path d="M74 184 L100 184 L99 200 Q98 250 95 322 L79 322 Q76 250 74 200 Z"/>' +
    '<path d="M100 184 L126 184 L126 200 Q124 250 121 322 L105 322 Q102 250 101 200 Z"/></g>' +
    '<path d="M87 200 Q86 250 86 318 M113 200 Q114 250 114 318" stroke="#1d2540" stroke-width="2" fill="none"/>' +
    `<g fill="#3a3d4d" stroke="${INK}" stroke-width="1">${both('M77 320 L96 320 L97 331 Q88 336 71 334 Q71 325 77 320 Z')}</g>`;
  if (legs) {
    // One fill colour and one drawing per name in SLOTS.legs, in the same order. Long coats hang over them.
    const LEG = 'M74 184 L100 184 L99 200 Q98 250 95 322 L79 322 Q76 250 74 200 Z';
    const SHORT = 'M74 184 L100 184 L99 200 Q98.5 232 98 262 L75.5 262 Q74.5 232 74 200 Z';
    const shin = `<g fill="${SKIN}" stroke="${INK}" stroke-width="1">${both('M76 258 L98 258 Q97 290 95 322 L79 322 Q77 290 76 258 Z')}</g>`;

      // Cargo Pants: a big pocket on each thigh
      both(LEG) + both('M74.5 234 h13 v19 h-13 z') + both('M74.5 240 h13'),

      // Track Pants: a stripe down each side

      // Cargo Shorts, bare shins

      both(LEG) + `<g fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6">${both('M81 196 Q82 250 84 314')}</g>`,

        `<rect x="95" y="196" width="10" height="13" rx="3" fill="#e9e4d8"/>`,
    ][legs.kind]);
  }
  if (F.syn === 'null') {   // Null Sector: smuggler's thigh pouches
    out += `<g fill="#39402f" stroke="${SYN_COL.null}" stroke-width="1" stroke-linejoin="round">` +
      both('M75 224 L99 225 L99 228 L75 227 Z') + both('M72 228 h13 v17 h-13 z') + both('M72 233 h13') + '</g>';

  if (feet) {
    out += wear(feet, ['#e9e9f0', '#1d1d26', '#2b3050', '#7bd66b', '#e9e9f0', '#c0392b', '#4a3a2c', '#f4b6d2'][feet.kind], [
      // Sneakers
      both('M76 316 L97 316 L98 330 Q88 336 69 334 Q69 324 76 316 Z') +
        both('M70 333 Q84 336 98 331') + both('M80 320 h12 M80 324 h12'),
      // Combat Boots
      both('M77 288 L98 288 L99 330 Q88 336 69 334 Q69 323 77 316 Z') +

      // Courier Runners
      both('M76 316 L97 316 L98 330 Q88 336 68 334 Q68 324 76 316 Z') +
        both('M72 328 L96 321') + both('M64 322 h-9 M62 328 h-12'),
      // Foam Clogs
      both('M75 317 L97 317 L98 330 Q88 337 68 334 Q67 322 75 317 Z') +

      // Shirt and Tie

      `<path d="${TEE}"/>${LONG}<g fill="none" stroke="#27314f" stroke-width="4">` +

      // Tie-Dye Tee
      `<path d="${TEE}"/>${SHORT}<g fill="none" stroke-width="5"><circle cx="100" cy="128" r="27" stroke="#fcee0a"/>` +

      `<path d="${TEE}"/>${LONG}<path d="${zig(100)} ${zig(172)}" fill="none" stroke="#e9e9f0" stroke-width="2"/>` +

      '<path d="M82 33 Q81 12 100 12 Q119 12 118 33 Z"/><path d="M81 30 Q100 26 119 30 L119 38 Q100 34 81 38 Z"/>',
      // Hood, open at the face
      '<path fill-rule="evenodd" d="M77 46 Q73 9 100 9 Q127 9 123 46 Q124 62 114 72 L86 72 Q76 62 77 46 Z ' +
        'M86 40 a14 17 0 1 0 28 0 a14 17 0 1 0 -28 0 Z"/>',
      // AR Visor
      '<path d="M82 35 Q100 31 118 35 L117 45 Q100 48 83 45 Z" fill-opacity=".6"/>' +
        '<path d="M86 38 h10" stroke="#fff" stroke-opacity=".7" fill="none"/>',
      // Neural Band
      '<path d="M83 27 Q100 22 117 27 L117 33 Q100 28 83 33 Z"/>' +
        `<circle cx="83" cy="30" r="3" fill="${head.c}"/><circle cx="117" cy="30" r="3" fill="${head.c}"/>`,
      // Tinfoil Hat: a crumpled foil cone
      '<path d="M80 31 L91 9 L99 15 L106 2 L112 17 L120 31 Q100 24 80 31 Z"/>' +
        '<path d="M91 9 L95 27 M106 2 L104 26 M112 17 L113 28 M99 15 L99 26" fill="none" stroke-width="1"/>',
      // Gamer Headset with a boom mic
      '<path d="M81 38 Q79 7 100 7 Q121 7 119 38" fill="none" stroke-width="4"/>' +
        '<rect x="76" y="33" width="9" height="16" rx="3.5"/><rect x="115" y="33" width="9" height="16" rx="3.5"/>' +
        `<path d="M82 48 Q84 58 95 58" fill="none"/><circle cx="96.5" cy="58" r="2.2" fill="${head.c}"/>`,
      // Mirrorshades
      '<path d="M85 37 h13 v5 q-6.5 4 -13 0 z M102 37 h13 v5 q-6.5 4 -13 0 z" fill-opacity=".9" stroke-width="1"/>' +
        '<path d="M98 38.5 h4 M85 38 L82 37 M115 38 L118 37" fill="none" stroke-width="1"/>' +
        '<path d="M87.5 38.5 l4 3 M104.5 38.5 l4 3" stroke="#fff" stroke-opacity=".8" fill="none" stroke-width="1"/>',
    ][head.kind]);
  }
  if (F.gold) {   // gold-rimmed shades for a big score
    out += `<path d="M86 37 h12 v4.5 q-6 3.5 -12 0 z M102 37 h12 v4.5 q-6 3.5 -12 0 z" fill="#05060a" stroke="${GOLD}" stroke-width="1.2"/>` +
      `<path d="M98 38.5 h4" stroke="${GOLD}" stroke-width="1.2"/>`;
  }
  if (F.ko) {   // seeing stars
    const star = (x, y) => `<path d="M${x} ${y} l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z"/>`;
    out += `<g fill="#fcee0a" class="av-zap">${star(70, 12)}${star(129, 10)}${star(100, 3)}</g>`;
  }

  // --- Legendary gear throws off sparks ---
  const anchor = {head: [100, 22], body: [100, 120], hands: [49, 206], feet: [100, 322], deck: [152, 182],
    face: [100, 46], legs: [100, 250], wrist: [151, 182], shirt: [100, 150], coat: [72, 232], back: [140, 96]};
  for (const [slot, [x, y]] of Object.entries(anchor)) {
    const p = F.gear[slot];
    if (!p || p.rar !== 4) continue;
    for (let i = 0; i < 4; i++) {
      out += `<circle class="av-spark" cx="${x + [-17, 9, -5, 19][i]}" cy="${y + [4, -2, 8, 6][i]}" r="1.7" fill="${p.c}" ` +
        `style="animation-delay:${(-i * 0.55 - x / 90).toFixed(2)}s"/>`;
    }
  }
  return out;
}

// The player. o: {bust} crops to a portrait, {pose} is 'busted', 'down', 'rich' or 'vanished',
// {plain} ignores the state of the run, {mood} forces an expression.
function avatarSvg(o) {
  o = o || {};
  const pose = o.pose || '', quiet = !!pose || !!o.plain, st = S || {}, id = 'av' + (++avSeq);
  const part = slot => {
    const it = career.gear[slot];
    if (!it) return null;
    return {kind: Math.max(0, SLOTS[slot][1].findIndex(name => it.name.endsWith(name))), c: RCOL[it.rar], rar: it.rar};
  };
  const lvl = level(), rich = pose === 'rich';
  const hp = quiet || !Number.isInteger(st.hp) ? 100 : st.hp;
  const opsec = quiet || !Number.isInteger(st.opsec) ? 100 : st.opsec;
  const heat = quiet ? 0 : st.heat || 0;
  // One canister on the belt for each kind of gadget carried, then spares.
  const kinds = [['emp', '#00e5ff'], ['smoke', '#c9d1d5'], ['bomb', '#ff4fd8'], ['fakeid', '#fcee0a']];
  const belt = kinds.filter(([k]) => st[k] > 0).map(([, c]) => c)
    .concat(kinds.flatMap(([k, c]) => Array(Math.max(0, (st[k] || 0) - 1)).fill(c)));
  const F = {look: getLook(), syn: career.syn, level: lvl, weapon: weaponArt(st.weapon || 0), belt, hp,
    gear: Object.fromEntries(Object.keys(SLOTS).map(slot => [slot, part(slot)])),
    mood: pose === 'busted' ? 'ouch' : rich ? 'grin' : o.mood || (quiet ? '' : st.mood) || '',
    gold: rich, ko: pose === 'down', cuffs: pose === 'busted'};
  const grad = (name, c) => `<radialGradient id="${id}${name}"><stop offset="0" stop-color="${c}"/>` +
    `<stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  let defs = '', back = '', front = '', box = '0 0 200 352';

  if (!quiet) back += backdrop(st.loc);
  // Heat: police lights, then a Fed searchlight, then the NSA's crosshair.
  if (heat >= 75) {
    defs += grad('n', '#ff3b5c');
    back += `<ellipse cx="100" cy="352" rx="150" ry="240" fill="url(#${id}n)" opacity=".5"/>`;
    front += pxHead('<g class="av-reticle" fill="none" stroke="#ff3b5c" stroke-width="1.6"><circle cx="100" cy="40" r="27"/>' +
      '<path d="M100 5 v17 M100 58 v17 M65 40 h17 M118 40 h17"/><circle cx="100" cy="40" r="2" fill="#ff3b5c"/></g>');
  } else if (heat >= 40) {
    defs += grad('c', '#4da3ff');
    back += `<ellipse cx="100" cy="0" rx="150" ry="150" fill="url(#${id}c)" opacity=".3"/>` +
      '<path class="av-search" d="M100 -12 L34 352 L138 352 Z" fill="#dfe8ff" opacity=".13"/>';
  } else if (heat >= 20) {
    defs += grad('r', '#ff3b5c') + grad('c', '#4da3ff');
    back += `<g class="av-cops"><ellipse class="a" cx="10" cy="60" rx="120" ry="170" fill="url(#${id}r)"/>` +
      `<ellipse class="b" cx="190" cy="60" rx="120" ry="170" fill="url(#${id}c)"/></g>`;
  }
  // Level aura: Ghost in the Wire (20), Root (25), Legend of the Wire (30). A big score gets a gold one.
  const aura = pose && !rich ? 0 : rich || lvl >= 30 ? 3 : lvl >= 25 ? 2 : lvl >= 20 ? 1 : 0;
  if (aura) {
    defs += grad('a', rich ? '#ffd24a' : '#ff4fd8');
    back += `<g class="av-aura"><ellipse cx="100" cy="150" rx="${75 + aura * 10}" ry="${150 + aura * 14}" ` +
      `fill="url(#${id}a)" opacity="${(0.3 + aura * 0.13).toFixed(2)}"/></g>`;
    if (aura === 3) {
      back += pxHead(`<ellipse class="av-ring" cx="100" cy="40" rx="34" ry="34" fill="none" stroke="${rich ? '#ffd24a' : '#00e5ff'}" ` +
        'stroke-width="1.6" stroke-dasharray="4 7" opacity=".8"/>');
    }
  }

  const ghost = career.syn === 'ghost' && pose !== 'vanished'
    ? ' style="opacity:.78;filter:drop-shadow(0 0 2.5px #00e5ff)"' : '';
  const shadow = '<ellipse cx="100" cy="337" rx="60" ry="8" fill="rgba(255,79,216,.2)"/>';
  let fig = sprite(figure(F), !pose);
  if (pose === 'down') {
    // Flat on the ground.
    box = '0 0 352 200';
    fig = '<ellipse cx="176" cy="190" rx="165" ry="8" fill="rgba(255,79,216,.2)"/>' +
      `<g transform="translate(0 232) rotate(-90)"${ghost}>${fig}</g>`;
  } else if (pose === 'vanished') {
    // Nothing left but an outline and a file stamp.
    fig = `<g style="filter:brightness(0) drop-shadow(0 0 2px #ff3b5c);opacity:.9">${fig}</g>`;
    front += '<g class="av-static"><rect x="0" y="34" width="200" height="4" fill="#ff3b5c"/><rect x="0" y="150" width="200" height="3" fill="#00e5ff"/>' +
      '<rect x="0" y="250" width="200" height="6" fill="#ff3b5c"/></g>' +
      pxHead('<rect x="78" y="34" width="44" height="11" fill="#000" stroke="#ff3b5c"/>') +
      '<g transform="rotate(-8 100 150)"><rect x="42" y="138" width="116" height="24" fill="#000" stroke="#ff3b5c" stroke-width="2"/>' +
      '<text x="100" y="156" text-anchor="middle" fill="#ff3b5c" font-size="18" font-weight="bold" font-family="monospace">REDACTED</text></g>';
  } else {
    fig = `<g${figClass()}${ghost}>${fig}</g>`;
    if (opsec <= 50) {
      // Your cover is failing: the picture tears.
      fig = `<g class="av-shake${opsec <= 25 ? ' bad' : ''}">${fig}</g>`;
      const bars = opsec <= 25 ? [[34, 5, '#00e5ff'], [70, 3, '#ff2a6d'], [118, 6, '#00e5ff'], [176, 4, '#ff2a6d'], [238, 7, '#00e5ff'], [296, 4, '#ff2a6d']]
        : [[46, 4, '#00e5ff'], [96, 3, '#ff2a6d'], [210, 5, '#00e5ff']];
      front += '<g class="av-static">' + bars.map(([y, h, c]) => `<rect x="0" y="${y}" width="200" height="${h}" fill="${c}"/>`).join('') + '</g>';
    }
    if (hp <= 35) fig = `<g transform="rotate(3 100 335)">${fig}</g>`;   // slumped
    fig = shadow + fig;
  }
  if (pose === 'busted') {
    // Mugshot: height chart behind, booking board in front.
    back = [40, 90, 140, 190, 240, 290].map((y, i) => `<path d="M0 ${y} h200" stroke="#3a3f66" stroke-width="${i % 2 ? 1 : 2}"/>` +
      `<text x="4" y="${y - 4}" fill="#5a6090" font-size="11" font-family="monospace">${6 - i}'</text>`).join('');
    front += `<g transform="translate(0 ${pxY(120) - 120})">` +
      '<rect x="62" y="116" width="76" height="38" fill="#e9e4d8" stroke="#0b0a19" stroke-width="1.5"/>' +
      `<text x="100" y="131" text-anchor="middle" fill="#111" font-size="9.5" font-weight="bold" font-family="monospace">${o.label || 'CYBER UNIT'}</text>` +
      `<text x="100" y="147" text-anchor="middle" fill="#111" font-size="12" font-weight="bold" font-family="monospace">0D-${String(1000 + (career.xp % 9000)).padStart(4, '0')}</text></g>`;
  }
  if (rich) {
    // It is raining money.
    for (let i = 0; i < 9; i++) {
      front += `<g class="av-bill" style="animation-delay:${(-i * 0.37).toFixed(2)}s"><rect x="${8 + (i * 67) % 180}" y="0" width="13" height="7" ` +
        'fill="#3dff9a" stroke="#0b3a22" stroke-width="1"/>' + `<circle cx="${14.5 + (i * 67) % 180}" cy="3.5" r="1.8" fill="#0b3a22"/></g>`;
    }
  }
  // fill: the picture takes the shape of its box. A portrait is cropped with the head pinned to the top;
  // the whole figure is fitted inside, standing on the bottom edge.
  if (o.bust) box = bustBox(o.fill);
  else if (o.fill) box = '0 0 200 340';
  return `<svg class="avatar" viewBox="${box}"${o.fill ? ` preserveAspectRatio="${o.bust ? 'xMidYMin slice' : 'xMidYMax meet'}"` : ''} role="img" aria-label="Your character">` +
    `${defs ? `<defs>${defs}</defs>` : ''}${back}${fig}${front}</svg>`;
}

// Portrait of whoever you are up against, built from the same figure.
// full: the whole figure, armed, for the battle stage. i: which one of the group, so street thugs do not all look alike.
function foeSvg(E, full, i) {
  const none = {head: null, body: null, hands: null, feet: null, deck: null};
  let F, tint, weapon = 0;
  if (E.kind === 'thug') {

// ---------- state helpers ----------
// ---------- the prison pocket ----------
// Cornered by the law, you can hide a few small goods where nobody wants to look: they survive a search,
// an arrest and a drive wipe. Each time, some of them may not come back out. Stuck goods (S.stuck) still
// count as carried but cannot be sold, used or moved until a street doc removes them; left in, they give
// you dysentery (S.sick counts the nights slept on them). Goods a doc has removed are tagged for good:
// S.tag[name] says how many of S.inv[name] carry the tag (S.stashTag the same for the Bunker stash), so
// tagged and clean ones of a kind share one stack, and the tagged ones sell for less.
const POCKET_CAP = 6, STUCK_ODDS = 0.35, EXTRACT_FEE = 2000, SICK_DAYS = 6;
const TAG = 'discount because reasons', TAG_CUT = 0.2;
// What fits, and why the rest does not.
const POCKET_NO = {'Botnet Hours': 'you cannot hide time', 'Phishing Kits': 'the kit includes a laminator',
  'Rogue APs': 'it has antennas'};
const stuckTotal = () => Object.values(S.stuck || {}).reduce((a, b) => a + b, 0);
const tagged = name => Math.min((S.tag && S.tag[name]) || 0, S.inv[name] || 0);
const tagPrice = price => Math.floor(price * (1 - TAG_CUT));
const tagHtml = `<span class="tagmark">${TAG}</span>`;
// Keep the tag counts inside what is actually held: goods can leave in bulk (a wipe, an arrest, a robbery).
function fixTags() {
  for (const [tags, held] of [[S.tag, S.inv], [S.stashTag, S.stash]]) {
    for (const name of Object.keys(tags || {})) {
      tags[name] = Math.min(tags[name], held[name] || 0);
      if (!(tags[name] > 0)) delete tags[name];
    }
  }
}
const sickLeft = () => SICK_DAYS - (S.sick || 0);
const nights = n => `${n} more night${n === 1 ? '' : 's'}`;
const stuckList = () => Object.entries(S.stuck).map(([name, q]) => `${num(q)} ${name}`).join(', ');
const docSpots = () => GEAR_SPOTS.join(' or ');

const used = () => Object.values(S.inv).reduce((a, b) => a + b, 0) + stuckTotal();
// What you can carry: the drive in your pocket, plus what your backpack and your clothes hold.
const cap = () => S.drive + (inSyn('null') ? 60 : 0) + bonus('storage') + bagHolds() + pocketsHold() + rideCargo();
// What you could carry with `it` worn in `slot` instead of what is there now (null: with nothing there).
function capWith(slot, it) {
  const worn = career.gear[slot];

  if (worn) career.gear[slot] = worn; else delete career.gear[slot];

}
let fullTally = 0;   // counted for the self-test
// Changing clothes cannot leave you holding more than you can carry. Returns the reason, or '' if it is fine.
function tooFull(slot, it) {

    `you could only carry <b>${num(room)}</b>.</p>` +

const free = () => cap() - used();
const pick = list => list[rnd(0, list.length - 1)];
// A labelled bar: Health, OpSec, or the hostiles left in a fight.
function meter(label, value, max, text, color) {

const vitals = () => meter('Health', S.hp, 100, S.hp + '%') + meter('OpSec', S.opsec, 100, S.opsec + '%');
const lawTier = () => S.heat >= 75 ? 2 : S.heat >= 40 ? 1 : 0;

// marked (optional): how many of them carry the "discount because reasons" tag. Leave it out for clean goods.
function addItems(name, qty, price, marked) {
  const held = S.inv[name] || 0;
  const paid = (S.cost[name] || 0) * held + price * qty;
  S.inv[name] = held + qty;
  S.cost[name] = Math.floor(paid / (held + qty));
  if (marked > 0) { S.tag = S.tag || {}; S.tag[name] = (S.tag[name] || 0) + Math.min(marked, qty); }
}
// Clean ones go first. marked (optional): true takes tagged ones instead (that is what selling them does).
function removeItems(name, qty, marked) {
  if (marked && S.tag && S.tag[name]) S.tag[name] -= Math.min(qty, S.tag[name]);
  S.inv[name] -= qty;
  if (S.inv[name] <= 0) { delete S.inv[name]; delete S.cost[name]; }
  fixTags();
}
function addHeat(value) {

// What the Heat items leave running: {vpn: days of halved Heat gains left, decoy: nights of extra cooling left}.
const fx = () => (S.fx && typeof S.fx === 'object' ? S.fx : (S.fx = {vpn: 0, decoy: 0}));
// Everything that raises Heat comes through here, so a running VPN can halve it.
function heatUp(n) {

// How much Heat a Heat item would take off if used right now (0 for the ones that work over time).
function coolDrop(key) {

// Why a Heat item cannot be used right now, or '' when it can.
function coolBlock(key) {

  if (c.hp && S.hp <= c.hp) return `It costs ${c.hp}% Health, and you only have ${S.hp}%.`;
  if (c.home && S.loc !== BUNKER) return 'It only works at the Bunker.';
  if (c.home && S.trips < c.trips) return `Too late in the day: you need ${c.trips} or more trips left to lie low.`;
  if (c.nights && fx().decoy >= c.nights) return 'One is already running, with all its nights left.';
  if (c.days && fx().vpn >= c.days) return 'One is already running, with all its days left.';

}
// What is running, in words, for the status chips and the dialogs.
const coverText = () => [fx().vpn > 0 ? `VPN ${fx().vpn}d` : '', fx().decoy > 0 ? `Decoy ${fx().decoy}n` : ''].filter(Boolean).join(' &middot; ');
// Today's Heat items at this black market: COOL_KINDS of the six kinds, COOL_EACH of each. Gone when sold.
const COOL_KINDS = 3, COOL_EACH = 1;
function coolStock() {

  if (!m.cool || typeof m.cool !== 'object') {

// What a Heat item would do if used right now, or why it cannot be. inline: for a line inside a list row.
function coolHint(key, inline) {

const heatClass = h => (h >= 60 ? 'red' : h >= 30 ? 'amber' : 'green');
const coolCount = () => Object.keys(COOL).reduce((sum, k) => sum + (S[k] || 0), 0);
let coolUses = 0, coolBuys = 0, coolFires = 0;   // counted for the self-test
const COOL_SAY = {
  burner: 'You move your whole life onto a phone that cost less than lunch. The old one goes in a river.',

// ---------- contracts ----------
function rollContracts() {
  S.contracts = [];
  const count = pick([0, 1, 1, 2, 2, 3]);
  const pool = GOODS.slice().sort(() => Math.random() - 0.5).slice(0, count);
  for (const [name, low, high] of pool) {
    const mid = (low + high) / 2;
    const lot = mid >= 10000 ? 3 : mid >= 2000 ? 8 : mid >= 500 ? 15 : mid >= 100 ? 30 : 50;
    const qty = Math.min(60, Math.max(1, Math.round(rnd(Math.ceil(lot / 3), lot) * (1 + S.day / 8))));
    const chance = rnd(50, 85);
    // Riskier jobs pay more. The unit price is never below today's local price,
    // so a job that works always beats selling the same goods here.
    const mult = 1.5 + (85 - chance) / 35 * 1.3 + Math.random() * 0.4;
    const unit = Math.max(S.prices[name] || 0, Math.round(mid));
    S.contracts.push({good: name, qty, chance, payout: Math.round(unit * qty * mult / 10) * 10,
      job: pick(JOBS[name]), client: pick(CLIENTS)});
  }
  // About one board in three also has a break-in on it: a device to leave somewhere, behind a lock.
  if (Math.random() < 0.33) S.contracts.push(breakinJob());
}
const payoutFor = c => Math.round(c.payout * (inSyn('red') ? 1.25 : 1));
const chanceFor = c => Math.max(10, Math.min(95,
  c.chance + Math.min(10, level()) + 2 * S.proxies - Math.floor(S.heat / 5) + (inSyn('red') ? 10 : 0) + bonus('charm')));
function log(text, cls) {
  logs.unshift(`<div${cls ? ` class="${cls}"` : ''}>${text}</div>`);
  logs.length = Math.min(logs.length, 14);
}

function rollMarket() {
  if (S.loc === BUNKER) {   // nobody trades at your hideout
    S.prices = {}; S.flags = {}; S.news = []; S.contracts = []; S.shop = []; S.store = [];
    return;
  }
  // Each place has one market per day: coming back the same day finds the same prices,
  // with any contracts you ran and gear you bought already gone.
  const today = S.markets[S.loc];
  if (today) {
    S.prices = today.prices; S.flags = today.flags; S.news = today.news;
    S.contracts = today.contracts; S.shop = today.shop; S.store = today.store || [];
    return;
  }
  for (;;) {
    S.prices = {}; S.flags = {}; S.news = [];
    for (const [name, low, high, scarce, flood] of GOODS) {
      if (Math.random() < 0.18) continue;   // nobody is dealing this here today
      let price = rnd(low, high);
      const r = Math.random();
      if (r < 0.06) { price *= rnd(3, 6); S.news.push(scarce); S.flags[name] = 'up'; }
      else if (r < 0.12) { price = Math.max(1, Math.floor(price / rnd(3, 5))); S.news.push(flood); S.flags[name] = 'down'; }
      S.prices[name] = price;
    }
    if (Object.keys(S.prices).length >= 4) break;
  }
  rollContracts();
  // Today's gear on the black market: up to Epic, never Legendary.
  S.shop = [0, 1, 2].map(() => makeItem(Math.min(3, rollRarity(S.day * 0.3))));
  S.store = S.loc === GUN_SPOT ? outfitStock() : [];
  S.markets[S.loc] = {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop, store: S.store};
}

    fx: {vpn: 0, decoy: 0}, tricks: 0,   // Heat items: what is still running, and fast fixes used today
    rides: [], ride: '', gas: {}, tripDebt: 0,   // rides owned, the one you are on, tanks filled today (see VEHICLES)

// ---------- dialogs ----------
const overlay = $('#overlay'), dlg = $('#dialog');
let autoPick = null;   // self-test only: (values on offer, dialog title) => the one to pick

function dialog(title, html, buttons, tone) {
  return new Promise(resolve => {
    dlg.className = tone || '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div><div class="dbtns"></div>`;
    const box = dlg.querySelector('.dbtns');
    for (const [label, value, cls, icon] of buttons) {   // icon: optional picture shown on the button
      const el = document.createElement('button');
      el.textContent = label;
      if (cls) el.className = cls;
      if (icon) { el.insertAdjacentHTML('afterbegin', icon); el.classList.add('hasico'); }
      el.onclick = () => { overlay.hidden = true; resolve(value); };
      box.appendChild(el);
    }
    // Anything in the body marked data-pick="value" also answers the dialog when tapped.
    dlg.querySelectorAll('.body [data-pick]').forEach(el => {
      el.onclick = () => { overlay.hidden = true; resolve(el.dataset.pick); };
    });
    if (AUTO) {   // the self-test picks any button or tappable thing at random
      const all = buttons.map(b => b[1]).concat([...dlg.querySelectorAll('.body [data-pick]')].map(el => el.dataset.pick));
      // ...unless it is steering: autoPick answers from what is on offer, or returns undefined to leave it to chance.
      const want = autoPick ? autoPick(all, title) : undefined;
      return resolve(want !== undefined ? want : all[rnd(0, all.length - 1)]);
    }
    overlay.hidden = false;
    dlg.scrollTop = 0;
  });
}
const confirmDlg = (title, html, yes, no) =>

// Amount picker, 1..max. opts: unit (price each), cash (amount is money), ok (button label).
function askQty(title, html, max, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <div class="qty"><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="${max}">
      <input id="qs" type="range" min="1" max="${max}" value="${max}"></div>
      <div class="quick"><button data-q="1">Min</button><button data-q="h">Half</button><button data-q="m">Max</button></div>
      <div class="total" id="qt"></div>
      <div class="dbtns"><button id="qok" class="primary">${opts.ok || 'OK'}</button><button id="qcancel">Cancel</button></div>`;
    const qn = $('#qn'), qs = $('#qs'), qt = $('#qt');
    const value = () => Math.max(0, Math.min(max, Math.floor(Number(qn.value) || 0)));
    const show = () => {
      const v = value();
      qt.textContent = !v ? '' : opts.unit ? `${num(v)} x ${money(opts.unit)} = ${money(v * opts.unit)}`
        : opts.cash ? money(v) : num(v);
      $('#qok').disabled = !v;
    };
    const set = v => { qn.value = v; qs.value = v; show(); };
    qn.oninput = () => { qs.value = value(); show(); };
    qs.oninput = () => { qn.value = qs.value; show(); };
    dlg.querySelector('.quick').onclick = e => {
      const q = e.target.dataset.q;
      if (q) set(q === 'm' ? max : q === 'h' ? Math.max(1, Math.floor(max / 2)) : 1);
    };
    const done = v => { overlay.hidden = true; resolve(v); };
    $('#qok').onclick = () => done(value() || null);
    $('#qcancel').onclick = () => done(null);
    qn.onkeydown = e => { if (e.key === 'Enter' && value()) done(value()); };
    show();
    if (AUTO) return resolve([null, 1, max, rnd(1, max)][rnd(0, 3)]);
    overlay.hidden = false;
  });
}

function askText(title, html) {
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <input id="tx" type="text" maxlength="16" autocomplete="off" placeholder="anon">
      <div class="dbtns"><button id="tok" class="primary">OK</button></div>`;
    const done = () => { overlay.hidden = true; resolve($('#tx').value.trim()); };
    $('#tok').onclick = done;
    $('#tx').onkeydown = e => { if (e.key === 'Enter') done(); };
    if (AUTO) return resolve('bot');
    overlay.hidden = false;
    $('#tx').focus();
  });
}

// ---------- weapon shops ----------
// kinds: which weapon kinds this shop sells. markup: price multiplier on everything except military hardware.
// hot: true for the black-market dealer (no background check, and every purchase adds a little Heat).
async function weaponShop(title, blurb, kinds, markup, hot) {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5;
    const mine = WEAPONS[S.weapon], tradeIn = mine ? Math.round(mine[1] * 0.3) : 0;
    const priceOf = w => Math.max(0, Math.round(w[1] * scale * (w[4] === 'heavy' ? 1 : markup)) - tradeIn);
    let html = `<p>${blurb}</p><p>Cash: <span class="green">${money(S.cash)}</span>. You carry: ` +
      `<b>${mine ? mine[0] : 'nothing'}</b>${mine ? ` (worth ${money(tradeIn)} as a trade-in)` : ''}.</p>` +
      (mine ? `<div class="syn">${withIcon(weaponIcon(S.weapon), `<b>${mine[0]}</b><br>${mine[2] > 1 ? `${mine[2]} shots a round, ` : ''}${pct(mine[3])}% to hit`)}</div>` : '');
    for (const kind of kinds) {
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${WTYPE[kind][0].toUpperCase()}</b><br>${WTYPE[kind][1]}</p>`;
      if (!hot && kind === 'gun' && S.heat >= 40) {   // the legal store checks who it sells guns to
        html += '<p class="red">"Your background check came back... interesting. No firearms for you today."</p>' +
          '<p class="dim">Get your Heat under 40%, or try the arms dealer at the black market.</p>';
        continue;
      }
      WEAPONS.map((w, i) => [w, i]).filter(([w]) => w && w[4] === kind).sort((a, b) => a[0][1] - b[0][1]).forEach(([w, i]) => {
        const price = priceOf(w), owned = i === S.weapon, ok = !owned && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}>` + withIcon(weaponIcon(i),
          `<span class="${owned ? 'dim' : ok ? 'amber' : 'red'}">${owned ? 'yours' : money(price)}</span> &middot; <b>${w[0]}</b><br>` +
          `${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit${usesAmmo(w) ? ' &middot; <span class="dim">uses ammo</span>' : ''}`) + '</div>';
      });
    }
    // Ammunition: the gun store stocks the ordinary kinds, the van has everything.
    html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">AMMUNITION</b><br>Sold in boxes of ${AMMO_BOX}. ` +
      'Firearms and military hardware use one round a shot; better rounds hit more often.</p>';
    for (const [key, [name, boxPrice, , legal]] of Object.entries(AMMO)) {
      if (!hot && !legal) continue;
      const price = Math.round(boxPrice * scale * (hot && legal ? markup : 1));
      const ok = S.cash >= price && S.ammo[key] + AMMO_BOX <= AMMO_MAX;
      html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="a:${key}"` : ''}>` + withIcon(ammoIcon(key),
        `<span class="${ok ? 'amber' : 'red'}">${money(price)}</span> &middot; <b>${name}</b><br>${hitChange(key)} &middot; you have ${S.ammo[key]}`) + '</div>';
    }
    html += '<p class="dim">Tap a weapon to buy it. You carry one at a time, and your old one is traded in.' +
      (hot ? ' Hardware from the van is hot: each purchase adds 5% Heat.' : '') + '</p>';
    const choice = await dialog(title, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    if (String(choice).startsWith('a:')) {   // a box of ammo
      const key = choice.slice(2), price = Math.round(AMMO[key][1] * scale * (hot && AMMO[key][3] ? markup : 1));
      if (S.cash < price) continue;
      S.cash -= price;
      S.ammo[key] += AMMO_BOX;
      if (!S.ammo[S.loaded]) S.loaded = key;
      log(`Bought ${AMMO_BOX} ${AMMO[key][0]} for ${money(price)}.`);
      render();
      continue;
    }
    const index = Number(choice), w = WEAPONS[index], price = priceOf(w);
    if (!w || index === S.weapon || S.cash < price) continue;
    S.cash -= price;
    S.weapon = index;
    if (usesAmmo(w)) {   // every firearm comes with a few rounds to get you started
      S.ammo.std = Math.min(AMMO_MAX, S.ammo.std + 10);
      if (!S.ammo[S.loaded]) S.loaded = 'std';
    }
    if (hot) heatUp(5);
    log(`Bought: ${w[0]} for ${money(price)}.`);
    render();
  }
}

// Choose which ammo to load. Costs nothing and takes no time.
async function pickAmmo() {
  for (;;) {
    const active = activeAmmo();
    const html = '<p>Better rounds hit more often. Your weapon fires the kind you load here; if that runs out it falls back to the best kind you have left.</p>' +
      Object.entries(AMMO).map(([key, [name]]) => {
        const have = S.ammo[key];
        return `<div class="syn${have ? ' pickable' : ''}"${have ? ` data-pick="${key}"` : ''}>` + withIcon(ammoIcon(key),
          `<b class="${key === S.loaded && have ? 'amber' : have ? '' : 'dim'}">${name}</b>${key === active ? ' <span class="green">&larr; loaded</span>' : ''}` +
          `<br>${hitChange(key)} &middot; ${have ? `${have} rounds` : '<span class="dim">none</span>'}`) + '</div>';
      }).join('') +
      `<p class="dim">Ammo is sold at ${GUN_STORE} and by the arms dealer. Rival crews sometimes drop it.</p>`;
    const choice = await dialog('Ammunition', html, [['Done', null, 'primary']]);
    if (choice === null || !AMMO[choice]) return;
    S.loaded = choice;
    render();
  }
}
// A picture of a cartridge, coloured by how good the round is.
function ammoIcon(key) {
  const c = {budget: '#8a8fa8', std: '#ffd24a', hollow: '#ff8a1e', ap: '#00e5ff', smart: '#ff4fd8'}[key];
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#0b0a19" stroke-width=".8">' +
    `<rect x="8.5" y="10" width="7" height="11" rx="1" fill="#b98a55"/><path d="M8.5 10 q0 -7 3.5 -8 q3.5 1 3.5 8 z" fill="${c}"/>` +
    `<rect x="7.5" y="19.5" width="9" height="2" fill="#8a5a2e"/></g>${key === 'smart' ? '<circle cx="12" cy="6.5" r="1.4" fill="#fff"/>' : ''}</svg>`;
}

// ---------- clothing and armour store ----------
// Two items for every slot each day: one plain, one from the better rack.
function outfitStock() {
  const stock = [];
  for (const slot of Object.keys(SLOTS)) {
    stock.push(makeItem(pick([0, 0, 1]), slot));
    stock.push(makeItem(Math.min(3, Math.max(1, rollRarity(S.day * 0.3 + 5))), slot));
  }
  return stock;
}

async function outfitShop() {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5, full = career.bag.length >= BAG_SIZE;
    let html = '<p>"Welcome to Ctrl+Alt+Drip. Streetwear, body armour, and things with too many pockets."</p>' +
      `<p>Cash: <span class="green">${money(S.cash)}</span>. Bag ${career.bag.length}/${BAG_SIZE}.</p>` +
      (full ? '<p class="red">Your bag is full. Scrap or store something before you buy more.</p>' : '');
    for (const [slot, [label]] of Object.entries(SLOTS)) {
      const rack = S.store.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
      if (!rack.length) continue;
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${label.toUpperCase()}</b></p>`;
      for (const [it, i] of rack) {
        const price = Math.round(itemValue(it) * scale * 0.9), ok = !full && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}><span class="${ok ? 'amber' : 'red'}">${money(price)}</span>${itemHtml(it)}</div>`;
      }
    }
    html += S.store.length ? '<p class="dim">Tap an item to buy it. It goes into your bag; put it on from the Gear screen. New stock arrives every day.</p>'
      : '<p>You bought everything on the racks. New stock arrives tomorrow.</p>';
    const choice = await dialog(OUTFITTER, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    const it = S.store[Number(choice)];
    if (!it) continue;
    const price = Math.round(itemValue(it) * scale * 0.9);
    if (S.cash < price || career.bag.length >= BAG_SIZE) continue;
    S.cash -= price;
    S.store.splice(Number(choice), 1);
    career.bag.push(it);
    saveCareer();
    log(`Bought: <span class="r${it.rar}">${it.name}</span> for ${money(price)}.`);
    render();
  }
}

// ---------- ride shops and the garage ----------
// One of the three shops in RIDE_SHOPS. You ride away on what you buy, with a full tank. The ride you came on
// is either traded in or sent home to the garage. Any shop buys the ride you are on.
async function rideShop(key) {
  const [title, spot, , blurb] = RIDE_SHOPS[key];
  if (S.loc !== spot) return;
  for (;;) {
    const mine = VEHICLES[S.ride], tradeIn = mine ? rideValue(S.ride) : 0, full = S.rides.length >= GARAGE_SIZE;
    const priceOf = id => VEHICLES[id][1];   // the table is the price: it does not rise with the day
    const least = id => (mine ? Math.max(0, priceOf(id) - tradeIn) : priceOf(id));   // the cheapest way to leave on it
    let html = `<p>${blurb}</p><p>Cash: <span class="green">${money(S.cash)}</span>. You have ${tripsHtml()}. ` +
      `Garage ${S.rides.length}/${GARAGE_SIZE}.</p>` +
      (mine ? `<p class="dim">YOU CAME ON</p><div class="syn">${rideCard(S.ride, `<span class="dim">worth ${money(tradeIn)} as a trade-in</span>`)}</div>`
        : '<p class="dim">You walked here.</p>') +
      `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${title.toUpperCase()}</b><br>` +
      `On foot you get ${TRIPS_PER_DAY} trips a day. A ride adds its hops to that, every day, for as long as you are on it.</p>`;
    Object.keys(VEHICLES).filter(id => VEHICLES[id][3] === key).sort((a, b) => VEHICLES[a][1] - VEHICLES[b][1]).forEach(id => {
      const owned = S.rides.includes(id), ok = !owned && S.cash >= least(id) && (mine || !full);
      html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${id}"` : ''}>` +
        rideCard(id, `<span class="${owned ? 'dim' : ok ? 'amber' : 'red'}">${owned ? (id === S.ride ? 'riding it' : 'in your garage') : money(priceOf(id))}</span>`) + '</div>';
    });
    html += '<p class="dim">Tap a ride to buy it. You leave on it, with a full tank, and its hops count from right now. ' +
      `The one you came on is traded in for ${pct(RIDE_TRADE)}% of its list price or sent home to your garage, which holds ${GARAGE_SIZE}. ` +
      'Swap between them at the Bunker.' + (full && !mine ? ' <span class="amber">Your garage is full: come here on one to trade it in.</span>' : '') + '</p>';
    const buttons = [];
    if (mine) buttons.push([`Sell the ${mine[0]} for ${money(tradeIn)}`, 'sell', 'danger', rideIcon(S.ride)]);
    buttons.push(['Leave', null, 'primary']);
    const choice = await dialog(title, html, buttons);
    if (choice === null) return;
    if (choice === 'sell') {
      if (!mine) continue;
      if (rideTooFull('')) { SND.play('deny'); await alertDlg('Too much to carry', rideTooFull('')); continue; }
      const was = S.trips;
      S.cash += tradeIn;
      dropVehicle(S.ride);
      rideSales++;
      SND.play('cash');
      log(`Sold the ${mine[0]} for ${money(tradeIn)}. You are on foot${S.trips !== was ? `: ${S.trips} trip${S.trips === 1 ? '' : 's'} left today` : ''}.`);
      render();
      continue;
    }
    const v = VEHICLES[choice];
    if (!v || v[3] !== key || S.rides.includes(choice) || S.cash < least(choice) || (!mine && full)) continue;
    let trade = false;
    if (mine) {
      const price = priceOf(choice), swap = Math.max(0, price - tradeIn), opts = [];
      if (S.cash >= swap) opts.push([`Trade in the ${mine[0]}: pay ${money(swap)}`, 't', 'primary', rideIcon(S.ride)]);
      if (!full && S.cash >= price) opts.push([`Keep it, send it home: pay ${money(price)}`, 'k']);
      opts.push(['Cancel', null, 'small']);
      const how = await dialog(v[0], `<div class="syn">${rideCard(choice, `<span class="amber">${money(price)}</span>`)}</div>` +
        `<p>You came on the <b>${mine[0]}</b>. It is worth <b>${money(tradeIn)}</b> as a trade-in.</p>` +
        (full ? `<p class="amber">Your garage is full (${GARAGE_SIZE}), so the only way to take this one is to trade that one in.</p>`
          : `<p class="dim">Or keep it: somebody rides it back to your garage at the Bunker. Garage ${S.rides.length}/${GARAGE_SIZE}.</p>`), opts);
      if (!how) continue;
      trade = how === 't';
    }
    const why = trade ? rideTooFull(choice) : '', cost = trade ? Math.max(0, priceOf(choice) - tradeIn) : priceOf(choice);
    if (why) { SND.play('deny'); await alertDlg('Too much to carry', why); continue; }
    if (S.cash < cost || (!trade && S.rides.length >= GARAGE_SIZE)) continue;
    // Riding off on something that carries less is fine when the old one is kept... as long as it all still fits.
    if (!trade && rideTooFull(choice)) { SND.play('deny'); await alertDlg('Too much to carry', rideTooFull(choice)); continue; }
    S.cash -= cost;
    if (trade) dropVehicle(S.ride);
    grantVehicle(choice);
    rideVehicle(choice, true);
    rideBuys++;
    tally('rides');
    SND.play('loot');
    log(`Bought: <span class="cyan">${v[0]}</span> for ${money(cost)}${trade ? ` (the ${mine[0]} went in part exchange)` : ''}. ` +
      `<span class="green">+${v[2]} hop${v[2] === 1 ? '' : 's'} a day</span>: ${S.trips} trip${S.trips === 1 ? '' : 's'} left today.`);
    render();
  }
}

// The garage at the Bunker: every ride you own, and which one you are on. Changing costs nothing but the
// tank, if the one you get on has an engine and has not been filled today.
async function garage() {
  if (S.loc !== BUNKER) return;
  for (;;) {
    const spots = Object.values(RIDE_SHOPS).map(([name, spot, what]) => `${name} at ${spot} (${what})`).join(', ');
    let html = `<p>A roller door, an oil stain and room for ${GARAGE_SIZE} rides. You have ${tripsHtml()}.</p>` +
      `<div class="syn${S.ride ? ' pickable" data-pick="foot' : ''}"><b>On foot</b>${S.ride ? '' : ' <span class="green">&larr; today</span>'}<br>` +
      `<span class="dim">${TRIPS_PER_DAY} trips a day. Costs nothing, impresses nobody.</span></div>`;
    for (const id of S.rides) {
      const on = id === S.ride, fuel = rideTwist(id, 'fuel'), dry = !tanked(id), ok = !on || dry;
      html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${id}"` : ''}>` +
        rideCard(id, on ? '<span class="green">riding it</span>' : '<span class="dim">parked</span>') +
        (dry ? `<br><span class="${S.cash >= fuel ? 'amber' : 'red'}">${on ? 'Tank empty: tap to fill it' : 'Not filled today: getting on it costs a tank'}, ${money(fuel)}` +
          `${S.cash >= fuel ? '' : '. You cannot pay that, so it would add no hops today'}</span>` : '') + '</div>';
    }
    html += S.rides.length
      ? '<p class="dim">Tap a ride to get on it. Today\'s trips move by the difference in hops, and hops you have already used stay used. ' +
        'Engines take a tank of fuel each day you ride them, paid when you wake up or when you get on. To sell one, ride it to a shop.</p>'
      : `<p>Empty. You go everywhere on foot, ${TRIPS_PER_DAY} trips a day.</p>`;
    html += `<p class="dim">Rides are sold at ${spots}.</p>`;
    const choice = await dialog('Garage', html, [['Close', null, 'primary']]);
    if (!choice) return;
    const id = choice === 'foot' ? '' : choice, v = VEHICLES[id];
    if (id ? !S.rides.includes(id) || (id === S.ride && tanked(id)) : !S.ride) continue;
    if (id !== S.ride && rideTooFull(id)) { SND.play('deny'); await alertDlg('Too much to carry', rideTooFull(id)); continue; }
    const swapped = id !== S.ride, fuel = rideTwist(id, 'fuel'), dry = id && !tanked(id);
    if (swapped) { rideVehicle(id); rideSwaps++; }
    const filled = dry && fuelUp(id), loud = rideTwist(id, 'loud');
    SND.play(dry && !filled ? 'deny' : swapped ? 'travel' : 'buy');
    log((!id ? 'You leave the wheels at home and walk.' : swapped ? `You get on the <span class="cyan">${v[0]}</span>.` : `You fill up the ${v[0]}.`) +
      (filled ? ` Fuel: ${money(fuel)}.${loud ? ` It is loud: Heat +${loud}%.` : ''}` : dry ? ` <span class="red">No cash for fuel (${money(fuel)}): it adds no hops.</span>` : '') +
      ` ${S.trips} trip${S.trips === 1 ? '' : 's'} left today.`);
    render();
  }
}

// ---------- loadout close-up ----------
// A big view of the avatar with a tag on each gear slot. Tapping a tag opens that slot.
async function inspectGear() {
  const POS = {face: 'top:1%;left:0', shirt: 'top:19%;left:0', body: 'top:37%;left:0', wrist: 'top:55%;left:0', hands: 'top:73%;left:0',
    head: 'top:1%;right:0', coat: 'top:17%;right:0', back: 'top:33%;right:0', deck: 'top:49%;right:0', legs: 'top:65%;right:0',
    feet: 'bottom:1%;right:0'};
  for (;;) {
    const tags = Object.entries(SLOTS).map(([slot, [label]]) => {
      const it = career.gear[slot], spare = career.bag.filter(b => b.slot === slot).length;
      return `<div class="slottag${spare ? ' has' : ''}" data-pick="${slot}" style="${POS[slot]}"><small>${label}</small>` +
        (it ? `<b class="r${it.rar}">${it.name}</b>` : '<b class="dim">empty</b>') +
        (spare ? `<i>${spare} in bag to swap</i>` : '') + '</div>';
    }).join('');
    const slot = await dialog('Loadout', `<div class="stage">${avatarSvg()}${tags}</div>` +
      `<p>${capLines()}</p>` +
      '<p class="dim">Tap a slot to see it and change what you are wearing there. Yellow slots have something in your bag.</p>',
      [['Back', null, 'primary']]);
    if (!slot) return;
    await swapSlot(slot);
  }
}

// How a bag item's stats differ from the item worn in its slot.
function swapDiff(it) {
  const worn = career.gear[it.slot];
  const keys = [...new Set([...Object.keys(it.stats), ...Object.keys(worn ? worn.stats : {})])];
  const parts = keys.map(k => {
    const d = (it.stats[k] || 0) - ((worn && worn.stats[k]) || 0);
    return d ? `<span class="${d > 0 ? 'green' : 'red'}">${d > 0 ? '+' : ''}${d}${STATS[k][3]} ${STATS[k][0]}</span>` : '';
  }).filter(Boolean);
  const room = carries(it) - carries(worn);   // what the bag or the pockets hold
  if (room) parts.unshift(`<span class="${room > 0 ? 'green' : 'red'}">holds ${room > 0 ? '+' : ''}${room}</span>`);
  return parts.length ? `<br><span class="dim">If you swap:</span> ${parts.join(', ')}` : '';
}

// Wear or scrap one item from the bag.
async function bagItem(index) {
  const it = career.bag[index], worn = career.gear[it.slot];
  const act = await dialog(it.name, `<div class="syn">${itemHtml(it)}${swapDiff(it)}</div>` +
    (worn ? `<p class="dim">Replaces what you are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Wear it', 'e', 'primary'], [`Scrap for ${money(scrapValue(it))}`, 's', 'danger'], ['Back', null, 'small']]);
  if (act === 'e' && tooFull(it.slot, it)) {
    await alertDlg('Too much to carry', tooFull(it.slot, it));
  } else if (act === 'e') {
    career.bag.splice(index, 1);
    if (worn) career.bag.push(worn);
    career.gear[it.slot] = it;
    log(`Now wearing <span class="r${it.rar}">${it.name}</span>.`);
  } else if (act === 's') {
    career.bag.splice(index, 1);
    S.cash += scrapValue(it);
    log(`Scrapped ${it.name} for ${money(scrapValue(it))}.`);
  }
  saveCareer();
  render();
}

// Best gear first, then grouped by slot, so the bag reads the same every time you open it.
function sortBag() {
  const order = Object.keys(SLOTS);
  career.bag.sort((a, b) => b.rar - a.rar || order.indexOf(a.slot) - order.indexOf(b.slot) || a.name.localeCompare(b.name));
}

// One slot: what is worn there, and everything in the bag that could replace it.
async function swapSlot(slot) {
  const label = SLOTS[slot][0], worn = career.gear[slot];
  const options = career.bag.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
  const change = swapDiff;
  const html = `<p class="dim">WEARING</p><div class="syn">${worn ? itemHtml(worn) : 'Nothing'}</div>` +
    (options.length
      ? '<p class="dim">IN YOUR BAG: tap one to wear it</p>' + options.map(([it, i]) =>
        `<div class="syn pickable" data-pick="${i}">${itemHtml(it)}${change(it)}</div>`).join('')
      : `<p>Nothing in your bag fits the ${label.toLowerCase()} slot. Rival crews drop gear and the black market sells it.</p>`);
  const buttons = options.map(([it, i]) => [`Wear ${it.name}`, String(i), 'r' + it.rar, gearIcon(it)]);
  if (worn && career.bag.length < BAG_SIZE) buttons.push(['Take it off', 'off']);
  buttons.push(['Back', null, 'primary']);
  const choice = await dialog(`${label} slot`, html, buttons);
  if (choice === null) return;
  const swap = choice === 'off' ? null : career.bag[Number(choice)];
  if (tooFull(slot, swap)) return alertDlg('Too much to carry', tooFull(slot, swap));
  if (choice === 'off') {   // back into the bag, leaving the slot empty
    career.bag.push(worn);
    delete career.gear[slot];
    log(`Took off <span class="r${worn.rar}">${worn.name}</span>.`);
    saveCareer();
    render();
    return;
  }
  const index = Number(choice), it = career.bag[index];
  career.bag.splice(index, 1);
  if (worn) career.bag.push(worn);
  career.gear[slot] = it;
  log(`Now wearing <span class="r${it.rar}">${it.name}</span>.`);
  saveCareer();
  render();
}

// ---------- actions ----------
const ACTIONS = {
  async buy(name) {
    const price = S.prices[name];
    if (!price) return;
    const most = Math.min(Math.floor(S.cash / price), free());
    if (most <= 0) return;
    const qty = await askQty(`Buy ${name}`, `<p>${money(price)} each. You can take up to ${num(most)}.</p>`,
      most, {unit: price, ok: 'Buy'});
    if (!qty) return;
    S.cash -= qty * price;
    addItems(name, qty, price);
    addHeat(qty * price);
    SND.play('buy');
    log(`Bought ${num(qty)} ${name} for ${money(qty * price)}.`);
  },

  async sell(name) {
    const list = S.prices[name], all = S.inv[name] || 0;
    if (!list || !all) return;
    // Goods a street doc had to remove carry a tag and sell for less. They are sold apart from the clean ones.
    const marked = tagged(name), clean = all - marked, low = tagPrice(list);
    let cut = !clean;
    if (marked && clean) {
      const which = await dialog(`Sell ${name}`, `<p>You hold ${num(all)} ${name}. ${num(marked)} of them carry a tag:</p>` +
        `<div class="syn">${tagHtml}<br><span class="dim">Buyers pay ${pct(TAG_CUT)}% less for those: ` +
        `<s>${money(list)}</s> <b class="amber">${money(low)}</b> each. Nobody asks why. Everybody knows why.</span></div>`,
        [[`Sell clean ones (${num(clean)}) at ${money(list)}`, 'c', 'primary'], [`Sell tagged ones (${num(marked)}) at ${money(low)}`, 't'],
          ['Cancel', null, 'small']]);
      if (!which) return;
      cut = which === 't';
    }
    const price = cut ? low : list, held = cut ? marked : clean;
    const qty = await askQty(`Sell ${name}`,
      (cut ? `<p>${tagHtml}</p><p>Buyers pay <s>${money(list)}</s> <b class="amber">${money(price)}</b> each for these: ${pct(TAG_CUT)}% off.` : `<p>Buyers pay ${money(price)} each.`) +
      ` You hold ${num(held)}, bought at ${money(S.cost[name] || 0)}.</p>`,
      held, {unit: price, ok: 'Sell'});
    if (!qty) return;
    const profit = (price - (S.cost[name] || 0)) * qty;
    S.cash += qty * price;
    removeItems(name, qty, cut);
    if (cut) { tagSales += qty; tally('reasons', qty); }
    addHeat(qty * price);
    const xp = profit > 0 ? gainXp(Math.min(60, Math.sqrt(profit) / 4)) : '';
    if (profit > 0) { tally('profit', profit); if (S.flags[name] === 'up') tally('spike'); }
    S.mood = profit > 0 ? 'grin' : profit < 0 ? 'ouch' : S.mood;
    SND.play(profit >= 0 ? 'cash' : 'loss');
    log(`Sold ${num(qty)} ${name} for ${money(qty * price)} ` +
      `(<span class="${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${money(profit)}</span>).${cut ? ` ${tagHtml}` : ''}${xp}`);
  },

  async contract(index) {
    const c = S.contracts[index];
    if (!c || (S.inv[c.good] || 0) < c.qty) return;
    if (c.heist) return heistPlay(heistM('job', c));   // a break-in: the goods are the devices you leave behind
    const chance = chanceFor(c), pay = payoutFor(c), price = S.prices[c.good];
    const compare = price ? `Selling them here instead would bring ${money(price * c.qty)}.` : 'Nobody is buying them here today.';
    if (!await confirmDlg('Freelance job', `<p><b>${c.job}</b>, for ${c.client}.</p>` +
      `<p>Uses up ${num(c.qty)} ${c.good}. Pays <span class="amber">${money(pay)}</span> if it works. ${compare}</p>` +
      `<p>Chance of success: <b>${chance}%</b></p>` +
      '<p class="dim">If it fails the goods are burned, your Heat jumps, and you may be traced. ' +
      'Levels and proxies raise the chance; Heat lowers it.</p>', 'Run the job', 'Walk away')) return;
    removeItems(c.good, c.qty);
    S.contracts.splice(index, 1);
    const quiet = inSyn('ghost'), heatWas = S.heat;
    if (Math.random() * 100 < chance) {
      S.cash += pay;
      S.mood = 'grin';
      heatUp(quiet ? 4 : 8);
      const xp = gainXp(40 + (100 - c.chance));
      tally('jobs');
      if (heatWas < 30) tally('quietjob');
      SND.play('hack'); SND.play('imin', 0.45); SND.play('cash', 1.2);
      log(`<span class="green">Freelance job done: ${c.client} paid ${money(pay)}.</span>${xp}`);
      await alertDlg('Job done', `<p>Clean work. ${c.client} pays <b>${money(pay)}</b>.</p>`);
    } else {
      heatUp(quiet ? 8 : 15);
      S.mood = 'ouch';
      const xp = gainXp(10);
      SND.play('hack'); SND.play('lose', 0.45);
      log(`<span class="red">Freelance job blown: ${num(c.qty)} ${c.good} burned.</span>${xp}`);
      await alertDlg('Job blown', `<p>It goes sideways. The ${c.good} are burned and ${c.client} stops answering.</p>`, 'danger');
      if (Math.random() < 0.35) await lawEncounter();
    }
  },

  // Break into a rival syndicate's node for loot. Once a day.
  async raid() {
    if (S.raided) return;
    if (!S.proxies && !S.inv['Zero-Days']) {
      return alertDlg('Hack a rival', '<p>You need at least one proxy chain or a Zero-Day to breach a rival node.</p>' +
        `<p class="dim">Proxy chains are sold at the black market (${GEAR_SPOTS.join(', ')}).</p>`);
    }
    const mood = g => g >= 3 ? '<span class="red">out for blood</span>' : g >= 1 ? '<span class="amber">watching you</span>' : 'ignoring you';
    const crews = rivals();
    const html = '<p>Breach a rival node and drain it. One raid a day. It is a hacking fight: weapons are no use, ' +
      'and if they win they rob you instead.</p>' +
      crews.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b> &middot; ${mood(S.grudge[k])}</div>`).join('') +
      '<p class="dim">Every raid makes that crew more likely to come after you.</p>';
    const buttons = crews.map(k => [SYNDICATES[k][0], k]);
    buttons.push(['Not today', null, 'small']);
    const key = await dialog('Hack a rival', html, buttons);
    if (!key) return;
    S.raided = true;
    await fight({kind: 'raid', gang: key, name: SYNDICATES[key][0], n: rnd(2, 3 + Math.floor(S.day / 6)),
      hit: 0.3, lo: 3, hi: 8});

  async medkit() {
    if (!S.medkits || S.hp >= 100) return;
    S.medkits--;
    S.hp = Math.min(100, S.hp + MED_HEAL);
    SND.play('heal');
    log(`Used a medkit: Health back to ${S.hp}%.`);

  // Wear, swap and scrap gear.
  async gearmenu() {
    for (;;) {
      const totals = Object.keys(STATS).filter(k => bonus(k)).map(k => statLine(k, bonus(k)));
      const html = `<div class="avatarbox"><div class="zoomable" data-pick="zoom">${avatarSvg()}<small>tap to zoom</small></div><div>` +
        Object.entries(SLOTS).map(([slot, [label]]) => {
        const it = career.gear[slot];
        return `<div class="slotline" data-pick="slot:${slot}">${it ? gearIcon(it) : ''}<span><span class="dim">${label}</span><br>` + (it
          ? `<b class="r${it.rar}">${it.name}</b><br>${itemStats(it)}`
          : '<span class="dim">empty</span>') + '</span></div>';
      }).join('') + '</div></div>' +
        `<p><b>Total bonuses:</b> ${totals.length ? totals.join(', ') : 'none yet'}</p>` +
        `<p>${capLines()}<br><span class="dim">Backpacks and anything with pockets add to what you can carry. ` +
        'The number takes the colour of your backpack.</span></p>' +
        `<p class="dim">BAG ${career.bag.length}/${BAG_SIZE}. Tap an item to wear or scrap it. Gear drops from rival crews, ` +
        'is sold at the black market, and stays with you between runs.</p>' +
        `<p class="dim">${RARITY.map((name, i) => `<span class="r${i}">${name}</span>`).join(' &middot; ')}</p>`;
      const buttons = career.bag.map((it, i) => [it.name, i, 'r' + it.rar, gearIcon(it)]);
      buttons.push(['Change your look', 'look'], ['Close', null, 'primary']);
      const index = await dialog('Gear', html, buttons);
      if (index === null) return;
      if (index === 'look') { await ACTIONS.look(); continue; }
      if (index === 'zoom') { await inspectGear(); continue; }
