    }
  },

  // Everything you are carrying on one screen, as a grid of picture tiles:
  // goods, weapon and ammo, supplies, and the gear bag. Tapping a tile opens it.
  async inventory() {
    // pick: what the dialog answers when the tile is tapped. cls: extra classes (rarity, wide, state).
    const tile = (pick, art, label, count, cls) =>
      `<div class="tile ${cls || ''}"${pick ? ` data-pick="${pick}"` : ''}>${art}` +
      (count ? `<i>${count}</i>` : '') + `<small>${label}</small></div>`;
    const head = (title, note) => `<div class="invhead"><b>${title}</b><span>${note}</span></div>`;
    const none = text => `<p class="dim">${text}</p>`;
    const initials = name => {
      const words = name.split(/[\s-]+/);
      return (words.length > 1 ? words.map(word => word[0]).join('').slice(0, 3) : name.slice(0, 2)).toUpperCase();
    };
    for (;;) {
      sortBag();
      // --- goods on the drive: green when they sell here for more than you paid, red for less ---
      const goods = GOODS.map(g => g[0]).filter(n => S.inv[n]);
      let worth = 0, paid = 0;
      const goodsHtml = goods.map(n => {
        const q = S.inv[n], price = S.prices[n], cost = S.cost[n] || 0;
        paid += q * cost;
        if (price) worth += (q - tagged(n)) * price + tagged(n) * tagPrice(price);
        const cls = !price ? 'dim' : price > cost ? 'green' : price < cost ? 'red' : '';
        // Tagged ones get a tile of their own, next to the clean ones of the same kind.
        const marked = tagged(n), glyph = `<b class="glyph ${cls}">${initials(n)}</b>`;
        return (q > marked ? tile('g:' + n, glyph, n, 'x' + num(q - marked)) : '') +
          (marked ? tile('g:' + n, glyph, tagHtml, 'x' + num(marked) + ' &#9888;', 'tagged wide') : '');
      }).join('');
      // --- stuck in the prison pocket: listed, but locked ---
      const stuckHtml = Object.keys(S.stuck).map(n =>
        tile('k:' + n, `<b class="glyph">${initials(n)}</b>`, n, 'x' + num(S.stuck[n]) + ' &#128274;', 'stuck')).join('');
      // --- weapon and ammunition ---
      const w = WEAPONS[S.weapon], active = activeAmmo();
      const weaponHtml = (w ? tile('weapon', weaponIcon(S.weapon), w[0], '', 'wide')
        : tile('', '<b class="glyph dim">&mdash;</b>', 'Unarmed', '', 'wide empty')) +
        Object.keys(AMMO).filter(k => S.ammo[k] > 0).map(k =>
          tile('a:' + k, ammoIcon(k), AMMO[k][4], 'x' + S.ammo[k], k === active && usesAmmo(w) ? 'on' : '')).join('');
      // --- supplies: medkits, proxies and single-use gadgets ---
      let supplies = '';
      if (S.medkits) supplies += tile('s:medkit', miscIcon('medkit'), 'Medkit', 'x' + S.medkits);

          `${sickLeft() <= 1 ? 'Sleep on them again and you die of dysentery.' : `You can sleep on them ${nights(sickLeft() - 1)}.`}</p>` : '') +

        head('Ride', tripsHtml()) + '<div class="tiles">' + (VEHICLES[S.ride] ? tile('ride', rideIcon(S.ride), VEHICLES[S.ride][4], `+${rideHops()}`, 'wide')
          : tile('', '<b class="glyph dim">&mdash;</b>', 'On foot', '', 'wide empty')) + '</div>' +
        head('Supplies', '') + (supplies ? `<div class="tiles">${supplies}</div>` : none('No medkits, proxies or gadgets.')) +
        head('Gear bag', `${career.bag.length}/${BAG_SIZE}`) + `<div class="tiles">${bagHtml}</div>` +
        none('Tap anything to see it, use it, wear it or scrap it. &#9650; marks gear rarer than what you are wearing.');
      const buttons = [['Loadout', 'gear']];
      if (junk.length) buttons.push([`Scrap ${junk.length} Common for ${money(junkCash)}`, 'junk', 'danger']);
      buttons.push(['Close', null, 'primary']);

      } else if (choice === 'weapon') {
        await dialog(w[0], `<div class="syn">${withIcon(weaponIcon(S.weapon), `<b>${w[0]}</b> <span class="dim">${(WTYPE[w[4]] || [''])[0]}</span><br>` +
          `${Math.round(w[3] * 100)}% to hit${w[2] > 1 ? ` &middot; ${w[2]} shots a round` : ''}`)}</div>` +
          (!usesAmmo(w) ? none('Needs no ammunition.')
            : active ? `<p>Loaded with <b>${AMMO[active][0]}</b>: ${hitChange(active)}, ${S.ammo[active]} rounds left.</p>`
              : '<p class="red">No ammunition. It will not fire until you buy some.</p>'),
          [['Back', null, 'primary']]);
      } else if (choice === 'ride') {
        await dialog(VEHICLES[S.ride][0], `<div class="syn">${rideCard(S.ride)}</div>` +
          (tanked(S.ride) ? '' : `<p class="red">The tank is empty, so it adds no hops today. Fill it from the Garage at the Bunker.</p>`) +
          `<p class="dim">You own ${S.rides.length} of the ${GARAGE_SIZE} rides your garage holds. Swap between them at the Bunker; ` +
          `any ride shop pays ${money(rideValue(S.ride))} for this one.</p>`, [['Back', null, 'primary']]);
      } else if (choice.startsWith('a:')) {
        const [name, , , , short] = AMMO[arg];
        const act = await dialog(name, `<div class="syn">${withIcon(ammoIcon(arg), `<b>${name}</b> <span class="dim">${short}</span><br>` +
          `${hitChange(arg)} &middot; ${S.ammo[arg]} rounds`)}</div>` +
          (arg === active ? '<p class="green">This is what your weapon fires.</p>'
            : none('If the loaded kind runs out, your weapon falls back to the best kind you have left.')),
          arg === S.loaded ? [['Back', null, 'primary']] : [['Load it', 'load', 'primary'], ['Back', null]]);
        if (act === 'load') S.loaded = arg;
      } else if (choice.startsWith('s:')) {

          ? ['Medkit', `heals ${MED_HEAL}% Health, even in the middle of a fight`, S.medkits, MAX_MED, S.hp < 100]
          : arg === 'proxy' ? ['Proxy chain', 'powers your counter-hacks; more proxies, better odds', S.proxies, MAX_PROXIES, false]
            : [GADGETS[arg][0], GADGETS[arg][3], S[arg], GADGETS[arg][2], COOL[arg] ? !coolBlock(arg) : arg === 'fakeid' && S.heat > 0];
        const fightOnly = arg !== 'medkit' && arg !== 'fakeid' && !COOL[arg] && !TOOLS[arg];
        const act = await dialog(name, `<div class="syn">${withIcon(miscIcon(arg), `<b>${name}</b><br>${text}`)}</div>` +
          `<p>You carry <b>${have}</b> of ${most}.</p>` + (COOL[arg] ? coolHint(arg) : '') +
          (fightOnly ? none('Used from the fight screen.')
            : TOOLS[arg] ? `<p>${lockLine()}</p>` + none('An entry tool: used at the lock when you break in on a job, and at the practice board in the Bunker.')
            : usable || COOL[arg] ? '' : none(arg === 'medkit' ? 'Your Health is already full.' : 'You have no Heat to drop.')),
          usable ? [['Use it', 'use', 'primary'], ['Back', null]] : [['Back', null, 'primary']]);

          (price ? `<p>Sells here for <b class="${price > cost ? 'green' : price < cost ? 'red' : ''}">${money(price)}</b> each, ` +
            `${money((q - tagged(arg)) * price + tagged(arg) * tagPrice(price))} for the lot.</p>` : none('Nobody is buying these here.')) +
          (tagged(arg) ? `<div class="syn">${num(tagged(arg))} of them carry a tag: ${tagHtml}<br><span class="dim">Those sell for ${pct(TAG_CUT)}% less` +
            `${price ? `: ${money(tagPrice(price))} each here` : ''}. A street doc had to remove them. That is all anyone needs to know.</span></div>` : ''),
          [price ? ['Sell', 'sell', 'primary'] : ['Dump', 'dump', 'danger'], ['Back', null]]);
        if (act) await ACTIONS[act](arg);
      } else if (choice.startsWith('k:')) {
        await dialog(arg, `<div class="syn"><b class="red">${arg}</b> x${num(S.stuck[arg])} &#128274;<br>stuck in your prison pocket</div>` +
          `<p>They cannot be sold, used, stashed or dumped until a street doc at the black market (${docSpots()}) takes them out. ` +
          'He also patches you up to full Health while he is in there.</p>' +
          `<p class="amber">${sickLeft() <= 1 ? 'Sleep on them again and you die of dysentery.' : `You can sleep on them ${nights(sickLeft() - 1)} before the one that kills you.`}</p>`,

  // Character creator: skin, hair and streak. Saved with the career.
  async look() {
    const sizes = {skin: SKINS.length, hair: HAIRSTYLES.length, col: HAIRCOLS.length, streak: STREAKS.length};
    for (;;) {
      const L = getLook();
      const cmd = await dialog('Your look', `<div class="posebox">${avatarSvg({plain: true})}</div>` +
        '<p class="dim">Tap a button to step through the choices. Your look stays with you between runs, ' +
        'and you can change it any time from the Gear screen.</p>',
        [[`Skin: ${SKINS[L.skin][0]}`, 'skin'], [`Hair: ${HAIRSTYLES[L.hair]}`, 'hair'],
          [`Hair colour: ${HAIRCOLS[L.col][0]}`, 'col'], [`Streak: ${STREAKS[L.streak][0]}`, 'streak'],
          ['Surprise me', 'any'], ['Done', null, 'primary']]);
      if (!cmd) break;
      if (cmd === 'any') for (const key of Object.keys(sizes)) L[key] = rnd(0, sizes[key] - 1);
      else L[cmd] = (L[cmd] + 1) % sizes[cmd];
      career.look = L;
      saveCareer();
    }
    career.look = getLook();
    saveCareer();
  },

  // --- the Bunker: stash goods, lock up gear, sleep ---
  async store(name) {
    const held = S.inv[name] || 0, most = Math.min(held, STASH_CAP - stashTotal());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Stash ${name}`, `<p>Move them off your drive into the Bunker. You carry ${num(held)}.</p>`,
      most, {ok: 'Store'});
    if (!qty) return;
    const had = S.stash[name] || 0;
    S.stashCost[name] = Math.floor(((S.stashCost[name] || 0) * had + (S.cost[name] || 0) * qty) / (had + qty));
    S.stash[name] = had + qty;
    const tagWas = tagged(name);
    removeItems(name, qty);   // clean ones first; any tagged ones that go keep their tag in the stash
    if (tagWas > tagged(name)) S.stashTag[name] = (S.stashTag[name] || 0) + tagWas - tagged(name);
    log(`Stashed ${num(qty)} ${name} in the Bunker.`);
  },

  async take(name) {
    const had = S.stash[name] || 0, most = Math.min(had, free());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Take ${name}`, `<p>Load them back onto your drive. The stash holds ${num(had)}.</p>`,
      most, {ok: 'Take'});
    if (!qty) return;
    const stTag = Math.min(S.stashTag[name] || 0, had), back = Math.max(0, qty - (had - stTag));   // clean ones first
    addItems(name, qty, S.stashCost[name] || 0, back);
    if (back) S.stashTag[name] = stTag - back;
    S.stash[name] = had - qty;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
    fixTags();
    log(`Took ${num(qty)} ${name} out of the stash.`);
  },

  // Sleeping is the only thing that ends the day. The law may come in the night.
  async sleep() {
    if (S.loc !== BUNKER) return;
    if (S.day >= DAYS) return ACTIONS.cashout();
    const gut = !stuckTotal() ? '' : sickLeft() <= 1
      ? '<p class="red"><b>You still have goods stuck in your prison pocket. If you sleep now, you will die of dysentery.</b> ' +
        `The street doc is at ${docSpots()}.</p>`
      : `<p class="amber">You still have goods stuck in your prison pocket. Sleeping on them makes you sicker: ${nights(sickLeft() - 1)} ` +
        `and then the one that kills you. The street doc is at ${docSpots()}.</p>`;
    // An engine wants its tank filled in the morning: say what that will cost, and what it gets you.
    const fuel = rideTwist(S.ride, 'fuel'), loud = rideTwist(S.ride, 'loud');
    const tank = !fuel ? '' : `<p class="${S.cash >= fuel ? 'dim' : 'amber'}">In the morning the ${VEHICLES[S.ride][0]} takes <b>${money(fuel)}</b> of fuel` +
      `${loud ? ` and adds ${loud}% Heat` : ''}, for +${VEHICLES[S.ride][2]} hops. ` +
      `${S.cash >= fuel ? 'To skip it, get on something else in the Garage first.' : 'You do not have that in cash right now: without it, it adds no hops tomorrow.'}</p>`;
    if (!await confirmDlg('Sleep', gut + '<p>Sleep in the Bunker and end the day? You recover 35% Health and 15% OpSec, and your Heat cools.</p>' + tank +
      '<p class="dim">Rival crews can\'t find you here, but the hotter you are, the more likely the law kicks the door in overnight.</p>',
      'Go to sleep', 'Stay up')) return;
    if (S.heat < 20) tally('cool');
    if (S.heat <= 0) tally('zeroheat');
    SND.play('sleep');
    nextDay();
    // Sleeping on stuck goods makes you ill: less rest at first, then none, then dysentery.
    const ill = stuckTotal() ? ++S.sick : (S.sick = 0);
    S.hp = Math.min(100, S.hp + (ill >= 3 ? 0 : ill ? 15 : 35));
    S.opsec = Math.min(100, S.opsec + 15);
    S.heat = Math.max(0, S.heat - 20);
    log(`Day ${S.day}: you slept in the Bunker. New prices everywhere.`);
    render();
    if (ill) await sickNight(ill);
    if (S.over) return;
    if (Math.random() < Math.min(0.5, 0.03 + S.heat / 200) * (inSyn('ghost') ? 0.7 : 1)) await homeRaid(true);
  },

  // Gear you are not carrying can wait in the Bunker's locker.
  async locker() {
    if (S.loc !== BUNKER) return;
    career.locker = career.locker || [];
    for (;;) {
      const list = (items, empty) => items.length
        ? items.map(it => `<div class="syn">${itemHtml(it)}</div>`).join('') : `<p class="dim">${empty}</p>`;
      const html = `<p class="dim">IN YOUR BAG ${career.bag.length}/${BAG_SIZE}</p>${list(career.bag, 'Your bag is empty.')}` +
        `<p class="dim">IN THE LOCKER ${career.locker.length}/${LOCKER_SIZE}</p>${list(career.locker, 'The locker is empty.')}` +
        '<p class="dim">The locker has a hidden compartment: raids never find it.</p>';
      const buttons = [];
      if (career.locker.length < LOCKER_SIZE) career.bag.forEach((it, i) => buttons.push([`Store ${it.name}`, 'b' + i, 'r' + it.rar, gearIcon(it)]));
      if (career.bag.length < BAG_SIZE) career.locker.forEach((it, i) => buttons.push([`Take ${it.name}`, 'l' + i, 'r' + it.rar, gearIcon(it)]));
      buttons.push(['Close', null, 'primary']);
      const choice = await dialog('Gear locker', html, buttons);
      if (!choice) return;
      const index = Number(choice.slice(1));
      if (choice[0] === 'b') career.locker.push(career.bag.splice(index, 1)[0]);
      else career.bag.push(career.locker.splice(index, 1)[0]);
      saveCareer();
      render();
    }
  },

  // The practice board in the Bunker: real locks, nobody listening. It teaches slowly, a few tries a day,
  // and only up to a point (BREAKIN.practiceCap), so a new player can open the first doors they meet.
  async practice() {
    if (S.loc !== BUNKER) return;
    for (;;) {
      const left = BREAKIN.drills - (S.drills || 0), capped = lockInfo().level >= BREAKIN.practiceCap;
      const html = '<p>A board of locks screwed to the workbench, bought as a job lot from a locksmith who retired suddenly.</p>' +
        `<div class="syn">${lockLine()}${lockMeter()}</div>` +
        `<p>Tries left today: <b class="${left ? 'green' : 'red'}">${left}</b> of ${BREAKIN.drills}.</p>` +
        (capped ? `<p class="amber">You have learned what a workbench can teach (level ${BREAKIN.practiceCap}). The rest is behind real doors.</p>`
          : `<p class="dim">Practice teaches less than a real door, and only up to level ${BREAKIN.practiceCap}. Harder locks teach more. ` +
            'Your picks can still snap, and a paperclip costs nothing.</p>') +
        '<p class="dim">Electronic locks cannot be practised: nobody sells a badge reader by the job lot.</p>';
      const buttons = left > 0 ? ['padlock', 'deadbolt', 'cylinder'].map(k => [`${LOCKS[k][0]} (difficulty ${LOCKS[k][1]})`, k]) : [];
      buttons.push(['Done', null, 'primary']);
      const lock = await dialog('Practice locks', html, buttons);

        log(`You opened the practice ${LOCKS[lock][0].toLowerCase()}.`);

        await alertDlg('Practice locks', `<p>${r.last}</p><p class="dim">You lock it again. That is the whole job.</p>`);

  // The street doc at the black market takes out whatever is stuck in your prison pocket. It always can be
  // done: if you are short, the fee goes on your tab with the Fixer. The goods come back tagged.
  async clinic() {
    if (!GEAR_SPOTS.includes(S.loc) || !stuckTotal()) return;
    const fee = Math.round(EXTRACT_FEE * (1 + Math.floor(S.day / 10) * 0.5)), paid = Math.min(fee, S.cash), owed = fee - paid;
    const n = stuckTotal();
    if (!await confirmDlg('Street doc', `<div class="syn">${withIcon(miscIcon('doc'), '<b>Extraction</b><br>' +
      `removes what is stuck in your prison pocket, and patches you up from ${S.hp}% to full Health`)}</div>` +
      '<p>The street doc looks at you, then at the scan, then at you again. "I am not going to ask. I am going to charge."</p>' +
      `<p>Stuck: <b>${stuckList()}</b>.</p>` +
      `<p>Fee: <span class="amber">${money(fee)}</span>. You have <span class="green">${money(S.cash)}</span>.` +
      (owed ? ` <span class="amber">"I know the Fixer. The other ${money(owed)} goes on your tab."</span>` : '') + '</p>' +
      `<p class="dim">You get the goods back. They will sell for ${pct(TAG_CUT)}% less from now on, with a tag that reads: ${tagHtml}</p>`,
      'Get them out', 'Keep them in')) return;
    S.cash -= paid;
    S.debt += owed;
    for (const [name, qty] of Object.entries(S.stuck)) addItems(name, qty, S.stuckCost[name] || 0, qty);
    S.stuck = {}; S.stuckCost = {}; S.sick = 0;
    S.hp = 100;
    extractTally++;
    tally('extract');
    SND.play('heal');
    log(`<span class="green">The street doc got ${num(n)} goods out for ${money(fee)}${owed ? ` (${money(owed)} of it on the Fixer's tab)` : ''}. ` +
      `Health back to 100%.</span> ${tagHtml}`);
    render();
    await alertDlg('Extracted', `<p>Ten minutes, one pair of tongs, no eye contact. All <b>${num(n)}</b> are out, and you are patched up to <b>100% Health</b>.</p>` +
      `<p>He rinses them, bags them, and staples a tag to the bag: ${tagHtml}</p>` +
      `<p class="dim">Tagged goods sell for ${pct(TAG_CUT)}% less, wherever you sell them. Word gets around.</p>`);
  },

  // Black market: weapons, gadgets, proxy chains, medkits and gear.
  async gear() {
    for (;;) {
      const scale = 1 + Math.floor(S.day / 10) * 0.5;
      const offers = [];
      // Heat items are in short supply (see coolStock) and cost more the hotter you are.
      const stock = coolStock(), hot = HOT_MARKUP[lawTier()];
      for (const [key, [name, price, most, what]] of Object.entries(GADGETS)) {
        if (COOL[key] && !stock[key]) continue;
        if (S[key] < most) offers.push({key: 'x' + key, gadget: key, art: key, name, price: Math.round(price * scale * (COOL[key] ? hot : 1)),
          text: `${gadgetText(key)} (you have ${S[key]}${COOL[key] ? `; ${stock[key]} left here today` : ''})`});
      }
      if (S.proxies < MAX_PROXIES) offers.push({key: 'p', art: 'proxy', name: 'Proxy chain', price: Math.round(1500 * (1 + S.proxies) * scale),
        text: `for hacking back, raids and freelance jobs (you have ${S.proxies})`});
      if (S.medkits < MAX_MED) offers.push({key: 'm', art: 'medkit', name: 'Medkit', price: Math.round(600 * scale),
        text: `restores ${MED_HEAL}% Health any time, even mid-fight (you have ${S.medkits})`});
      S.shop.forEach((it, i) => offers.push({key: 'g' + i, name: it.name, price: Math.round(itemValue(it) * scale),
        item: it, cls: 'r' + it.rar}));
      if (S.hp < 100) offers.push({key: 'd', art: 'doc', name: 'Street doc', price: Math.round((100 - S.hp) * 40 * scale),
        text: `patches you up from ${S.hp}% to full Health`});
      const html = `<p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
        (offers.length ? offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">` +
          `${money(o.price)}</span>${o.item ? itemHtml(o.item) : withIcon(miscIcon(o.art), `<b>${o.name}</b><br>${o.text}`)}</div>`).join('')
          : '<p>You already own everything they sell.</p>') +
        (Object.keys(stock).some(k => stock[k]) ? (hot > 1 ? `<p class="amber">"${LAW[lawTier()].name[0].toUpperCase() + LAW[lawTier()].name.slice(1)} is asking about you. ` +
          `So anything that makes them stop asking costs ${Math.round((hot - 1) * 100)}% more today."</p>` : '') +
          `<p class="dim">Whatever lowers Heat is in short supply: each market gets a few a day. ${QUICK_NOTE}</p>` : '') +
        `<p class="dim">Looking for weapons? The arms dealer is right here, and ${GUN_STORE} is at the ${GUN_SPOT}.</p>`;
      const buttons = offers.filter(o => S.cash >= o.price)
        .map(o => [o.key === 'd' ? 'See the street doc' : `Buy ${o.name}`, o.key, o.cls, o.item ? gearIcon(o.item) : miscIcon(o.art)]);
      if (stuckTotal()) buttons.unshift([`Street doc: get them out (${stuckTotal()})`, 'clinic', 'danger', miscIcon('doc')]);
      buttons.push(['Leave', null, 'small']);
      const key = await dialog('Black market', html, buttons);
      if (!key) return;
      if (key === 'clinic') { await ACTIONS.clinic(); continue; }
      const o = offers.find(x => x.key === key);
      S.cash -= o.price;
      if (o.gadget) {
        S[o.gadget]++;
        if (COOL[o.gadget]) { stock[o.gadget]--; coolBuys++; }
      } else if (key === 'm') S.medkits++;
      else if (key === 'd') S.hp = 100;
      else if (o.item) { S.shop.splice(S.shop.indexOf(o.item), 1); stash(o.item); saveCareer(); }
      else S.proxies++;
      log(key === 'd' ? `The street doc patched you up for ${money(o.price)}.` : `Bought: ${o.name} for ${money(o.price)}.`);
      render();
    }
  },

      `<div class="syn"><b>${Q.order ? 'Standing orders' : `Mission ${q.n + 1} of ${chain.length}: ${Q.title}`}</b><br>"${Q.brief}"</div>` +

      if (S.raided) html += '<p class="amber">You have already raided today. Sleep first.</p>';
      else if (!S.proxies && !S.inv['Zero-Days']) html += '<p class="amber">You need at least one proxy chain or a Zero-Day to breach it.</p>';
      else buttons.push(['Launch the breach', 'boss', 'danger']);
    } else if (Q.kind === 'heist') {   // a break-in, played in stages (see heistPlay)
      const M = heistM('quest', Q);
      html += heistBrief(M);

    html += '<p class="dim" style="margin-top:12px">THE LINE</p>' + chain.map((m, i) =>
      `<div class="${i < q.n ? 'green' : i === q.n ? 'cyan' : 'dim'}">${i < q.n ? '&#10003;' : i === q.n ? '&#9656;' : '&middot;'} ` +

  // The street gig you are holding: who gave it, how far along it is, and handing over a delivery.
  async gig() {
    const G = S.gig;
    if (!G || !CONTACTS[G.who]) return;
    const held = S.inv[G.good] || 0, here = S.loc === G.place;
    let html = contactHead(G.who) + `<p class="dim">${CONTACTS[G.who][0]}. Trust: ${trustStars(G.who)}</p>` +
      `<div class="syn"><b>${G.title}</b><br>"${G.pitch}"</div>` +
      `<p><b>${gigGoal(G)}</b><br><span class="amber">${gigStatus(G)}</span> &middot; ${gigDue(G)} (end of day ${G.due})</p>` +
      `<p>Pays: ${questReward(G)}</p>`;
    const buttons = [];
    if (G.kind === 'deliver') {
      if (here && held >= G.t) buttons.push([`Hand over ${G.t} ${G.good}`, 'give', 'primary']);
      else html += `<p class="dim">${here ? `You are at ${G.place}, but you need ${G.t} ${G.good} on your drive.`
        : `Carry ${G.t} ${G.good} to ${G.place}, then open this there to hand them over.`}</p>`;
    } else if (G.kind === 'courier') {
      if (here) buttons.push(['Hand over the package', 'give', 'primary']);
      else html += `<p class="dim">Get to ${G.place}, then open this there to hand the package over.</p>`;
    } else if (G.kind === 'breakin') {   // a break-in, played in stages (see heistPlay)
      const M = heistM('gig', G);
      html += heistBrief(M);
      if (heistReady(M)) buttons.push([heistButton(M), 'heist', 'primary']);
    } else html += '<p class="dim">It pays out by itself as soon as it is done.</p>';
    buttons.push(['Drop the gig', 'drop', 'small'], ['Close', null, buttons.length ? '' : 'primary']);
    const choice = await dialog('Street gig', html, buttons);
    if (choice === 'heist' && S.gig === G) await heistPlay(heistM('gig', G));
    else if (choice === 'give' && S.gig === G && S.loc === G.place && (G.kind === 'courier' || (S.inv[G.good] || 0) >= G.t)) {
      if (G.kind === 'deliver') removeItems(G.good, G.t);
      G.p = G.t;   // gigCheck pays it out
      log(G.kind === 'deliver' ? `Handed ${G.t} ${G.good} to ${G.who}'s people at ${G.place}.`
        : `Handed ${G.who}'s package over at ${G.place}.`);

      `<p>Walk away from <b>${G.title}</b>? ${G.who} will trust you less.</p>`, 'Drop it', 'Keep it')) {
      S.gig = null;
      addTrust(G.who, -1);
      log(`You dropped ${G.who}'s gig.`);
    }
  },

  // Travelling does not end the day; only sleeping at the Bunker does. You get a set number of
  // trips each day, and the trip home is always free.
  async travel() {
    const tired = S.trips <= 0;
    if (tired && S.loc === BUNKER) {
      return alertDlg('Worn out', '<p>You have no trips left today. Sleep to start a new day.</p>');
    }
    const others = LOCATIONS.filter(l => l !== S.loc && (!tired || l === BUNKER));
    const buttons = others.map(l =>
      [l === HOME ? l + ' (Fixer, wallet)' : l === BUNKER ? l + ' (your hideout, free trip)'
        : GEAR_SPOTS.includes(l) ? l + ' (black market, arms dealer)' : l === GUN_SPOT ? l + ' (guns, ammo, clothing, bags)'
          : rideSpot(l) ? `${l} (${rideSpot(l)[2]})` : l, l]);
    buttons.push(['Stay here', null, 'small']);
    const dest = await dialog('Tunnel out', tired
      ? '<p>You are worn out: no trips left today. You can still make it home to the Bunker to sleep.</p>'
      : `<p>Where to? You have <b>${S.trips}</b> trip${S.trips === 1 ? '' : 's'} left today` +
        `${rideHops() ? ` (the ${VEHICLES[S.ride][4]} adds ${rideHops()} a day)` : ''}. Prices stay put until you ` +
        'sleep at the Bunker, and the trip home is always free.</p>', buttons);
    if (!dest) return;
    await travelFx(S.loc, dest);
    S.loc = dest;
    if (dest !== BUNKER) {
      S.trips--;
      awayRaid(Math.min(0.08, S.heat / 1200));
    }
    rollMarket();
    log(`You surface at ${dest}.`);
    render();
    await randomEvent();
  },

function nextDay(inside) {
  S.day += 1;
  S.debt = Math.ceil(S.debt * (1 + debtRate()));
  const banked = S.wallet;
  S.wallet = Math.floor(S.wallet * (1 + walletRate()));
  if (S.wallet > banked) tally('interest', S.wallet - banked);
  S.heat = Math.max(0, S.heat - HEAT_DECAY);
  // Heat items: decoy traffic cools a little more each night, a VPN runs down, and fast fixes are fresh again.
  if (fx().decoy > 0) { S.heat = Math.max(0, S.heat - COOL.decoy.cool); S.fx.decoy--; }
  if (S.fx.vpn > 0) S.fx.vpn--;
  S.tricks = 0;
  S.drills = 0;      // the practice board is fresh again
  plantsTick();      // devices left behind on break-ins send their money home
  S.raided = false;
  S.mood = '';
  S.hp = Math.min(100, S.hp + 3 + bonus('regen'));
  // Trips: what your legs give you, plus the hops of the ride you are on. Engines start the day empty and
  // are filled here, unless you are inside (a day in a cell): then the tank waits for the day you get out.
  S.gas = {}; S.tripDebt = 0;
  S.trips = TRIPS_PER_DAY + rideHops();
  if (!inside) wakeRide();
  S.markets = {};
  rollMarket();
  if (S.loc !== BUNKER) awayRaid(Math.min(0.25, S.heat / 400));   // days spent locked up or in a clinic
}

// While you are out, the law may raid the Bunker and take whatever is stashed there.
function awayRaid(chance) {
  if (stashTotal() && Math.random() < chance * (inSyn('ghost') ? 0.7 : 1)) {
    const who = LAW[lawTier()].name, lost = seizeStash(1);
    log(`<span class="red">${who[0].toUpperCase() + who.slice(1)} raided the Bunker while you were out: ${num(lost)} stashed goods seized.</span>`);
    notes.push(['Bunker raided', `<p>${who[0].toUpperCase() + who.slice(1)} hit the Bunker while you were out.</p>` +
      `<p>Everything in the stash is gone: <b>${num(lost)}</b> goods seized. Your gear locker's hidden compartment was not found.</p>` +
      '<p class="dim">The higher your Heat, the more likely a raid.</p>']);
  }
}

// ---------- the Bunker ----------
let notes = [];   // things that happened off-screen, shown as pop-ups after the current action
async function flushNotes() {
  while (notes.length) {
    const [title, html] = notes.shift();
    render();
    await alertDlg(title, html, 'danger');
  }
}
const stashTotal = () => Object.values(S.stash).reduce((a, b) => a + b, 0);

// The law takes a share of the stash (1 = all of it). Returns how many goods went.
function seizeStash(share) {
  let lost = 0;
  for (const name of Object.keys(S.stash)) {
    const take = Math.ceil(S.stash[name] * share);
    lost += take;
    S.stash[name] -= take;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
  }
  return lost;
}

function stashHtml() {
  const total = stashTotal();
  const names = GOODS.map(g => g[0]).filter(n => S.inv[n] || S.stash[n] || S.stuck[n]);
  return `<div class="row"><div><div class="name cyan">THE BUNKER &middot; stash ${num(total)}/${STASH_CAP} &middot; carrying ${driveHtml()}</div>` +
    '<div class="sub">Store goods here to free up your drive. Rival crews can\'t touch you at home, but the law can raid ' +
    'the place whether you are in or out, and they take the stash.</div></div></div>' +
    (names.length ? names.map(n => `<div class="row"><div><div class="name">${n}</div>` +
      `<div class="sub">carrying ${num(S.inv[n] || 0)} &middot; stashed ${num(S.stash[n] || 0)}</div>` +
      (tagged(n) || S.stashTag[n] ? `<div class="sub">${tagHtml} ${[tagged(n) ? `${num(tagged(n))} carried` : '',
        S.stashTag[n] ? `${num(S.stashTag[n])} stashed` : ''].filter(Boolean).join(', ')}</div>` : '') +
      (S.stuck[n] ? `<div class="sub red">${num(S.stuck[n])} stuck in your prison pocket: they are not going in the stash</div>` : '') +
      '</div><div></div>' +
      `<div class="btns"><button data-act="store" data-arg="${n}"${S.inv[n] && total < STASH_CAP ? '' : ' disabled'}>Store</button>` +
      `<button data-act="take" data-arg="${n}"${S.stash[n] && free() > 0 ? '' : ' disabled'}>Take</button></div></div>`).join('')
      : '<div class="row"><div class="sub">Nothing to store yet. Bring goods here to keep them off your drive.</div></div>');
}

// The law comes to the Bunker while you are in it. Beat them and the stash is safe;
// slip away and they take half; get arrested and they take all of it.
async function homeRaid(asleep) {
  const tier = lawTier(), L = LAW[tier], who = L.name[0].toUpperCase() + L.name.slice(1);
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  const E = {kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi,
    intro: asleep ? `You wake to boots on the stairs. ${who} is raiding the Bunker: ${n} agent${n === 1 ? '' : 's'}.`
      : `${who} has the Bunker surrounded: ${n} agent${n === 1 ? '' : 's'}.`};
  await fight(E);
  if (S.busted || !stashTotal()) return;
  if (E.result === 'won') {
    log('<span class="green">The Bunker held. Your stash is safe.</span>');
    return;
  }
  const lost = seizeStash(E.result === 'lost' ? 1 : 0.5);
  log(`<span class="red">${who} searched the Bunker: ${num(lost)} stashed goods seized.</span>`);
  render();
  await alertDlg('Bunker searched', `<p>${who} tears the Bunker apart${E.result === 'lost' ? '' : ' after you slip away'}.</p>` +
    `<p><b>${num(lost)}</b> stashed goods seized${E.result === 'lost' ? '' : ' (half the stash)'}.</p>`, 'danger');
}

// ---------- events ----------
async function randomEvent() {
  // These odds are per trip. There are several trips in a day, so each one is fairly small.
  if (Math.random() < Math.min(0.25, 0.03 + S.heat / 600) * (inSyn('ghost') ? 0.7 : 1)) {
    return S.loc === BUNKER ? homeRaid(false) : lawEncounter();
  }
  // Rival syndicates come after you more often the more you have crossed them. Never at the Bunker.
  const crews = rivals(), anger = crews.reduce((sum, k) => sum + S.grudge[k], 0);
  if (S.loc !== BUNKER && Math.random() < Math.min(0.15, 0.02 + 0.015 * anger)) {
    let roll = Math.random() * (anger + crews.length);
    const key = crews.find(k => (roll -= S.grudge[k] + 1) < 0) || crews[0];
    return gangEncounter(key);
  }
  if (S.loc !== BUNKER && Math.random() < JUMP_ODDS) return jumped();   // street muscle, waiting where you come up
  if (S.loc !== BUNKER && Math.random() < JUNKIE_ODDS) return junkie();
  // A street contact with a gig: only when you are free to take one and there is time left to do it.
  if (S.loc !== BUNKER && !S.gig && S.day <= DAYS - 2 && Math.random() < CONTACT_ODDS) return contact();
  if (Math.random() < 0.5) return;   // most trips are uneventful
  const r = Math.random();
  if (r < 0.10) {
    const name = GOODS[rnd(3, GOODS.length - 1)][0];
    const qty = Math.min(rnd(2, 8), free());
    if (qty > 0) {
      addItems(name, qty, 0);
      log(`<span class="cyan">Found an unlocked laptop in a ride share: ${qty} ${name}!</span>`);
      await alertDlg('Lucky find', `<p>Someone left an unlocked laptop in a ride share. You lift <b>${qty} ${name}</b>.</p>`);
    }
  } else if (r < 0.18) {
    const price = rnd(400, 1200) * (1 + Math.floor(S.day / 8));
    if (S.cash >= price && await confirmDlg('Drive upgrade',
      `<p>A hardware hacker offers an encrypted drive upgrade: <b>+50 slots</b> for ${money(price)}.</p>`, 'Buy it', 'Pass')) {
      S.cash -= price; S.drive += 50;
      log(`Drive upgraded to ${cap()} slots.`);
    }
  } else if (r < 0.27) {
    const price = rnd(700, 1500) * (1 + S.proxies);
    if (S.cash >= price && S.proxies < MAX_PROXIES && await confirmDlg('Proxy chain',
      `<p>A sysadmin with a grudge will sell you a proxy chain for ${money(price)}.</p>` +
      '<p class="dim">Proxies help you slip traces and let you counter-hack.</p>', 'Buy it', 'Pass')) {
      S.cash -= price; S.proxies += 1;
      log(`Proxy chain added. You now run ${S.proxies}.`);
    }
  } else if (r < 0.33) {
    if (S.cash > 100) {
      const loss = Math.floor(S.cash * rnd(10, 25) / 100);
      S.cash -= loss;
      S.mood = 'ouch';
      tally('phished');
      log(`<span class="red">Phished! Lost ${money(loss)} from your hot wallet.</span>`);
      await alertDlg('Phished', `<p>You clicked a link. YOU. Someone drained <b>${money(loss)}</b> from your hot wallet.</p>` +
        '<p class="dim">Cash in the cold wallet is safe from this.</p>', 'danger');
    }
  } else if (r < 0.40) {
    if (S.opsec < 100) {
      const price = (100 - S.opsec) * rnd(20, 45);
      if (S.cash >= price && await confirmDlg('OpSec audit',
        `<p>An old-timer offers a full OpSec audit for ${money(price)}. Restores OpSec to 100%.</p>`, 'Pay', 'Pass')) {
        S.cash -= price; S.opsec = 100;
        log('OpSec restored to 100%.');
      }
    }
  }
}

// ---------- junkies ----------
// Now and then a junkie is waiting where you surface, selling whatever they have lifted for a
// fraction of the going rate. Each one carries different kinds of things, and each thing sells once.
const JUNKIE_ODDS = 0.12, JUNKIE_RATE = [25, 45];   // chance per trip, and their price as a % of the shop price
// [name, what they say, what they carry (see junkOffer), skin, hair colour, hat, coat]
const JUNKIES = [
  ['Twitch', 'A twitchy kid with a backpack full of blinking boards. "Tools, man. Good tools. I just need bus fare."',
    ['gadget', 'gadget', 'proxy', 'gadget', 'drive', 'cool'], 0, 4, 0, 1],
  ['Needles', 'A hollow-eyed ex-medic opens a coat lined with stolen hospital stock. "All sterile. Mostly."',
    ['medkit', 'medkit', 'gadget', 'gear', 'medkit'], 2, 1, 4, 6],
  ['Brass', 'His jacket rattles when he walks: loose rounds in every pocket. "Fell off a truck. A police truck."',
    ['ammo', 'ammo', 'weapon', 'ammo', 'weapon'], 3, 2, 1, 4],
  ['Ragpicker', 'She pushes a shopping trolley of clothes with the store tags still on. "Your size. Everything is your size."',
    ['gear', 'gear', 'gear', 'medkit', 'gear'], 4, 5, 0, 7],
  ['Dumpster Dave', 'A man climbs out of the skip behind a datacenter with an armful of drives. "They throw out the good stuff."',
    ['goods', 'goods', 'drive', 'proxy', 'goods', 'cool'], 1, 3, 4, 2],
  ['Glitch', 'Someone in a tinfoil hat is selling things off a blanket. No two of them belong together.',
    ['weapon', 'gadget', 'gear', 'ammo', 'goods', 'proxy', 'cool'], 5, 6, 4, 0],
];

function junkieSvg(J) {
  const [name, , , skin, col, hat, coat] = J, c = '#8a8fa8';
  const F = {look: {skin, hair: 2, col, streak: 4}, level: 1, weapon: 0, hp: 50, mood: '',
    gear: {head: {kind: hat, c, rar: 0}, body: {kind: coat, c, rar: 0}, hands: null, feet: null, deck: null}};
  return `<svg class="avatar foe" viewBox="${bustBox()}" role="img" aria-label="${esc(name)}">` +
    `<rect x="0" y="0" width="200" height="352" fill="#3dff9a" opacity=".1"/><g${figClass()}>${sprite(figure(F), true)}</g></svg>`;
}

// One thing a junkie might have. Returns null when you could not use it (already carrying the most you can).
// {name, text, list (the shop price), icon, cls, take()}
function junkOffer(kind) {
  const scale = 1 + Math.floor(S.day / 10) * 0.5;
  if (kind === 'gadget' || kind === 'cool') {   // 'cool': one of the Heat items; 'gadget': any of the others
    const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2] && !COOL[k] === (kind === 'gadget'));
    if (!spare.length) return null;
    const k = pick(spare), [name, price, , what] = GADGETS[k];
    return {name, text: `${gadgetText(k)} (you have ${S[k]})`, list: price * scale, icon: miscIcon(k), take() { S[k]++; }};
  }
  if (kind === 'proxy') {
    if (S.proxies >= MAX_PROXIES) return null;
    return {name: 'Proxy chain', text: `"borrowed" server logins: for hacking back, raids and freelance jobs (you have ${S.proxies})`,
      list: 1500 * (1 + S.proxies) * scale, icon: miscIcon('proxy'), take() { S.proxies++; }};
  }
  if (kind === 'medkit') {
    if (S.medkits >= MAX_MED) return null;
    return {name: 'Medkit', text: `restores ${MED_HEAL}% Health any time (you have ${S.medkits})`, list: 600 * scale,
      icon: miscIcon('medkit'), take() { S.medkits++; }};
  }
  if (kind === 'ammo') {
    const k = pick(Object.keys(AMMO));
    if (S.ammo[k] + AMMO_BOX > AMMO_MAX) return null;
    return {name: `${AMMO_BOX} ${AMMO[k][0]}`, text: `${hitChange(k)} (you have ${S.ammo[k]})`, list: AMMO[k][1] * scale, icon: ammoIcon(k),
      take() { S.ammo[k] += AMMO_BOX; if (!S.ammo[S.loaded]) S.loaded = k; }};
  }
  if (kind === 'weapon') {
    // Nothing too grand: what a junkie could plausibly have walked off with, a little better late in a run.
    const top = 20000 + S.day * 3000;
    const i = pick(WEAPONS.map((w, n) => n).filter(n => WEAPONS[n] && n !== S.weapon && WEAPONS[n][1] <= top));
    const w = WEAPONS[i], mine = WEAPONS[S.weapon];
    return {name: w[0], text: `${WTYPE[w[4]][0].toLowerCase()}, ${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit` +
      `${usesAmmo(w) ? ', no rounds included' : ''}${mine ? `. Replaces your ${mine[0]}` : ''}`, list: w[1] * scale, icon: weaponIcon(i),
      take() { S.weapon = i; }};
  }
  if (kind === 'gear') {
    const it = makeItem(Math.min(3, rollRarity(S.day * 0.3 + 5)));
    return {name: it.name, item: it, list: itemValue(it) * scale, icon: gearIcon(it), cls: 'r' + it.rar,
      take() { stash(it); saveCareer(); }};
  }
  if (kind === 'goods') {
    const [name, low, high] = GOODS[rnd(3, GOODS.length - 1)], qty = Math.min(rnd(3, 10), free());
    if (qty <= 0) return null;
    const list = Math.round((low + high) / 2) * qty;
    return {name: `${qty} ${name}`, text: 'still in the shrink wrap', list, icon: '', goods: [name, qty],
      take(paid) { addItems(name, qty, Math.floor(paid / qty)); }};
  }
  // 'drive': a pocketful of storage
  return {name: 'Loose drives', text: '+25 drive slots, wiped (he says)', list: 600 * (1 + Math.floor(S.day / 8)), icon: '',
    take() { S.drive += 25; }};
}

async function junkie() {
  const J = pick(JUNKIES), [name, line, kinds] = J;
  const offers = [];
  for (const kind of kinds.slice().sort(() => Math.random() - 0.5)) {
    const o = junkOffer(kind);
    if (!o || offers.some(x => x.name === o.name) || offers.length >= 4) continue;
    o.price = Math.max(10, Math.round(o.list * rnd(JUNKIE_RATE[0], JUNKIE_RATE[1]) / 1000) * 10);
    o.list = Math.round(o.list);
    offers.push(o);
  }
  if (!offers.length) return;
  junkTally++;
  log(`A junkie called ${name} was waiting at ${S.loc} with things to sell.`);
  let bought = 0;
  while (offers.length) {
    render();
    const html = `<div class="versus" style="grid-template-columns:86px"><div>${junkieSvg(J)}<small>${name.toUpperCase()}</small></div></div>` +
      `<p>${bought ? '"Anything else? I got more."' : line}</p><p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
      offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">${money(o.price)}</span> ` +
        `<span class="dim">(<s>${money(o.list)}</s>)</span>` +
        `${o.item ? itemHtml(o.item) : withIcon(o.icon, `<b>${o.name}</b><br>${o.text}`)}</div>`).join('') +
      '<p class="dim">Junkies sell for a fraction of what the shops charge. Walk away and they are gone.</p>';
    // Goods only while there is still room for them: an earlier buy from the same junkie may have used it up.
    const buttons = offers.filter(o => S.cash >= o.price && (!o.goods || o.goods[1] <= free()))
      .map(o => [`Buy ${o.name}`, o.name, o.cls, o.icon]);
    buttons.push(['Walk on', null, buttons.length ? 'small' : 'primary']);
    const choice = await dialog('A junkie with a deal', html, buttons, '');
    const o = offers.find(x => x.name === choice);
    if (!o) break;
    S.cash -= o.price;
    o.take(o.price);
    offers.splice(offers.indexOf(o), 1);
    bought++;
    tally('junk');
    log(`Bought ${o.name} from ${name} for ${money(o.price)}.`);
  }
  if (!bought) log(`You left ${name} to it.`);
}

// ---------- confrontations: the law, rival syndicates, and raids on rivals ----------
function lawEncounter() {
  const tier = lawTier(), L = LAW[tier];
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  return fight({kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi});
}

function gangEncounter(key) {
  return fight({kind: 'gang', gang: key, name: SYNDICATES[key][0], n: rnd(1, 2 + Math.floor(S.day / 8)),
    hit: 0.3, lo: 3, hi: 8});
}

// ---------- getting jumped ----------
// Now and then somebody is waiting where you surface, and not to sell you anything. They are there in
// person, so every hit lands on your Health, and half the time they get the first swing in.
const JUMP_ODDS = 0.1;   // chance per trip
const THUG_CREWS = ['Street punks', 'Scrap Dogs', 'Chrome Rats', 'Alley Jackers', 'Gutter Saints', 'Wire Strippers'];
// [skin, hair, hair colour, hat (-1 none), jacket, mask (-1 none), weapon]
const THUG_LOOKS = [[2, 2, 3, -1, 4, 0, 11], [4, 0, 1, 0, 0, 6, 13], [0, 4, 5, 1, 4, -1, 14], [3, 1, 0, -1, 3, 8, 11],
  [1, 3, 2, 0, 4, 0, 13], [5, 2, 6, 1, 0, 6, 14]];
let jumpTally = 0;   // counted for the self-test

function jumped() {
  const n = rnd(1, 2 + Math.floor(S.day / 8)), name = pick(THUG_CREWS);
  jumpTally++;
  log(`<span class="red">${name} jumped you at ${S.loc}.</span>`);
  return fight({kind: 'thug', name, n, hit: 0.4, lo: 4, hi: 9, seed: rnd(0, 5),
    ambush: Math.random() < Math.max(0.15, 0.5 - bonus('speed') / 100),
    intro: `You surface at ${S.loc} and walk straight into it. ${name}: ${n} of them, stepping out of the dark.`});
}

// ---------- the prison pocket, in use ----------
// E.pocket holds what went in during this encounter: [{name, qty, cost, tag}]. It only lasts as long as the
// fight does; pocketOut() empties it again when the fight is over, however it ended.
let pocketTally = 0, stuckTally = 0, extractTally = 0, tagSales = 0, sickTally = 0, deadTally = 0;   // counted for the self-test
const pocketRoom = E => POCKET_CAP - stuckTotal() - ((E && E.pocket) || []).reduce((sum, lot) => sum + lot.qty, 0);
const pocketable = () => GOODS.map(g => g[0]).filter(name => S.inv[name] && !POCKET_NO[name]);

// Choose what to hide. Returns {name, qty}, or null if you thought better of it.
async function pocketIn(E) {
  const room = pocketRoom(E), names = pocketable();
  if (room <= 0 || !names.length) return null;
  const wont = Object.keys(POCKET_NO).filter(name => S.inv[name]);
  const html = `<p>There is one place on you ${E.name} will not search without a warrant and a strong stomach. ` +
    `It holds <b>${room}</b> more small thing${room === 1 ? '' : 's'}.</p>` +
    names.map(name => {
      const qty = Math.min(room, S.inv[name]);
      return `<div class="syn pickable" data-pick="${name}"><b>${name}</b> x${num(qty)}` +
        `<br><span class="dim">you hold ${num(S.inv[name])}, bought at ${money(S.cost[name] || 0)} each</span></div>`;
    }).join('') +
    (wont.length ? `<p class="dim">Will not fit: ${wont.map(name => `${name} (${POCKET_NO[name]})`).join(', ')}.</p>` : '') +
    '<p class="dim">What you hide survives a search, an arrest and a drive wipe. It costs you this turn. ' +
    `About one time in three, some of it does not come back out, and then you need a street doc.</p>`;
  // In a fight the choice is a window on the battle screen; anywhere else (and in the self-test) it is a dialog.
  const name = BTL.live()
    ? await BTL.pick('Prison pocket', names.map(name => [name, `<span>${name}</span><small>x${num(Math.min(room, S.inv[name]))} of ${num(S.inv[name])}</small>`]),
      `One place ${E.name} will not search. It holds <b>${room}</b> more. What you hide survives a search, an arrest and a wipe, and costs you this turn. ` +
      'About one time in three, some of it does not come back out.' + (wont.length ? ` Will not fit: ${wont.join(', ')}.` : ''))
    : await dialog('Prison pocket', html, [['Never mind', null, 'primary']]);
  if (!name || !S.inv[name] || POCKET_NO[name]) return null;
  const qty = Math.min(room, S.inv[name]), cost = S.cost[name] || 0, tagWas = tagged(name);
  removeItems(name, qty);
  E.pocket = E.pocket || [];
  E.pocket.push({name, qty, cost, tag: tagWas - tagged(name)});
  if (Math.random() < STUCK_ODDS) E.jam = true;   // each use rolls on its own; you find out afterwards
  pocketTally++;
  tally('pocket');
  log(`You hid ${num(qty)} ${name} in your prison pocket.`);
  return {name, qty};
}

// The fight is over: get it all back out. If a use went wrong, some of it stays where it is.
async function pocketOut(E) {
  const lots = E.pocket || [];
  delete E.pocket;
  if (!lots.length || S.over) return;
  fixTags();   // the drive may have been wiped or seized since they went in
  const total = lots.reduce((sum, lot) => sum + lot.qty, 0);
  // Which ones stick is the luck of the draw: shuffle every hidden thing and keep the first few.
  const units = lots.flatMap((lot, i) => Array(lot.qty).fill(i)).sort(() => Math.random() - 0.5);
  const jam = E.jam ? rnd(1, total) : 0, held = lots.map(() => 0);
  units.slice(0, jam).forEach(i => held[i]++);
  const wasStuck = stuckTotal();
  lots.forEach((lot, i) => {
    const out = lot.qty - held[i];
    if (out) addItems(lot.name, out, lot.cost, Math.min(lot.tag, out));
    if (held[i]) {
      const had = S.stuck[lot.name] || 0;
      S.stuckCost[lot.name] = Math.floor(((S.stuckCost[lot.name] || 0) * had + lot.cost * held[i]) / (had + held[i]));
      S.stuck[lot.name] = had + held[i];
    }
  });
  render();
  if (!jam) {
    log(`<span class="green">Your prison pocket gave back all ${num(total)} goods.</span>`);
    return alertDlg('Prison pocket', `<p>Somewhere private, you get all <b>${num(total)}</b> back. You do not look at them directly.</p>` +
      '<p class="dim">Nobody saw anything. You will be telling yourself that for a while.</p>');
  }
  if (!wasStuck) S.sick = 0;
  stuckTally++;
  tally('stuck');
  S.mood = 'ouch';
  log(`<span class="red">${num(jam)} of the goods in your prison pocket are stuck: ${stuckList()}.</span>`);
  render();
  return alertDlg('Stuck', `<p>${total - jam ? `<b>${num(total - jam)}</b> come back out.` : 'Nothing comes back out.'} ` +
    `<b>${num(jam)}</b> ${jam === 1 ? 'does' : 'do'} not, and you tried.</p>` +
    `<div class="syn"><b class="red">Stuck:</b> ${stuckList()}<br><span class="dim">They cannot be sold, used or moved, and they still count as carried.</span></div>` +
    `<p>A <b>street doc</b> at the black market (${docSpots()}) will take them out for a fee, and patch you up to full Health while he is in there.</p>` +
    `<p class="amber">Do not sleep on it. Left in, they give you dysentery: you have ${nights(sickLeft() - 1)} before the one you do not wake up from.</p>`, 'danger');
}

// A night slept with goods stuck. n: how many nights that makes. Tells you where you stand; the last one ends the run.
async function sickNight(n) {
  sickTally++;
  const left = SICK_DAYS - n, doc = `<p class="dim">Stuck: ${stuckList()}. The street doc at the black market (${docSpots()}) removes them.</p>`;
  const count = left > 1 ? `<p class="amber">You can sleep on it ${nights(left - 1)}. The one after that is the last.</p>` : '';
  if (n >= SICK_DAYS) {
    S.hp = 0;
    S.over = true;
    S.dead = 'dysentery';
    deadTally++;
    tally('dysentery');
    log('<span class="red">You have died of dysentery.</span>');
    return;
  }
  if (n < 3) {
    log(`<span class="amber">Day ${S.day}: your gut is not happy about what is stuck in it. Sleep only healed 15%.</span>`);
    return alertDlg(n === 1 ? 'Something is wrong' : 'Cramps', (n === 1
      ? '<p>You sleep badly. What is stuck in your prison pocket has started to disagree with you, and it is winning the argument.</p>'
      : '<p>Cramps wake you twice. You have begun to plan your day around bathrooms.</p>') +
      '<p>Sleep only heals 15% Health while they are in there.</p>' + count + doc, 'danger');
  }
  const loss = n >= 5 ? 25 : 15, slow = n >= 5 ? 2 : 1;
  S.hp = Math.max(5, S.hp - loss);
  S.trips = Math.max(1, S.trips - slow);
  S.mood = 'ouch';
  log(`<span class="red">Day ${S.day}: dysentery. Health -${loss}%, and ${slow} trip${slow === 1 ? '' : 's'} lost to the bathroom.</span>`);
  return alertDlg(n >= 5 ? 'DYSENTERY: LAST WARNING' : 'DYSENTERY', (n >= 5
    ? '<p>You are grey, shaking, and on first-name terms with the Bunker\'s plumbing. <b>If you sleep again with them still in, you die.</b></p>'
    : '<p>It is dysentery now. This is what happens when you keep merchandise where merchandise was never meant to be kept.</p>') +
    `<p>Health <b class="red">-${loss}%</b>, sleep no longer heals you, and you lose <b>${slow}</b> trip${slow === 1 ? '' : 's'} today to the bathroom.</p>` +
    count + doc, 'danger');
}

// ====================== BATTLE SCREEN: BEGIN ======================
// Fights play out on a side-on stage, drawn on one canvas: a backdrop for wherever you are, the hostiles
// standing on the left, you on the right with the gear you wear and the weapon you hold. Underneath is a row
// of windows: who is left standing, the commands, your vitals. It only shows what fightRounds() decides.
// None of it runs during the self-test: every call returns at once when AUTO is set, and nothing that
// decides the order of play waits on a drawn frame (the timing is all setTimeout; frames only paint).
const BTL = (() => {
  const el = $('#battle');
  const prefs = Object.assign({fast: false}, store.get('zdh-battle') || {});
  const calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const q = sel => el.querySelector(sel);
  const H = 160, FLOOR = 84;          // the stage is H "big pixels" tall and as wide as the screen allows
  const TAU = Math.PI * 2, AIMED = Math.PI / 2;
  let E = null, title = '', run = 0;  // run: counts fights, so work left over from the last one can tell
  let cv = null, g = null, W = 256, K = 3, scn = null;   // K: screen pixels per big pixel
  let foes = [], hero = null, parts = [], tweens = [], waits = [];
  let busy = false, skipping = false, ready = Promise.resolve(), raf = 0, lastTick = -1, dirty = true;
  let V = {};                         // stage-wide effects: flash, shake, dim, wipe, cursor
  let list = null;                    // the menu that has the keyboard, if any
  let aim = null, lastCmd = null, turn = 'you';
  const on = () => !AUTO && !!E;
  const speed = () => (prefs.fast || calm ? 0.45 : 1);
  const dir = a => (a.flip ? 1 : -1);   // which way someone faces: you face left, they face right
  const living = () => foes.filter(f => f.alive);

  // ---------- timing: waits and tweens you can skip ----------
  function wait(ms) {
    if (skipping) return Promise.resolve();
    return new Promise(resolve => {
      const w = {resolve, id: setTimeout(() => { waits.splice(waits.indexOf(w), 1); resolve(); }, ms * speed())};
      waits.push(w);
    });
  }
  // Slide numbers on an object to new values. The frame loop moves them; the timer finishes them, frames or not.
  function tw(o, to, ms, ease) {

  const SCENES = {'The Hackerspace': ['racks', '#c77dff'], 'Tor Bazaar': ['market', '#3dff9a'], 'IRC Backchannel': ['alley', '#00e5ff'],
    'Con Hallway': ['market', '#fcee0a'], 'Campus Lab': ['racks', '#3dff9a'], 'Datacenter Dock': ['racks', '#00e5ff'],
    'Cyber Cafe': ['market', '#ff4fd8'], 'Paste Alley': ['alley', '#ff4fd8'], 'Strip Mall': ['street', '#ff4fd8']};
  function paint(kind, w, col, o) {

      for (let d = 3, s = 4; FLOOR + d < H; d += s, s += 3) R(0, FLOOR + d, w, 1, seam || cc);
    };

    const NEON = ['#fcee0a', '#00e5ff', '#ff4fd8', '#3dff9a', '#ff9d2e'];

      for (let i = 0; i < 30; i++) R(ri(0, w), ri(0, 38), 1, 1, rr() < 0.3 ? '#d9e2ff' : '#5a5f9a');

      for (let d = 10; FLOOR + d < H; d = d * 1.45 + 3) R(w / 2 - 1 - d * 0.03, FLOOR + d, 2 + d * 0.06, Math.max(1, d * 0.1), '#b8a922');
      for (let i = 0; i < 16; i++) R(ri(0, w), ri(FLOOR + 8, H - 4), ri(6, 18), 1, pk(['rgba(255,79,216,.2)', 'rgba(0,229,255,.15)', 'rgba(252,238,10,.1)']));
      const lx = w - 14;   // a streetlamp and its pool of light

  // ---------- drawing ----------
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  function pline(x1, y1, x2, y2, c, th) {
    const n = Math.max(1, Math.round(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1))));
    g.fillStyle = c;
    for (let i = 0; i <= n; i++) g.fillRect(Math.round(x1 + (x2 - x1) * i / n), Math.round(y1 + (y2 - y1) * i / n), th || 1, th || 1);

  }

      }

  function drawActor(a, now) {
    const B = a.body;
    if (!B || a.alpha <= 0 || a.die >= 1) return;
    const sc = Math.max(1, Math.round(a.s * K)) / K;
    const bx = Math.round((a.x + a.ox) * K) / K, by = Math.round((a.y + a.oy) * K) / K;

    if (a.rot) g.rotate(a.rot);
    g.globalAlpha = a.alpha * (a.ghost ? 0.8 : 1);
    if (a.die > 0) {
      // Taken apart a row at a time: the rows slide off sideways and go out.
      for (let i = 0; i < PXH; i++) {
        if (hash(i + a.ph) < a.die * 1.15) continue;

    // You go down: flat on the floor if they got to you, taken apart if they got into your rig.
    async down() {
      if (!on()) return;
      begin();
      turn = '';
      banner('');
      stat();
      const h = hero, my = run, wire = S.hp > 0;
      SND.play('bfall');
      tw(V, {dim: 0.5}, 700);
      if (wire) {
        h.glitch = 1; await wait(320); h.glitch = 0;
        await tw(h, {die: 1}, 620, 'lin');
        h.show = false;
      } else {
        const mk = figure(heroFig({ko: true}));
        h.mk = mk;
        bitmap(mk).then(B => { if (B && my === run && hero === h) { h.body = B; dirty = true; } });
        await recoil(h, true);
        h.arm = null;
        await tw(h, {rot: 1.5, ox: -Math.round(30 * h.s)}, 360, 'in');   // falls back, and far enough in to stay on the stage
        shake(2);
        FX.dust(h.x - 10, h.y - 2);
      }
      big(E.kind === 'law' ? 'BUSTED' : wire ? 'OWNED' : 'DEFEATED', 'bad stay');
      await wait(950);
      end();
    },
    // You leave the stage: at a run, through smoke, off the wire, after wiping the drive, or because you paid.
    async flee(how) {
      if (!on()) return;
      how = how === true ? 'smoke' : how || 'run';
      begin();
      turn = '';
      banner('');
      stat();
      const h = hero;
      if (how === 'smoke') {
        SND.play('btoss');
        FX.puff(h.x, h.y - 8, '#c9d1d5', 16, 60, 900);
        await wait(140);
        flash('#c9d1d5', 0.5);
        FX.puff(h.x - 10, h.y - 30, '#e3edf7', 12, 70, 900);
        await tw(h, {alpha: 0}, 300);
      } else if (how === 'jack') {
        SND.play('bflee');
        h.glitch = 1; await wait(200); h.glitch = 0;
        await tw(h, {die: 1}, 450, 'lin');
        h.show = false;
      } else if (how === 'pay') {
        SND.play('cash');
        const [cx, cy] = centre(living()), [hx, hy] = chest(h);
        FX.lob(hx, hy, cx, cy - 20, '#3dff9a', 360);
        pop(h, 'PAID', 'green');
        await wait(380);
        for (const f of living()) { f.flip = false; tw(f, {ox: -W * 0.7}, 620, 'in'); }
        await wait(450);
      } else {
        if (how === 'wipe') {
          SND.play('bzap');
          h.glitch = 1;
          flash('#ffffff', 0.7);
          pop(h, 'WIPED', 'cyan');
          await wait(330);
          h.glitch = 0;
        }
        SND.play('bflee');
        h.flip = true;
        FX.dust(h.x - 6, h.y - 2);
        tw(h, {oy: -4}, 90).then(() => tw(h, {oy: 0}, 90, 'in'));
        await tw(h, {ox: W * 0.34}, 400, 'in');
      }
      big(how === 'wipe' ? 'DRIVE WIPED' : how === 'jack' ? 'JACKED OUT' : how === 'pay' ? 'PAID OFF' : 'ESCAPED', 'stay');
      await wait(700);
      end();
    },
  };
  return api;
})();
// ====================== BATTLE SCREEN: END ======================

// One confrontation. E: {kind: 'law' | 'gang' | 'raid' | 'thug', name, n, hit, lo, hi, tier, gang, intro, ambush}
// The music switches to the fight or raid theme for as long as it lasts.
async function fight(E) {
  SND.battle = E.kind === 'raid' ? 'raid' : 'fight';
  SND.play(E.kind === 'raid' ? 'hack' : 'alarm');
  try {
    const result = await fightRounds(E);
    await pocketOut(E);   // whatever went into the prison pocket comes back out now. Most of it.
    return result;
  } finally {
    BTL.close();
    SND.battle = null;
    SND.sync();
  }
}

async function fightRounds(E) {
  const total = E.n, law = E.kind === 'law', raid = E.kind === 'raid', thug = E.kind === 'thug', quiet = inSyn('ghost');
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;
  let n = E.n, violent = false, unhurt = true;
  const heatWas = S.heat, xpWas = career.xp;   // for the results window
  const gotAway = () => { tally('law'); tally('escape'); if (used() >= 50) tally('smuggle'); };
  let msg = law ? `${E.name[0].toUpperCase() + E.name.slice(1)} has a lock on you: ${plural(n, 'agent')}.`
    : raid ? `You breach a ${E.name} node. ${plural(n, 'operator')} are jacked in and they see you.`
    : `${E.name} crackers are inside your rig: ${plural(n, 'intruder')}.`;
  const title = law ? `!! ${E.name.replace(/^the /, '').toUpperCase()} !!`
    : raid ? `RAID: ${E.name}` : thug ? `!! ${E.name.toUpperCase()} !!` : `!! ${E.name.toUpperCase()} ATTACK !!`;
  const hint = law
    ? 'Shooting, EMPs and running risk your Health. Hacking risks your OpSec and keeps your Heat down. Wiping the drive loses your goods but always escapes. Your prison pocket keeps a few small goods through a search, an arrest or a wipe.'
    : raid ? 'A remote fight: only hacking tools work and only your OpSec is at risk. Jack out any time to leave empty-handed.'
    : thug ? 'They are on you in person, so whatever you do, their hits land on your Health. Fight, run, pop smoke, or hand over some cash.'
    : 'Shooting, EMPs and running risk your Health. Hacking back risks your OpSec. Or pay them to go away.';
  let physical = thug;
  if (E.intro) msg = E.intro;

  // The hostiles' turn. Out in the open they hurt you; over the wire they hurt your rig. True when it finishes you.
  const strike = async (stunned, late) => {
    let dmg = 0;
    const theirAim = E.hit * (inSyn(HIDDEN_SYN) ? 0.75 : 1);   // the 404 are hard to pin down
    for (let i = 0; i < n && !stunned; i++) if (Math.random() < theirAim) dmg += rnd(E.lo, E.hi);
    if (dmg) unhurt = false;
    if (dmg) SND.play('hurt', late);
    if (dmg && physical) {
      // Armour soaks up part of it.
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('armor') / 100)));
      S.hp -= dmg;
      msg += ` <span class="red">${law ? 'They open fire' : 'They jump you'}: Health -${dmg}%.</span>`;
    } else if (dmg) {
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('firewall') / 100)));
      S.opsec -= dmg;
      msg += ` <span class="red">They ${law ? 'unmask part of your trail' : 'tear into your defences'}: OpSec -${dmg}%.</span>`;
    } else if (!stunned) {
      msg += ' Their attacks miss.';
    }
    await BTL.hit(dmg, physical, stunned, msg);
    return S.opsec <= 0 || S.hp <= 0;
  };

  BTL.open(E, title, hint);
  if (E.ambush) {
    // Caught flat-footed: they swing before you can do anything.
    await BTL.note('AMBUSH!', '#ff3b5c');
    msg += ' They get the first swing in.';
    if (await strike(false, 0.2)) { E.result = 'lost'; await BTL.down(); return lose(E); }
  }
  for (;;) {
    render();
    const W = WEAPONS[S.weapon], zeroDays = S.inv['Zero-Days'] || 0;
    const payoff = Math.max(500, Math.floor(S.cash * 0.2));
    const buttons = [];
    const round = usesAmmo(W) ? activeAmmo() : null;
    if (!raid && W) {
      buttons.push([!usesAmmo(W) ? `Use ${W[0]}` : round ? `Fire ${W[0]} (${AMMO[round][4]} x${S.ammo[round]})`
        : `Club them with ${W[0]} (no ammo)`, 'shoot']);
      if (usesAmmo(W) && Object.values(S.ammo).filter(q => q > 0).length > 1) buttons.push(['Change ammo', 'ammo']);
    }
    if (!raid && S.emp) buttons.push([`${GADGETS.emp[0]} (${S.emp})`, 'emp']);
    if (S.proxies) buttons.push([raid ? 'Hack them' : thug ? 'Hack their chrome' : 'Counter-hack', 'hack']);
    if (S.bomb) buttons.push([`${GADGETS.bomb[0]} (${S.bomb})`, 'bomb']);
    if (!raid && S.smoke) buttons.push([`${GADGETS.smoke[0]} (${S.smoke})`, 'smoke']);
    if (zeroDays) buttons.push([`Burn a Zero-Day (${zeroDays})`, 'zero']);
    if (S.medkits && S.hp < 100) buttons.push([`Medkit (${S.medkits})`, 'med']);
    buttons.push([raid ? 'Jack out' : 'Run', 'run']);
    if (law) buttons.push(['Wipe drive', 'wipe', 'danger']);
    if (law && pocketRoom(E) > 0 && pocketable().length) buttons.push([`Prison pocket (${pocketRoom(E)} free)`, 'pocket']);
    if ((E.kind === 'gang' || thug) && S.cash >= payoff) buttons.push([`${thug ? 'Hand over' : 'Pay them'} ${money(payoff)}`, 'pay']);
    const cmd = await BTL.menu(buttons, msg);

    if (cmd === 'ammo') { await BTL.ammo(); continue; }   // swapping ammo does not cost a turn
    const hid = cmd === 'pocket' ? await pocketIn(E) : null;
    if (cmd === 'pocket' && !hid) continue;               // thought better of it: that does not cost a turn either
    let kills = 0, stunned = false, fired = 0;   // fired: shots let off, for the battle screen
    const hadRounds = !W || !usesAmmo(W) || !!activeAmmo();   // false when a gun is empty and gets swung instead
    const move = buttons.find(b => b[1] === cmd)[0].replace(/\s*\(.*$/, '');   // its name, for the banner over the stage
    physical = thug || (!raid && (cmd === 'shoot' || cmd === 'emp' || cmd === 'run' || cmd === 'med'));
    if (cmd === 'shoot' && usesAmmo(W) && !activeAmmo()) {
      // No rounds left: all you can do is swing the thing.
      if (Math.random() < 0.3 + bonus('aim') / 100) kills = 1;
      violent = true;
      heatUp(law ? 5 : 0);
      msg = kills ? `Click. Empty. You club one of them with the ${W[0]}.` : `Click. Empty. You swing the ${W[0]} and miss.`;
    } else if (cmd === 'shoot') {
      const kind = WTYPE[W[4]] || WTYPE.gun;
      const round = usesAmmo(W) ? activeAmmo() : null;                    // which ammo this volley uses
      const shots = round ? Math.min(W[2], S.ammo[round]) : W[2];
      const hit = W[3] + bonus('aim') / 100 + (round ? AMMO[round][2] / 100 : 0);   // better rounds hit more often
      for (let i = 0; i < shots; i++) if (Math.random() < hit) kills++;
      if (round) S.ammo[round] -= shots;
      fired = shots;
      kills = Math.min(n, kills);
      violent = true;
      heatUp(kind[law ? 2 : 3]);   // blades are silent, guns are loud
      stunned = W[4] === 'blunt' && kills > 0 && Math.random() < 0.4;
      msg = (kills ? `Your ${W[0]} drops ${kills} of them.` : `Your ${W[0]} misses.`) +
        (stunned && n - kills > 0 ? ' The rest are too rattled to hit back.' : '') +
        (round ? ` (${S.ammo[round]} ${AMMO[round][0]} left.)` : '');
    } else if (cmd === 'emp') {
      S.emp--;
      kills = Math.min(n, rnd(2, 3));
      violent = true;
      heatUp(law ? 6 : 2);
      msg = `The EMP fries ${kills} of them.`;
    } else if (cmd === 'bomb') {
      S.bomb--;
      kills = Math.min(n, rnd(2, 3));
      msg = `The logic bomb goes off in their systems: ${kills} knocked offline.`;
    } else if (cmd === 'smoke') {
      S.smoke--;
      log(`<span class="green">You vanished in a cloud of ${GADGETS.smoke[0]}.</span>` + gainXp(10));
      if (law) gotAway();
      E.result = 'fled';
      await BTL.flee(true);
      return alertDlg('Escaped', '<p>You pop the smoke and you are gone before it clears.</p>');
    } else if (cmd === 'hack') {
      for (let i = 0; i < S.proxies; i++) if (Math.random() < 0.4 + bonus('hack') / 100) kills++;
      kills = Math.min(n, kills);
      msg = thug ? `You push an overload into their implants: ${kills} dropped.`
        : `You hit back through your proxies: ${kills} knocked offline.`;
    } else if (cmd === 'med') {
      S.medkits--;
      S.hp = Math.min(100, S.hp + MED_HEAL);
      msg = `You jab a medkit: Health back to ${S.hp}%.`;
    } else if (cmd === 'zero') {
      removeItems('Zero-Days', 1);
      kills = Math.min(n, 2);
      msg = `The Zero-Day tears through their gear: ${kills} knocked offline.`;
    } else if (cmd === 'run') {
      const chance = raid ? 1
        : Math.max(0.25, Math.min(0.9, 0.55 + 0.05 * S.proxies - 0.07 * (n - 1) + bonus('speed') / 100));
      if (Math.random() < chance) {
        if (raid) {
          log(`You jacked out of the ${E.name} node empty-handed.`);
          await BTL.flee('jack');
          return;
        }
        if (law) { S.heat = Math.max(0, S.heat - 10); gotAway(); }
        const how = thug ? ['You went over a fence and lost them in the alleys.', 'You go over a fence and lose them in the alleys.']
          : ['You hopped three networks and vanished.', 'You hop three networks and vanish.'];
        log(`<span class="green">${how[0]}</span>` + gainXp(law ? 20 : 10));
        E.result = 'fled';
        await BTL.flee();
        return alertDlg('Escaped', `<p>${how[1]}</p>`);
      }
      msg = 'They are still on you.';
    } else if (cmd === 'wipe') {
      S.inv = {}; S.cost = {};
      S.heat = Math.floor(S.heat / 2);
      log('<span class="amber">You nuked the drive. The trail went cold.</span>');
      E.result = 'fled';
      await BTL.flee('wipe');
      return alertDlg('Drive wiped', '<p>You nuke the drive. Nothing left to find. The trail goes cold.</p>');
    } else if (cmd === 'pocket') {
      msg = `You turn your back for a moment. ${num(hid.qty)} ${hid.name} ${hid.qty === 1 ? 'is' : 'are'} no longer on your drive, ` +
        'or anywhere else a warrant covers.';
    } else if (cmd === 'pay') {
      S.cash -= payoff;
      log(`<span class="amber">Paid ${E.name} ${money(payoff)} to back off.</span>`);
      await BTL.flee('pay');
      return alertDlg('Paid off', `<p>${E.name} take ${money(payoff)} and ${thug ? 'melt back into the alleys' : 'log out'}. For now.</p>`);
    }

    // The battle screen plays the sound for the move, in time with the animation (see BTL.act).
    // A hack that lands gets the voice: "I'm in."
    const hacked = kills > 0 && (cmd === 'hack' || cmd === 'bomb' || cmd === 'zero');

    await BTL.act(cmd, kills, move, msg, {fired, hadRounds, hacked});
    n -= kills;
    if (n <= 0) {
      await BTL.win();
      let loot, xp;
      if (law) {
        loot = total * rnd(400, 1500) * (1 + Math.floor(S.day / 10));
        if (!violent) S.heat = Math.max(0, S.heat - 25);
        xp = gainXp(30 * total);
      } else if (raid) {
        loot = total * rnd(1500, 4000) * (1 + Math.floor(S.day / 6));
        S.grudge[E.gang] += 2;
        heatUp(quiet ? 5 : 10);
        xp = gainXp(40 * total);
      } else if (thug) {
        loot = total * rnd(300, 1200) * (1 + Math.floor(S.day / 10));   // street muscle carries less than a crew does
        xp = gainXp(25 * total);
      } else {
        loot = total * rnd(600, 2000) * (1 + Math.floor(S.day / 10));
        S.grudge[E.gang] += 1;
        xp = gainXp(30 * total);
      }
      loot = Math.round(loot * (1 + bonus('luck') / 100));
      S.cash += loot;
      if (law) {
        tally('law'); tally('lawwin');
        if (!violent) tally('cleanwin');
        if (E.tier >= 1) tally('fed');
        if (E.tier === 2) tally('nsawin');
      } else if (!thug) {
        tally('kills', total);
        if (raid) { tally('raid'); tally('loot', loot); questEvent('raidall', E.gang); } else tally('gangwin');
      }
      if (unhurt) tally('flawless');
      if (total >= 4) tally('bigwin');
      S.mood = 'grin';
      const what = law ? `You shook off ${E.name} and sold their tooling`
        : raid ? `You cleaned out a ${E.name} node`
        : thug ? `You left ${E.name} on the pavement and emptied their pockets`
        : `You beat back ${E.name} and drained their wallets`;
      log(`<span class="green">${what} for ${money(loot)}.</span>${xp}`);
      // What the win was worth, for the results window on the battle screen: [label, value, colour].
      // The small things they drop are found first, so they can be listed with the rest.
      const gains = [['Cash', `+${money(loot)}`, 'green'], ['XP', `+${num(career.xp - xpWas)}`, 'cyan']];
      let gear = false;
      if (!law) {
        // Rival crews drop medkits and gear. Raids and higher levels drop better.
        if (S.medkits < MAX_MED && Math.random() < 0.3) {
          S.medkits++;
          gains.push(['Medkit', '+1']);
          log('You pocket a medkit they left behind.');
        }
        const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2] && !COOL[k]);
        if (spare.length && Math.random() < 0.25) {
          const k = pick(spare);
          S[k]++;
          gains.push([GADGETS[k][0], '+1']);
          log(`You also grab a ${GADGETS[k][0]} off them.`);
        }
        // Crews have their own Heat to manage, so now and then one of them was carrying something for it.
        const cover = Object.keys(COOL).filter(k => S[k] < GADGETS[k][2]);
        if (cover.length && Math.random() < 0.15) {
          const k = pick(cover);
          S[k]++;
          gains.push([GADGETS[k][0], '+1']);
          log(`One of them had a ${GADGETS[k][0]}. Had.`);
        }
        if (Math.random() < 0.4) {
          const k = pick(['budget', 'std', 'std', 'hollow', 'hollow', 'ap', 'smart']), found = rnd(5, 15);
          S.ammo[k] = Math.min(AMMO_MAX, S.ammo[k] + found);
          gains.push([AMMO[k][0], `+${found}`]);
          log(`You scoop up ${found} ${AMMO[k][0]}.`);
        }
        gear = Math.random() < (raid ? 0.85 : 0.6);
      }
      if (S.heat !== heatWas) gains.push(['Heat', `${heatWas}% &rarr; ${S.heat}%`, S.heat > heatWas ? 'red' : 'green']);
      const grudge = law || thug ? '' : `${E.name} will remember this.`;
      if (!await BTL.results(raid ? 'Node looted' : 'You won', `${what}.`, gains, grudge)) {
        await alertDlg(raid ? 'Node looted' : 'You won', `<p>${what} for <b>${money(loot)}</b>.</p>` +
          (grudge ? `<p class="dim">${grudge}</p>` : ''));
      }
      if (gear) await dropLoot(E.name, Math.min(30, level()) * 0.5 + S.day * 0.3 + (raid ? 5 : 0));
      E.result = 'won';
      return;
    }

    if (await strike(stunned, 0.2)) { E.result = 'lost'; await BTL.down(); return lose(E); }
  }
}

const FIGHT_FX = {emp: 'emp', bomb: 'bomb', hack: 'hack', zero: 'hack', med: 'heal'};

// Health or OpSec hit zero.
async function lose(E) {
  SND.play('lose', 0.5);
  const hurt = S.hp <= 0;
  S.opsec = Math.max(0, S.opsec);
  S.hp = Math.max(0, S.hp);
  if (E.kind !== 'law') {
    // Rival crews rob you but don't end the run.
    const cash = Math.floor(S.cash * 0.35);
    S.cash -= cash;
    let goods = 0;
    for (const name of Object.keys(S.inv)) {
      const take = Math.ceil(S.inv[name] / 2);
      goods += take;
      removeItems(name, take);
    }
    S.opsec = Math.max(S.opsec, 40);
    let clinic = '';
    if (hurt) {
      // Beaten unconscious: a day in a back-room clinic.
      S.hp = 50;
      if (S.day < DAYS) { nextDay(); clinic = '<p>You wake up a day later in a back-room clinic, stitched up to 50% Health.</p>'; }
    }
    log(`<span class="red">${E.name} cleaned you out: ${money(cash)} and ${num(goods)} goods.</span>`);
    S.mood = 'ouch';
    render();
    return alertDlg(hurt ? 'Beaten and robbed' : 'Robbed',
      (hurt ? `<div class="posebox wide">${avatarSvg({pose: 'down'})}</div>` : '') + `<p>${E.name} ${hurt ? 'leave you on the floor' : 'own your rig'}. They take <b>${money(cash)}</b> and ` +
      `<b>${num(goods)}</b> of your goods${hurt ? '' : ' before you pull the plug'}.</p>${clinic}`, 'danger');
  }
  if (E.tier === 2) {
    S.busted = S.over = true;
    return;
  }
  // Police and Feds: goods seized, a fine, and time inside. The run goes on.
  const fine = Math.floor(S.cash * (E.tier ? 0.5 : 0.25)), days = E.tier ? 4 : 2;
  S.cash -= fine;
  S.inv = {}; S.cost = {};
  let served = 0;
  while (served < days && S.day < DAYS) { nextDay(true); served++; }
  if (served) wakeRide();   // your ride sat outside the whole time; the tank is for the day you get out
  S.opsec = Math.max(S.opsec, E.tier ? 50 : 60);
  S.hp = Math.max(S.hp, 50);
  S.heat = E.tier ? 20 : 10;
  S.arrests = (S.arrests || 0) + 1;
  tally('arrest');
  log(`<span class="red">Arrested by ${E.name}: goods seized, ${money(fine)} fine, ${served} day${served === 1 ? '' : 's'} inside.</span>`);
  S.mood = 'ouch';
  render();
  await alertDlg('Arrested', `<div class="posebox">${avatarSvg({pose: 'busted', label: E.tier ? 'FED TASK FORCE' : 'METRO CYBER'})}</div>` +
    `<p>${E.name[0].toUpperCase() + E.name.slice(1)} ` +
    `${hurt ? 'drags you out on a stretcher' : 'kicks the door in'}.</p>` +
    `<p>Your goods are seized, you pay <b>${money(fine)}</b> and lose <b>${served} day${served === 1 ? '' : 's'}</b> ` +
    'before a lawyer gets you out. Your debt kept growing.</p>' +
    '<p class="dim">The cold wallet was never found.</p>', 'danger');
}

// ---------- end of run ----------
async function finish() {
  store.del('zdh-save');
  render();
  SND.play(S.busted || S.dead ? 'gone' : 'level');
  if (S.dead) {
    // The one way to die: leaving goods stuck in your prison pocket until the dysentery finishes it.
    await dialog('YOU HAVE DIED OF DYSENTERY', `<div class="posebox wide">${avatarSvg({pose: 'down'})}</div>` +
      `<p>Cause of death: <b class="red">${S.dead}</b>.</p>` +
      `<p>You went to sleep on day ${S.day - 1} with ${stuckList() || 'goods'} still stuck in your prison pocket, and did not get up. ` +
      `A street doc would have had them out in ten minutes.</p>` +
      '<p>The Fixer writes off the debt. The goods are recovered, bagged as evidence, and never spoken of again.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the dead.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  if (S.busted) {
    await dialog('VANISHED', `<div class="posebox">${avatarSvg({pose: 'vanished'})}</div>` + '<p>The NSA does not arrest people like you. A van you never noticed was parked outside all week.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the disappeared.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  const score = S.cash + S.wallet - S.debt;
  tally('runs');
  if (!S.arrests) tally('cleanrun');
  tally('score', score);
  gainXp(100 + Math.min(400, Math.sqrt(Math.max(0, score)) / 5));
  const ranks = [[0, 'Owned by the Fixer'], [50000, 'Script Kiddie'], [250000, 'Gray Hat'],
    [1000000, 'Elite Operator'], [10000000, 'Ghost in the Wire']];
  const rank = (ranks.find(([limit]) => score < limit) || [0, 'Legend of the Underground'])[1];
  let scores = (!AUTO && store.get('zdh-scores')) || [];
  if (!Array.isArray(scores)) scores = [];
  // A big score ends the run draped in gold.
  const summary = `<div class="posebox">${avatarSvg(score >= 250000 ? {pose: 'rich'}
    : {plain: true, mood: score < 50000 ? 'ouch' : 'grin'})}</div>` + `<p>Cash ${money(S.cash)} + wallet ${money(S.wallet)} - debt ${money(S.debt)}</p>` +
    `<p>Final score: <b class="green">${money(score)}</b><br>Run rating: <b class="cyan">${rank}</b><br>` +
    `XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`;
  if (scores.length < 10 || score > Math.min(...scores.map(s => s.score))) {
    const handle = (await askText('New high score!', summary + '<p>Your handle:</p>')) || 'anon';
    scores.push({handle: handle.slice(0, 16), score});
    scores = scores.sort((a, b) => b.score - a.score).slice(0, 10);
    if (!AUTO) store.set('zdh-scores', scores);
  }
  const hall = scores.map((s, i) =>
    `<tr><td>${i + 1}.</td><td>${esc(s.handle)}</td><td>${money(s.score)}</td></tr>`).join('');
  await dialog('Run complete', summary + `<p class="dim">HALL OF FAME</p><table class="hall">${hall}</table>`,
    [['New run', true, 'primary']]);
}

// ---------- self test: open index.html#selftest to auto-play random games ----------
// The Heat items, step by step: each one does what its description says at low, middle and high Heat, every

async function coolSelfTest() {
  const run = S, random = Math.random, keys = Object.keys(COOL), TEXT = k => GADGETS[k][3];

  // A new run at the Bunker, carrying the most of every Heat item.
  const fresh = (heat, o) => { newGame(); S.heat = heat; for (const k of keys) S[k] = GADGETS[k][2]; Object.assign(S, o || {}); };
  try {

    }
    // Run one action with the dice fixed: 0.99 never trips the Log Wiper's alarm, 0 always does.
    const roll = async (value, fn) => { Math.random = () => value; try { await fn(); } finally { Math.random = random; } };
    for (const heat of [6, 30, 39, 40, 55, 74, 75, 90, 100]) {
      for (const k of keys.filter(key => COOL[key].drop)) {

        const c = COOL[k], full = c.drop[lawTier()], most = GADGETS[k][2];

          S.trips !== (c.home ? 0 : TRIPS_PER_DAY) || S.tricks !== (c.quick ? 1 : 0)) fail('wrong effect', k, heat, S.heat, S.hp, S.trips, S.tricks);
        if (c.hp && !TEXT(k).includes(`Health down ${c.hp}%`)) fail('description does not give the Health cost', k);
        if (!logs[0].includes(`from ${heat}% to ${S.heat}%`)) fail('log does not show before and after', k, logs[0]);
        // A second fast fix the same day works at half strength; with no Heat left it is not used up at all.
        const was = S.heat, n = S.burner, half = Math.ceil(COOL.burner.drop[lawTier()] / 2);
        await ACTIONS.burner();
        if (!was ? S.burner !== n || S.heat !== 0
