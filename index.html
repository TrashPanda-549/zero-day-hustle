<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0Day Hustle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Zero Day Hustle</title>
<style>
:root{--bg:#06050d;--panel:#0f0d1f;--panel2:#17142e;--line:#2b2752;--fg:#d9e2ff;--dim:#7c81ab;
  --accent:#00e5ff;--cyan:#00e5ff;--pink:#ff2a6d;--magenta:#ff4fd8;--yellow:#fcee0a;--amber:#fcee0a;
  --green:#3dff9a;--red:#ff3b5c;
  --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 ui-monospace,Consolas,"Cascadia Mono",Menlo,"Roboto Mono",monospace;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;min-height:100vh;
  background:
    radial-gradient(900px 420px at 90% -8%,rgba(255,42,109,.17),transparent 70%),
    radial-gradient(700px 380px at 0% 0%,rgba(0,229,255,.13),transparent 70%),
    linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px) 0 0/34px 100%,
    var(--bg)}
/* scanlines over everything */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#app{max-width:760px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtns{display:flex;gap:6px}
h1{margin:0;font-size:18px;letter-spacing:3px;font-weight:800;font-style:italic;color:#000;background:var(--yellow);
  padding:5px 22px 5px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  animation:glitch 4.5s infinite steps(1)}
@keyframes glitch{0%,91%,100%{text-shadow:none;transform:none}
  92%{text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);transform:translateX(1px)}
  94%{text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);transform:translateX(-2px) skewX(-6deg)}
  96%{text-shadow:1px 0 var(--pink);transform:none}}
h2{margin:0 0 10px;font-size:16px;color:var(--yellow);letter-spacing:2px;text-transform:uppercase}
#dayloc{margin:6px 0 4px;font-size:15px;letter-spacing:1px}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.cyan{color:var(--cyan)}.dim{color:var(--dim)}
button{font:inherit;color:var(--accent);background:rgba(0,229,255,.06);border:1px solid var(--accent);
  padding:8px 12px;min-height:40px;cursor:pointer;clip-path:var(--cut);letter-spacing:.5px;
  text-shadow:0 0 6px rgba(0,229,255,.5)}
button:active:not(:disabled){background:var(--accent);color:#000;text-shadow:none}
button:disabled{opacity:.28;cursor:default;text-shadow:none}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:bold;text-shadow:none}
button.primary:active:not(:disabled){background:#fff}
button.danger{border-color:var(--pink);color:var(--pink);background:rgba(255,42,109,.08);text-shadow:0 0 6px rgba(255,42,109,.5)}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-color:var(--line);color:var(--dim);
  background:transparent;text-shadow:none}

/* heads-up panel: avatar, level, health */
#hud{display:grid;grid-template-columns:66px 1fr;gap:10px;margin-top:10px;align-items:stretch}
#ava{cursor:pointer;background:linear-gradient(#0b0a1c,#17132f);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta);position:relative;overflow:hidden;min-height:76px}
#ava .avatar{position:absolute;left:0;top:0;width:100%;height:100%}
.avatar{display:block;width:100%;height:auto}
/* the pixel model: a small bitmap shown with big square pixels; the body above the legs bobs one pixel */
.av-px{image-rendering:crisp-edges;image-rendering:pixelated}
.av-bob{animation:avbob 1.7s steps(1) infinite}
@keyframes avbob{0%,100%{transform:none}55%{transform:translateY(6.25px)}}
/* avatar effects: breathing, blinking, rarity glows, glitches, sirens */
.av-fig{transform-origin:100px 336px;animation:avbreathe 3.6s ease-in-out infinite}
@keyframes avbreathe{50%{transform:scaleY(1.012)}}
.av-blink{opacity:0;animation:avblink 5.2s infinite}
@keyframes avblink{0%,93%{opacity:0}94%,96%{opacity:1}97%,100%{opacity:0}}
.av-streak{animation:avflick 4.1s infinite steps(1)}
@keyframes avflick{0%,100%{opacity:1}47%{opacity:.35}49%{opacity:1}52%{opacity:.5}54%{opacity:1}}
.av-epic{animation:avpulse 1.7s ease-in-out infinite alternate}
@keyframes avpulse{from{filter:drop-shadow(0 0 1px var(--rc))}to{filter:drop-shadow(0 0 6px var(--rc))}}
.av-leg{animation:avshimmer 1.2s ease-in-out infinite alternate}
@keyframes avshimmer{from{filter:drop-shadow(0 0 3px var(--rc)) brightness(1)}
  to{filter:drop-shadow(0 0 8px #fff3b0) brightness(1.45)}}
.av-spark{opacity:0;animation:avspark 2.2s linear infinite}
@keyframes avspark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.av-shake{animation:avshake 2.6s infinite steps(1)}
.av-shake.bad{animation-duration:1.3s}
@keyframes avshake{0%,100%{transform:none}8%{transform:translateX(3px)}10%{transform:translateX(-4px) skewX(-4deg)}
  12%{transform:none}61%{transform:translateX(-3px)}63%{transform:none}}
.av-static rect{opacity:0;animation:avstatic 1.7s infinite steps(1)}
.av-static rect:nth-child(2n){animation-duration:2.3s;animation-delay:-.6s}
@keyframes avstatic{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}30%{opacity:0;transform:translateY(22px)}
  55%{opacity:.45}62%{opacity:0;transform:translateY(-14px)}85%{opacity:.4}92%,100%{opacity:0}}
.av-cops ellipse{opacity:.15}
.av-cops .a{animation:avcop 1s infinite steps(1)}
.av-cops .b{animation:avcop 1s -.5s infinite steps(1)}
@keyframes avcop{0%{opacity:.8}50%{opacity:.15}}
.av-search{transform-origin:100px 0;animation:avsearch 4.5s ease-in-out infinite alternate}
@keyframes avsearch{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.av-reticle{transform-origin:100px 40px;animation:avret 1.3s ease-in-out infinite alternate}
@keyframes avret{from{transform:scale(1.3);opacity:.45}to{transform:scale(.92);opacity:1}}
.av-aura,.av-eye{animation:avglow 2.4s ease-in-out infinite alternate}
@keyframes avglow{from{opacity:.5}to{opacity:1}}
.av-ring{animation:avdash 3s linear infinite}
@keyframes avdash{to{stroke-dashoffset:-44}}
.av-zap{animation:blink .35s infinite steps(1)}
.av-bill{animation:avfall 3.3s linear infinite}
@keyframes avfall{from{transform:translateY(-20px)}to{transform:translateY(370px)}}
@media (prefers-reduced-motion:reduce){.avatar *{animation:none!important}}
#career{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--magenta);cursor:pointer;font-size:13px}
#career .lvl{color:var(--magenta);font-weight:bold;white-space:nowrap;text-shadow:0 0 8px rgba(255,79,216,.6)}
#career .bar{flex:1;height:8px;background:#000;border:1px solid var(--line);overflow:hidden;min-width:30px}
#career .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--cyan))}
#career .xp{color:var(--dim);white-space:nowrap}
#vitals{margin:2px 0 0}
.meter{display:grid;grid-template-columns:64px 1fr 58px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.meter span:first-child{color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.meter .track{height:11px;background:#000;border:1px solid var(--line);overflow:hidden;transform:skewX(-18deg)}
.meter .track i{display:block;height:100%;transition:width .25s;box-shadow:0 0 8px currentColor}
.meter b{text-align:right;white-space:nowrap}

#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:6px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);padding:6px 8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.chip small{display:block;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.chip b{font-size:15px;font-weight:600;white-space:nowrap}
#news{margin:10px 0 0}
#news div{color:var(--yellow);padding:2px 0}
#news div::before{content:">> ";color:var(--pink)}
#quest .fold{margin-top:10px;border:1px solid var(--line);border-top:2px solid var(--pink);background:rgba(15,13,31,.92)}
#quest .fold>summary{color:var(--pink)}
#quest .fold>summary small{text-align:right}
#quest .fold[open]>summary small{display:none}
#quest .fold .job{margin:6px}
#market{margin-top:10px;border:1px solid var(--line);border-top:2px solid var(--accent);background:rgba(15,13,31,.92)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 9px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{font-size:12px;color:var(--dim)}
.row .price{text-align:right;white-space:nowrap}
.row .btns{display:flex;gap:6px}
.row .btns button{padding:6px 10px;min-width:52px}
.fold>summary{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;list-style:none;
  font-size:13px;letter-spacing:2px;color:var(--accent);user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8"}
.fold[open]>summary::before{content:"\25BE"}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold>summary small{margin-left:auto;font-size:12px;letter-spacing:0;color:var(--dim)}
#jobs .fold{margin-bottom:6px;border:1px solid var(--line);border-top:2px solid var(--yellow);background:rgba(15,13,31,.92)}
#jobs .fold>summary{color:var(--yellow)}
#jobs .fold .job{margin:6px}
#jobs .fold .none{padding:8px 10px;font-size:12px;color:var(--dim)}
#jobs{margin-top:12px}
#jobs h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--pink);font-weight:normal}
.job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 9px;margin-bottom:6px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yellow)}
.job .what{font-weight:600}
.job .sub{font-size:12px;color:var(--dim)}
.job button{border-color:var(--yellow);color:var(--yellow);background:rgba(252,238,10,.06);text-shadow:none}
.job button:active:not(:disabled){background:var(--yellow);color:#000}
.job.quest{border-left-color:var(--cyan)}
.job.gig{border-left-color:var(--magenta)}
.job.quest button{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.06)}
.job.quest button:active:not(:disabled){background:var(--cyan);color:#000}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
#actions button{min-height:46px}
#log{margin-top:14px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
#log div{padding:1px 0}
#log div:first-child{color:var(--fg)}

/* dialogs */
#overlay{position:fixed;inset:0;background:rgba(3,2,10,.84);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:10}
#overlay[hidden]{display:none}
#dialog{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#0b0a19;border:1px solid var(--accent);
  border-top:3px solid var(--yellow);padding:16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
  animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96) skewX(-2deg);opacity:0}to{transform:none;opacity:1}}
#dialog.danger{border-color:var(--pink);border-top-color:var(--pink)}
#dialog.danger h2{color:var(--pink);text-shadow:0 0 10px rgba(255,42,109,.6)}
#dialog p{margin:0 0 10px}
.dbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.qty{display:flex;flex-direction:column;gap:10px;margin-top:6px}
input[type=number],input[type=text]{font:inherit;font-size:18px;color:var(--yellow);background:#000;
  border:1px solid var(--accent);padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--yellow);height:28px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.total{margin-top:10px;color:var(--yellow);min-height:1.35em}
.hall{width:100%;border-collapse:collapse;margin-top:6px}
.hall td{padding:2px 4px}.hall td:last-child{text-align:right}
.syn{margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-left:2px solid var(--accent);background:rgba(23,20,46,.6)}
.syn b{color:var(--cyan)}

/* gear screen */
.avatarbox{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.avatarbox .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);border-bottom:2px solid var(--magenta)}
/* a posed avatar in a dialog, and the two sides of a fight */
.posebox{max-width:150px;margin:0 auto 12px}
.posebox.wide{max-width:280px}
.posebox .avatar,.versus .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta)}
.versus{display:grid;grid-template-columns:86px auto 86px;gap:14px;align-items:center;justify-content:center;margin-bottom:10px}
.versus .foe{border-bottom-color:var(--pink)}
.versus b{color:var(--pink);font-style:italic;font-size:20px;text-shadow:0 0 10px rgba(255,42,109,.6)}
.versus small{display:block;text-align:center;color:var(--dim);font-size:11px;letter-spacing:1px;margin-top:3px}

/* ===== battle screen: BEGIN =====
   A stage drawn on a canvas (backdrop, the hostiles on the left, you on the right) with a row of
   windows underneath: who is left, the commands, your vitals. Everything here is for #battle only. */
#battle{position:fixed;inset:0;right:auto;width:min(100vw,100%);z-index:9;background:#04030b;overflow:auto;
  padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left))}
#battle[hidden]{display:none}
.bwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:100%;--fc:var(--magenta)}
.bwrap.law{--fc:#4da3ff}.bwrap.thug{--fc:#ff9d2e}.bwrap.raid{--fc:var(--green)}
.bfield{position:relative;width:100%;height:min(50vh,62.5vw);min-height:170px;background:#000;border:1px solid var(--line);
  border-bottom:2px solid var(--fc);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bstage{position:relative;flex:none}
.bstage canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
/* one window style for everything: dark glass, a cyan top edge, a label tab, the faction colour underneath */
.bw{position:relative;min-width:0;padding:15px 9px 7px;color:#e6ebff;font-size:13px;border:1px solid #3b3f7a;border-top-color:var(--cyan);
  border-bottom:2px solid var(--fc);background:linear-gradient(180deg,rgba(23,20,46,.97),rgba(9,8,22,.97));
  box-shadow:inset 0 0 0 1px #06050d,inset 0 0 0 2px rgba(0,229,255,.13),0 2px 0 #000}
.bw[data-t]::before{content:attr(data-t);position:absolute;left:8px;top:0;font-size:9px;line-height:11px;letter-spacing:2px;font-weight:bold;
  color:#000;background:var(--cyan);padding:0 9px 0 5px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bw::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-right:1px solid var(--yellow);
  border-bottom:1px solid var(--yellow);opacity:.75;pointer-events:none}
.bban{position:absolute;z-index:3;top:5px;left:50%;transform:translateX(-50%);max-width:calc(100% - 96px);padding:3px 14px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px;color:var(--yellow);pointer-events:none}
.bban:empty{display:none}
.bspd{position:absolute;z-index:3;right:4px;top:4px;min-height:30px;padding:2px 8px;font-size:11px;background:rgba(6,5,13,.7)}
.bspd.on{color:var(--yellow);border-color:var(--yellow)}
.bmsg{min-height:52px}
.bmsg .red{color:#ff7a90}
.bpanel{position:relative;display:grid;grid-template-columns:1fr 1.3fr 1.15fr;gap:6px;align-items:stretch}
.bfoes .row{display:flex;justify-content:space-between;gap:6px;padding:1px 3px}
.bfoes .row b{color:var(--yellow)}
.bfoes .row.cur{color:#fff;background:rgba(252,238,10,.16)}
.bstat .who{display:flex;justify-content:space-between;gap:6px;color:var(--cyan);letter-spacing:1px;margin-bottom:2px}
.bbar{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;margin:3px 0}
.bbar .lbl{color:#9aa6ff;font-size:11px;letter-spacing:1px}
.bbar .track{height:8px;background:#05061c;border:1px solid #3b3f7a;overflow:hidden;transform:skewX(-20deg)}
.bbar .track i{display:block;height:100%;transition:width .35s}
.bbar b{text-align:right;font-variant-numeric:tabular-nums}
.bgear{color:#aab1d8;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bturn{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;letter-spacing:1px;color:var(--dim)}
.bturn b{padding:1px 6px;border:1px solid #3b3f7a;color:var(--dim);font-weight:normal}
.bturn b.on{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:bold}
.bturn b.on.foe{background:var(--pink);border-color:var(--pink)}
/* a list of options with a pointer on the one that is picked out */
.bopts{display:grid;grid-template-columns:1fr;gap:1px 6px}
.bopt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px;padding:3px 6px 3px 23px;
  cursor:pointer;line-height:1.2;border:1px solid transparent;text-shadow:1px 1px 0 #000}
.bopt > span{min-width:0;overflow-wrap:anywhere}
.bopt small{flex:none;color:#aab1d8;font-size:11px;white-space:nowrap}
.bopt.danger{color:#ff8fa3}.bopt.dim{color:var(--dim)}
.bopt.cur{background:linear-gradient(90deg,rgba(252,238,10,.18),rgba(252,238,10,.03));border-color:rgba(252,238,10,.4);color:#fff}
.bopt.cur.danger{color:#ffb3c0}
.bopt.cur::before{content:"";position:absolute;left:6px;top:50%;width:11px;height:12px;margin-top:-6px;background:var(--yellow);
  clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,42% 50%);animation:bptr .6s steps(2) infinite}
@keyframes bptr{50%{transform:translateX(3px)}}
.bopt:active{background:rgba(252,238,10,.35)}
.bcmd.off{pointer-events:none}
.bcmd.off .bopt{opacity:.4}
.bcmd.off .bopt.cur::before{animation:none}
/* sub-menus open over the other windows */
.bsub{position:absolute;z-index:4;left:21%;bottom:8px;width:58%;max-height:72vh;overflow:auto;
  box-shadow:inset 0 0 0 1px #06050d,inset 0 0 0 2px rgba(0,229,255,.13),0 0 0 2px #04030b,7px 7px 0 rgba(0,0,0,.65)}
.bsub[hidden],.bres[hidden]{display:none}
.bnote{color:#aab1d8;font-size:11.5px;line-height:1.3;margin:0 2px 6px}
.bnote b{color:var(--cyan)}
.bres{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,94%);max-height:96%;overflow:auto;
  box-shadow:inset 0 0 0 1px #06050d,inset 0 0 0 2px rgba(0,229,255,.13),0 0 0 2px #04030b,7px 7px 0 rgba(0,0,0,.65);cursor:default}
.bres p{margin:0 0 5px;line-height:1.25}
.bres .line{display:flex;justify-content:space-between;gap:10px;padding:2px 2px;border-bottom:1px dashed rgba(124,129,171,.3);
  animation:bline .18s ease-out both}
@keyframes bline{from{transform:translateX(-12px);opacity:0}}
.bres .foot{color:var(--dim);font-size:11px;margin:5px 0 3px}
/* numbers and words that bounce off whoever was hit */
.bpop{position:absolute;z-index:3;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:bpop .95s linear forwards}

const money = n => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US');
const num = n => n.toLocaleString('en-US');
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/[&<>"']/g,
  ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));

let S, logs = [], busy = false, AUTO = false;

// ---------- storage ----------
// There are up to MAX_SAVES save files. Each has its own career and its own run in progress, stored
// under 'zdh-career-<n>' and 'zdh-save-<n>'. 'zdh-slots' lists them ({n: {name, t: last played}}) and
// 'zdh-last' is the one played most recently. The hall of fame ('zdh-scores') is shared.
const MAX_SAVES = 5;
let slot = 0;   // the save file in use; 0 until one is chosen from the start menu, and nothing is saved until then
const perSave = key => key === 'zdh-save' || key === 'zdh-career';
const store = {
  // n: read or write another save file's copy instead of the one in use.
  get(key, n) { try { return JSON.parse(localStorage.getItem(perSave(key) ? `${key}-${n || slot}` : key)); } catch (e) { return null; } },
  set(key, value, n) {
    if (perSave(key) && !(n || slot)) return;
    try { localStorage.setItem(perSave(key) ? `${key}-${n || slot}` : key, JSON.stringify(value)); } catch (e) {}
  },
  del(key, n) { try { localStorage.removeItem(perSave(key) ? `${key}-${n || slot}` : key); } catch (e) {} },
};
function saveList() {
  const m = store.get('zdh-slots');
  return m && typeof m === 'object' && !Array.isArray(m) ? m : {};
}
// Note that the save file in use was just played (and name it, when it is new).
function touchSave(name) {
  if (!slot) return;
  const m = saveList();
  m[slot] = {name: name || (m[slot] && m[slot].name) || 'anon', t: Date.now()};
  store.set('zdh-slots', m);
  store.set('zdh-last', slot);
}
const save = () => { if (!AUTO && slot) { store.set('zdh-save', S); touchSave(); } };
// A game from before there were save files becomes save 1.
// The old copy is left where it was, so a build from before save files still finds its game.
function adoptOldSave() {
  try {
    if (localStorage.getItem('zdh-slots')) return;
    const c = localStorage.getItem('zdh-career'), r = localStorage.getItem('zdh-save');
    if (!c && !r) return;
    if (c) localStorage.setItem('zdh-career-1', c);
    if (r) localStorage.setItem('zdh-save-1', r);
    localStorage.setItem('zdh-slots', JSON.stringify({1: {name: 'anon', t: Date.now()}}));
    localStorage.setItem('zdh-last', '1');
  } catch (e) {}
}
// The drop-downs on the main screen (syndicate mission, products, Local BBS). Which ones are open is remembered.
const FOLDS = store.get('zdh-folds') || {};
const fold = (id, label, note, body) => `<details class="fold" data-fold="${id}"${FOLDS[id] ? ' open' : ''}>` +
  `<summary>${label}<small>${note}</small></summary>${body}</details>`;
document.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.fold;
  if (!id || FOLDS[id] === e.target.open) return;
  FOLDS[id] = e.target.open;
  store.set('zdh-folds', FOLDS);
}, true);

// One 16-step bar per mood. Drums: x = hit. Bass: 0 = root, 1 = octave up. Arp: 0-3 = chord note.
// prog: one chord per bar as [semitones above the key, size of its third]. parts: which layers play
// (p pad, a arp, b bass, d drums), one entry per four bars, so a theme builds up and thins out again.
const MOODS = {
  bunker: {bpm: 68, key: 45, prog: [[0, 3], [5, 3], [8, 4], [7, 3]], parts: ['pa'],
    kick: '', snare: '', hat: '', bass: '', arp: '0.......2.....1.', wave: 'sine'},
  calm: {bpm: 92, key: 45, prog: [[0, 3], [8, 4], [3, 4], [10, 4], [0, 3], [8, 4], [5, 3], [7, 4]],
    parts: ['pa', 'pab', 'pabd', 'pabd', 'pbd', 'pab'],
    kick: 'x.......x.x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xx',
    bass: '0..0..0.0..0..1.', arp: '0.2.1.2.3.2.1.2.', wave: 'triangle'},
  tense: {bpm: 106, key: 43, prog: [[0, 3], [1, 4], [0, 3], [10, 3]], parts: ['pabd'],
    kick: 'x...x...x...x...', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx',
    bass: '0.0.0.0.0.0.0.01', arp: '0.1.0.2.0.1.0.3.', wave: 'square'},
  raid: {bpm: 124, key: 38, prog: [[0, 3], [0, 3], [3, 4], [1, 4]], parts: ['abd'],
    kick: 'x..x..x.x..x..x.', snare: '....x.......x...', hat: 'xxxxxxxxxxxxxxxx',
    bass: '0.01.0.00.01.0.1', arp: '0.3.2.3.1.3.2.3.', wave: 'square'},
  fight: {bpm: 138, key: 40, prog: [[0, 3], [0, 3], [8, 4], [7, 4]], parts: ['abd'],
    kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..x...x...x...xx',
    bass: '0000000000000011', arp: '0321032103210321', wave: 'sawtooth'},
};

const SND = (() => {
  const prefs = Object.assign({music: true, sfx: true}, store.get('zdh-sound') || {});
  const MUSIC_VOL = 0.2, SFX_VOL = 0.55;   // the music sits well under the effects
  let ctx = null, musicBus, sfxBus, echo, noiseBuf, voiceBuf = null;
  let mood = 'calm', step = 0, nextAt = 0;
  const hz = note => 440 * Math.pow(2, (note - 69) / 12);

  // Browsers only allow sound after a tap or a key press, so this runs on the first one.
  function wake() {
    if (AUTO) return false;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { ctx = new AC(); } catch (e) { return false; }
      const out = ctx.createDynamicsCompressor();
      out.connect(ctx.destination);
      musicBus = ctx.createGain(); sfxBus = ctx.createGain();
      musicBus.gain.value = prefs.music ? MUSIC_VOL : 0;
      sfxBus.gain.value = prefs.sfx ? SFX_VOL : 0;
      musicBus.connect(out); sfxBus.connect(out);
      // A dark echo for the arpeggios.
      echo = ctx.createDelay(1); echo.delayTime.value = 0.3;
      const damp = ctx.createBiquadFilter(), back = ctx.createGain();
      damp.type = 'lowpass'; damp.frequency.value = 1800; back.gain.value = 0.4;
      echo.connect(damp); damp.connect(back); back.connect(echo); damp.connect(musicBus);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      try {
        const raw = atob(VOICE_IM_IN), bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        ctx.decodeAudioData(bytes.buffer, buf => { voiceBuf = buf; }, () => {});
      } catch (e) {}
      setInterval(tick, 50);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume();
    return true;
  }

  // One note. o: type, vol, to (glide to this pitch), cut / cutTo (low-pass), attack, echo
  function tone(bus, t, freq, dur, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = osc;
    if (o.cut) {
      const flt = ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(o.cut, t);
      if (o.cutTo) flt.frequency.exponentialRampToValueAtTime(o.cutTo, t + dur);
      osc.connect(flt);
      last = flt;
    }
    last.connect(g); g.connect(bus);
    if (o.echo) g.connect(echo);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  // A burst of filtered noise. o: type (filter), f, to (sweep the filter), q, vol, attack
  function hiss(bus, t, dur, o = {}) {
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    flt.type = o.type || 'highpass';
    flt.frequency.setValueAtTime(o.f || 6000, t);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.q) flt.Q.value = o.q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  // ----- music: a step sequencer that schedules a little ahead of the clock -----
  function playStep(t) {
    const M = MOODS[mood], i = step % 16, bar = Math.floor(step / 16), len = 60 / M.bpm / 4;
    const [root, third] = M.prog[bar % M.prog.length];
    const parts = M.parts[Math.floor(bar / 4) % M.parts.length];
    const base = M.key + root;
    if (parts.includes('d')) {
      if (M.kick[i] === 'x') tone(musicBus, t, 150, 0.2, {type: 'sine', to: 42, vol: 0.6});
      if (M.snare[i] === 'x') {
        hiss(musicBus, t, 0.13, {type: 'bandpass', f: 1900, q: 0.8, vol: 0.28});
        tone(musicBus, t, 190, 0.08, {type: 'triangle', to: 110, vol: 0.18});
      }
      if (M.hat[i] === 'x') hiss(musicBus, t, 0.03, {f: 8000, vol: i % 4 === 2 ? 0.1 : 0.05});
    }
    if (parts.includes('b') && M.bass[i] >= '0') {
      tone(musicBus, t, hz(base + 12 * M.bass[i]), len * 1.8, {type: 'sawtooth', cut: 520, cutTo: 160, vol: 0.3});
    }
    if (parts.includes('a') && M.arp[i] >= '0') {
      tone(musicBus, t, hz(base + 24 + [0, third, 7, 12][M.arp[i]]), len * 1.6,
        {type: M.wave, vol: M.wave === 'sine' ? 0.16 : 0.055, cut: 2600, echo: true});
    }
    if (parts.includes('p') && i === 0) {
      for (const n of [0, third, 7]) {
        for (const detune of [-7, 7]) {
          tone(musicBus, t, hz(base + 12 + n), len * 17, {type: 'sawtooth', detune, cut: 700, vol: 0.035, attack: len * 5});
        }
      }
    }
  }
  function tick() {
    if (!ctx || ctx.state !== 'running' || !prefs.music) return;
    if (nextAt < ctx.currentTime) nextAt = ctx.currentTime + 0.05;
    while (nextAt < ctx.currentTime + 0.25) {
      playStep(nextAt);
      nextAt += 60 / MOODS[mood].bpm / 4;
      step++;
    }
  }

  // ----- effects -----
  const run = (t, notes, gap, dur, o) => notes.forEach((f, i) => tone(sfxBus, t + i * gap, f, dur, o));
  const FX = {

// ---------- career: XP, levels and syndicate carry over between runs ----------
// stats: running counts of things you have done (see tally()). ach: achievements earned, {id: when}.
// lockpick: lock picking skill points (see lockInfo()).
const newCareer = () => ({xp: 0, syn: null, gear: {}, bag: [], locker: [], stats: {}, ach: {}, rep: {}, lockpick: 0});
let career = newCareer(), pendingLevel = 0;

function levelInfo(total) {
  let xp = total === undefined ? career.xp : total, level = 1, need = 100;
  while (xp >= need) { xp -= need; level++; need = 100 * level; }
  return {level, into: xp, need};
}
const level = () => levelInfo().level;
const inSyn = key => career.syn === key;
const debtRate = () => inSyn('ledger') ? 0.04 : DEBT_RATE;
const walletRate = () => inSyn('ledger') ? 0.06 : WALLET_RATE;
const pct = rate => Math.round(rate * 100);

// Adds XP and returns a snippet to append to a log line.
function gainXp(n) {
  n = Math.floor(n * (inSyn(HIDDEN_SYN) ? 1.25 : 1));
  if (n <= 0) return '';
  const before = level();
  career.xp += n;
  S.xpRun = (S.xpRun || 0) + n;
  if (!AUTO) store.set('zdh-career', career);
  if (level() > before) pendingLevel = level();
  return ` <span class="cyan">+${n} XP</span>`;
}

// The crews you can see: the hidden one only once you hold the achievement that reveals it.
const openSyns = () => Object.keys(SYNDICATES).filter(k => k !== HIDDEN_SYN || career.ach[KEY_ACH]);

async function joinSyndicate(key) {
  career.syn = key;
  career.quest = null;
  fixQuest();
  if (!AUTO) store.set('zdh-career', career);
  log(`<span class="cyan">You joined ${SYNDICATES[key][0]}.</span>`);
  await alertDlg(SYNDICATES[key][0], `<p>You're in. ${SYNDICATES[key][1]}</p>` +
    `<p>Your handler is <b>${HANDLER[key]}</b>. The crew has work for you: its missions pay big XP, cash and gear.</p>`);
  await questBrief();
}

async function chooseSyndicate() {
  const keys = openSyns();
  const html = `<p>You are level 10. ${keys.length === 4 ? 'Four' : 'Five'} syndicates want you. The choice is permanent.</p>` +
    keys.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b>${k === HIDDEN_SYN ? ' <span class="amber">hidden</span>' : ''}<br>${SYNDICATES[k][1]}</div>`).join('');
  const buttons = keys.map(k => [SYNDICATES[k][0], k]);
  buttons.push(['Decide later', null, 'small']);
  const key = await dialog('Join a syndicate', html, buttons);
  if (key) await joinSyndicate(key);
}

// The hidden syndicate gets in touch once you have earned its achievement. It is the one crew you can
// leave another crew for.
async function hiddenInvite() {
  const name = SYNDICATES[HIDDEN_SYN][0];
  if (inSyn(HIDDEN_SYN)) return;
  if (level() < 10) {
    return alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Reach level 10 and we will talk."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, will be on the list when you choose a crew.</p>`);
  }
  if (!career.syn) {
    await alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. There is a place for you."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, is now on the list.</p>`);
    return chooseSyndicate();
  }
  const old = SYNDICATES[career.syn][0];
  if (await confirmDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Walk away from ${old}. There is a place for you."</p>` +
    `<div class="syn"><b>${name}</b><br>${SYNDICATES[HIDDEN_SYN][1]}</div>` +
    `<p class="dim">Leaving ${old} is permanent: you lose its perk and its missions, and start the ${name} line from the top. ` +
    'You can also answer later, from your record.</p>', `Join the ${name}`, 'Not now')) await joinSyndicate(HIDDEN_SYN);
}

async function levelUpCheck() {
  await heistCheck();
  await questCheck();
  await gigCheck();
  if (pendingLevel) {
    const l = pendingLevel;
    pendingLevel = 0;
    SND.play('level');
    log(`<span class="cyan">LEVEL UP: level ${l}, ${titleFor(l)}.</span>`);
    render();
    await alertDlg('LEVEL UP', `<p>You reached <b>level ${l}</b>: <span class="cyan">${titleFor(l)}</span>.</p>` +
      '<p class="dim">Each level (up to 10) adds 1% to your freelance job success chance.</p>');
    if (l >= 10 && !career.syn) await chooseSyndicate();
  }
  await achCheck();
  if (pendingLevel) return levelUpCheck();   // an achievement's XP was enough for another level
}

// Award anything newly earned. Runs after every action.
async function achCheck() {
  for (const [id, [name, how, xp, test]] of Object.entries(ACH)) {
    if (career.ach[id]) continue;
    let earned = false;
    try { earned = !!test(); } catch (e) {}
    if (!earned) continue;
    career.ach[id] = Date.now();
    achTally++;
    const got = gainXp(xp);
    saveCareer();
    log(`<span class="amber">Achievement: ${name}.</span>${got}`);
    render();
    await alertDlg('ACHIEVEMENT UNLOCKED', `<p><b class="amber">${name}</b><br>${how}</p><p>Reward:${got}</p>` +
      `<p class="dim">${achCount()} of ${Object.keys(ACH).length} earned.</p>`);
    if (id === KEY_ACH) await hiddenInvite();
  }
}

// Make sure a syndicate member has a valid place in the questline (and nobody else has one).
function fixQuest() {
  const q = career.quest;
  if (!career.syn) career.quest = null;
  else if (!q || !Number.isInteger(q.n) || q.n < 0 || !(q.p >= 0)) career.quest = {n: 0, p: 0, v: 3};
  else if (q.v !== 3) {
    // v2: the lines were rewritten: keep the place, restart that mission's count.
    // v3: three break-ins joined each line: move the place past the ones that now come before it, so
    // everybody stays on the mission they were on (and whoever had finished the line stays finished).
    if (q.v !== 2) q.p = 0;
    q.n = q.n < QUEST_V2.length ? QUEST_V2[q.n] : q.n + 3;
    q.v = 3;
  }
}
const QUEST_V2 = [0, 2, 3, 5, 6, 7, 9, 10];   // where missions 1 to 8 of the old lines sit in the new ones
// Fill in whatever a career from an older version lacks.
function fixCareer() {
  if (!career.stats || typeof career.stats !== 'object') career.stats = {};

  if (!Array.isArray(career.locker)) career.locker = [];

  {kind: 'raid', t: rnd(2, 3)}, {kind: 'kills', t: rnd(6, 12)}, {kind: 'cool', t: rnd(2, 4)},
  // ...or one of the crew's break-ins again (two chances in eight).

// The mission you are on, or null if you are not in a syndicate.
function quest() {
  const q = career.quest;
  if (!career.syn || !q) return null;
  const chain = QUESTS[career.syn];
  if (q.n < chain.length) {
    // A break-in ('heist': the fifth value is its id in HEISTS) pays by its own tier; the rest are paid in
    // the order they come, skipping the break-ins.
    const [title, brief, kind, t, good, place] = chain[q.n], H = kind === 'heist' ? HEISTS[good] : null;
    const [xp, cash, rar] = H ? HEIST_PAY[H.tier - 1] : QUEST_PAY[chain.slice(0, q.n).filter(m => m[2] !== 'heist').length];
    return {title, brief, kind, t, good, place: H ? H.at : place, xp, cash, rar};
  }
  if (!q.o || !q.o.kind || !(q.o.t > 0) || (q.o.kind === 'heist' && !HEISTS[q.o.good])) q.o = newOrder();
  // A standing order is worth 60% of the level you are working on, so it stays useful however high you climb.
  // A break-in is more work than the others, and pays half as much again.
  const hard = q.o.kind === 'heist' ? 1.5 : 1;
  return {title: 'Standing orders', brief: 'You have done everything I asked. The crew still has work, and it still pays.',
    kind: q.o.kind, t: q.o.t, good: q.o.good, place: hard > 1 ? HEISTS[q.o.good].at : undefined,
    xp: 60 * level() * hard, cash: 10000 * hard, rar: -1, order: true};
}

function makeGig(name) {

  const gigs = CONTACTS[name][3], inside = gigs.find(g => g[2] === 'breakin');
  const [title, pitch, kind, hid] = inside && Math.random() < 0.25 ? inside : pick(gigs);
  const G = {who: name, title, pitch, kind, t: 1, p: 0};
  const elsewhere = () => pick(LOCATIONS.filter(l => l !== BUNKER && l !== S.loc));
  let hard = 1, days = 3, worth = 0;   // how much it pays next to a plain gig, days allowed, and the goods you give up
  if (kind === 'deliver') {
    const [good, low, high] = GOODS[rnd(4, GOODS.length - 1)], avg = (low + high) / 2;
    G.good = good;
    G.t = Math.max(3, Math.min(40, Math.floor(cap() / 2), Math.round((1500 + S.day * 300) / avg)));
    G.place = elsewhere();

    G.good = hid; G.place = elsewhere(); days = 4; hard = BREAKIN.gigHard[0];

  else if (kind === 'jobs') { G.t = rnd(1, 2); hard = G.t; }
  else if (kind === 'law') { days = 5; hard = 1.4; }
  else if (kind === 'raid') { days = 4; hard = 1.5; }

  else if (kind === 'profit') G.t = (2 + Math.floor(S.day / 3)) * 2500;

  G.xp = Math.round((60 + 12 * level()) * Math.max(0.7, kind === 'breakin' ? BREAKIN.gigHard[1] : hard));

    `<p><b>${gigGoal(G)}</b><br><span class="amber">You have until the end of day ${G.due}.</span></p>` +
    `<p>Pays: ${questReward(G)}</p>` +
    '<p class="dim">You can hold one gig at a time. Finish it and they trust you more, and pay more next time. ' +
    'Let it run out and they remember that too.</p>';
  const took = await dialog('Someone wants a word', html, [['Take the gig', true, 'primary'], ['Not today', false, 'small']]);
  if (!took) return log(`You told ${name} you were busy.`);
  S.gig = G;
  log(`<span class="amber">Gig taken from ${name}: ${G.title}.</span> ${gigGoal(G)} by the end of day ${G.due}.`);
}

// Pay out the gig if it is done, or lose it if its time ran out.
async function gigCheck() {
  const G = S.gig;
  if (!G) return;
  if (!CONTACTS[G.who] || !(G.t > 0)) { S.gig = null; return; }
  if (G.p >= G.t) {
    S.gig = null;
    gigTally++;
    S.cash += G.cash;
    const xp = gainXp(G.xp), before = trust(G.who);
    addTrust(G.who, 1);
    SND.play('cash');
    log(`<span class="green">Gig done for ${G.who}: ${G.title}.</span> Paid ${money(G.cash)}.${xp}`);
    render();
    await alertDlg('GIG DONE', contactHead(G.who) + `<p><b>${G.title}</b></p><p>${G.who} pays you <b>${money(G.cash)}</b>: ` +
      `<span class="cyan">+${num(G.xp)} XP</span>.</p><p class="dim">Trust: ${trustStars(G.who)}` +
      `${trust(G.who) > before ? '. They will pay more next time.' : ''}</p>`);
    if (G.rar >= 0) await dropLoot(G.who, 0, makeItem(G.rar));
  } else if (S.day > G.due) {
    S.gig = null;
    addTrust(G.who, -1);
    log(`<span class="red">You ran out of time on ${G.who}'s gig: ${G.title}.</span>`);
    render();
    await alertDlg('Gig lost', `<p>The deadline for <b>${G.title}</b> has passed. ${G.who} found someone else, and will remember it.</p>` +
      `<p class="dim">Trust: ${trustStars(G.who)}</p>`, 'danger');
  }
}

const lockNeed = l => BREAKIN.need[0] * l + BREAKIN.need[1];

function toolBlock(key, lock, st) {

// The odds for one try, in whole percent: these are the numbers shown, and the numbers rolled.

function lockOdds(key, lock, edge) {
  const T = TOOLS[key], B = BREAKIN, [, diff, type] = LOCKS[lock], lvl = lockInfo().level;
  const raw = T.loud ? B.force[0] - B.force[1] * diff + B.force[2] * lvl - (type === 'elec' ? B.force[3] : 0)

  const ease = 1 - B.ease * (lvl - 1);

    wear: Math.round(T.wear * 100), noise: Math.max(1, Math.round(T.noise * ease))};

        : '<p class="dim">Tap a tool to try it. Nobody is listening down here, so a miss only costs you the try, and now and then a pick.</p>');
    const usable = drills > 0 ? toolsFor(lock, st) : [];
    const buttons = usable.map(k => [`${toolName(k)} (${lockOdds(k, lock, o.edge).open}%)`, k, TOOLS[k].loud ? 'danger' : '', miscIcon(k)]);
    buttons.push([o.practice ? 'Step away' : 'Back off', null, usable.length ? 'small' : 'primary']);
    const key = await dialog(o.practice ? `Practice: ${name}` : `The lock: ${name}`, html, buttons, st && st.alert >= 70 ? 'danger' : '');
    if (!key || !TOOLS[key] || toolBlock(key, lock, st)) return {res: 'back', last};
    const T = TOOLS[key], r = lockTry(key, lock, o.edge, o.practice);
    if (o.practice) { S.drills = (S.drills || 0) + 1; heistTally.drills++; }
    if (st) st.pts = (st.pts || 0) + r.pts;
    const gone = r.broke ? (key === 'picks' ? ` <span class="red">The pick snaps${r.jam ? ', and its tip stays in the lock' : ''}.</span>`
      : key === 'bump' ? ' <span class="red">The bump key\'s teeth have rounded off. It is a keyring ornament now.</span>'
      : key === 'cloner' ? ' <span class="red">The cloner gets warm, then smells of solder, then is a paperweight.</span>'
      : key === 'crowbar' ? ' <span class="red">The crowbar bends. You did not know they could do that.</span>'
      : ' <span class="red">Something inside the pick gun goes ping, and it stops being one.</span>') : '';
    if (r.broke) heistTally.snapped++;
    if (r.open) {
      SND.play(T.loud ? 'thud' : 'click');
      last = (T.loud ? `<span class="amber">The ${name.toLowerCase()} gives up with a noise the whole street can hear.</span>`
        : `<span class="green">${key === 'cloner' ? 'The light goes green. The reader thinks you work here.' : key === 'bump' ? 'One sharp rap and the pins jump. It turns.' : 'The last pin sets, and the lock turns as if it had been waiting for you.'}</span>`) + gone + r.got;
      return {res: T.loud ? 'forced' : 'open', key, last};
    }
    SND.play('deny');
    heistTally.miss++;
    last = `<span class="amber">${T.loud ? 'The door holds. The noise does not.' : key === 'cloner' ? 'The light stays red. The reader beeps, twice, like a judge.' : 'The pins drop. Nothing turns.'}</span>` +
      (st ? ` Alert +${r.noise}.` : '') + gone + r.got;
    if (st) {
      st.alert = Math.min(100, st.alert + r.noise);
      if (r.jam) { st.jam = true; heistTally.jammed++; }
      if (st.alert >= 100) return {res: 'alarm', key, last};
    }
  }
}

// ----- where a break-in's progress is kept -----
// A mission descriptor: {src ('quest', 'gig', 'job' or 'free'), o (the mission, gig or BBS posting), H (the break-in:
// its HEISTS entry plus whatever the source overrides), box + key (where its state lives)}.
// The state: {id, stage (0 to 3: see STAGES), day, alert, cased, entry ('quiet' or 'forced'), jam, moves, done,
// careful, hot (the day the alarm went: no going back that day), loc, took (what you carried out, in words), pts}.
// A syndicate break-in's state sits on the run (S.qh), a gig's on the gig, a BBS job's on its posting, and one
// started with startHeist() on the run too (S.fh).
function heistM(src, o) {
  const id = src === 'job' ? o.heist : o.good, base = HEISTS[id];
  if (!base) return null;
  const H = Object.assign({id}, base);
  if (src === 'gig') { H.at = o.place; H.lock = LOCKS[o.lock] ? o.lock : base.lock; H.tier = LOCKS[H.lock][1]; }
  if (src === 'job') { H.at = o.at; H.lock = LOCKS[o.lock] ? o.lock : base.lock; H.tier = LOCKS[H.lock][1]; H.n = o.qty; H.dev = o.good; }
  if (src === 'free') H.at = o.at;
  return {src, o, H, box: src === 'gig' || src === 'job' ? o : S, key: src === 'quest' ? 'qh' : src === 'free' ? 'fh' : 'h'};
}
// The state, without making one.
const heistPeek = M => (M && M.box[M.key] && M.box[M.key].id === M.H.id ? M.box[M.key] : null);
function heistState(M) {
  let st = heistPeek(M);
  if (!st) st = M.box[M.key] = {id: M.H.id, stage: 0, day: S.day, alert: 0};
  if (st.day !== S.day && st.stage < 2) { st.day = S.day; st.alert = 0; st.jam = false; }   // a night has passed: the place has settled, and somebody fixed the lock
  return st;
}
// "Break into the records annex at Paste Alley and copy the file off their terminal"
function heistGoal(Q) {
  const M = heistM(Q.kind === 'heist' ? 'quest' : 'gig', Q);
  return M ? `Break into ${M.H.site} at ${M.H.at} and ${M.H.prize}` : 'Break in';
}
// The same in a few words, for the summary line of the folded mission section: "stage 2/4: the lock".
function heistShort(Q) {
  const M = heistM('quest', Q), st = heistPeek(M);
  if (!M) return '';
  if (st && st.hot === S.day) return 'come back tomorrow';
  if (!st || (!st.stage && !st.cased)) return S.loc === M.H.at ? 'you are here' : `break-in at ${M.H.at}`;
  return `stage ${st.stage + 1}/4: ${STAGES[st.stage]}`;
}
// One line for the main screen: where the break-in stands.
function heistStatus(src, o) {
  const M = heistM(src, o), st = heistPeek(M);
  if (!M) return '';
  if (st && st.hot === S.day) return 'the place is crawling: come back tomorrow';
  if (!st || (!st.stage && !st.cased)) return S.loc === M.H.at ? 'you are here: open it to start' : `not started &middot; ${LOCKS[M.H.lock][0].toLowerCase()}`;
  return `stage ${st.stage + 1} of 4: ${STAGES[st.stage]}` + (st.cased && !st.stage ? ' (cased)' : '') +
    (st.stage && st.day === S.day ? ` &middot; Alert ${st.alert}%` : '');
}
// What the briefing says about a break-in: the place, the lock, what to bring, and where it stands.
function heistBrief(M) {
  const H = M.H, st = heistPeek(M), type = LOCKS[H.lock][2];
  const works = Object.keys(TOOLS).filter(k => TOOLS[k].on === 'any' || TOOLS[k].on === type);
  const mine = works.filter(k => k === 'clip' || S[k]);
  const need = H.job === 'plant' ? `<p>To leave behind: <b>${H.n} ${H.dev}</b> <span class="${(S.inv[H.dev] || 0) >= H.n ? 'green' : 'red'}">(you carry ${num(S.inv[H.dev] || 0)})</span></p>` : '';
  return `<div class="syn"><b>${cap1(H.site)}</b> &middot; ${H.at}<br>${JOB_WORD[H.job]} job: ${H.prize}.</div>` + lockCard(H.lock) +
    `<p>Opens with: ${works.map(k => `<span class="${mine.includes(k) ? 'green' : 'dim'}">${toolName(k)}</span>`).join(', ')}. ` +
    `<span class="dim">Green ones you carry.</span><br>${lockLine()}</p>` + need +
    '<p class="dim">Four stages: the approach, the lock, the job inside, the way out. A quiet entry and a clean exit pay a bonus; ' +
    'a forced door means less time inside and a smaller haul. If it goes wrong you can come back another day.</p>' +
    (st && st.hot === S.day ? '<p class="amber">The alarm went today. The place is crawling: come back tomorrow.</p>'
      : S.loc !== H.at ? `<p class="dim">Get to ${H.at}, then open this there.</p>` : '');
}
// Can it be started (or carried on) right here, right now?
const heistReady = M => !!M && S.loc === M.H.at && !(heistPeek(M) && heistPeek(M).hot === S.day);
const heistButton = M => {
  const st = heistPeek(M);
  return !st || !st.stage ? `Go to work at ${M.H.site}` : `Carry on: ${STAGES[st.stage]}`;
};
// Everything that raises Heat on a break-in comes through here: Ghost Shell and stealth gear soften it, as they do a deal.
function heistHeat(n) {
  if (inSyn('ghost')) n = Math.ceil(n / 2);
  n = Math.ceil(n * (1 - bonus('stealth') / 100));
  const was = S.heat;
  if (n > 0) heatUp(n);
  return S.heat - was;
}
// The chance the job inside works, carefully and fast.
function jobOddsIn(M, st) {
  const H = M.H, B = BREAKIN;
  const gear = H.job === 'hack' ? B.proxyEdge * S.proxies + bonus('hack') / 2 : H.job === 'rob' ? bonus('speed') / 2 : bonus('stealth') / 2;
  const base = B.job[H.job] + gear - B.tierDrop * (H.tier - 1) + (st.cased ? B.casedEdge : 0) + (H.edge || 0);
  return {careful: clampN(Math.round(base), B.jobMin, B.jobMax), fast: clampN(Math.round(base - B.fastDrop), B.jobMin, B.jobMax)};
}
const cleanOdds = st => clampN(Math.round(100 - st.alert + bonus('stealth') / 2 + (st.cased ? BREAKIN.casedEdge / 2 : 0)), BREAKIN.cleanMin, BREAKIN.cleanMax);
const fastHeat = st => BREAKIN.heat.fast[0] + Math.round(st.alert / BREAKIN.heat.fast[1]);
// What heistHeat(n) would add right now, for telling the player before they choose.
function heatShown(n) {
  if (inSyn('ghost')) n = Math.ceil(n / 2);
  n = Math.ceil(n * (1 - bonus('stealth') / 100));
  if (n > 0 && fx().vpn > 0) n = Math.ceil(n / 2);
  return Math.max(0, Math.min(100 - S.heat, n));
}
// Put goods on the drive, as many as there is room for. Returns how many went on.
function heistGoods(name, qty) {
  const n = Math.max(0, Math.min(qty, free()));
  if (n < qty) heistTally.noroom++;
  if (n) addItems(name, n, 0);
  return n;
}
const stageHead = (n, M) => `<p class="dim">STAGE ${n + 1} OF 4 &middot; ${STAGES[n].toUpperCase()} &middot; ${M.H.site.toUpperCase()}</p>`;

// The alarm has gone, or somebody saw you. Heat, and then whoever answers it: site security, the law or a rival crew.
// Returns 'won' (they are down: carry on), 'fled' (you got away), 'lost', 'none' (nobody came) or 'over' (the run ended).
async function heistAlarm(M, st, spotted) {
  const H = M.H, B = BREAKIN, heat = heistHeat(spotted ? B.heat.spotted : B.heat.alarm);
  heistTally.alarm++;
  st.alert = 100;
  S.mood = 'ouch';
  SND.play('alarm');
  log(`<span class="red">${spotted ? `Somebody saw you leaving ${H.site}` : `The alarm went at ${H.site}`}: Heat +${heat}%.</span>`);
  render();
  const quiet = H.guard === 'sec' && Math.random() < B.noShow;
  await alertDlg(spotted ? 'SPOTTED' : 'ALARM', `<p>${spotted ? 'A torch beam finds you halfway across the car park, and then a voice does.'
    : 'A bell the size of a dinner plate starts up above the door. It is very good at its job.'}</p>` +
    `<p>Heat <b class="red">+${heat}%</b>.</p>` +
    (quiet ? '<p class="dim">Nobody comes. The alarm company has put the call on hold. You do not wait to find out for how long.</p>' : ''), 'danger');
  if (quiet) { heistTally.noshow++; return 'none'; }
  const tier = lawTier(), L = LAW[tier], crew = SYNDICATES[H.guard];
  const E = H.guard === 'law' ? {kind: 'law', tier, name: L.name, n: [rnd(1, 2), rnd(2, 3), rnd(2, 3)][tier], hit: L.hit, lo: L.lo, hi: L.hi,
    intro: `${cap1(L.name)} was already on the way. They are between you and the street.`}
    : crew ? {kind: 'gang', gang: H.guard, name: crew[0], n: rnd(2, 3), hit: 0.3, lo: 3, hi: 8}
      : {kind: 'thug', name: 'Site security', n: rnd(1, 1 + Math.ceil(H.tier / 2)), hit: B.guards.hit, lo: B.guards.lo, hi: B.guards.hi + H.tier, seed: rnd(0, 5),
        guard: true,   // the battle screen draws them in uniform
        intro: `Site security comes round the corner of ${H.site}, torches up, already on the radio.`};
  await fight(E);
  const res = S.over ? 'over' : E.result === 'won' ? 'won' : E.result === 'lost' ? 'lost' : 'fled';
  if (heistTally[res] !== undefined) heistTally[res]++;
  if (res === 'won') st.alert = B.afterFight;
  return res;
}

// It did not work this time. The mission is still there: the place needs a night to settle down.
// (A BBS job is not: the client reads the news.)
async function heistBlown(M, st, why) {
  const H = M.H;
  heistTally.blown++;
  M.box[M.key] = {id: H.id, stage: 0, day: S.day, alert: 0, cased: st.cased, hot: S.day};
  if (M.src === 'job') { const i = S.contracts.indexOf(M.o); if (i >= 0) S.contracts.splice(i, 1); }
  if (M.src === 'free') delete S.fh;
  log(`<span class="red">The job at ${H.site} is blown for today.</span>`);
  render();
  if (S.over) return;
  await alertDlg('Blown', `<p>${why}</p>` + (M.src === 'job' ? '<p class="dim">The client has stopped answering. The posting is gone.</p>'
    : M.src === 'free' ? '' : '<p class="dim">The job is still yours. Give the place a night to calm down, then try again.</p>'), 'danger');
}

// The job is done and you are out. clean: you slipped out unseen. Pays whatever this kind of break-in pays.
async function heistDone(M, st, clean) {
  const H = M.H, B = BREAKIN, ghost = st.entry === 'quiet' && clean, mult = ghost ? B.ghost : st.entry === 'forced' ? B.messy : 1;
  heistTally.done++;
  delete M.box[M.key];
  tally('breakins');
  if (ghost) tally('cleanin');
  let pay = '';
  if (M.src === 'quest') {
    // The mission's own reward is paid by questCheck, like any other mission's. A quiet, clean job earns extra respect.
    const xp = ghost ? gainXp(Math.round(M.o.xp * B.ghostXp)) : '';
    pay = `Your handler will hear about it.${xp ? ` Nobody will ever know you were there, which the crew values:${xp}.` : ''}`;
    questEvent('heist', 1);
  } else if (M.src === 'gig') {
    M.o.cash = Math.round(M.o.cash * mult / 10) * 10;
    M.o.p = M.o.t;   // gigCheck pays it out
    if (ghost) addTrust(M.o.who, B.ghostTrust);
    pay = `${M.o.who} will pay <b>${money(M.o.cash)}</b>` + (ghost ? ', with a bonus for leaving no trace, and trusts you a little more for it.' : st.entry === 'forced' ? ', less the price of a new door.' : '.');
  } else if (M.src === 'job') {
    const cash = Math.round(payoutFor(M.o) * mult / 10) * 10, i = S.contracts.indexOf(M.o);
    if (i >= 0) S.contracts.splice(i, 1);
    S.cash += cash;
    tally('jobs');
    const xp = gainXp(B.bbsXp[0] + B.bbsXp[1] * LOCKS[H.lock][1]);
    pay = `${M.o.client} pays <b>${money(cash)}</b>` + (ghost ? ', bonus included: nobody knows anyone was there' : st.entry === 'forced' ? ', less the price of a new door' : '') + `.${xp}`;
  } else {
    const [xp, cash] = HEIST_PAY[H.tier - 1];
    S.cash += cash;
    pay = `It pays <b>${money(cash)}</b>.${gainXp(xp)}`;
  }
  S.mood = 'grin';
  SND.play('cash');
  log(`<span class="green">Break-in done at ${H.site}: ${st.entry === 'forced' ? 'forced entry' : 'quiet entry'}, ${clean ? 'clean exit' : 'messy exit'}.</span>` +
    (st.took ? ` You took ${st.took}.` : ''));
  render();
  await alertDlg('JOB DONE', `<p><b>${cap1(H.site)}</b>: you came to ${H.prize}, and you did.</p>` +
    `<div class="syn">Entry: <b class="${st.entry === 'forced' ? 'amber' : 'green'}">${st.entry === 'forced' ? 'forced' : 'quiet'}</b> &middot; ` +
    `Exit: <b class="${clean ? 'green' : 'amber'}">${clean ? 'clean' : 'messy'}</b>` +
    (st.took ? `<br>Carried out: ${st.took}` : '') + (st.pts ? `<br>Lock picking: <span class="amber">+${st.pts}</span> this job` : '') + '</div>' +
    `<p>${pay}</p>`);
}

// ----- the four stages -----
// Play a break-in from wherever it stands. Returns when it is done, blown, or you back off.
async function heistPlay(M) {
  if (!M || !heistReady(M)) return;
  const H = M.H, B = BREAKIN, st = heistState(M);
  st.loc = S.loc;
  let note = '';   // what the last stage did, shown at the top of the next one

  // Stage 1, the approach: case the place (a trip, and a small chance of being noticed) or go in blind.
  if (st.stage === 0) {
    const type = LOCKS[H.lock][2], short = H.job === 'plant' && (S.inv[H.dev] || 0) < H.n, tools = toolsFor(H.lock, st);
    const html = stageHead(0, M) + `<p>${cap1(H.site)}, from across the street. You are here to ${H.prize}.</p>` + lockCard(H.lock) +
      (short ? `<p class="red">You need ${H.n} ${H.dev} to leave behind, and you carry ${num(S.inv[H.dev] || 0)}. There is nothing to do in there without them.</p>` : '') +
      (!tools.length ? `<p class="red">Nothing you carry opens this. ${type === 'elec' ? 'An electronic lock needs an RFID Cloner, or a Crowbar and a tolerance for noise.' : 'Find a pick, a paperclip, anything.'}</p>` : '') +
      (short || !tools.length ? '' : st.cased ? '<p class="green">You cased this place already: you know when the guard goes for his tea.</p>'
        : `<p><b>Case it</b>: an hour across the street with a coffee. Uses a trip. +${B.casedEdge}% at the lock and inside, an easier way out, and no Alert to start with. ` +
          `About one time in ${Math.round(1 / B.caseSeen[0])} somebody wonders what you are looking at.<br>` +
          `<b>Go in blind</b>: no trip, no waiting, and you start with ${B.blind}% Alert because you do not know where the cameras are.</p>`) +
      `<p class="dim">${S.trips} trip${S.trips === 1 ? '' : 's'} left today.</p>`;
    const buttons = [];
    if (!short && tools.length) {
      if (st.cased) buttons.push(['Go in', 'in', 'primary']);
      else {
        if (S.trips > 0) buttons.push(['Case the place (1 trip)', 'case', 'primary']);
        buttons.push(['Go in blind', 'blind', S.trips > 0 ? '' : 'primary']);
      }
    }
    buttons.push(['Not now', null, buttons.length ? 'small' : 'primary']);
    const how = await dialog('The approach', html, buttons);
    if (!how) return;
    if (how === 'case') {
      S.trips--;
      st.cased = true;
      heistTally.cased++;
      if (Math.random() < B.caseSeen[0]) {
        heistTally.seen++;
        st.alert = B.caseSeen[1];
        note = `<span class="amber">A man in a hi-vis vest asks if you are lost. You say yes. He does not believe you: Alert ${st.alert}%, Heat +${heistHeat(B.heat.seen)}%.</span>`;
      } else {
        st.alert = 0;
        note = '<span class="green">Two coffees later you know the cameras, the patrol, and that the guard does the crossword in pen.</span>';
      }
    } else if (how === 'blind') { st.alert = Math.max(st.alert, B.blind); heistTally.blind++; note = 'No plan survives contact with the door anyway.'; }
    st.stage = 1;
    save();
  }

  // Stage 2, the lock: quietly, loudly, or not at all.
  if (st.stage === 1) {
    const r = await lockDialog(H.lock, st, {head: stageHead(1, M) + (note ? `<p>${note}</p>` : ''), edge: st.cased ? B.casedEdge : 0});
    note = r.last;
    if (r.res === 'back') { save(); return; }
    if (r.res === 'alarm') {
      const res = await heistAlarm(M, st);
      if (res !== 'won') return heistBlown(M, st, res === 'lost' ? 'You never got through the door, and you are in no state to try again today.'
        : 'You are three streets away before the bell stops. The door is still locked.');
      note = '<span class="amber">Whoever answered the alarm is on the floor, and one of them had keys. That is one way through a door.</span>';
      r.res = 'forced';
    } else if (r.res === 'forced') {
      st.alert = Math.min(100, st.alert + B.forced);
      note += ` <span class="amber">Alert +${B.forced}, Heat +${heistHeat(B.heat.forced)}%.</span>`;
      tally('forced');
    } else tally('picked');
    st.entry = r.res === 'forced' ? 'forced' : 'quiet';
    heistTally[st.entry]++;
    st.moves = B.moves[st.entry === 'forced' ? 1 : 0];
    st.stage = 2;
    st.jam = false;
    SND.play('imin', 0.2);
    save();
    if (st.alert >= 100) {   // the door came off, and so did the roof
      const res = await heistAlarm(M, st);
      if (res !== 'won') return heistBlown(M, st, res === 'lost' ? 'The door is open. So, after a fashion, are you.' : 'The door is open, the alarm is ringing, and you are leaving.');
    }
  }

  // Stage 3, inside: the job, carefully or fast, and whatever else there is time for.
  if (st.stage === 2) {
    const verb = {hack: ['Hack it carefully', 'Smash and grab the data'], rob: ['Take only what will not be missed yet', 'Grab everything and go'],
      plant: ['Hide it properly', 'Tape it under the nearest desk']}[H.job];
    while (st.moves > 0) {
      const odds = jobOddsIn(M, st), short = H.job === 'plant' && (S.inv[H.dev] || 0) < H.n;
      const html = stageHead(2, M) + (note ? `<p>${note}</p>` : '') + `<p>${H.inside}</p>` + alertMeter(st) +
        `<p>Time left: <b class="${st.moves > 1 ? 'green' : 'amber'}">${'&#9632;'.repeat(st.moves)}</b> <span class="dim">(${st.entry === 'forced' ? 'a forced door: somebody will come and look' : 'a quiet entry: nobody knows you are here'})</span></p>` +
        `<div class="syn"><b>${cap1(H.prize)}</b>: ${st.done ? '<span class="green">done</span>' : '<span class="amber">not yet</span>'}` +
        (st.took ? `<br><span class="dim">In your bag: ${st.took}</span>` : '') + '</div>' +
        (short && !st.done ? `<p class="red">You no longer have the ${H.n} ${H.dev} to leave behind.</p>` : '') +
        (st.done ? '' : `<p class="dim">Carefully takes two moves and adds ${B.jobOk[0]} Alert. Fast takes one and adds ${B.jobOk[1]}` +
          `${H.job === 'plant' ? ', and a taped-up device does not last as long' : ''}. A botched try adds ${B.jobMiss}.</p>`) +
        `<p class="dim">Helping yourself to what is lying around takes one move and adds ${B.grab} Alert. Drive: ${used()}/${cap()}.</p>`;
      const buttons = [];
      if (!st.done && !short) {
        if (st.moves >= 2) buttons.push([`${verb[0]} (${odds.careful}%, 2 moves)`, 'careful', 'primary']);
        buttons.push([`${verb[1]} (${odds.fast}%, 1 move)`, 'fast', st.moves >= 2 ? '' : 'primary']);
      }
      buttons.push(['Help yourself (1 move)', 'grab'], ['Head for the door', null, 'small']);
      const act = await dialog('Inside', html, buttons, st.alert >= 70 ? 'danger' : '');
      if (!act) break;
      if (act === 'grab') {
        st.moves--;
        st.alert = Math.min(100, st.alert + B.grab);
        heistTally.grab++;
        const cut = st.entry === 'forced' ? B.forcedLoot : 1;
        if (Math.random() < B.grabGoods) {
          const name = GOODS[rnd(6, GOODS.length - 1)][0], want = Math.max(1, Math.round(rnd(1, 3) * cut)), n = heistGoods(name, want);
          note = n ? `<span class="green">A desk drawer gives up ${n} ${name}.</span>${n < want ? ' The rest will not fit on your drive.' : ''}`
            : `<span class="amber">There are ${name} in a drawer, and no room on your drive for any of them.</span>`;
          if (n) st.took = (st.took ? st.took + ', ' : '') + `${n} ${name}`;
        } else {
          const cash = Math.round(rnd(B.grabCash[0], B.grabCash[1]) * H.tier * cut / 10) * 10;
          S.cash += cash;
          st.took = (st.took ? st.took + ', ' : '') + money(cash);
          note = `<span class="green">The petty cash tin was not locked. ${money(cash)}.</span>`;
        }
        note += ` Alert +${B.grab}.`;
      } else {
        const careful = act === 'careful';
        st.moves -= careful ? 2 : 1;
        if (Math.random() * 100 < (careful ? odds.careful : odds.fast)) {
          st.done = true;
          st.careful = careful;
          heistTally[H.job]++;
          const add = B.jobOk[careful ? 0 : 1], cut = st.entry === 'forced' ? B.forcedLoot : 1;
          st.alert = Math.min(100, st.alert + add);
          let got = '';
          if (H.job === 'plant') {
            removeItems(H.dev, H.n);
            const each = Math.round(rnd(B.plantPay[0], B.plantPay[1]) * H.tier * (1 + 0.25 * (H.n - 1)) / 10) * 10;
            S.plants = S.plants || [];
            S.plants.push({site: H.site, what: PLANT_WHAT[H.dev] || 'device', left: B.plantDays[careful ? 0 : 1], pay: each, sloppy: !careful});
            got = `It should send home about ${money(each)} a night for ${B.plantDays[careful ? 0 : 1]} nights${careful ? '' : ', if nobody finds it first'}.`;
          } else {
            const lot = H.job === 'hack' ? H.data : H.swag;
            if (H.job === 'rob') {
              const cash = Math.round(rnd(B.cash[0], B.cash[1]) * H.tier * (1 + S.day / 30) * cut / 10) * 10;
              S.cash += cash;
              st.took = (st.took ? st.took + ', ' : '') + money(cash);
              got = `${money(cash)} in notes that do not need counting twice.`;
            }
            if (lot) {
              const want = Math.max(1, Math.round(lot[1] * cut)), n = heistGoods(lot[0], want);
              if (n) st.took = (st.took ? st.took + ', ' : '') + `${n} ${lot[0]}`;
              got += n ? ` ${n} ${lot[0]} ${H.job === 'hack' ? 'copied to' : 'on'} your drive.${n < want ? ` There was room for no more: ${want - n} stay behind.` : ''}`
                : ` There were ${want} ${lot[0]} for the taking, and no room on your drive for one of them.`;
            }
          }
          note = `<span class="green">${H.job === 'hack' ? 'You are in, you have it, and the logs say the cleaner did it.' : H.job === 'rob' ? 'It goes in the bag.' : careful ? 'It is in, it is hidden, and it has started to listen.' : 'It is in. It is held on with tape and optimism.'}</span> ${got} Alert +${add}.`;
          SND.play('hack');
        } else {
          heistTally.botched++;
          st.alert = Math.min(100, st.alert + B.jobMiss);
          note = `<span class="red">${H.job === 'hack' ? 'Wrong password. The screen says so in a large, red, shared-with-IT sort of way.' : H.job === 'rob' ? 'You knock over a display of something made entirely of glass.' : 'The tile comes down, and brings its friends.'}</span> Alert +${B.jobMiss}.`;
          SND.play('deny');
        }
      }
      save();
      if (st.alert >= 100) {
        const res = await heistAlarm(M, st);
        if (res === 'won') { note = '<span class="amber">That is the alarm answered. You have a little time before anybody else does.</span>'; continue; }
        if (res === 'over') return heistBlown(M, st, '');
        if (st.done && res !== 'lost') return heistDone(M, st, false);   // out, in a hurry, with the job done
        return heistBlown(M, st, res === 'lost' ? 'They have you, and everything you came for.' : 'You go out through a fire door with nothing to show for it.');
      }
    }
    if (!st.moves && !st.done) note = '<span class="amber">Out of time. Somebody is coming up the stairs, whistling.</span>';
    st.stage = 3;
    save();
  }

  // Stage 4, the way out: clean, if the Alert lets you, or fast.
  if (st.stage === 3) {
    const odds = cleanOdds(st), hot = fastHeat(st);
    const how = await dialog('The way out', stageHead(3, M) + (note ? `<p>${note}</p>` : '') + alertMeter(st) +
      (st.done ? '' : '<p class="amber">The job is not done. You can still leave in one piece and come back another day.</p>') +
      `<p><b>Slip out clean</b>: the way you came, at a walk, closing things behind you. <b>${odds}%</b>, and no Heat if it works. If it does not, somebody sees you: Heat +${heatShown(B.heat.spotted)}% and whoever that was.<br>` +
      `<b>Leg it</b>: always works. Heat +${heatShown(hot)}%, because running is what guilty people do.</p>`,
      [[`Slip out clean (${odds}%)`, 'clean', 'primary'], [`Leg it (Heat +${heatShown(hot)}%)`, 'fast']], st.alert >= 70 ? 'danger' : '');
    let clean = false;
    if (how === 'clean') {
      if (Math.random() * 100 < odds) { clean = true; heistTally.clean++; }
      else {
        heistTally.spotted++;
        const res = await heistAlarm(M, st, true);
        if (res === 'lost' || res === 'over') return heistBlown(M, st, res === 'lost' ? 'So close to the street. They take back what you took, and then some.' : '');
      }
    } else {
      heistTally.fast++;
      const up = heistHeat(hot);
      log(`You ran from ${H.site}: Heat +${up}%.`);
    }
    if (!st.done) return heistBlown(M, st, 'You are out, with nothing to show for it. The job is still there.');
    return heistDone(M, st, clean);
  }
}

// Every break-in in progress, wherever its state is kept.
function heistList() {
  const list = [], Q = quest(), G = S.gig;
  if (Q && Q.kind === 'heist') list.push(heistM('quest', Q));
  if (G && G.kind === 'breakin') list.push(heistM('gig', G));
  if (S.fh && HEISTS[S.fh.id]) list.push(heistM('free', {good: S.fh.id, at: S.fh.loc}));
  for (const c of new Set(Object.values(S.markets || {}).flatMap(m => m.contracts || []).concat(S.contracts || []))) if (c.heist) list.push(heistM('job', c));
  return list.filter(Boolean);
}
// You cannot be inside a building and somewhere else. Anyone who was inside (after a reload, say) and has
// since turned up in another part of town left in a hurry: the job counts if it was done, and the Heat is real.
async function heistCheck() {
  for (const M of heistList()) {
    const st = heistPeek(M);
    if (!st || st.stage < 2 || st.loc === S.loc || S.over) continue;
    heistTally.walked++;
    const up = heistHeat(fastHeat(st));
    log(`You left ${M.H.site} in a hurry: Heat +${up}%.`);
    if (st.done) await heistDone(M, st, false);
    else await heistBlown(M, st, `You walked out of ${M.H.site} with the job half done. It will keep.`);
  }
}
// Start (or restart) any break-in at a given stage, right where you stand: 0 the approach, 1 the lock, 2 inside,
// 3 the way out. It pays its tier's reward directly. (For the debug menu and the self-test.)
async function startHeist(id, stage) {
  if (!HEISTS[id]) return;
  stage = clampN(Math.floor(stage) || 0, 0, 3);
  S.fh = {id, stage, day: S.day, alert: 0, loc: S.loc, entry: stage >= 2 ? 'quiet' : '', moves: stage >= 2 ? BREAKIN.moves[0] : 0, done: stage >= 3};
  return heistPlay(heistM('free', {good: id, at: S.loc}));
}
// A break-in for the Local BBS: somebody wants a device left somewhere it should not be.
function breakinJob() {
  const B = BREAKIN, [id, good] = pick([['job_usb', 'USB Droppers'], ['job_ap', 'Rogue APs'], ['job_sim', 'Burner SIMs']]);
  const lock = pick(S.day <= 6 ? ['padlock', 'padlock', 'deadbolt'] : S.day <= 15 ? ['padlock', 'deadbolt', 'deadbolt', 'badge']
    : ['deadbolt', 'badge', 'cylinder', 'maglock']);
  const diff = LOCKS[lock][1], qty = rnd(1, 3), g = GOODS.find(x => x[0] === good), worth = (g[1] + g[2]) / 2 * qty;
  return {good, qty, chance: 50, payout: Math.round(((B.bbs[0] + B.bbs[1] * S.day) * (1 + B.bbs[2] * diff) + B.bbs[3] * worth) / 10) * 10,
    job: HEISTS[id].ad, client: pick(CLIENTS), heist: id, lock, at: S.loc};
}
// What the BBS says about a job's odds: a chance for ordinary jobs, the lock for a break-in.
const jobOdds = c => (c.heist ? `break-in &middot; ${(LOCKS[c.lock] || LOCKS.padlock)[0].toLowerCase()}` : `${chanceFor(c)}% chance`);
// Devices you left behind send a little money home every night until the battery goes, or somebody finds them.
function plantsTick() {
  const B = BREAKIN;
  for (const p of (S.plants || []).slice()) {
    if (p.sloppy && Math.random() < B.plantFound) {
      S.plants.splice(S.plants.indexOf(p), 1);
      heistTally.found++;
      heatUp(B.heat.found);
      log(`<span class="amber">Somebody found the ${p.what} you taped up at ${p.site}. It has stopped paying, and they are dusting it for prints.</span>`);
      continue;
    }
    S.cash += p.pay;
    heistTally.paid++;
    tally('plantpay', p.pay);
    if (--p.left <= 0) S.plants.splice(S.plants.indexOf(p), 1);
    log(`<span class="green">The ${p.what} you left at ${p.site} sent home ${money(p.pay)}.</span>${p.left <= 0 ? ' Its battery is flat now.' : ''}`);
  }
}

// ---------- gear: clothing and equipment in five colour-coded rarities ----------
// Gear belongs to the career, so it carries over between runs.
const RARITY = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
const RARITY_MULT = [1, 1.5, 2.2, 3, 4];
const RARITY_PREFIX = ['Worn', 'Tuned', 'Custom', 'Prototype', 'Mythic'];   // names on items from older saves
// Every item is named "<something from this list> <item type>", e.g. "Kernel Panic Trench Coat".
// One list per rarity, Common to Legendary.
const GEAR_NAMES = [
  ['n00b', 'Script Kiddie', 'Dial-Up', 'Password123', 'Hello World', 'Unpaid Intern', 'Floppy Disk', 'Lorem Ipsum',
    'Spaghetti Code', 'Works-On-My-Machine', 'Default Settings', 'Trial Version'],
  ['Ctrl+Alt+Del', '404', 'Chmod 777', 'Localhost', 'Git Blame', 'Off-By-One', 'Tinfoil', 'Rubber Duck',
    'Dark Mode', 'Hotfix', 'Copy-Paste', 'Stack Overflow'],
