<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0Day Hustle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Zero Day Hustle</title>
<style>
:root{--bg:#06050d;--panel:#0f0d1f;--panel2:#17142e;--line:#2b2752;--fg:#d9e2ff;--dim:#7c81ab;
  --accent:#00e5ff;--cyan:#00e5ff;--pink:#ff2a6d;--magenta:#ff4fd8;--yellow:#fcee0a;--amber:#fcee0a;
  --green:#3dff9a;--red:#ff3b5c;
  --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 ui-monospace,Consolas,"Cascadia Mono",Menlo,"Roboto Mono",monospace;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;min-height:100vh;
  background:
    radial-gradient(900px 420px at 90% -8%,rgba(255,42,109,.17),transparent 70%),
    radial-gradient(700px 380px at 0% 0%,rgba(0,229,255,.13),transparent 70%),
    linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px) 0 0/34px 100%,
    var(--bg)}
/* scanlines over everything */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#app{max-width:760px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtns{display:flex;gap:6px}
h1{margin:0;font-size:18px;letter-spacing:3px;font-weight:800;font-style:italic;color:#000;background:var(--yellow);
  padding:5px 22px 5px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  animation:glitch 4.5s infinite steps(1)}
@keyframes glitch{0%,91%,100%{text-shadow:none;transform:none}
  92%{text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);transform:translateX(1px)}
  94%{text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);transform:translateX(-2px) skewX(-6deg)}
  96%{text-shadow:1px 0 var(--pink);transform:none}}
h2{margin:0 0 10px;font-size:16px;color:var(--yellow);letter-spacing:2px;text-transform:uppercase}
#dayloc{margin:6px 0 4px;font-size:15px;letter-spacing:1px}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.cyan{color:var(--cyan)}.dim{color:var(--dim)}
button{font:inherit;color:var(--accent);background:rgba(0,229,255,.06);border:1px solid var(--accent);
  padding:8px 12px;min-height:40px;cursor:pointer;clip-path:var(--cut);letter-spacing:.5px;
  text-shadow:0 0 6px rgba(0,229,255,.5)}
button:active:not(:disabled){background:var(--accent);color:#000;text-shadow:none}
button:disabled{opacity:.28;cursor:default;text-shadow:none}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:bold;text-shadow:none}
button.primary:active:not(:disabled){background:#fff}
button.danger{border-color:var(--pink);color:var(--pink);background:rgba(255,42,109,.08);text-shadow:0 0 6px rgba(255,42,109,.5)}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-color:var(--line);color:var(--dim);
  background:transparent;text-shadow:none}

/* heads-up panel: avatar, level, health */
#hud{display:grid;grid-template-columns:66px 1fr;gap:10px;margin-top:10px;align-items:stretch}
#ava{cursor:pointer;background:linear-gradient(#0b0a1c,#17132f);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta);position:relative;overflow:hidden;min-height:76px}
#ava .avatar{position:absolute;left:0;top:0;width:100%;height:100%}
.avatar{display:block;width:100%;height:auto}
/* avatar effects: breathing, blinking, rarity glows, glitches, sirens */
.av-fig{transform-origin:100px 336px;animation:avbreathe 3.6s ease-in-out infinite}
@keyframes avbreathe{50%{transform:scaleY(1.012)}}
.av-blink{opacity:0;animation:avblink 5.2s infinite}
@keyframes avblink{0%,93%{opacity:0}94%,96%{opacity:1}97%,100%{opacity:0}}
.av-streak{animation:avflick 4.1s infinite steps(1)}
@keyframes avflick{0%,100%{opacity:1}47%{opacity:.35}49%{opacity:1}52%{opacity:.5}54%{opacity:1}}
.av-epic{animation:avpulse 1.7s ease-in-out infinite alternate}
@keyframes avpulse{from{filter:drop-shadow(0 0 1px var(--rc))}to{filter:drop-shadow(0 0 6px var(--rc))}}
.av-leg{animation:avshimmer 1.2s ease-in-out infinite alternate}
@keyframes avshimmer{from{filter:drop-shadow(0 0 3px var(--rc)) brightness(1)}
  to{filter:drop-shadow(0 0 8px #fff3b0) brightness(1.45)}}
.av-spark{opacity:0;animation:avspark 2.2s linear infinite}
@keyframes avspark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.av-shake{animation:avshake 2.6s infinite steps(1)}
.av-shake.bad{animation-duration:1.3s}
@keyframes avshake{0%,100%{transform:none}8%{transform:translateX(3px)}10%{transform:translateX(-4px) skewX(-4deg)}
  12%{transform:none}61%{transform:translateX(-3px)}63%{transform:none}}
.av-static rect{opacity:0;animation:avstatic 1.7s infinite steps(1)}
.av-static rect:nth-child(2n){animation-duration:2.3s;animation-delay:-.6s}
@keyframes avstatic{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}30%{opacity:0;transform:translateY(22px)}
  55%{opacity:.45}62%{opacity:0;transform:translateY(-14px)}85%{opacity:.4}92%,100%{opacity:0}}
.av-cops ellipse{opacity:.15}
.av-cops .a{animation:avcop 1s infinite steps(1)}
.av-cops .b{animation:avcop 1s -.5s infinite steps(1)}
@keyframes avcop{0%{opacity:.8}50%{opacity:.15}}
.av-search{transform-origin:100px 0;animation:avsearch 4.5s ease-in-out infinite alternate}
@keyframes avsearch{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.av-reticle{transform-origin:100px 40px;animation:avret 1.3s ease-in-out infinite alternate}
@keyframes avret{from{transform:scale(1.3);opacity:.45}to{transform:scale(.92);opacity:1}}
.av-aura,.av-eye{animation:avglow 2.4s ease-in-out infinite alternate}
@keyframes avglow{from{opacity:.5}to{opacity:1}}
.av-ring{animation:avdash 3s linear infinite}
@keyframes avdash{to{stroke-dashoffset:-44}}
.av-zap{animation:blink .35s infinite steps(1)}
.av-bill{animation:avfall 3.3s linear infinite}
@keyframes avfall{from{transform:translateY(-20px)}to{transform:translateY(370px)}}
@media (prefers-reduced-motion:reduce){.avatar *{animation:none!important}}
#career{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--magenta);cursor:pointer;font-size:13px}
#career .lvl{color:var(--magenta);font-weight:bold;white-space:nowrap;text-shadow:0 0 8px rgba(255,79,216,.6)}
#career .bar{flex:1;height:8px;background:#000;border:1px solid var(--line);overflow:hidden;min-width:30px}
#career .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--cyan))}
#career .xp{color:var(--dim);white-space:nowrap}
#vitals{margin:2px 0 0}
.meter{display:grid;grid-template-columns:64px 1fr 58px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.meter span:first-child{color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.meter .track{height:11px;background:#000;border:1px solid var(--line);overflow:hidden;transform:skewX(-18deg)}
.meter .track i{display:block;height:100%;transition:width .25s;box-shadow:0 0 8px currentColor}
.meter b{text-align:right;white-space:nowrap}

#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:6px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);padding:6px 8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.chip small{display:block;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.chip b{font-size:15px;font-weight:600;white-space:nowrap}
#news{margin:10px 0 0}
#news div{color:var(--yellow);padding:2px 0}
#news div::before{content:">> ";color:var(--pink)}
#market{margin-top:10px;border:1px solid var(--line);border-top:2px solid var(--accent);background:rgba(15,13,31,.92)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 9px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{font-size:12px;color:var(--dim)}
.row .price{text-align:right;white-space:nowrap}
.row .btns{display:flex;gap:6px}
.row .btns button{padding:6px 10px;min-width:52px}
#jobs{margin-top:12px}
#jobs h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--pink);font-weight:normal}
.job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 9px;margin-bottom:6px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yellow)}
.job .what{font-weight:600}
.job .sub{font-size:12px;color:var(--dim)}
.job button{border-color:var(--yellow);color:var(--yellow);background:rgba(252,238,10,.06);text-shadow:none}
.job button:active:not(:disabled){background:var(--yellow);color:#000}
.job.quest{border-left-color:var(--cyan)}
.job.quest button{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.06)}
.job.quest button:active:not(:disabled){background:var(--cyan);color:#000}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
#actions button{min-height:46px}
#log{margin-top:14px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
#log div{padding:1px 0}
#log div:first-child{color:var(--fg)}

/* dialogs */
#overlay{position:fixed;inset:0;background:rgba(3,2,10,.84);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:10}
#overlay[hidden]{display:none}
#dialog{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#0b0a19;border:1px solid var(--accent);
  border-top:3px solid var(--yellow);padding:16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
  animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96) skewX(-2deg);opacity:0}to{transform:none;opacity:1}}
#dialog.danger{border-color:var(--pink);border-top-color:var(--pink)}
#dialog.danger h2{color:var(--pink);text-shadow:0 0 10px rgba(255,42,109,.6)}
#dialog p{margin:0 0 10px}
.dbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.qty{display:flex;flex-direction:column;gap:10px;margin-top:6px}
input[type=number],input[type=text]{font:inherit;font-size:18px;color:var(--yellow);background:#000;
  border:1px solid var(--accent);padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--yellow);height:28px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.total{margin-top:10px;color:var(--yellow);min-height:1.35em}
.hall{width:100%;border-collapse:collapse;margin-top:6px}
.hall td{padding:2px 4px}.hall td:last-child{text-align:right}
.syn{margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-left:2px solid var(--accent);background:rgba(23,20,46,.6)}
.syn b{color:var(--cyan)}

/* gear screen */
.avatarbox{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.avatarbox .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);border-bottom:2px solid var(--magenta)}
/* a posed avatar in a dialog, and the two sides of a fight */
.posebox{max-width:150px;margin:0 auto 12px}
.posebox.wide{max-width:280px}
.posebox .avatar,.versus .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta)}
.versus{display:grid;grid-template-columns:86px auto 86px;gap:14px;align-items:center;justify-content:center;margin-bottom:10px}
.versus .foe{border-bottom-color:var(--pink)}
.versus b{color:var(--pink);font-style:italic;font-size:20px;text-shadow:0 0 10px rgba(255,42,109,.6)}
.versus small{display:block;text-align:center;color:var(--dim);font-size:11px;letter-spacing:1px;margin-top:3px}
.slotline{font-size:12px;margin-bottom:7px;line-height:1.3}
.slotline .dim{letter-spacing:1px;text-transform:uppercase;font-size:10px}
/* gear rarity colours: common, uncommon, rare, epic, legendary */
.r0,.syn b.r0{color:#c9d1d5}.r1,.syn b.r1{color:#39ff7a}.r2,.syn b.r2{color:#4da3ff}
.r3,.syn b.r3{color:#c77dff}.r4,.syn b.r4{color:#ff9d2e}
button.r0{border-color:#c9d1d5}button.r1{border-color:#39ff7a}button.r2{border-color:#4da3ff}
button.r3{border-color:#c77dff}button.r4{border-color:#ff9d2e}
button.r0,button.r1,button.r2,button.r3,button.r4{background:rgba(255,255,255,.04);text-shadow:none}

/* loadout close-up: big avatar with a tappable tag per gear slot */
.zoomable{cursor:pointer;position:relative}
.zoomable small{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;letter-spacing:1px;
  color:var(--cyan);text-transform:uppercase;text-shadow:0 0 4px #000,0 0 4px #000}
.stage{position:relative;margin:0 auto 10px}
.stage .avatar{display:block;width:60%;margin:0 auto;background:linear-gradient(#0b0a1c,#1a1535);
  border:1px solid var(--line);border-bottom:2px solid var(--magenta)}
.slottag{position:absolute;width:38%;padding:4px 6px;background:rgba(11,10,25,.9);border:1px solid var(--line);
  border-left:2px solid var(--accent);cursor:pointer;font-size:11px;line-height:1.25}
.slottag small{display:block;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:9px}
.slottag b{display:block;font-weight:600;overflow-wrap:anywhere}
.slottag i{display:block;font-style:normal;color:var(--yellow);font-size:10px}
.slottag.has{border-color:var(--yellow);box-shadow:0 0 8px rgba(252,238,10,.35)}
.slottag:active{background:var(--panel2)}
.slotline[data-pick],.pickable{cursor:pointer}

/* small item pictures in lists and on buttons */
.ico{display:block;flex:none;width:42px;height:42px;background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line)}
.ico.wide{width:92px;height:38px}
.itemrow{display:flex;gap:9px;align-items:center}
.itemrow > span{min-width:0}
button .ico{width:30px;height:30px}
button.hasico{display:flex;align-items:center;gap:7px;text-align:left;padding:5px 9px}
.slotline{display:flex;gap:7px;align-items:flex-start}
.slotline .ico{width:30px;height:30px}
.slotline > span{min-width:0}

/* loading screen */
#boot{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px) 0 0/34px 100%,
    radial-gradient(600px 400px at 50% 40%,rgba(255,42,109,.22),transparent 70%),#06050d;
  transition:opacity .35s,transform .35s}
#boot.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.bootbox{width:100%;max-width:380px}
.bootlogo{position:relative;font-size:44px;line-height:.95;font-weight:900;font-style:italic;letter-spacing:2px;
  color:var(--yellow);text-shadow:3px 0 var(--pink),-3px 0 var(--cyan);animation:bootglitch 1.1s infinite steps(1)}
@keyframes bootglitch{0%,100%{transform:none;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
  20%{transform:translateX(-3px) skewX(-8deg);text-shadow:-4px 0 var(--pink),4px 0 var(--cyan)}
  24%{transform:translateX(2px);text-shadow:5px 0 var(--pink),-2px 0 var(--cyan)}
  28%{transform:none}
  70%{transform:translateY(1px);clip-path:inset(0 0 42% 0)}
  73%{clip-path:inset(38% 0 0 0);transform:translateX(4px)}
  76%{clip-path:none;transform:none}}
.bootsub{margin:12px 0 18px;color:var(--cyan);letter-spacing:3px;font-size:12px}
.bootlog div{opacity:0;color:var(--dim);font-size:13px;margin:3px 0;animation:bootline .01s forwards}
.bootlog div:nth-child(1){animation-delay:.25s}.bootlog div:nth-child(2){animation-delay:.7s}
.bootlog div:nth-child(3){animation-delay:1.15s}.bootlog div:nth-child(4){animation-delay:1.6s}
.bootlog b{color:var(--green);float:right}
@keyframes bootline{to{opacity:1}}
.bootbar{margin-top:16px;height:12px;border:1px solid var(--accent);background:#000;transform:skewX(-18deg);overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));
  box-shadow:0 0 12px var(--yellow);animation:bootfill 2.2s cubic-bezier(.3,.1,.2,1) forwards}
@keyframes bootfill{to{width:100%}}
.boothint{margin-top:14px;color:var(--dim);font-size:11px;letter-spacing:3px;text-align:center;animation:blink 1s infinite steps(1)}
@keyframes blink{50%{opacity:.25}}

/* travel animation */
#travel{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(4,3,12,.93);overflow:hidden}
#travel[hidden]{display:none}
#travel::before{content:"";position:absolute;inset:-50% 0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,229,255,.16) 46px 48px,transparent 48px 120px,rgba(255,42,109,.14) 120px 121px);
  animation:streak .5s linear infinite}
@keyframes streak{to{transform:translateX(-121px)}}
.tbox{position:relative;width:100%;max-width:420px;text-align:center}
.tlabel{color:var(--yellow);letter-spacing:6px;font-weight:800;font-style:italic;font-size:22px;
  text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);animation:bootglitch .7s infinite steps(1)}
.troute{display:flex;justify-content:space-between;gap:10px;margin:18px 0 8px;font-size:13px;color:var(--dim)}
.troute .to{color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,.7)}
.ttrack{position:relative;height:4px;background:var(--line)}
.ttrack::before,.ttrack::after{content:"";position:absolute;top:-5px;width:14px;height:14px;border:2px solid var(--accent);
  background:#06050d;transform:rotate(45deg)}
.ttrack::before{left:-7px}.ttrack::after{right:-7px;border-color:var(--yellow)}
.ttrack b{position:absolute;top:-4px;left:0;width:26px;height:12px;background:var(--yellow);
  box-shadow:0 0 16px var(--yellow),-30px 0 24px rgba(252,238,10,.4);animation:packet 1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes packet{to{left:calc(100% - 26px)}}
.thex{margin-top:16px;color:var(--dim);font-size:11px;letter-spacing:2px;white-space:nowrap;overflow:hidden;opacity:.7}
@media (prefers-reduced-motion:reduce){h1,.bootlogo,.tlabel,#travel::before,.boothint{animation:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="bootbox">
    <div class="bootlogo">ZERO DAY<br>HUSTLE</div>
    <div class="bootsub">// UNDERGROUND MARKET UPLINK</div>
    <div class="bootlog">
      <div>&gt; spoofing hardware address <b>OK</b></div>
      <div>&gt; chaining proxies <b>OK</b></div>
      <div>&gt; decrypting drive <b>OK</b></div>
      <div>&gt; handshake with the Hackerspace <b>OK</b></div>
    </div>
    <div class="bootbar"><i></i></div>
    <div class="boothint">TAP TO SKIP</div>
  </div>
</div>
<div id="app">
  <header><h1>ZERO DAY HUSTLE</h1><span class="hbtns"><button class="small" data-act="menu">Menu</button><button class="small" data-act="restart">New run</button></span></header>
  <div id="hud">
    <div id="ava" data-act="gearmenu" title="Gear"></div>
    <div id="hudr">
      <div id="career" data-act="profile"></div>
      <div id="dayloc"></div>
      <section id="vitals"></section>
    </div>
  </div>
  <section id="stats"></section>
  <section id="news"></section>
  <section id="market"></section>
  <section id="jobs"></section>
  <nav id="actions"></nav>
  <section id="log"></section>
</div>
<div id="overlay" hidden><div id="dialog"></div></div>
<div id="travel" hidden></div>
<script>
'use strict';
const DAYS = 30, START_CASH = 2000, START_DEBT = 5500, DEBT_RATE = 0.08, WALLET_RATE = 0.03,

  get(key, n) { try { return JSON.parse(localStorage.getItem(perSave(key) ? `${key}-${n || slot}` : key)); } catch (e) { return null; } },
  set(key, value, n) {
    if (perSave(key) && !(n || slot)) return;
    try { localStorage.setItem(perSave(key) ? `${key}-${n || slot}` : key, JSON.stringify(value)); } catch (e) {}

  del(key, n) { try { localStorage.removeItem(perSave(key) ? `${key}-${n || slot}` : key); } catch (e) {} },

async function hiddenInvite() {
  const name = SYNDICATES[HIDDEN_SYN][0];

  if (level() < 10) {
    return alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Reach level 10 and we will talk."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, will be on the list when you choose a crew.</p>`);
  }
  if (!career.syn) {
    await alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. There is a place for you."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, is now on the list.</p>`);
    return chooseSyndicate();
  }
  const old = SYNDICATES[career.syn][0];
  if (await confirmDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Walk away from ${old}. There is a place for you."</p>` +
    `<div class="syn"><b>${name}</b><br>${SYNDICATES[HIDDEN_SYN][1]}</div>` +
    `<p class="dim">Leaving ${old} is permanent: you lose its perk and its missions, and start the ${name} line from the top. ` +
    'You can also answer later, from your record.</p>', `Join the ${name}`, 'Not now')) await joinSyndicate(HIDDEN_SYN);
}

// Make sure a syndicate member has a valid place in the questline (and nobody else has one).
function fixQuest() {
  const q = career.quest;
  if (!career.syn) career.quest = null;
  else if (!q || !Number.isInteger(q.n) || q.n < 0 || !(q.p >= 0)) career.quest = {n: 0, p: 0, v: 2};
  else if (q.v !== 2) { q.p = 0; q.v = 2; }   // the lines were rewritten: keep the place, restart that mission's count

function fixCareer() {

// A standing order: a repeatable job once the chain is done.
const newOrder = () => pick([{kind: 'jobs', t: rnd(2, 4)}, {kind: 'profit', t: rnd(2, 6) * 50000}, {kind: 'law', t: rnd(2, 3)},
  {kind: 'raid', t: rnd(2, 3)}, {kind: 'kills', t: rnd(6, 12)}, {kind: 'cool', t: rnd(2, 4)}]);
// The mission you are on, or null if you are not in a syndicate.
function quest() {
  const q = career.quest;
  if (!career.syn || !q) return null;
  const chain = QUESTS[career.syn];
  if (q.n < chain.length) {
    const [title, brief, kind, t, good, place] = chain[q.n], [xp, cash, rar] = QUEST_PAY[q.n];
    return {title, brief, kind, t, good, place, xp, cash, rar};
  }
  if (!q.o || !q.o.kind || !(q.o.t > 0)) q.o = newOrder();
  // A standing order is worth 60% of the level you are working on, so it stays useful however high you climb.
  return {title: 'Standing orders', brief: 'You have done everything I asked. The crew still has work, and it still pays.',
    kind: q.o.kind, t: q.o.t, xp: 60 * level(), cash: 10000, rar: -1, order: true};
}

// How far along the current mission is. Some missions look at where you stand now, not at a count.
const QUEST_NOW = {wallet: () => S.wallet, debt: () => (S.debt ? 0 : 1), drive: () => cap(), stash: () => stashTotal(),
  proxies: () => S.proxies};
const questProg = Q => (QUEST_NOW[Q.kind] ? QUEST_NOW[Q.kind]() : career.quest.p);
function questStatus(Q) {
  const p = Math.min(Q.t, questProg(Q));
  return Q.kind === 'deliver' ? `you carry ${num(S.inv[Q.good] || 0)} / ${Q.t}`
    : Q.kind === 'boss' ? 'start it from the briefing'
    : Q.kind === 'debt' ? (S.debt ? `you owe ${money(S.debt)}` : 'paid')
    : Q.kind === 'score' ? `best so far ${money(p)}`
    : ['profit', 'wallet', 'interest', 'loot'].includes(Q.kind) ? `${money(p)} / ${money(Q.t)}`

const questReward = Q => `<span class="cyan">+${num(Q.xp)} XP</span>, ${money(Q.cash)}` +
  (Q.rar >= 0 ? ` and <span class="r${Q.rar}">${RARITY[Q.rar]} gear</span>` : '');
// Something happened that may count toward the current mission.
function questEvent(kind, amount) {
  const Q = quest();
  if (!Q || Q.kind !== kind) return;
  const q = career.quest;
  if (kind === 'raidall') {   // amount is the crew that was raided: count each crew once
    q.set = q.set || {};
    q.set[amount] = 1;
    q.p = Object.keys(q.set).length;
  } else {
    q.p = kind === 'score' ? Math.max(q.p, amount) : q.p + amount;
  }

}
async function questBrief() {
  const Q = quest();
  if (!Q) return;
  await alertDlg(Q.order ? 'Standing orders' : `Mission ${career.quest.n + 1}: ${Q.title}`,
    `<p class="dim">${HANDLER[career.syn][0].toUpperCase() + HANDLER[career.syn].slice(1)}, ${SYNDICATES[career.syn][0]}:</p><p>"${Q.brief}"</p>` +
    `<div class="syn"><b>${questGoal(Q)}</b><br>Reward: ${questReward(Q)}</div>` +
    '<p class="dim">Your mission is always shown on the main screen. Progress carries over between runs.</p>');
}
// Pay out the current mission if it is done, and hand over the next one.
async function questCheck() {
  for (let Q = quest(); Q && questProg(Q) >= Q.t; Q = quest()) {
    const q = career.quest, crew = SYNDICATES[career.syn][0], who = HANDLER[career.syn];
    const last = !Q.order && q.n === QUESTS[career.syn].length - 1;
    q.n++; q.p = 0; q.o = null; delete q.set;
    questTally++;
    S.cash += Q.cash;
    const xp = gainXp(Q.xp);
    saveCareer();
    log(`<span class="cyan">${crew} mission done: ${Q.title}.</span> Paid ${money(Q.cash)}.${xp}`);
    render();
    await alertDlg('MISSION COMPLETE', `<p><b>${Q.title}</b></p><p>${who[0].toUpperCase() + who.slice(1)} wires you ` +
      `<b>${money(Q.cash)}</b> and the crew's respect: <span class="cyan">+${num(Q.xp)} XP</span>.</p>`);
    if (Q.rar >= 0) await dropLoot(who[0].toUpperCase() + who.slice(1), 0, makeItem(Q.rar));
    else if (Q.order && Math.random() < 0.35) await dropLoot(who[0].toUpperCase() + who.slice(1), 0, makeItem(Math.max(1, rollRarity(25))));
    if (last) {
      await alertDlg(crew, `<p>That was the last thing ${who} had to ask of you. You are inner circle now.</p>` +
        '<p class="dim">From here on the crew hands out standing orders: repeatable jobs that pay more XP the higher your level.</p>');
    }
    await questBrief();
  }
}

// stat: [what it does, value on a Common item, cap on your total, unit]
const STATS = {
  armor: ['less Health damage', 6, 70, '%'],

const BAG_SIZE = 12, MAX_MED = 5, MED_HEAL = 40;

function makeItem(rar, slot) {
  slot = slot || pick(Object.keys(SLOTS));
  const [, names, pool] = SLOTS[slot];
  const count = Math.min(pool.length, [1, pick([1, 2]), 2, 3, pick([3, 4])][rar]);
  const stats = {};
  for (const key of pool.slice().sort(() => Math.random() - 0.5).slice(0, count)) {
    stats[key] = Math.max(1, Math.round(STATS[key][1] * RARITY_MULT[rar] * (0.8 + Math.random() * 0.4)));
  }
  return {slot, rar, name: `${pick(GEAR_NAMES[rar])} ${pick(names)}`, stats};
}
// boost shifts the odds toward rarer items
function rollRarity(boost) {
  const r = Math.random() * 100 - boost;
  return r < 1 ? 4 : r < 5 ? 3 : r < 15 ? 2 : r < 40 ? 1 : 0;
}
const itemValue = it => 800 * [1, 3, 8, 20, 60][it.rar];
const scrapValue = it => Math.round(itemValue(it) * 0.25);
const bonus = key => Math.min(STATS[key][2],
  Object.values(career.gear).reduce((sum, it) => sum + ((it && it.stats[key]) || 0), 0));
const statLine = (key, v) => `+${v}${STATS[key][3]} ${STATS[key][0]}`;
const itemHtml = it => withIcon(gearIcon(it), `<b class="r${it.rar}">${it.name}</b> <span class="dim">${RARITY[it.rar]} &middot; ` +
  `${SLOTS[it.slot][0]}</span><br>${Object.entries(it.stats).map(([k, v]) => statLine(k, v)).join(', ')}`);
const saveCareer = () => { if (!AUTO) store.set('zdh-career', career); };

// Item types that used to belong to another slot: [name, old slot, new slot].
const MOVED = [['Gas Mask', 'head', 'face'], ['Smart Watches', 'hands', 'wrist'], ['Carpal Tunnel Braces', 'hands', 'wrist']];
const movedTo = it => (MOVED.find(([name, from]) => it && it.slot === from && String(it.name).endsWith(name)) || [])[2];
// Re-slot moved items in a list (the bag, the locker, a shop's stock).
function reslot(list) {
  for (const it of Array.isArray(list) ? list : []) if (movedTo(it)) it.slot = movedTo(it);
}
// The same for the career: anything worn in its old slot moves to the new one, or into the bag if that is taken.
function reslotCareer() {
  reslot(career.bag); reslot(career.locker);
  for (const [slot, it] of Object.entries(career.gear)) {
    const to = movedTo(it);
    if (!to) continue;
    delete career.gear[slot];
    it.slot = to;
    if (!career.gear[to]) career.gear[to] = it;
    else if (career.bag.length >= BAG_SIZE && career.locker && career.locker.length < LOCKER_SIZE) career.locker.push(it);
    else career.bag.push(it);   // never thrown away, even if that overfills the bag
  }
}

// Everyone starts with a basic item in every slot except the face and the coat, which stay empty until you find something.
const STARTER = {head: [0, 'firewall'], body: [0, 'armor'], hands: [0, 'aim'], feet: [0, 'speed'], deck: [0, 'hack'],
  legs: [0, 'storage'], wrist: [0, 'luck'], shirt: [0, 'regen']};
function starterGear() {
  for (const [slot, [index, stat]] of Object.entries(STARTER)) {
    if (!career.gear[slot]) {
      career.gear[slot] = {slot, rar: 0, name: `n00b ${SLOTS[slot][1][index]}`, stats: {[stat]: STATS[stat][1]}};
    }
  }
  saveCareer();
}

// Put an item in the bag, or scrap it for cash if the bag is full.
function stash(it) {
  if (career.bag.length < BAG_SIZE) return career.bag.push(it);
  S.cash += scrapValue(it);
  log(`Bag full: scrapped ${it.name} for ${money(scrapValue(it))}.`);
}

// Pass an item to hand over that exact one (a mission reward) instead of rolling loot.
async function dropLoot(from, boost, gift) {
  const it = gift || makeItem(rollRarity(boost));
  const worn = career.gear[it.slot];
  log(`${gift ? 'Reward' : 'Loot'} from ${from}: <span class="r${it.rar}">${it.name}</span> (${RARITY[it.rar]}).`);
  const choice = await dialog(gift ? 'Reward!' : 'Loot!', `<p>${from} ${gift ? 'hands you your cut' : 'left something behind'}:</p><div class="syn">${itemHtml(it)}</div>` +
    (worn ? `<p class="dim">You are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Equip it', 'e', 'primary'], ['Put it in the bag', 'b']]);
  if (choice === 'e') {
    if (worn) stash(worn);
    career.gear[it.slot] = it;
  } else {
    stash(it);
  }
  saveCareer();
}

const RCOL = ['#c9d1d5', '#39ff7a', '#4da3ff', '#c77dff', '#ff9d2e'];
// Looks the player can choose. They belong to the career, so they carry over between runs.
const SKINS = [['Pale', '#f1c9a5', '#d3a27c'], ['Fair', '#e0ac84', '#bd8760'], ['Tan', '#c98f6b', '#a8704f'],
  ['Brown', '#a56c4a', '#855235'], ['Deep', '#7a4a30', '#5e3722'], ['Dark', '#4f2f20', '#3a2115']];
const HAIRSTYLES = ['Crop', 'Mohawk', 'Long', 'Buzz', 'Bald'];
const HAIRCOLS = [['Violet', '#2b1b3f'], ['Black', '#15131c'], ['Brown', '#4a2c1a'], ['Blonde', '#d9b45a'],
  ['Red', '#a8321f'], ['Silver', '#b9c0d0'], ['Teal', '#0f6f78']];
const STREAKS = [['Magenta', '#ff4fd8'], ['Cyan', '#00e5ff'], ['Yellow', '#fcee0a'], ['Green', '#3dff9a'], ['None', null]];
const SYN_COL = {ghost: '#00e5ff', ledger: '#ffd24a', null: '#3dff9a', red: '#ff3b5c', x404: '#c77dff'};
// Cyberware that appears on the avatar as you level up.
const WARE = [[8, 'optic implant'], [9, 'wired forearm'], [20, 'aura'], [25, 'brighter aura'], [30, 'full aura and halo']];
let avSeq = 0;

function getLook() {
  const L = career.look || {}, ok = (v, n, d) => Number.isInteger(v) && v >= 0 && v < n ? v : d;
  return {skin: ok(L.skin, SKINS.length, 2), hair: ok(L.hair, HAIRSTYLES.length, 0),
    col: ok(L.col, HAIRCOLS.length, 0), streak: ok(L.streak, STREAKS.length, 0)};
}

// Draws one person in a 200 x 352 box. Used for the player and for everyone who comes after them.
// F: {look, gear: {slot: {kind, c, rar, fill}}, syn, level, weapon, emp, hp, mood, gold, ko, cuffs}
function figure(F) {
  const INK = '#0b0a19', EYE = '#1b1426', GOLD = '#ffd24a', CYAN = '#00e5ff';
  const [, SKIN, SHADE] = SKINS[F.look.skin];
  const HAIR = HAIRCOLS[F.look.col][1], STREAK = STREAKS[F.look.streak][1], hair = F.look.hair;
  const {head, body, hands, feet, deck, face, legs, wrist, shirt, coat} = F.gear;
  const hurt = F.hp <= 35 && !F.ko;
  // A shape and its mirror image, for the left and right side of the body.
  const both = d => `<path d="${d}"/><path d="${d}" transform="translate(200 0) scale(-1 1)"/>`;
  const flip = s => `<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
  const twin = s => s + flip(s);   // any shapes plus their mirror image
  // A piece of clothing: solid material colour, thin trim in the rarity colour.
  // Rare glows, Epic pulses, Legendary shimmers.
  const wear = (p, fill, shapes) => `<g${p.rar >= 3 ? ` class="${p.rar === 4 ? 'av-leg' : 'av-epic'}"` : ''} ` +
    `fill="${p.fill || fill}" stroke="${p.c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"` +
    `${p.rar >= 2 ? ` style="--rc:${p.c};filter:drop-shadow(0 0 3px ${p.c})"` : ''}>${shapes}</g>`;
  const SLEEVE = 'M70 76 Q56 80 52 96 Q46 140 42 196 L57 199 Q60 160 67 118 Z';
  const TORSO = 'M70 75 Q100 68 130 75 L137 84 L139 120 Q134 160 132 190 L68 190 Q66 160 61 120 L63 84 Z';
  let out = '';

  // --- behind the body ---
  if (deck && deck.kind === 2) {   // Mesh Rig: backpack with an antenna array
    out += wear(deck, '#232638', '<path d="M66 84 h68 v70 q-34 10 -68 0 z"/>' +
      '<path d="M74 86 L58 34 M126 86 L142 34 M100 80 V22" fill="none" stroke-width="2"/>' +
      `<circle cx="58" cy="32" r="4" fill="${deck.c}"/><circle cx="142" cy="32" r="4" fill="${deck.c}"/>` +
      `<circle cx="100" cy="20" r="4" fill="${deck.c}"/>`);
  }
  if (deck && deck.kind === 7) {   // Server Backpack: a rack unit towering over the shoulders
    out += wear(deck, '#232638', '<rect x="56" y="58" width="88" height="104" rx="4"/>' +
      '<path d="M56 72 h88 M56 86 h88 M56 100 h88" fill="none"/>' +
      `<g fill="${deck.c}" stroke="none"><circle cx="62" cy="65" r="2"/><circle cx="69" cy="65" r="2"/>` +
      '<circle cx="62" cy="79" r="2"/><circle cx="138" cy="65" r="2"/><circle cx="131" cy="79" r="2"/>' +
      '<circle cx="138" cy="93" r="2"/><circle cx="62" cy="93" r="2"/></g>' +
      '<path d="M124 58 v-22 M130 58 v-14" fill="none"/>');
  }
  if (hair === 2) {   // long hair falls behind the shoulders
    out += `<path d="M81 30 Q74 62 79 90 L121 90 Q126 62 119 30 Z" fill="${HAIR}" stroke="${INK}" stroke-width="1"/>`;
  }
  if (head && head.kind === 1) {   // back of the hood
    out += wear(head, '#222539', '<path d="M76 46 Q72 8 100 8 Q128 8 124 46 Q126 66 114 76 L86 76 Q74 66 76 46 Z"/>');
  }

  // --- legs and shoes ---
  out += `<g fill="#27314f" stroke="${INK}" stroke-width="1" stroke-linejoin="round">` +
    '<path d="M74 184 L100 184 L99 200 Q98 250 95 322 L79 322 Q76 250 74 200 Z"/>' +
    '<path d="M100 184 L126 184 L126 200 Q124 250 121 322 L105 322 Q102 250 101 200 Z"/></g>' +
    '<path d="M87 200 Q86 250 86 318 M113 200 Q114 250 114 318" stroke="#1d2540" stroke-width="2" fill="none"/>' +
    `<g fill="#3a3d4d" stroke="${INK}" stroke-width="1">${both('M77 320 L96 320 L97 331 Q88 336 71 334 Q71 325 77 320 Z')}</g>`;
  if (legs) {
    // One fill colour and one drawing per name in SLOTS.legs, in the same order. Long coats hang over them.

      // Track Pants: a stripe down each side
      both(LEG) + `<g fill="none" stroke-width="2.6">${both('M77.5 190 Q78.5 250 81.5 320')}</g>`,
      // Tactical Trousers: knee pads and a thigh strap
      both(LEG) + `<g fill="#151827">${both('M79 250 h17 v15 q-8.5 5 -17 0 z')}</g>` + both('M75 214 h24 M75 219 h24'),
      // Pyjama Bottoms: baggy, striped
      both('M72 184 L100 184 L100 200 Q100 250 98 322 L77 322 Q73 250 72 200 Z') +

      // Cargo Shorts, bare shins
      shin + both(SHORT) + both('M75 232 h12 v17 h-12 z') + both('M75 238 h12'),

      both(LEG) + `<g fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6">${both('M81 196 Q82 250 84 314')}</g>`,
      // Kilt, bare shins
      shin + '<path d="M72 184 L128 184 L135 254 L65 254 Z"/>' +
        '<path d="M70 206 h60 M67 232 h66 M86 184 L81 254 M100 184 V254 M114 184 L119 254" fill="none"/>' +
        `<rect x="95" y="196" width="10" height="13" rx="3" fill="#e9e4d8"/>`,

  }
  if (F.syn === 'null') {   // Null Sector: smuggler's thigh pouches
    out += `<g fill="#39402f" stroke="${SYN_COL.null}" stroke-width="1" stroke-linejoin="round">` +
      both('M75 224 L99 225 L99 228 L75 227 Z') + both('M72 228 h13 v17 h-13 z') + both('M72 233 h13') + '</g>';
  }
  if (feet) {
    out += wear(feet, ['#e9e9f0', '#1d1d26', '#2b3050', '#7bd66b', '#e9e9f0', '#c0392b', '#4a3a2c', '#f4b6d2'][feet.kind], [
      // Sneakers
      both('M76 316 L97 316 L98 330 Q88 336 69 334 Q69 324 76 316 Z') +
        both('M70 333 Q84 336 98 331') + both('M80 320 h12 M80 324 h12'),
      // Combat Boots
      both('M77 288 L98 288 L99 330 Q88 336 69 334 Q69 323 77 316 Z') +
        both('M81 296 h13 M81 303 h13 M81 310 h13') + both('M70 333 Q84 336 99 331'),
      // Courier Runners
      both('M76 316 L97 316 L98 330 Q88 336 68 334 Q68 324 76 316 Z') +
        both('M72 328 L96 321') + both('M64 322 h-9 M62 328 h-12'),
      // Foam Clogs
      both('M75 317 L97 317 L98 330 Q88 337 68 334 Q67 322 75 317 Z') +
        twin('<g fill="#1d2540" stroke="none"><circle cx="76" cy="327" r="1.5"/><circle cx="81" cy="323" r="1.5"/>' +
          '<circle cx="86" cy="327" r="1.5"/><circle cx="91" cy="323" r="1.5"/></g>'),
      // Socks and Sandals
      both('M79 298 L96 298 L97 330 Q88 336 71 334 Q71 325 78 318 Z') + both('M79 303 h17 M79 307 h17') +
        '<g stroke-width="3" fill="none">' + both('M70 327 L98 322 M69 335 Q84 338 99 332') + '</g>',
      // Rocket Skates
      both('M77 300 L98 300 L99 328 L69 330 Q69 322 77 316 Z') +
        twin('<g fill="#1d1d26"><circle cx="75" cy="334" r="3.5"/><circle cx="94" cy="334" r="3.5"/></g>') +
        `<g fill="${feet.c}" fill-opacity=".85">${both('M70 318 L56 321 L65 324 L54 330 L70 329 Z')}</g>`,
      // Steel Toecaps
      both('M77 294 L98 294 L99 330 Q88 336 69 334 Q69 323 77 316 Z') + both('M81 302 h13 M81 309 h13') +
        `<g fill="#b9c2d0">${both('M69 334 Q69 325 76 321 L85 321 L85 335 Z')}</g>`,
      // Bunny Slippers
      both('M75 318 L97 318 L98 330 Q88 337 67 334 Q66 322 75 318 Z') +
        both('M72 320 Q65 305 71 303 Q77 308 77 319 Z') + both('M81 319 Q79 304 85 304 Q89 310 86 319 Z') +
        twin('<g fill="#1d1d26" stroke="none"><circle cx="74" cy="327" r="1.3"/><circle cx="82" cy="327" r="1.3"/></g>'),
    ][feet.kind]);
  }

  // --- t-shirt and bare arms ---
  out += `<g fill="#32364f" stroke="${INK}" stroke-width="1" stroke-linejoin="round">` +
    '<path d="M72 76 Q100 70 128 76 L132 120 Q128 160 126 188 L74 188 Q72 160 68 120 Z"/>' +
    both('M72 76 Q58 80 54 96 L52 113 L66 117 L70 96 Z') + '</g>' +
    `<g fill="${SKIN}" stroke="${INK}" stroke-width="1" stroke-linejoin="round">` +
    both('M53 111 Q48 140 47 165 Q45 185 44 200 L55 202 Q58 180 60 165 Q64 140 66 115 Z') + '</g>' +
    `<path d="M74 187 h52" stroke="#151827" stroke-width="4"/><rect x="96" y="184" width="8" height="6" fill="#8a8fa8"/>`;

  // --- shirt, in place of the plain t-shirt ---
  if (shirt) {
    const TEE = 'M72 76 Q100 70 128 76 L132 120 Q128 160 126.5 185 L73.5 185 Q72 160 68 120 Z';
    const SHORT = both('M72 76 Q58 80 54 96 L52 113 L66 117 L70 96 Z');

    const zig = y => `M70 ${y}` + ' l5 -5 l5 5'.repeat(6);
    // One fill colour and one drawing per name in SLOTS.shirt, in the same order.
    out += wear(shirt, ['#15131c', '#a8321f', '#1d1d26', '#e9e9f0', '#e8e8f0', '#e9e9f0', '#ff4fd8', '#1f7a3f'][shirt.kind], [
      // Band Tee: black, with a lightning-bolt logo
      `<path d="${TEE}"/>${SHORT}<path d="M95 102 h12 l-5 11 h6 l-13 18 l3 -12 h-6 z" fill="#fcee0a" stroke-width=".8"/>`,
      // Flannel Shirt: checked, long sleeves
      `<path d="${TEE}"/>${LONG}<g fill="none" stroke="#15131c" stroke-opacity=".6" stroke-width="2">` +
        '<path d="M69 100 h62 M69 125 h62 M71 150 h58 M72 172 h56 M85 74 V185 M100 72 V185 M115 74 V185"/>' +
        both('M52 112 l14 3 M49 138 l14 3 M46 164 l13 3') + '</g><path d="M90 72 L100 84 L110 72" fill="none"/>',

      `<path d="${TEE}"/>${LONG}<path d="M87 70 Q100 79 113 70 L113 77 Q100 86 87 77 Z"/>` +
        '<path d="M92 76 v5 M100 79 v5 M108 76 v5" fill="none" stroke-width="1"/>',
      // Tank Top: bare shoulders
      `<g fill="${SKIN}" stroke="${INK}" stroke-width="1"><path d="${TEE}"/>${SHORT}</g>` +
        '<path d="M82 74 L90 74 Q100 94 110 74 L118 74 L125 108 L131 122 Q128 160 126.5 185 L73.5 185 Q72 160 69 122 L75 108 Z"/>',

      `<path d="${TEE}"/>${LONG}<path d="M100 112 V185" fill="none" stroke-width="1"/>` +
        '<path d="M89 72 L100 84 L111 72 L108 70 L100 78 L92 70 Z"/>' +
        `<path d="M98 80 h4 l2.5 28 l-4.5 7 l-4.5 -7 Z" fill="${shirt.c}" stroke="${INK}" stroke-width=".8"/>`,
      // Striped Longsleeve
      `<path d="${TEE}"/>${LONG}<g fill="none" stroke="#27314f" stroke-width="4">` +
        '<path d="M70 94 h60 M69 110 h62 M69 126 h62 M70 142 h60 M71 158 h58 M72 174 h56"/>' +
        both('M52.5 108 l14 3 M50 128 l14 3 M48 148 l13.5 3 M46 168 l13 3 M44.5 188 l12 2') + '</g>',
      // Tie-Dye Tee
      `<path d="${TEE}"/>${SHORT}<g fill="none" stroke-width="5"><circle cx="100" cy="128" r="27" stroke="#fcee0a"/>` +
        '<circle cx="100" cy="128" r="17" stroke="#00e5ff"/><circle cx="100" cy="128" r="7" stroke="#3dff9a"/></g>',
      // Christmas Jumper: zigzags and a tree
      `<path d="${TEE}"/>${LONG}<path d="${zig(100)} ${zig(172)}" fill="none" stroke="#e9e9f0" stroke-width="2"/>` +
        '<path d="M100 112 l-10 15 h20 z M100 124 l-14 19 h28 z" fill="#e9e9f0" stroke="none"/>' +
        '<rect x="97.5" y="143" width="5" height="7" fill="#8a5a2e" stroke="none"/>' +
        '<g fill="#e0483c" stroke="none"><circle cx="100" cy="112" r="2.4"/><circle cx="94" cy="134" r="1.8"/><circle cx="106" cy="138" r="1.8"/></g>',
    ][shirt.kind]);
  }

  // --- body gear ---
  if (body && body.kind === 'suit') {   // only agents wear one, so it is not in the SLOTS list
    out += wear(body, '#16161f', `<path d="${TORSO}"/>${both(SLEEVE)}` +
      '<path d="M89 72 L100 104 L111 72 Z" fill="#e8e8f0"/>' +
      `<path d="M98 78 h4 l2.5 26 l-4.5 7 l-4.5 -7 Z" fill="${body.c}" stroke-width=".8"/>` +

  } else if (body) {

        '<path d="M82 74 Q100 62 118 74 Q112 86 100 88 Q88 86 82 74 Z"/>' +
        '<path d="M80 154 h40 l5 26 h-50 z"/><path d="M95 88 v20 M105 88 v20 M68 184 h64" fill="none"/>',
      // Trench Coat
      `<path d="M70 75 Q100 68 130 75 L137 84 L139 120 Q140 200 146 274 L54 274 Q60 200 61 120 L63 84 Z"/>${both(SLEEVE)}` +
        '<path d="M86 72 L100 104 L114 72 L122 82 L104 112 L100 104 L96 112 L78 82 Z"/>' +
        `<path d="M100 112 V274 M62 168 h76" fill="none"/><rect x="95" y="163" width="10" height="10" fill="${body.c}"/>`,

      '<path d="M76 76 Q100 71 124 76 L130 100 L128 178 L72 178 L70 100 Z"/>' +

        both('M71 76 Q57 80 53 96 L50 117 L67 121 L70 96 Z') +
        '<path d="M88 72 L100 94 L112 72" fill="#32364f"/><path d="M100 94 V192" fill="none"/>' +
        '<g stroke="none"><g fill="#ffd24a"><circle cx="82" cy="112" r="4"/><circle cx="118" cy="134" r="4"/>' +

    ][body.kind]);
  }

  // --- coat: worn open over everything else on the torso ---
  if (coat) {
    // One side of an open coat, from the collar down to y = len, with its hem starting at x = hem.
    const side = (len, hem) => both(`M70 75 Q80 72 90 73 L92 110 L90 ${len} L${hem} ${len} Q60 ${Math.min(200, len - 20)} 61 120 L63 84 Z`);
    const arms = both(SLEEVE);
    // One fill colour and one drawing per name in SLOTS.coat, in the same order.
    out += wear(coat, ['#e9e9f0', '#ff8a1e', '#6b4a2c', '#fcee0a', '#39402f', '#d7ff3a', '#70143f', '#b98a55'][coat.kind], [
      // Lab Coat: breast pocket full of pens
      side(264, 55) + arms + both('M90 73 L92 106 L79 88 Z') + '<path d="M66 208 h17 v17 h-17 z M112 122 h13 v12 h-13 z"/>' +

      side(304, 51) + arms + `<g fill="#55381f">${both('M63 82 Q76 72 90 73 L92 102 Q76 108 60 100 Z')}</g>`,
      // Rain Poncho: see-through, over the arms

      side(244, 57) + arms + '<path d="M73 72 Q100 63 127 72 L129 83 Q100 73 71 83 Z" fill="#d8c9a8"/>' +

      side(192, 67) + `<g fill="none" stroke="#c9d1d5" stroke-width="4">${both('M62.5 132 h28.5 M64 162 h26.5')}</g>`,
      // Cape, fastened at the throat
      both('M72 74 Q54 78 46 100 Q36 180 33 284 L60 290 Q58 200 62 120 L64 84 Z') +

  // --- syndicate marks ---
  if (F.syn === 'ledger' || F.gold) {   // Black Ledger: gold chain and watch

  if (F.syn === 'x404') {   // 404 Collective: a flickering error code on the chest
    out += `<text class="av-eye" x="100" y="121" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" ` +
      `fill="${SYN_COL.x404}" stroke="${INK}" stroke-width=".5" style="filter:drop-shadow(0 0 3px ${SYN_COL.x404})">404</text>`;

      out += `<g fill="${HAIR}" stroke="${INK}" stroke-width=".8">${both('M82 34 Q77 58 81 82 L87 80 Q84 58 86 38 Z')}</g>` +
        streak('M118 34 Q123 58 119 82 L113 80 Q116 58 114 38 Z');
    } else {
      out += streak('M104 14 Q117 18 117 34 Q113 24 104 23 Z');
    }
  } else if (hair === 1) {
    out += `<path d="M83 34 Q83 20 100 19 Q117 20 117 34 Q112 24 100 23 Q88 24 83 34 Z" fill="${HAIR}" opacity=".4"/>` +
      `<path d="M93 25 Q91 4 100 1 Q109 4 107 25 Q100 21 93 25 Z" fill="${HAIR}" stroke="${INK}" stroke-width="1"/>` +
      streak('M100 1.6 Q108.4 4.4 106.4 24 Q103 22.2 100 22 Z');
  } else if (hair === 3) {
    out += `<path d="M83 36 Q82 17 100 16 Q118 17 117 36 Q113 25 100 24 Q87 25 83 36 Z" fill="${HAIR}" opacity=".85"/>` +
      streak('M108 17.5 L111 18.5 L116 31 L113.6 28 Z');
  }

  // --- face: eyes, brows, nose, mouth ---
  const mood = F.ko ? 'ko' : F.mood || '';
  if (F.ko) {
    out += '<path d="M90.5 38 l5 4 m0 -4 l-5 4 M104.5 38 l5 4 m0 -4 l-5 4" stroke="#1b1426" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
  } else {
    out += '<ellipse cx="93" cy="40" rx="3.2" ry="2.1" fill="#fff"/>' +
      `<circle cx="93.4" cy="40" r="1.6" fill="${EYE}"/>`;
    if (F.level >= 8) {   // optic implant
      out += `<ellipse cx="107" cy="40" rx="3.4" ry="2.3" fill="#05131a" stroke="${CYAN}" stroke-width=".6"/>` +
        `<circle cx="107.2" cy="40" r="1.7" fill="${CYAN}" class="av-eye" style="filter:drop-shadow(0 0 2px ${CYAN})"/>` +
        `<path d="M110.6 41 L114 44 L114 50" fill="none" stroke="${CYAN}" stroke-width=".8"/>`;
    } else {
      out += '<ellipse cx="107" cy="40" rx="3.2" ry="2.1" fill="#fff"/>' + `<circle cx="107.4" cy="40" r="1.6" fill="${EYE}"/>`;
    }
    if (hurt) out += `<path d="M89.4 38.3 h7.2 M103.4 38.3 h7.2" stroke="${SKIN}" stroke-width="2.2"/>`;
    out += `<g class="av-blink" fill="${SKIN}"><ellipse cx="93" cy="40" rx="3.8" ry="2.7"/><ellipse cx="107" cy="40" rx="3.8" ry="2.7"/></g>`;
  }
  const brows = {
    grin: 'M89 35.5 q4 -2 8 0 M103 34.2 q4 -2.6 8 -.6',
    ouch: 'M89 36.6 L97 34.4 M103 34.4 L111 36.6',
    mean: 'M89 34.2 L97 36.6 M103 36.6 L111 34.2',
    ko: 'M89 35 h8 M103 35 h8',
  }[hurt ? 'ouch' : mood] || 'M89 35.5 q4 -2 8 0 M103 35.5 q4 -2 8 0';
  out += `<path d="${brows}" stroke="${hair === 4 ? EYE : HAIR}" stroke-width="1.6" fill="none" stroke-linecap="round"/>` +
    `<path d="M100 42 q-2 6 0 8 q1.5 .6 2.5 0" stroke="${SHADE}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  if (hurt) {   // gritted teeth
    out += '<rect x="95" y="52.4" width="10" height="3.6" rx="1.2" fill="#fff" stroke="#8a4a3c" stroke-width=".8"/>' +
      '<path d="M97.5 52.4 v3.6 M100 52.4 v3.6 M102.5 52.4 v3.6" stroke="#8a4a3c" stroke-width=".5"/>';
  } else {
    const mouth = {grin: 'M93.5 53 q6.5 5 12.5 -1.2', ouch: 'M95 55.6 q5 -2.8 10 0', mean: 'M95 54.8 h10',
      ko: 'M95 55 q2.5 -2 5 0 q2.5 2 5 0'}[mood] || 'M94.5 54 q5.5 2.4 11 0';
    out += `<path d="${mouth}" stroke="#8a4a3c" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  }
  if (F.hp <= 60) out += '<ellipse cx="111" cy="47.5" rx="3.3" ry="2.3" fill="#6b2d6b" opacity=".55"/>';
  if (F.hp <= 35) {
    out += `<rect x="85.5" y="45.5" width="8" height="3.4" rx="1" fill="#e9d9b8" stroke="${INK}" stroke-width=".5" transform="rotate(-20 90 47)"/>`;
  }
  if (F.hp <= 15) out += '<path d="M101.6 50.6 v3.6" stroke="#c9423a" stroke-width="1.3" stroke-linecap="round"/>';

  // --- face gear, under any headgear ---
  if (face) {
    // One fill colour and one drawing per name in SLOTS.face, in the same order.
    out += wear(face, ['#a8321f', '#bfe3ea', '#15131c', '#4a2c1a', face.c, '#e0483c', '#e9e4d8', '#0d0f1a', '#2a2e3f'][face.kind], [
      // Bandana over the nose and mouth
      '<path d="M84.5 46 Q100 41 115.5 46 L113 58 Q100 71 87 58 Z"/>' +
        '<path d="M88 52 q12 5 24 0 M115.5 46 l5 -2 M115 48 l5 3" fill="none"/>',
      // Surgical Mask
      '<path d="M86 46.5 Q100 43 114 46.5 L113 57 Q100 63.5 87 57 Z"/>' +
        '<path d="M86 47 L83 42 M114 47 L117 42 M88.5 50.5 h23 M89 54.5 h22" fill="none" stroke-width="1"/>',
      // Eyepatch
      '<path d="M83 33 L117 37" fill="none" stroke-width="1.2"/><path d="M88 36.5 h10 v4.5 q-5 4.5 -10 0 z"/>',
      // Fake Moustache
      '<path d="M100 51.2 q-4.5 -3 -8.5 -.4 q-2.6 1.8 -4.5 -.6 q1.4 5.6 6.8 4.4 q3.6 -.8 6.2 -2.4 q2.6 1.6 6.2 2.4 q5.4 1.2 6.8 -4.4 ' +
        'q-1.9 2.4 -4.5 .6 q-4 -2.6 -8.5 .4 z" stroke-width="1"/>',
      // Monocle on a chain
      '<circle cx="107" cy="40" r="5.4" fill-opacity=".3"/><path d="M111.4 43.4 Q117 54 112.5 66" fill="none" stroke-width="1"/>',
      // Clown Nose
      '<circle cx="100" cy="47.5" r="4.3"/><circle cx="98.6" cy="46" r="1.2" fill="#fff" stroke="none"/>',
      // Hockey Mask
      '<path d="M85 34 Q100 25 115 34 L114 52 Q100 67 86 52 Z"/>' +
        '<g fill="#0b0a19" stroke="none"><ellipse cx="93" cy="40" rx="3.6" ry="2.6"/><ellipse cx="107" cy="40" rx="3.6" ry="2.6"/>' +
        '<circle cx="96" cy="54" r="1"/><circle cx="100" cy="56" r="1"/><circle cx="104" cy="54" r="1"/><circle cx="100" cy="51" r="1"/></g>' +
        '<path d="M100 29 l-2.5 6 h5 z M89 46 l4 2.5 l-1 2.5 z M111 46 l-4 2.5 l1 2.5 z" fill="#c0392b" stroke="none"/>',
      // LED Mask: crosses for eyes and a lit grin
      '<path d="M85 33 Q100 26 115 33 L114 53 Q100 66 86 53 Z"/>' +
        '<path class="av-eye" d="M90 37.5 l6 5 m0 -5 l-6 5 M104 37.5 l6 5 m0 -5 l-6 5 M92 52 q8 6.5 16 0" fill="none" stroke-width="1.6"/>',
      // Gas Mask
      '<path d="M85 37 Q100 33 115 37 L113 56 Q100 67 87 56 Z"/><path d="M85 40 L81 35 M115 40 L119 35" fill="none"/>' +
        `<circle cx="93" cy="43" r="4.5" fill="${face.c}" fill-opacity=".6"/><circle cx="107" cy="43" r="4.5" fill="${face.c}" fill-opacity=".6"/>` +
        '<circle cx="100" cy="57" r="6"/><path d="M96 57 h8 M100 53 v8" fill="none" stroke-width="1"/>',
    ][face.kind]);
  }

  // --- headgear ---
  if (head && head.kind === 'cap') {   // peaked cap (police); agent headgear is not in the SLOTS list
    out += wear(head, '#1c2f5e', '<path d="M82 29 Q82 11 100 10 Q118 11 118 29 Z"/>' +
      '<path d="M80 28 Q100 23 120 28 L123 34 Q100 29 77 34 Z" fill="#0d0f1a"/><circle cx="100" cy="19" r="3.2" fill="#ffd24a" stroke="none"/>');
  } else if (head && head.kind === 'shades') {   // dark glasses and an earpiece (agents)
    out += wear(head, '#05060a', '<path d="M86 37 h12 v4.5 q-6 3.5 -12 0 z M102 37 h12 v4.5 q-6 3.5 -12 0 z" stroke-width="1"/>' +
      '<path d="M98 38.5 h4 M118.5 43 q3.5 7 0 15" fill="none" stroke-width="1"/>');
  } else if (head) {
    // One fill colour and one drawing per name in SLOTS.head, in the same order.
    out += wear(head, ['#3b3f5e', '#2b2f48', head.c, '#1b1e30', '#c9d1d5', '#1d1d26', head.c][head.kind], [
      // Beanie
      '<path d="M82 33 Q81 12 100 12 Q119 12 118 33 Z"/><path d="M81 30 Q100 26 119 30 L119 38 Q100 34 81 38 Z"/>',
      // Hood, open at the face
      '<path fill-rule="evenodd" d="M77 46 Q73 9 100 9 Q127 9 123 46 Q124 62 114 72 L86 72 Q76 62 77 46 Z ' +
        'M86 40 a14 17 0 1 0 28 0 a14 17 0 1 0 -28 0 Z"/>',
      // AR Visor
      '<path d="M82 35 Q100 31 118 35 L117 45 Q100 48 83 45 Z" fill-opacity=".6"/>' +
        '<path d="M86 38 h10" stroke="#fff" stroke-opacity=".7" fill="none"/>',
      // Neural Band
      '<path d="M83 27 Q100 22 117 27 L117 33 Q100 28 83 33 Z"/>' +
        `<circle cx="83" cy="30" r="3" fill="${head.c}"/><circle cx="117" cy="30" r="3" fill="${head.c}"/>`,
      // Tinfoil Hat: a crumpled foil cone
      '<path d="M80 31 L91 9 L99 15 L106 2 L112 17 L120 31 Q100 24 80 31 Z"/>' +
        '<path d="M91 9 L95 27 M106 2 L104 26 M112 17 L113 28 M99 15 L99 26" fill="none" stroke-width="1"/>',
      // Gamer Headset with a boom mic
      '<path d="M81 38 Q79 7 100 7 Q121 7 119 38" fill="none" stroke-width="4"/>' +
        '<rect x="76" y="33" width="9" height="16" rx="3.5"/><rect x="115" y="33" width="9" height="16" rx="3.5"/>' +
        `<path d="M82 48 Q84 58 95 58" fill="none"/><circle cx="96.5" cy="58" r="2.2" fill="${head.c}"/>`,
      // Mirrorshades
      '<path d="M85 37 h13 v5 q-6.5 4 -13 0 z M102 37 h13 v5 q-6.5 4 -13 0 z" fill-opacity=".9" stroke-width="1"/>' +
        '<path d="M98 38.5 h4 M85 38 L82 37 M115 38 L118 37" fill="none" stroke-width="1"/>' +
        '<path d="M87.5 38.5 l4 3 M104.5 38.5 l4 3" stroke="#fff" stroke-opacity=".8" fill="none" stroke-width="1"/>',
    ][head.kind]);
  }
  if (F.gold) {   // gold-rimmed shades for a big score
    out += `<path d="M86 37 h12 v4.5 q-6 3.5 -12 0 z M102 37 h12 v4.5 q-6 3.5 -12 0 z" fill="#05060a" stroke="${GOLD}" stroke-width="1.2"/>` +
      `<path d="M98 38.5 h4" stroke="${GOLD}" stroke-width="1.2"/>`;
  }
  if (F.ko) {   // seeing stars
    const star = (x, y) => `<path d="M${x} ${y} l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z"/>`;
    out += `<g fill="#fcee0a" class="av-zap">${star(70, 12)}${star(129, 10)}${star(100, 3)}</g>`;
  }

  // --- Legendary gear throws off sparks ---
  const anchor = {head: [100, 22], body: [100, 120], hands: [49, 206], feet: [100, 322], deck: [152, 182],
    face: [100, 46], legs: [100, 250], wrist: [151, 182], shirt: [100, 150], coat: [72, 232]};
  for (const [slot, [x, y]] of Object.entries(anchor)) {
    const p = F.gear[slot];
    if (!p || p.rar !== 4) continue;
    for (let i = 0; i < 4; i++) {
      out += `<circle class="av-spark" cx="${x + [-17, 9, -5, 19][i]}" cy="${y + [4, -2, 8, 6][i]}" r="1.7" fill="${p.c}" ` +
        `style="animation-delay:${(-i * 0.55 - x / 90).toFixed(2)}s"/>`;
    }
  }
  return out;
}

  return scenes[loc] ? `<g opacity=".62">${scenes[loc]}</g>` : '';

// The player. o: {bust} crops to a portrait, {pose} is 'busted', 'down', 'rich' or 'vanished',
// {plain} ignores the state of the run, {mood} forces an expression.
function avatarSvg(o) {
  o = o || {};
  const pose = o.pose || '', quiet = !!pose || !!o.plain, st = S || {}, id = 'av' + (++avSeq);
  const part = slot => {
    const it = career.gear[slot];
    if (!it) return null;
    return {kind: Math.max(0, SLOTS[slot][1].findIndex(name => it.name.endsWith(name))), c: RCOL[it.rar], rar: it.rar};
  };
  const lvl = level(), rich = pose === 'rich';
  const hp = quiet || !Number.isInteger(st.hp) ? 100 : st.hp;
  const opsec = quiet || !Number.isInteger(st.opsec) ? 100 : st.opsec;
  const heat = quiet ? 0 : st.heat || 0;
  // One canister on the belt for each kind of gadget carried, then spares.
  const kinds = [['emp', '#00e5ff'], ['smoke', '#c9d1d5'], ['bomb', '#ff4fd8'], ['fakeid', '#fcee0a']];
  const belt = kinds.filter(([k]) => st[k] > 0).map(([, c]) => c)
    .concat(kinds.flatMap(([k, c]) => Array(Math.max(0, (st[k] || 0) - 1)).fill(c)));
  const F = {look: getLook(), syn: career.syn, level: lvl, weapon: weaponArt(st.weapon || 0), belt, hp,
    gear: Object.fromEntries(Object.keys(SLOTS).map(slot => [slot, part(slot)])),
    mood: pose === 'busted' ? 'ouch' : rich ? 'grin' : o.mood || (quiet ? '' : st.mood) || '',
    gold: rich, ko: pose === 'down', cuffs: pose === 'busted'};
  const grad = (name, c) => `<radialGradient id="${id}${name}"><stop offset="0" stop-color="${c}"/>` +
    `<stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  let defs = '', back = '', front = '', box = '0 0 200 352';

  if (!quiet) back += backdrop(st.loc);
  // Heat: police lights, then a Fed searchlight, then the NSA's crosshair.
  if (heat >= 75) {
    defs += grad('n', '#ff3b5c');
    back += `<ellipse cx="100" cy="352" rx="150" ry="240" fill="url(#${id}n)" opacity=".5"/>`;
    front += '<g class="av-reticle" fill="none" stroke="#ff3b5c" stroke-width="1.6"><circle cx="100" cy="40" r="27"/>' +
      '<path d="M100 5 v17 M100 58 v17 M65 40 h17 M118 40 h17"/><circle cx="100" cy="40" r="2" fill="#ff3b5c"/></g>';
  } else if (heat >= 40) {
    defs += grad('c', '#4da3ff');
    back += `<ellipse cx="100" cy="0" rx="150" ry="150" fill="url(#${id}c)" opacity=".3"/>` +
      '<path class="av-search" d="M100 -12 L34 352 L138 352 Z" fill="#dfe8ff" opacity=".13"/>';
  } else if (heat >= 20) {
    defs += grad('r', '#ff3b5c') + grad('c', '#4da3ff');
    back += `<g class="av-cops"><ellipse class="a" cx="10" cy="60" rx="120" ry="170" fill="url(#${id}r)"/>` +
      `<ellipse class="b" cx="190" cy="60" rx="120" ry="170" fill="url(#${id}c)"/></g>`;
  }
  // Level aura: Ghost in the Wire (20), Root (25), Legend of the Wire (30). A big score gets a gold one.
  const aura = pose && !rich ? 0 : rich || lvl >= 30 ? 3 : lvl >= 25 ? 2 : lvl >= 20 ? 1 : 0;
  if (aura) {
    defs += grad('a', rich ? '#ffd24a' : '#ff4fd8');
    back += `<g class="av-aura"><ellipse cx="100" cy="150" rx="${75 + aura * 10}" ry="${150 + aura * 14}" ` +
      `fill="url(#${id}a)" opacity="${(0.3 + aura * 0.13).toFixed(2)}"/></g>`;
    if (aura === 3) {
      back += `<ellipse class="av-ring" cx="100" cy="40" rx="34" ry="34" fill="none" stroke="${rich ? '#ffd24a' : '#00e5ff'}" ` +
        'stroke-width="1.6" stroke-dasharray="4 7" opacity=".8"/>';
    }
  }

  const ghost = career.syn === 'ghost' && pose !== 'vanished'
    ? ' style="opacity:.78;filter:drop-shadow(0 0 2.5px #00e5ff)"' : '';
  const shadow = '<ellipse cx="100" cy="337" rx="60" ry="8" fill="rgba(255,79,216,.2)"/>';
  let fig = figure(F);
  if (pose === 'down') {
    // Flat on the ground.
    box = '0 0 352 200';
    fig = '<ellipse cx="176" cy="190" rx="165" ry="8" fill="rgba(255,79,216,.2)"/>' +
      `<g transform="translate(0 232) rotate(-90)"${ghost}>${fig}</g>`;
  } else if (pose === 'vanished') {
    // Nothing left but an outline and a file stamp.
    fig = `<g style="filter:brightness(0) drop-shadow(0 0 2px #ff3b5c);opacity:.9">${fig}</g>`;
    front += '<g class="av-static"><rect x="0" y="34" width="200" height="4" fill="#ff3b5c"/><rect x="0" y="150" width="200" height="3" fill="#00e5ff"/>' +
      '<rect x="0" y="250" width="200" height="6" fill="#ff3b5c"/></g>' +
      '<rect x="78" y="34" width="44" height="11" fill="#000" stroke="#ff3b5c"/>' +
      '<g transform="rotate(-8 100 150)"><rect x="42" y="138" width="116" height="24" fill="#000" stroke="#ff3b5c" stroke-width="2"/>' +
      '<text x="100" y="156" text-anchor="middle" fill="#ff3b5c" font-size="18" font-weight="bold" font-family="monospace">REDACTED</text></g>';
  } else {
    fig = `<g class="av-fig"${ghost}>${fig}</g>`;
    if (opsec <= 50) {
      // Your cover is failing: the picture tears.
      fig = `<g class="av-shake${opsec <= 25 ? ' bad' : ''}">${fig}</g>`;
      const bars = opsec <= 25 ? [[34, 5, '#00e5ff'], [70, 3, '#ff2a6d'], [118, 6, '#00e5ff'], [176, 4, '#ff2a6d'], [238, 7, '#00e5ff'], [296, 4, '#ff2a6d']]
        : [[46, 4, '#00e5ff'], [96, 3, '#ff2a6d'], [210, 5, '#00e5ff']];
      front += '<g class="av-static">' + bars.map(([y, h, c]) => `<rect x="0" y="${y}" width="200" height="${h}" fill="${c}"/>`).join('') + '</g>';
    }
    if (hp <= 35) fig = `<g transform="rotate(3 100 335)">${fig}</g>`;   // slumped
    fig = shadow + fig;
  }
  if (pose === 'busted') {
    // Mugshot: height chart behind, booking board in front.
    back = [40, 90, 140, 190, 240, 290].map((y, i) => `<path d="M0 ${y} h200" stroke="#3a3f66" stroke-width="${i % 2 ? 1 : 2}"/>` +
      `<text x="4" y="${y - 4}" fill="#5a6090" font-size="11" font-family="monospace">${6 - i}'</text>`).join('');
    front += '<rect x="62" y="116" width="76" height="38" fill="#e9e4d8" stroke="#0b0a19" stroke-width="1.5"/>' +
      `<text x="100" y="131" text-anchor="middle" fill="#111" font-size="9.5" font-weight="bold" font-family="monospace">${o.label || 'CYBER UNIT'}</text>` +
      `<text x="100" y="147" text-anchor="middle" fill="#111" font-size="12" font-weight="bold" font-family="monospace">0D-${String(1000 + (career.xp % 9000)).padStart(4, '0')}</text>`;
  }
  if (rich) {
    // It is raining money.
    for (let i = 0; i < 9; i++) {
      front += `<g class="av-bill" style="animation-delay:${(-i * 0.37).toFixed(2)}s"><rect x="${8 + (i * 67) % 180}" y="0" width="13" height="7" ` +
        'fill="#3dff9a" stroke="#0b3a22" stroke-width="1"/>' + `<circle cx="${14.5 + (i * 67) % 180}" cy="3.5" r="1.8" fill="#0b3a22"/></g>`;
    }
  }
  // The portrait fills its box whatever the box's shape: head pinned to the top, the excess cropped.
  if (o.bust) box = o.fill ? '50 0 100 150' : '50 0 100 116';
  return `<svg class="avatar" viewBox="${box}"${o.fill ? ' preserveAspectRatio="xMidYMin slice"' : ''} role="img" aria-label="Your character">` +
    `${defs ? `<defs>${defs}</defs>` : ''}${back}${fig}${front}</svg>`;
}

function travelFx(from, to) {

// ---------- state helpers ----------
const used = () => Object.values(S.inv).reduce((a, b) => a + b, 0);
const cap = () => S.drive + (inSyn('null') ? 60 : 0) + bonus('storage');
const free = () => cap() - used();
const pick = list => list[rnd(0, list.length - 1)];
// A labelled bar: Health, OpSec, or the hostiles left in a fight.
function meter(label, value, max, text, color) {
  const width = Math.max(0, Math.min(100, Math.round(value / max * 100)));
  color = color || (width > 60 ? 'green' : width > 30 ? 'amber' : 'red');
  return `<div class="meter"><span>${label}</span><span class="track">` +
    `<i style="width:${width}%;background:var(--${color})"></i></span><b class="${color}">${text}</b></div>`;
}
const vitals = () => meter('Health', S.hp, 100, S.hp + '%') + meter('OpSec', S.opsec, 100, S.opsec + '%');
const lawTier = () => S.heat >= 75 ? 2 : S.heat >= 40 ? 1 : 0;
const rivals = () => Object.keys(SYNDICATES).filter(k => k !== career.syn && k !== HIDDEN_SYN);
const noGrudges = () => ({ghost: 0, ledger: 0, null: 0, red: 0});

function addItems(name, qty, price) {
  const held = S.inv[name] || 0;
  const paid = (S.cost[name] || 0) * held + price * qty;
  S.inv[name] = held + qty;
  S.cost[name] = Math.floor(paid / (held + qty));
}
function removeItems(name, qty) {
  S.inv[name] -= qty;
  if (S.inv[name] <= 0) { delete S.inv[name]; delete S.cost[name]; }
}
function addHeat(value) {
  let gain = Math.min(10, Math.floor(value / 10000));
  if (inSyn('ghost')) gain = Math.ceil(gain / 2);
  gain = Math.ceil(gain * (1 - bonus('stealth') / 100));
  if (gain) S.heat = Math.min(100, S.heat + gain);
}

// ---------- contracts ----------
function rollContracts() {
  S.contracts = [];
  const count = pick([0, 1, 1, 2, 2, 3]);
  const pool = GOODS.slice().sort(() => Math.random() - 0.5).slice(0, count);
  for (const [name, low, high] of pool) {
    const mid = (low + high) / 2;
    const lot = mid >= 10000 ? 3 : mid >= 2000 ? 8 : mid >= 500 ? 15 : mid >= 100 ? 30 : 50;
    const qty = Math.min(60, Math.max(1, Math.round(rnd(Math.ceil(lot / 3), lot) * (1 + S.day / 8))));
    const chance = rnd(50, 85);
    // Riskier jobs pay more. The unit price is never below today's local price,
    // so a job that works always beats selling the same goods here.
    const mult = 1.5 + (85 - chance) / 35 * 1.3 + Math.random() * 0.4;
    const unit = Math.max(S.prices[name] || 0, Math.round(mid));
    S.contracts.push({good: name, qty, chance, payout: Math.round(unit * qty * mult / 10) * 10,
      job: pick(JOBS[name]), client: pick(CLIENTS)});
  }
}
const payoutFor = c => Math.round(c.payout * (inSyn('red') ? 1.25 : 1));
const chanceFor = c => Math.max(10, Math.min(95,
  c.chance + Math.min(10, level()) + 2 * S.proxies - Math.floor(S.heat / 5) + (inSyn('red') ? 10 : 0) + bonus('charm')));
function log(text, cls) {
  logs.unshift(`<div${cls ? ` class="${cls}"` : ''}>${text}</div>`);
  logs.length = Math.min(logs.length, 14);
}

function rollMarket() {
  if (S.loc === BUNKER) {   // nobody trades at your hideout
    S.prices = {}; S.flags = {}; S.news = []; S.contracts = []; S.shop = []; S.store = [];
    return;
  }
  // Each place has one market per day: coming back the same day finds the same prices,
  // with any contracts you ran and gear you bought already gone.
  const today = S.markets[S.loc];
  if (today) {
    S.prices = today.prices; S.flags = today.flags; S.news = today.news;
    S.contracts = today.contracts; S.shop = today.shop; S.store = today.store || [];
    return;
  }
  for (;;) {
    S.prices = {}; S.flags = {}; S.news = [];
    for (const [name, low, high, scarce, flood] of GOODS) {
      if (Math.random() < 0.18) continue;   // nobody is dealing this here today
      let price = rnd(low, high);
      const r = Math.random();
      if (r < 0.06) { price *= rnd(3, 6); S.news.push(scarce); S.flags[name] = 'up'; }
      else if (r < 0.12) { price = Math.max(1, Math.floor(price / rnd(3, 5))); S.news.push(flood); S.flags[name] = 'down'; }
      S.prices[name] = price;
    }
    if (Object.keys(S.prices).length >= 4) break;
  }
  rollContracts();
  // Today's gear on the black market: up to Epic, never Legendary.
  S.shop = [0, 1, 2].map(() => makeItem(Math.min(3, rollRarity(S.day * 0.3))));
  S.store = S.loc === GUN_SPOT ? outfitStock() : [];
  S.markets[S.loc] = {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop, store: S.store};
}

function newGame() {
  S = {day: 1, loc: BUNKER, trips: TRIPS_PER_DAY, markets: {}, cash: START_CASH + (inSyn('null') ? 3000 : 0), debt: START_DEBT, wallet: 0,
    drive: START_DRIVE, opsec: 100, heat: 0, proxies: 0, inv: {}, cost: {}, prices: {}, flags: {}, news: [],
    contracts: [], xpRun: 0, cleared: false, stash: {}, stashCost: {}, hp: 100, medkits: 2, shop: [], weapon: 0, ammo: noAmmo(), loaded: 'std', store: [], emp: 0, smoke: 0, bomb: 0, fakeid: 0, grudge: noGrudges(), raided: false,
    over: false, busted: false};
  logs = [];
  starterGear();
  rollMarket();
  log('New run. You wake up in the Bunker. Buy low, sell high, stay off the radar.');
}

// ---------- dialogs ----------
const overlay = $('#overlay'), dlg = $('#dialog');

function dialog(title, html, buttons, tone) {
  return new Promise(resolve => {
    dlg.className = tone || '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div><div class="dbtns"></div>`;
    const box = dlg.querySelector('.dbtns');
    for (const [label, value, cls, icon] of buttons) {   // icon: optional picture shown on the button
      const el = document.createElement('button');
      el.textContent = label;
      if (cls) el.className = cls;
      if (icon) { el.insertAdjacentHTML('afterbegin', icon); el.classList.add('hasico'); }
      el.onclick = () => { overlay.hidden = true; resolve(value); };
      box.appendChild(el);
    }
    // Anything in the body marked data-pick="value" also answers the dialog when tapped.
    dlg.querySelectorAll('.body [data-pick]').forEach(el => {
      el.onclick = () => { overlay.hidden = true; resolve(el.dataset.pick); };
    });
    if (AUTO) {   // the self-test picks any button or tappable thing at random
      const all = buttons.map(b => b[1]).concat([...dlg.querySelectorAll('.body [data-pick]')].map(el => el.dataset.pick));
      return resolve(all[rnd(0, all.length - 1)]);
    }
    overlay.hidden = false;
    dlg.scrollTop = 0;
  });
}
const confirmDlg = (title, html, yes, no) =>
  dialog(title, html, [[yes || 'Yes', true, 'primary'], [no || 'No', false]]);
const alertDlg = (title, html, tone) => dialog(title, html, [['OK', true, 'primary']], tone);

// Amount picker, 1..max. opts: unit (price each), cash (amount is money), ok (button label).
function askQty(title, html, max, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <div class="qty"><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="${max}">
      <input id="qs" type="range" min="1" max="${max}" value="${max}"></div>
      <div class="quick"><button data-q="1">Min</button><button data-q="h">Half</button><button data-q="m">Max</button></div>
      <div class="total" id="qt"></div>
      <div class="dbtns"><button id="qok" class="primary">${opts.ok || 'OK'}</button><button id="qcancel">Cancel</button></div>`;
    const qn = $('#qn'), qs = $('#qs'), qt = $('#qt');
    const value = () => Math.max(0, Math.min(max, Math.floor(Number(qn.value) || 0)));
    const show = () => {
      const v = value();
      qt.textContent = !v ? '' : opts.unit ? `${num(v)} x ${money(opts.unit)} = ${money(v * opts.unit)}`
        : opts.cash ? money(v) : num(v);
      $('#qok').disabled = !v;
    };
    const set = v => { qn.value = v; qs.value = v; show(); };
    qn.oninput = () => { qs.value = value(); show(); };
    qs.oninput = () => { qn.value = qs.value; show(); };
    dlg.querySelector('.quick').onclick = e => {
      const q = e.target.dataset.q;
      if (q) set(q === 'm' ? max : q === 'h' ? Math.max(1, Math.floor(max / 2)) : 1);
    };
    const done = v => { overlay.hidden = true; resolve(v); };
    $('#qok').onclick = () => done(value() || null);
    $('#qcancel').onclick = () => done(null);
    qn.onkeydown = e => { if (e.key === 'Enter' && value()) done(value()); };
    show();
    if (AUTO) return resolve([null, 1, max, rnd(1, max)][rnd(0, 3)]);
    overlay.hidden = false;
  });
}

function askText(title, html) {
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <input id="tx" type="text" maxlength="16" autocomplete="off" placeholder="anon">
      <div class="dbtns"><button id="tok" class="primary">OK</button></div>`;
    const done = () => { overlay.hidden = true; resolve($('#tx').value.trim()); };
    $('#tok').onclick = done;
    $('#tx').onkeydown = e => { if (e.key === 'Enter') done(); };
    if (AUTO) return resolve('bot');
    overlay.hidden = false;
    $('#tx').focus();
  });
}

// ---------- weapon shops ----------
// kinds: which weapon kinds this shop sells. markup: price multiplier on everything except military hardware.
// hot: true for the black-market dealer (no background check, and every purchase adds a little Heat).
async function weaponShop(title, blurb, kinds, markup, hot) {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5;
    const mine = WEAPONS[S.weapon], tradeIn = mine ? Math.round(mine[1] * 0.3) : 0;
    const priceOf = w => Math.max(0, Math.round(w[1] * scale * (w[4] === 'heavy' ? 1 : markup)) - tradeIn);
    let html = `<p>${blurb}</p><p>Cash: <span class="green">${money(S.cash)}</span>. You carry: ` +
      `<b>${mine ? mine[0] : 'nothing'}</b>${mine ? ` (worth ${money(tradeIn)} as a trade-in)` : ''}.</p>` +
      (mine ? `<div class="syn">${withIcon(weaponIcon(S.weapon), `<b>${mine[0]}</b><br>${mine[2] > 1 ? `${mine[2]} shots a round, ` : ''}${pct(mine[3])}% to hit`)}</div>` : '');
    for (const kind of kinds) {
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${WTYPE[kind][0].toUpperCase()}</b><br>${WTYPE[kind][1]}</p>`;
      if (!hot && kind === 'gun' && S.heat >= 40) {   // the legal store checks who it sells guns to
        html += '<p class="red">"Your background check came back... interesting. No firearms for you today."</p>' +
          '<p class="dim">Get your Heat under 40%, or try the arms dealer at the black market.</p>';
        continue;
      }
      WEAPONS.map((w, i) => [w, i]).filter(([w]) => w && w[4] === kind).sort((a, b) => a[0][1] - b[0][1]).forEach(([w, i]) => {
        const price = priceOf(w), owned = i === S.weapon, ok = !owned && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}>` + withIcon(weaponIcon(i),
          `<span class="${owned ? 'dim' : ok ? 'amber' : 'red'}">${owned ? 'yours' : money(price)}</span> &middot; <b>${w[0]}</b><br>` +
          `${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit${usesAmmo(w) ? ' &middot; <span class="dim">uses ammo</span>' : ''}`) + '</div>';
      });
    }
    // Ammunition: the gun store stocks the ordinary kinds, the van has everything.
    html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">AMMUNITION</b><br>Sold in boxes of ${AMMO_BOX}. ` +
      'Firearms and military hardware use one round a shot; better rounds hit more often.</p>';
    for (const [key, [name, boxPrice, , legal]] of Object.entries(AMMO)) {
      if (!hot && !legal) continue;
      const price = Math.round(boxPrice * scale * (hot && legal ? markup : 1));
      const ok = S.cash >= price && S.ammo[key] + AMMO_BOX <= AMMO_MAX;
      html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="a:${key}"` : ''}>` + withIcon(ammoIcon(key),
        `<span class="${ok ? 'amber' : 'red'}">${money(price)}</span> &middot; <b>${name}</b><br>${hitChange(key)} &middot; you have ${S.ammo[key]}`) + '</div>';
    }
    html += '<p class="dim">Tap a weapon to buy it. You carry one at a time, and your old one is traded in.' +
      (hot ? ' Hardware from the van is hot: each purchase adds 5% Heat.' : '') + '</p>';
    const choice = await dialog(title, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    if (String(choice).startsWith('a:')) {   // a box of ammo
      const key = choice.slice(2), price = Math.round(AMMO[key][1] * scale * (hot && AMMO[key][3] ? markup : 1));
      if (S.cash < price) continue;
      S.cash -= price;
      S.ammo[key] += AMMO_BOX;
      if (!S.ammo[S.loaded]) S.loaded = key;
      log(`Bought ${AMMO_BOX} ${AMMO[key][0]} for ${money(price)}.`);
      render();
      continue;
    }
    const index = Number(choice), w = WEAPONS[index], price = priceOf(w);
    if (!w || index === S.weapon || S.cash < price) continue;
    S.cash -= price;
    S.weapon = index;
    if (usesAmmo(w)) {   // every firearm comes with a few rounds to get you started
      S.ammo.std = Math.min(AMMO_MAX, S.ammo.std + 10);
      if (!S.ammo[S.loaded]) S.loaded = 'std';
    }
    if (hot) S.heat = Math.min(100, S.heat + 5);
    log(`Bought: ${w[0]} for ${money(price)}.`);
    render();
  }
}

// Choose which ammo to load. Costs nothing and takes no time.
async function pickAmmo() {
  for (;;) {
    const active = activeAmmo();
    const html = '<p>Better rounds hit more often. Your weapon fires the kind you load here; if that runs out it falls back to the best kind you have left.</p>' +
      Object.entries(AMMO).map(([key, [name]]) => {
        const have = S.ammo[key];
        return `<div class="syn${have ? ' pickable' : ''}"${have ? ` data-pick="${key}"` : ''}>` + withIcon(ammoIcon(key),
          `<b class="${key === S.loaded && have ? 'amber' : have ? '' : 'dim'}">${name}</b>${key === active ? ' <span class="green">&larr; loaded</span>' : ''}` +
          `<br>${hitChange(key)} &middot; ${have ? `${have} rounds` : '<span class="dim">none</span>'}`) + '</div>';
      }).join('') +
      `<p class="dim">Ammo is sold at ${GUN_STORE} and by the arms dealer. Rival crews sometimes drop it.</p>`;
    const choice = await dialog('Ammunition', html, [['Done', null, 'primary']]);
    if (choice === null || !AMMO[choice]) return;
    S.loaded = choice;
    render();
  }
}
// A picture of a cartridge, coloured by how good the round is.
function ammoIcon(key) {
  const c = {budget: '#8a8fa8', std: '#ffd24a', hollow: '#ff8a1e', ap: '#00e5ff', smart: '#ff4fd8'}[key];
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#0b0a19" stroke-width=".8">' +
    `<rect x="8.5" y="10" width="7" height="11" rx="1" fill="#b98a55"/><path d="M8.5 10 q0 -7 3.5 -8 q3.5 1 3.5 8 z" fill="${c}"/>` +
    `<rect x="7.5" y="19.5" width="9" height="2" fill="#8a5a2e"/></g>${key === 'smart' ? '<circle cx="12" cy="6.5" r="1.4" fill="#fff"/>' : ''}</svg>`;
}

// ---------- clothing and armour store ----------
// Two items for every slot each day: one plain, one from the better rack.
function outfitStock() {
  const stock = [];
  for (const slot of Object.keys(SLOTS)) {
    stock.push(makeItem(pick([0, 0, 1]), slot));
    stock.push(makeItem(Math.min(3, Math.max(1, rollRarity(S.day * 0.3 + 5))), slot));
  }
  return stock;
}

async function outfitShop() {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5, full = career.bag.length >= BAG_SIZE;
    let html = '<p>"Welcome to Ctrl+Alt+Drip. Streetwear, body armour, and things with too many pockets."</p>' +
      `<p>Cash: <span class="green">${money(S.cash)}</span>. Bag ${career.bag.length}/${BAG_SIZE}.</p>` +
      (full ? '<p class="red">Your bag is full. Scrap or store something before you buy more.</p>' : '');
    for (const [slot, [label]] of Object.entries(SLOTS)) {
      const rack = S.store.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
      if (!rack.length) continue;
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${label.toUpperCase()}</b></p>`;
      for (const [it, i] of rack) {
        const price = Math.round(itemValue(it) * scale * 0.9), ok = !full && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}><span class="${ok ? 'amber' : 'red'}">${money(price)}</span>${itemHtml(it)}</div>`;
      }
    }
    html += S.store.length ? '<p class="dim">Tap an item to buy it. It goes into your bag; put it on from the Gear screen. New stock arrives every day.</p>'
      : '<p>You bought everything on the racks. New stock arrives tomorrow.</p>';
    const choice = await dialog(OUTFITTER, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    const it = S.store[Number(choice)];
    if (!it) continue;
    const price = Math.round(itemValue(it) * scale * 0.9);
    if (S.cash < price || career.bag.length >= BAG_SIZE) continue;
    S.cash -= price;
    S.store.splice(Number(choice), 1);
    career.bag.push(it);
    saveCareer();
    log(`Bought: <span class="r${it.rar}">${it.name}</span> for ${money(price)}.`);
    render();
  }
}

// ---------- loadout close-up ----------
// A big view of the avatar with a tag on each gear slot. Tapping a tag opens that slot.
async function inspectGear() {
  const POS = {face: 'top:1%;left:0', shirt: 'top:19%;left:0', body: 'top:37%;left:0', wrist: 'top:55%;left:0', hands: 'top:73%;left:0',
    head: 'top:1%;right:0', coat: 'top:19%;right:0', deck: 'top:37%;right:0', legs: 'top:58%;right:0', feet: 'bottom:1%;right:0'};
  for (;;) {
    const tags = Object.entries(SLOTS).map(([slot, [label]]) => {
      const it = career.gear[slot], spare = career.bag.filter(b => b.slot === slot).length;
      return `<div class="slottag${spare ? ' has' : ''}" data-pick="${slot}" style="${POS[slot]}"><small>${label}</small>` +
