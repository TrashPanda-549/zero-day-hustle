    ['medkit', 'medkit', 'gadget', 'gear', 'medkit'], 2, 1, 4, 6],
  ['Brass', 'His jacket rattles when he walks: loose rounds in every pocket. "Fell off a truck. A police truck."',
    ['ammo', 'ammo', 'weapon', 'ammo', 'weapon'], 3, 2, 1, 4],
  ['Ragpicker', 'She pushes a shopping trolley of clothes with the store tags still on. "Your size. Everything is your size."',
    ['gear', 'gear', 'gear', 'medkit', 'gear'], 4, 5, 0, 7],
  ['Dumpster Dave', 'A man climbs out of the skip behind a datacenter with an armful of drives. "They throw out the good stuff."',
    ['goods', 'goods', 'drive', 'proxy', 'goods', 'cool'], 1, 3, 4, 2],
  ['Glitch', 'Someone in a tinfoil hat is selling things off a blanket. No two of them belong together.',
    ['weapon', 'gadget', 'gear', 'ammo', 'goods', 'proxy', 'cool'], 5, 6, 4, 0],
];

function junkieSvg(J) {
  const [name, , , skin, col, hat, coat] = J, c = '#8a8fa8';
  const F = {look: {skin, hair: 2, col, streak: 4}, level: 1, weapon: 0, hp: 50, mood: '',
    gear: {head: {kind: hat, c, rar: 0}, body: {kind: coat, c, rar: 0}, hands: null, feet: null, deck: null}};
  return `<svg class="avatar foe" viewBox="${bustBox()}" role="img" aria-label="${esc(name)}">` +
    `<rect x="0" y="0" width="200" height="352" fill="#3dff9a" opacity=".1"/><g${figClass()}>${sprite(figure(F), true)}</g></svg>`;
}

// One thing a junkie might have. Returns null when you could not use it (already carrying the most you can).
// {name, text, list (the shop price), icon, cls, take()}
function junkOffer(kind) {
  const scale = 1 + Math.floor(S.day / 10) * 0.5;
  if (kind === 'gadget' || kind === 'cool') {   // 'cool': one of the Heat items; 'gadget': any of the others
    const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2] && !COOL[k] === (kind === 'gadget'));
    if (!spare.length) return null;
    const k = pick(spare), [name, price, , what] = GADGETS[k];
    return {name, text: `single use: ${what} (you have ${S[k]})`, list: price * scale, icon: miscIcon(k), take() { S[k]++; }};
  }
  if (kind === 'proxy') {
    if (S.proxies >= MAX_PROXIES) return null;
    return {name: 'Proxy chain', text: `"borrowed" server logins: for hacking back, raids and freelance jobs (you have ${S.proxies})`,
      list: 1500 * (1 + S.proxies) * scale, icon: miscIcon('proxy'), take() { S.proxies++; }};
  }
  if (kind === 'medkit') {
    if (S.medkits >= MAX_MED) return null;
    return {name: 'Medkit', text: `restores ${MED_HEAL}% Health any time (you have ${S.medkits})`, list: 600 * scale,
      icon: miscIcon('medkit'), take() { S.medkits++; }};
  }
  if (kind === 'ammo') {
    const k = pick(Object.keys(AMMO));
    if (S.ammo[k] + AMMO_BOX > AMMO_MAX) return null;
    return {name: `${AMMO_BOX} ${AMMO[k][0]}`, text: `${hitChange(k)} (you have ${S.ammo[k]})`, list: AMMO[k][1] * scale, icon: ammoIcon(k),
      take() { S.ammo[k] += AMMO_BOX; if (!S.ammo[S.loaded]) S.loaded = k; }};
  }
  if (kind === 'weapon') {
    // Nothing too grand: what a junkie could plausibly have walked off with, a little better late in a run.
    const top = 20000 + S.day * 3000;
    const i = pick(WEAPONS.map((w, n) => n).filter(n => WEAPONS[n] && n !== S.weapon && WEAPONS[n][1] <= top));
    const w = WEAPONS[i], mine = WEAPONS[S.weapon];
    return {name: w[0], text: `${WTYPE[w[4]][0].toLowerCase()}, ${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit` +
      `${usesAmmo(w) ? ', no rounds included' : ''}${mine ? `. Replaces your ${mine[0]}` : ''}`, list: w[1] * scale, icon: weaponIcon(i),
      take() { S.weapon = i; }};
  }
  if (kind === 'gear') {
    const it = makeItem(Math.min(3, rollRarity(S.day * 0.3 + 5)));
    return {name: it.name, item: it, list: itemValue(it) * scale, icon: gearIcon(it), cls: 'r' + it.rar,
      take() { stash(it); saveCareer(); }};
  }
  if (kind === 'goods') {
    const [name, low, high] = GOODS[rnd(3, GOODS.length - 1)], qty = Math.min(rnd(3, 10), free());
    if (qty <= 0) return null;
    const list = Math.round((low + high) / 2) * qty;
    return {name: `${qty} ${name}`, text: 'still in the shrink wrap', list, icon: '', goods: [name, qty],
      take(paid) { addItems(name, qty, Math.floor(paid / qty)); }};
  }
  // 'drive': a pocketful of storage
  return {name: 'Loose drives', text: '+25 drive slots, wiped (he says)', list: 600 * (1 + Math.floor(S.day / 8)), icon: '',
    take() { S.drive += 25; }};
}

async function junkie() {
  const J = pick(JUNKIES), [name, line, kinds] = J;
  const offers = [];
  for (const kind of kinds.slice().sort(() => Math.random() - 0.5)) {
    const o = junkOffer(kind);
    if (!o || offers.some(x => x.name === o.name) || offers.length >= 4) continue;
    o.price = Math.max(10, Math.round(o.list * rnd(JUNKIE_RATE[0], JUNKIE_RATE[1]) / 1000) * 10);
    o.list = Math.round(o.list);
    offers.push(o);
  }
  if (!offers.length) return;
  junkTally++;
  log(`A junkie called ${name} was waiting at ${S.loc} with things to sell.`);
  let bought = 0;
  while (offers.length) {
    render();
    const html = `<div class="versus" style="grid-template-columns:86px"><div>${junkieSvg(J)}<small>${name.toUpperCase()}</small></div></div>` +
      `<p>${bought ? '"Anything else? I got more."' : line}</p><p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
      offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">${money(o.price)}</span> ` +
        `<span class="dim">(<s>${money(o.list)}</s>)</span>` +
        `${o.item ? itemHtml(o.item) : withIcon(o.icon, `<b>${o.name}</b><br>${o.text}`)}</div>`).join('') +
      '<p class="dim">Junkies sell for a fraction of what the shops charge. Walk away and they are gone.</p>';
    // Goods only while there is still room for them: an earlier buy from the same junkie may have used it up.
    const buttons = offers.filter(o => S.cash >= o.price && (!o.goods || o.goods[1] <= free()))
      .map(o => [`Buy ${o.name}`, o.name, o.cls, o.icon]);
    buttons.push(['Walk on', null, buttons.length ? 'small' : 'primary']);
    const choice = await dialog('A junkie with a deal', html, buttons, '');
    const o = offers.find(x => x.name === choice);
    if (!o) break;
    S.cash -= o.price;
    o.take(o.price);
    offers.splice(offers.indexOf(o), 1);
    bought++;
    tally('junk');
    log(`Bought ${o.name} from ${name} for ${money(o.price)}.`);
  }
  if (!bought) log(`You left ${name} to it.`);
}

// ---------- confrontations: the law, rival syndicates, and raids on rivals ----------
function lawEncounter() {
  const tier = lawTier(), L = LAW[tier];
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  return fight({kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi});
}

function gangEncounter(key) {
  return fight({kind: 'gang', gang: key, name: SYNDICATES[key][0], n: rnd(1, 2 + Math.floor(S.day / 8)),
    hit: 0.3, lo: 3, hi: 8});
}

// ---------- getting jumped ----------
// Now and then somebody is waiting where you surface, and not to sell you anything. They are there in
// person, so every hit lands on your Health, and half the time they get the first swing in.
const JUMP_ODDS = 0.1;   // chance per trip
const THUG_CREWS = ['Street punks', 'Scrap Dogs', 'Chrome Rats', 'Alley Jackers', 'Gutter Saints', 'Wire Strippers'];
// [skin, hair, hair colour, hat (-1 none), jacket, mask (-1 none), weapon]
const THUG_LOOKS = [[2, 2, 3, -1, 4, 0, 11], [4, 0, 1, 0, 0, 6, 13], [0, 4, 5, 1, 4, -1, 14], [3, 1, 0, -1, 3, 8, 11],
  [1, 3, 2, 0, 4, 0, 13], [5, 2, 6, 1, 0, 6, 14]];
let jumpTally = 0;   // counted for the self-test

function jumped() {
  const n = rnd(1, 2 + Math.floor(S.day / 8)), name = pick(THUG_CREWS);
  jumpTally++;
  log(`<span class="red">${name} jumped you at ${S.loc}.</span>`);
  return fight({kind: 'thug', name, n, hit: 0.4, lo: 4, hi: 9, seed: rnd(0, 5),
    ambush: Math.random() < Math.max(0.15, 0.5 - bonus('speed') / 100),
    intro: `You surface at ${S.loc} and walk straight into it. ${name}: ${n} of them, stepping out of the dark.`});
}

// ---------- the prison pocket, in use ----------
// E.pocket holds what went in during this encounter: [{name, qty, cost, tag}]. It only lasts as long as the
// fight does; pocketOut() empties it again when the fight is over, however it ended.
let pocketTally = 0, stuckTally = 0, extractTally = 0, tagSales = 0, sickTally = 0, deadTally = 0;   // counted for the self-test
const pocketRoom = E => POCKET_CAP - stuckTotal() - ((E && E.pocket) || []).reduce((sum, lot) => sum + lot.qty, 0);
const pocketable = () => GOODS.map(g => g[0]).filter(name => S.inv[name] && !POCKET_NO[name]);

// Choose what to hide. Returns {name, qty}, or null if you thought better of it.
async function pocketIn(E) {
  const room = pocketRoom(E), names = pocketable();
  if (room <= 0 || !names.length) return null;
  const wont = Object.keys(POCKET_NO).filter(name => S.inv[name]);
  const html = `<p>There is one place on you ${E.name} will not search without a warrant and a strong stomach. ` +
    `It holds <b>${room}</b> more small thing${room === 1 ? '' : 's'}.</p>` +
    names.map(name => {
      const qty = Math.min(room, S.inv[name]);
      return `<div class="syn pickable" data-pick="${name}"><b>${name}</b> x${num(qty)}` +
        `<br><span class="dim">you hold ${num(S.inv[name])}, bought at ${money(S.cost[name] || 0)} each</span></div>`;
    }).join('') +
    (wont.length ? `<p class="dim">Will not fit: ${wont.map(name => `${name} (${POCKET_NO[name]})`).join(', ')}.</p>` : '') +
    '<p class="dim">What you hide survives a search, an arrest and a drive wipe. It costs you this turn. ' +
    `About one time in three, some of it does not come back out, and then you need a street doc.</p>`;
  const name = await dialog('Prison pocket', html, [['Never mind', null, 'primary']]);
  if (!name || !S.inv[name] || POCKET_NO[name]) return null;
  const qty = Math.min(room, S.inv[name]), cost = S.cost[name] || 0, tagWas = tagged(name);
  removeItems(name, qty);
  E.pocket = E.pocket || [];
  E.pocket.push({name, qty, cost, tag: tagWas - tagged(name)});
  if (Math.random() < STUCK_ODDS) E.jam = true;   // each use rolls on its own; you find out afterwards
  pocketTally++;
  tally('pocket');
  log(`You hid ${num(qty)} ${name} in your prison pocket.`);
  return {name, qty};
}

// The fight is over: get it all back out. If a use went wrong, some of it stays where it is.
async function pocketOut(E) {
  const lots = E.pocket || [];
  delete E.pocket;
  if (!lots.length || S.over) return;
  fixTags();   // the drive may have been wiped or seized since they went in
  const total = lots.reduce((sum, lot) => sum + lot.qty, 0);
  // Which ones stick is the luck of the draw: shuffle every hidden thing and keep the first few.
  const units = lots.flatMap((lot, i) => Array(lot.qty).fill(i)).sort(() => Math.random() - 0.5);
  const jam = E.jam ? rnd(1, total) : 0, held = lots.map(() => 0);
  units.slice(0, jam).forEach(i => held[i]++);
  const wasStuck = stuckTotal();
  lots.forEach((lot, i) => {
    const out = lot.qty - held[i];
    if (out) addItems(lot.name, out, lot.cost, Math.min(lot.tag, out));
    if (held[i]) {
      const had = S.stuck[lot.name] || 0;
      S.stuckCost[lot.name] = Math.floor(((S.stuckCost[lot.name] || 0) * had + lot.cost * held[i]) / (had + held[i]));
      S.stuck[lot.name] = had + held[i];
    }
  });
  render();
  if (!jam) {
    log(`<span class="green">Your prison pocket gave back all ${num(total)} goods.</span>`);
    return alertDlg('Prison pocket', `<p>Somewhere private, you get all <b>${num(total)}</b> back. You do not look at them directly.</p>` +
      '<p class="dim">Nobody saw anything. You will be telling yourself that for a while.</p>');
  }
  if (!wasStuck) S.sick = 0;
  stuckTally++;
  tally('stuck');
  S.mood = 'ouch';
  log(`<span class="red">${num(jam)} of the goods in your prison pocket are stuck: ${stuckList()}.</span>`);
  render();
  return alertDlg('Stuck', `<p>${total - jam ? `<b>${num(total - jam)}</b> come back out.` : 'Nothing comes back out.'} ` +
    `<b>${num(jam)}</b> ${jam === 1 ? 'does' : 'do'} not, and you tried.</p>` +
    `<div class="syn"><b class="red">Stuck:</b> ${stuckList()}<br><span class="dim">They cannot be sold, used or moved, and they still count as carried.</span></div>` +
    `<p>A <b>street doc</b> at the black market (${docSpots()}) will take them out for a fee, and patch you up to full Health while he is in there.</p>` +
    `<p class="amber">Do not sleep on it. Left in, they give you dysentery: you have ${nights(sickLeft() - 1)} before the one you do not wake up from.</p>`, 'danger');
}

// A night slept with goods stuck. n: how many nights that makes. Tells you where you stand; the last one ends the run.
async function sickNight(n) {
  sickTally++;
  const left = SICK_DAYS - n, doc = `<p class="dim">Stuck: ${stuckList()}. The street doc at the black market (${docSpots()}) removes them.</p>`;
  const count = left > 1 ? `<p class="amber">You can sleep on it ${nights(left - 1)}. The one after that is the last.</p>` : '';
  if (n >= SICK_DAYS) {
    S.hp = 0;
    S.over = true;
    S.dead = 'dysentery';
    deadTally++;
    tally('dysentery');
    log('<span class="red">You have died of dysentery.</span>');
    return;
  }
  if (n < 3) {
    log(`<span class="amber">Day ${S.day}: your gut is not happy about what is stuck in it. Sleep only healed 15%.</span>`);
    return alertDlg(n === 1 ? 'Something is wrong' : 'Cramps', (n === 1
      ? '<p>You sleep badly. What is stuck in your prison pocket has started to disagree with you, and it is winning the argument.</p>'
      : '<p>Cramps wake you twice. You have begun to plan your day around bathrooms.</p>') +
      '<p>Sleep only heals 15% Health while they are in there.</p>' + count + doc, 'danger');
  }
  const loss = n >= 5 ? 25 : 15, slow = n >= 5 ? 2 : 1;
  S.hp = Math.max(5, S.hp - loss);
  S.trips = Math.max(1, S.trips - slow);
  S.mood = 'ouch';
  log(`<span class="red">Day ${S.day}: dysentery. Health -${loss}%, and ${slow} trip${slow === 1 ? '' : 's'} lost to the bathroom.</span>`);
  return alertDlg(n >= 5 ? 'DYSENTERY: LAST WARNING' : 'DYSENTERY', (n >= 5
    ? '<p>You are grey, shaking, and on first-name terms with the Bunker\'s plumbing. <b>If you sleep again with them still in, you die.</b></p>'
    : '<p>It is dysentery now. This is what happens when you keep merchandise where merchandise was never meant to be kept.</p>') +
    `<p>Health <b class="red">-${loss}%</b>, sleep no longer heals you, and you lose <b>${slow}</b> trip${slow === 1 ? '' : 's'} today to the bathroom.</p>` +
    count + doc, 'danger');
}

// ---------- battle screen ----------
// Fights play out on a side-on stage: the hostiles lined up on the left, you on the right, and windows
// underneath for who is left standing, your vitals and the list of commands. It only draws what
// fightRounds() decides, and none of it runs during the self-test.
const BTL = (() => {
  const el = $('#battle');
  const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
  const q = sel => el.querySelector(sel);
  let E = null, title = '', stage = null, hero = null, alive = [];   // alive: the sprites still standing, back row first
  const on = () => !AUTO && !!E;

  // Restart a one-shot animation class on a node.
  function fx(node, cls, ms) {
    node.classList.remove(cls);
    void node.offsetWidth;
    node.classList.add(cls);
    setTimeout(() => node.classList.remove(cls), ms);
  }
  function flash(color) {
    const f = q('.bflash');
    f.style.background = color;
    fx(f, 'on', 450);
  }
  // A number or a word that floats up off a sprite.
  function pop(target, html, cls) {
    const p = document.createElement('div');
    p.className = 'bpop ' + (cls || '');
    p.innerHTML = html;
    p.style.left = target.offsetLeft + target.offsetWidth / 2 + 'px';
    p.style.top = target.offsetTop + target.offsetHeight * 0.3 + 'px';
    stage.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
  function banner(text) {
    const b = q('.bban');
    b.hidden = !text;
    b.textContent = text || '';
  }
  function say(html) { q('.bmsg').innerHTML = html; }
  function stat() {
    const bar = (label, value) => {
      const v = Math.max(0, Math.min(100, value));
      return `<span class="lbl">${label}</span><span class="track"><i style="width:${v}%;background:var(--${v > 60 ? 'green' : v > 30 ? 'amber' : 'red'})"></i></span>` +
        `<b>${v}<small class="dim">/100</small></b>`;
    };
    q('.bstat').innerHTML = `<div class="who">YOU &middot; LV ${level()}</div>` + bar('HP', S.hp) + bar('SEC', S.opsec);
    const label = E.name.replace(/^the /, '');
    q('.bfoes').innerHTML = `<div><span>${esc(label[0].toUpperCase() + label.slice(1))}</span><b>&times;${alive.length}</b></div>` +
      (E.n > alive.length ? `<div class="dim"><span>down</span><span>${E.n - alive.length}</span></div>` : '');
  }

  return {
    open(enc, head, hint) {
      if (AUTO) return;
      E = enc; title = head;
      // Two staggered columns. The back row is drawn first, so the ones nearer the front overlap it.
      const n = enc.n, rows = Math.ceil(n / 2), h = n <= 2 ? 72 : n <= 4 ? 62 : 52, w = h * 0.355;
      let foes = '';
      for (let i = 0; i < n; i++) {
        const row = Math.floor(i / 2), col = i % 2;
        const left = 3 + col * w * 0.92 + (row % 2) * 6 + (n === 1 ? 8 : 0);
        const bottom = 5 + (rows - 1 - row) * Math.min(10, 26 / Math.max(1, rows - 1));
        foes += `<div class="bspr bfoe" style="left:${left.toFixed(1)}%;bottom:${bottom.toFixed(1)}%;height:${h}%;z-index:${2 + row}">` +
          `${foeSvg(enc, true, i)}</div>`;
      }
      el.innerHTML = `<div class="bwrap"><div class="bstage ${enc.kind}"><div class="bwin bban" hidden></div>${foes}` +
        `<div class="bspr bhero" style="right:7%;bottom:6%;height:72%;z-index:6">${avatarSvg({plain: true})}</div>` +
        '<div class="bflash"></div></div><div class="bwin bmsg"></div>' +
        '<div class="brow"><div class="bwin bfoes"></div><div class="bwin bstat"></div></div>' +
        `<div class="bwin bcmd off"></div><div class="bhint">${hint}</div></div>`;
      el.hidden = false;
      el.scrollTop = 0;
      stage = q('.bstage'); hero = q('.bhero'); alive = [...el.querySelectorAll('.bfoe')];
      banner(title);
      stat();
      flash('#fff');
    },
    close() {
      el.hidden = true;
      el.innerHTML = '';
      E = null; alive = [];
    },
    // Ask for a command. buttons: [label, value, class], as for dialog(). The self-test picks at random.
    menu(buttons, msg) {
      if (!on()) return Promise.resolve(buttons[rnd(0, buttons.length - 1)][1]);
      return new Promise(resolve => {
        const box = q('.bcmd');
        const point = b => { box.querySelectorAll('.cur').forEach(o => o.classList.remove('cur')); b.classList.add('cur'); };
        banner(title); say(msg); stat();
        box.innerHTML = '';
        for (const [label, value, cls] of buttons) {
          const b = document.createElement('button');
          b.textContent = label;
          if (cls === 'danger') b.className = 'danger';
          b.onpointerenter = b.onfocus = () => point(b);
          b.onclick = () => { box.classList.add('off'); box.onkeydown = null; resolve(value); };
          box.appendChild(b);
        }
        // Arrow keys move the pointer around the two columns; Enter or Space picks.
        box.onkeydown = e => {
          const step = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -2, ArrowDown: 2}[e.key];
          if (!step) return;
          e.preventDefault();
          const all = [...box.children], next = all[all.indexOf(document.activeElement) + step];
          if (next) next.focus();
        };
        box.classList.remove('off');
        point(box.firstChild);
        box.firstChild.focus({preventScroll: true});
      });
    },
    // A word across the top of the stage, held for a moment: AMBUSH!
    async note(text, color) {
      if (!on()) return;
      banner(text);
      if (color) flash(color);
      await pause(850);
    },
    // Your move: step forward, the move lands (or not), step back.
    async act(cmd, kills, label, msg) {
      if (!on()) return;
      banner(label); say(msg);
      if (cmd === 'med') {
        fx(hero, 'heal', 600);
        pop(hero, `+${MED_HEAL}<small>HP</small>`, 'green');
        stat();
        return pause(750);
      }
      if (cmd === 'pocket') {   // nothing to see here
        pop(hero, 'HIDDEN', 'yellow');
        return pause(750);
      }
      if (cmd === 'run') {   // only shown when it failed
        fx(hero, 'lunge', 260);
        await pause(300);
        pop(hero, 'BLOCKED', 'yellow');
        return pause(600);
      }
      const wire = cmd === 'hack' || cmd === 'bomb' || cmd === 'zero';
      hero.classList.add('step');
      await pause(240);
      if (cmd === 'emp' || cmd === 'bomb') { flash(cmd === 'emp' ? '#00e5ff' : '#ff4fd8'); fx(stage, 'shake', 300); }
      const down = kills > 0 ? alive.splice(Math.max(0, alive.length - kills), kills) : [];
      for (const f of down) { fx(f, wire ? 'glitch' : 'hit', 450); pop(f, wire ? 'OFFLINE' : 'DOWN', 'yellow'); }
      if (!down.length && alive.length) pop(alive[alive.length - 1], 'MISS');
      await pause(430);
      for (const f of down) f.classList.add('dead');
      stat();
      await pause(down.length ? 520 : 250);
      hero.classList.remove('step');
      await pause(220);
    },
    // Their move: everyone still standing lunges, and a number comes off you if they connect.
    async hit(dmg, physical, stunned, msg) {
      if (!on()) return;
      banner(title); say(msg);
      if (stunned) {
        for (const f of alive) pop(f, 'STUNNED', 'yellow');
        return pause(750);
      }
      for (const f of alive) f.classList.add('lunge');
      await pause(230);
      if (dmg) {
        fx(hero, physical ? 'hit' : 'glitch', 450);
        fx(stage, 'shake', 300);
        pop(hero, `-${dmg}<small>${physical ? 'HP' : 'SEC'}</small>`, 'red');
      } else pop(hero, 'MISS');
      stat();
      await pause(260);
      for (const f of alive) f.classList.remove('lunge');
      await pause(dmg ? 480 : 380);
    },
    async win() {
      if (!on()) return;
      banner('VICTORY');
      fx(hero, 'cheer', 1050);
      await pause(1100);
    },
    async down() {
      if (!on()) return;
      hero.classList.add('ko');
      await pause(700);
    },
    // You leave the stage at a run, through smoke if you popped some.
    async flee(smoke) {
      if (!on()) return;
      if (smoke) flash('#c9d1d5');
      hero.classList.add('flee');
      await pause(480);
    },
  };
})();

// One confrontation. E: {kind: 'law' | 'gang' | 'raid' | 'thug', name, n, hit, lo, hi, tier, gang, intro, ambush}
// The music switches to the fight or raid theme for as long as it lasts.
async function fight(E) {
  SND.battle = E.kind === 'raid' ? 'raid' : 'fight';
  SND.play(E.kind === 'raid' ? 'hack' : 'alarm');
  try {
    const result = await fightRounds(E);
    await pocketOut(E);   // whatever went into the prison pocket comes back out now. Most of it.
    return result;
  } finally {
    BTL.close();
    SND.battle = null;
    SND.sync();
  }
}

async function fightRounds(E) {
  const total = E.n, law = E.kind === 'law', raid = E.kind === 'raid', thug = E.kind === 'thug', quiet = inSyn('ghost');
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;
  let n = E.n, violent = false, unhurt = true;
  const gotAway = () => { tally('law'); tally('escape'); if (used() >= 50) tally('smuggle'); };
  let msg = law ? `${E.name[0].toUpperCase() + E.name.slice(1)} has a lock on you: ${plural(n, 'agent')}.`
    : raid ? `You breach a ${E.name} node. ${plural(n, 'operator')} are jacked in and they see you.`
    : `${E.name} crackers are inside your rig: ${plural(n, 'intruder')}.`;
  const title = law ? `!! ${E.name.replace(/^the /, '').toUpperCase()} !!`
    : raid ? `RAID: ${E.name}` : thug ? `!! ${E.name.toUpperCase()} !!` : `!! ${E.name.toUpperCase()} ATTACK !!`;
  const hint = law
    ? 'Shooting, EMPs and running risk your Health. Hacking risks your OpSec and keeps your Heat down. Wiping the drive loses your goods but always escapes. Your prison pocket keeps a few small goods through a search, an arrest or a wipe.'
    : raid ? 'A remote fight: only hacking tools work and only your OpSec is at risk. Jack out any time to leave empty-handed.'
    : thug ? 'They are on you in person, so whatever you do, their hits land on your Health. Fight, run, pop smoke, or hand over some cash.'
    : 'Shooting, EMPs and running risk your Health. Hacking back risks your OpSec. Or pay them to go away.';
  let physical = thug;
  if (E.intro) msg = E.intro;

  // The hostiles' turn. Out in the open they hurt you; over the wire they hurt your rig. True when it finishes you.
  const strike = async (stunned, late) => {
    let dmg = 0;
    const theirAim = E.hit * (inSyn(HIDDEN_SYN) ? 0.75 : 1);   // the 404 are hard to pin down
    for (let i = 0; i < n && !stunned; i++) if (Math.random() < theirAim) dmg += rnd(E.lo, E.hi);
    if (dmg) unhurt = false;
    if (dmg) SND.play('hurt', late);
    if (dmg && physical) {
      // Armour soaks up part of it.
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('armor') / 100)));
      S.hp -= dmg;
      msg += ` <span class="red">${law ? 'They open fire' : 'They jump you'}: Health -${dmg}%.</span>`;
    } else if (dmg) {
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('firewall') / 100)));
      S.opsec -= dmg;
      msg += ` <span class="red">They ${law ? 'unmask part of your trail' : 'tear into your defences'}: OpSec -${dmg}%.</span>`;
    } else if (!stunned) {
      msg += ' Their attacks miss.';
    }
    await BTL.hit(dmg, physical, stunned, msg);
    return S.opsec <= 0 || S.hp <= 0;
  };

  BTL.open(E, title, hint);
  if (E.ambush) {
    // Caught flat-footed: they swing before you can do anything.
    await BTL.note('AMBUSH!', '#ff3b5c');
    msg += ' They get the first swing in.';
    if (await strike(false, 0.2)) { E.result = 'lost'; await BTL.down(); return lose(E); }
  }
  for (;;) {
    render();
    const W = WEAPONS[S.weapon], zeroDays = S.inv['Zero-Days'] || 0;
    const payoff = Math.max(500, Math.floor(S.cash * 0.2));
    const buttons = [];
    const round = usesAmmo(W) ? activeAmmo() : null;
    if (!raid && W) {
      buttons.push([!usesAmmo(W) ? `Use ${W[0]}` : round ? `Fire ${W[0]} (${AMMO[round][4]} x${S.ammo[round]})`
        : `Club them with ${W[0]} (no ammo)`, 'shoot']);
      if (usesAmmo(W) && Object.values(S.ammo).filter(q => q > 0).length > 1) buttons.push(['Change ammo', 'ammo']);
    }
    if (!raid && S.emp) buttons.push([`${GADGETS.emp[0]} (${S.emp})`, 'emp']);
    if (S.proxies) buttons.push([raid ? 'Hack them' : thug ? 'Hack their chrome' : 'Counter-hack', 'hack']);
    if (S.bomb) buttons.push([`${GADGETS.bomb[0]} (${S.bomb})`, 'bomb']);
    if (!raid && S.smoke) buttons.push([`${GADGETS.smoke[0]} (${S.smoke})`, 'smoke']);
    if (zeroDays) buttons.push([`Burn a Zero-Day (${zeroDays})`, 'zero']);
    if (S.medkits && S.hp < 100) buttons.push([`Medkit (${S.medkits})`, 'med']);
    buttons.push([raid ? 'Jack out' : 'Run', 'run']);
    if (law) buttons.push(['Wipe drive', 'wipe', 'danger']);
    if (law && pocketRoom(E) > 0 && pocketable().length) buttons.push([`Prison pocket (${pocketRoom(E)} free)`, 'pocket']);
    if ((E.kind === 'gang' || thug) && S.cash >= payoff) buttons.push([`${thug ? 'Hand over' : 'Pay them'} ${money(payoff)}`, 'pay']);
    const cmd = await BTL.menu(buttons, msg);

    if (cmd === 'ammo') { await pickAmmo(); continue; }   // swapping ammo does not cost a turn
    const hid = cmd === 'pocket' ? await pocketIn(E) : null;
    if (cmd === 'pocket' && !hid) continue;               // thought better of it: that does not cost a turn either
    let kills = 0, stunned = false;
    const hadRounds = !W || !usesAmmo(W) || !!activeAmmo();   // false when a gun is empty and gets swung instead
    const move = buttons.find(b => b[1] === cmd)[0].replace(/\s*\(.*$/, '');   // its name, for the banner over the stage
    physical = thug || (!raid && (cmd === 'shoot' || cmd === 'emp' || cmd === 'run' || cmd === 'med'));
    if (cmd === 'shoot' && usesAmmo(W) && !activeAmmo()) {
      // No rounds left: all you can do is swing the thing.
      if (Math.random() < 0.3 + bonus('aim') / 100) kills = 1;
      violent = true;
      heatUp(law ? 5 : 0);
      msg = kills ? `Click. Empty. You club one of them with the ${W[0]}.` : `Click. Empty. You swing the ${W[0]} and miss.`;
    } else if (cmd === 'shoot') {
      const kind = WTYPE[W[4]] || WTYPE.gun;
      const round = usesAmmo(W) ? activeAmmo() : null;                    // which ammo this volley uses
      const shots = round ? Math.min(W[2], S.ammo[round]) : W[2];
      const hit = W[3] + bonus('aim') / 100 + (round ? AMMO[round][2] / 100 : 0);   // better rounds hit more often
      for (let i = 0; i < shots; i++) if (Math.random() < hit) kills++;
      if (round) S.ammo[round] -= shots;
      kills = Math.min(n, kills);
      violent = true;
      heatUp(kind[law ? 2 : 3]);   // blades are silent, guns are loud
      stunned = W[4] === 'blunt' && kills > 0 && Math.random() < 0.4;
      msg = (kills ? `Your ${W[0]} drops ${kills} of them.` : `Your ${W[0]} misses.`) +
        (stunned && n - kills > 0 ? ' The rest are too rattled to hit back.' : '') +
        (round ? ` (${S.ammo[round]} ${AMMO[round][0]} left.)` : '');
    } else if (cmd === 'emp') {
      S.emp--;
      kills = Math.min(n, rnd(2, 3));
      violent = true;
      heatUp(law ? 6 : 2);
      msg = `The EMP fries ${kills} of them.`;
    } else if (cmd === 'bomb') {
      S.bomb--;
      kills = Math.min(n, rnd(2, 3));
      msg = `The logic bomb goes off in their systems: ${kills} knocked offline.`;
    } else if (cmd === 'smoke') {
      S.smoke--;
      log(`<span class="green">You vanished in a cloud of ${GADGETS.smoke[0]}.</span>` + gainXp(10));
      if (law) gotAway();
      E.result = 'fled';
      await BTL.flee(true);
      return alertDlg('Escaped', '<p>You pop the smoke and you are gone before it clears.</p>');
    } else if (cmd === 'hack') {
      for (let i = 0; i < S.proxies; i++) if (Math.random() < 0.4 + bonus('hack') / 100) kills++;
      kills = Math.min(n, kills);
      msg = thug ? `You push an overload into their implants: ${kills} dropped.`
        : `You hit back through your proxies: ${kills} knocked offline.`;
    } else if (cmd === 'med') {
      S.medkits--;
      S.hp = Math.min(100, S.hp + MED_HEAL);
      msg = `You jab a medkit: Health back to ${S.hp}%.`;
    } else if (cmd === 'zero') {
      removeItems('Zero-Days', 1);
      kills = Math.min(n, 2);
      msg = `The Zero-Day tears through their gear: ${kills} knocked offline.`;
    } else if (cmd === 'run') {
      const chance = raid ? 1
        : Math.max(0.25, Math.min(0.9, 0.55 + 0.05 * S.proxies - 0.07 * (n - 1) + bonus('speed') / 100));
      if (Math.random() < chance) {
        if (raid) {
          log(`You jacked out of the ${E.name} node empty-handed.`);
          return;
        }
        if (law) { S.heat = Math.max(0, S.heat - 10); gotAway(); }
        const how = thug ? ['You went over a fence and lost them in the alleys.', 'You go over a fence and lose them in the alleys.']
          : ['You hopped three networks and vanished.', 'You hop three networks and vanish.'];
        log(`<span class="green">${how[0]}</span>` + gainXp(law ? 20 : 10));
        E.result = 'fled';
        await BTL.flee();
        return alertDlg('Escaped', `<p>${how[1]}</p>`);
      }
      msg = 'They are still on you.';
    } else if (cmd === 'wipe') {
      S.inv = {}; S.cost = {};
      S.heat = Math.floor(S.heat / 2);
      log('<span class="amber">You nuked the drive. The trail went cold.</span>');
      E.result = 'fled';
      await BTL.flee();
      return alertDlg('Drive wiped', '<p>You nuke the drive. Nothing left to find. The trail goes cold.</p>');
    } else if (cmd === 'pocket') {
      msg = `You turn your back for a moment. ${num(hid.qty)} ${hid.name} ${hid.qty === 1 ? 'is' : 'are'} no longer on your drive, ` +
        'or anywhere else a warrant covers.';
    } else if (cmd === 'pay') {
      S.cash -= payoff;
      log(`<span class="amber">Paid ${E.name} ${money(payoff)} to back off.</span>`);
      return alertDlg('Paid off', `<p>${E.name} take ${money(payoff)} and ${thug ? 'melt back into the alleys' : 'log out'}. For now.</p>`);
    }

    // Sound for the move. A hack that lands gets the voice: "I'm in."
    const hacked = kills > 0 && (cmd === 'hack' || cmd === 'bomb' || cmd === 'zero');
    if (cmd === 'shoot') {
      if (!hadRounds) SND.play(kills ? 'thud' : 'miss');
      else for (let i = 0; i < Math.min(3, W[2]); i++) SND.play('shoot', i * 0.11);
    } else if (cmd === 'run') SND.play('miss');
    else if (FIGHT_FX[cmd]) SND.play(FIGHT_FX[cmd]);
    if (hacked) SND.play('imin', 0.5);

    await BTL.act(cmd, kills, move, msg);
    n -= kills;
    if (n <= 0) {
      SND.play('win', hacked ? 0.3 : 0);
      await BTL.win();
      let loot, xp;
      if (law) {
        loot = total * rnd(400, 1500) * (1 + Math.floor(S.day / 10));
        if (!violent) S.heat = Math.max(0, S.heat - 25);
        xp = gainXp(30 * total);
      } else if (raid) {
        loot = total * rnd(1500, 4000) * (1 + Math.floor(S.day / 6));
        S.grudge[E.gang] += 2;
        heatUp(quiet ? 5 : 10);
        xp = gainXp(40 * total);
      } else if (thug) {
        loot = total * rnd(300, 1200) * (1 + Math.floor(S.day / 10));   // street muscle carries less than a crew does
        xp = gainXp(25 * total);
      } else {
        loot = total * rnd(600, 2000) * (1 + Math.floor(S.day / 10));
        S.grudge[E.gang] += 1;
        xp = gainXp(30 * total);
      }
      loot = Math.round(loot * (1 + bonus('luck') / 100));
      S.cash += loot;
      if (law) {
        tally('law'); tally('lawwin');
        if (!violent) tally('cleanwin');
        if (E.tier >= 1) tally('fed');
        if (E.tier === 2) tally('nsawin');
      } else if (!thug) {
        tally('kills', total);
        if (raid) { tally('raid'); tally('loot', loot); questEvent('raidall', E.gang); } else tally('gangwin');
      }
      if (unhurt) tally('flawless');
      if (total >= 4) tally('bigwin');
      S.mood = 'grin';
      const what = law ? `You shook off ${E.name} and sold their tooling`
        : raid ? `You cleaned out a ${E.name} node`
        : thug ? `You left ${E.name} on the pavement and emptied their pockets`
        : `You beat back ${E.name} and drained their wallets`;
      log(`<span class="green">${what} for ${money(loot)}.</span>${xp}`);
      await alertDlg(raid ? 'Node looted' : 'You won', `<p>${what} for <b>${money(loot)}</b>.</p>` +
        (law || thug ? '' : `<p class="dim">${E.name} will remember this.</p>`));
      if (!law) {
        // Rival crews drop medkits and gear. Raids and higher levels drop better.
        if (S.medkits < MAX_MED && Math.random() < 0.3) {
          S.medkits++;
          log('You pocket a medkit they left behind.');
        }
        const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2] && !COOL[k]);
        if (spare.length && Math.random() < 0.25) {
          const k = pick(spare);
          S[k]++;
          log(`You also grab a ${GADGETS[k][0]} off them.`);
        }
        // Crews have their own Heat to manage, so now and then one of them was carrying something for it.
        const cover = Object.keys(COOL).filter(k => S[k] < GADGETS[k][2]);
        if (cover.length && Math.random() < 0.15) {
          const k = pick(cover);
          S[k]++;
          log(`One of them had a ${GADGETS[k][0]}. Had.`);
        }
        if (Math.random() < 0.4) {
          const k = pick(['budget', 'std', 'std', 'hollow', 'hollow', 'ap', 'smart']), found = rnd(5, 15);
          S.ammo[k] = Math.min(AMMO_MAX, S.ammo[k] + found);
          log(`You scoop up ${found} ${AMMO[k][0]}.`);
        }
        if (Math.random() < (raid ? 0.85 : 0.6)) {
          await dropLoot(E.name, Math.min(30, level()) * 0.5 + S.day * 0.3 + (raid ? 5 : 0));
        }
      }
      E.result = 'won';
      return;
    }

    if (await strike(stunned, 0.2)) { E.result = 'lost'; await BTL.down(); return lose(E); }
  }
}

const FIGHT_FX = {emp: 'emp', bomb: 'bomb', hack: 'hack', zero: 'hack', med: 'heal'};

// Health or OpSec hit zero.
async function lose(E) {
  SND.play('lose', 0.5);
  const hurt = S.hp <= 0;
  S.opsec = Math.max(0, S.opsec);
  S.hp = Math.max(0, S.hp);
  if (E.kind !== 'law') {
    // Rival crews rob you but don't end the run.
    const cash = Math.floor(S.cash * 0.35);
    S.cash -= cash;
    let goods = 0;
    for (const name of Object.keys(S.inv)) {
      const take = Math.ceil(S.inv[name] / 2);
      goods += take;
      removeItems(name, take);
    }
    S.opsec = Math.max(S.opsec, 40);
    let clinic = '';
    if (hurt) {
      // Beaten unconscious: a day in a back-room clinic.
      S.hp = 50;
      if (S.day < DAYS) { nextDay(); clinic = '<p>You wake up a day later in a back-room clinic, stitched up to 50% Health.</p>'; }
    }
    log(`<span class="red">${E.name} cleaned you out: ${money(cash)} and ${num(goods)} goods.</span>`);
    S.mood = 'ouch';
    render();
    return alertDlg(hurt ? 'Beaten and robbed' : 'Robbed',
      (hurt ? `<div class="posebox wide">${avatarSvg({pose: 'down'})}</div>` : '') + `<p>${E.name} ${hurt ? 'leave you on the floor' : 'own your rig'}. They take <b>${money(cash)}</b> and ` +
      `<b>${num(goods)}</b> of your goods${hurt ? '' : ' before you pull the plug'}.</p>${clinic}`, 'danger');
  }
  if (E.tier === 2) {
    S.busted = S.over = true;
    return;
  }
  // Police and Feds: goods seized, a fine, and time inside. The run goes on.
  const fine = Math.floor(S.cash * (E.tier ? 0.5 : 0.25)), days = E.tier ? 4 : 2;
  S.cash -= fine;
  S.inv = {}; S.cost = {};
  let served = 0;
  while (served < days && S.day < DAYS) { nextDay(); served++; }
  S.opsec = Math.max(S.opsec, E.tier ? 50 : 60);
  S.hp = Math.max(S.hp, 50);
  S.heat = E.tier ? 20 : 10;
  S.arrests = (S.arrests || 0) + 1;
  tally('arrest');
  log(`<span class="red">Arrested by ${E.name}: goods seized, ${money(fine)} fine, ${served} day${served === 1 ? '' : 's'} inside.</span>`);
  S.mood = 'ouch';
  render();
  await alertDlg('Arrested', `<div class="posebox">${avatarSvg({pose: 'busted', label: E.tier ? 'FED TASK FORCE' : 'METRO CYBER'})}</div>` +
    `<p>${E.name[0].toUpperCase() + E.name.slice(1)} ` +
    `${hurt ? 'drags you out on a stretcher' : 'kicks the door in'}.</p>` +
    `<p>Your goods are seized, you pay <b>${money(fine)}</b> and lose <b>${served} day${served === 1 ? '' : 's'}</b> ` +
    'before a lawyer gets you out. Your debt kept growing.</p>' +
    '<p class="dim">The cold wallet was never found.</p>', 'danger');
}

// ---------- end of run ----------
async function finish() {
  store.del('zdh-save');
  render();
  SND.play(S.busted || S.dead ? 'gone' : 'level');
  if (S.dead) {
    // The one way to die: leaving goods stuck in your prison pocket until the dysentery finishes it.
    await dialog('YOU HAVE DIED OF DYSENTERY', `<div class="posebox wide">${avatarSvg({pose: 'down'})}</div>` +
      `<p>Cause of death: <b class="red">${S.dead}</b>.</p>` +
      `<p>You went to sleep on day ${S.day - 1} with ${stuckList() || 'goods'} still stuck in your prison pocket, and did not get up. ` +
      `A street doc would have had them out in ten minutes.</p>` +
      '<p>The Fixer writes off the debt. The goods are recovered, bagged as evidence, and never spoken of again.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the dead.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  if (S.busted) {
    await dialog('VANISHED', `<div class="posebox">${avatarSvg({pose: 'vanished'})}</div>` + '<p>The NSA does not arrest people like you. A van you never noticed was parked outside all week.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the disappeared.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  const score = S.cash + S.wallet - S.debt;
  tally('runs');
  if (!S.arrests) tally('cleanrun');
  tally('score', score);
  gainXp(100 + Math.min(400, Math.sqrt(Math.max(0, score)) / 5));
  const ranks = [[0, 'Owned by the Fixer'], [50000, 'Script Kiddie'], [250000, 'Gray Hat'],
    [1000000, 'Elite Operator'], [10000000, 'Ghost in the Wire']];
  const rank = (ranks.find(([limit]) => score < limit) || [0, 'Legend of the Underground'])[1];
  let scores = (!AUTO && store.get('zdh-scores')) || [];
  if (!Array.isArray(scores)) scores = [];
  // A big score ends the run draped in gold.
  const summary = `<div class="posebox">${avatarSvg(score >= 250000 ? {pose: 'rich'}
    : {plain: true, mood: score < 50000 ? 'ouch' : 'grin'})}</div>` + `<p>Cash ${money(S.cash)} + wallet ${money(S.wallet)} - debt ${money(S.debt)}</p>` +
    `<p>Final score: <b class="green">${money(score)}</b><br>Run rating: <b class="cyan">${rank}</b><br>` +
    `XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`;
  if (scores.length < 10 || score > Math.min(...scores.map(s => s.score))) {
    const handle = (await askText('New high score!', summary + '<p>Your handle:</p>')) || 'anon';
    scores.push({handle: handle.slice(0, 16), score});
    scores = scores.sort((a, b) => b.score - a.score).slice(0, 10);
    if (!AUTO) store.set('zdh-scores', scores);
  }
  const hall = scores.map((s, i) =>
    `<tr><td>${i + 1}.</td><td>${esc(s.handle)}</td><td>${money(s.score)}</td></tr>`).join('');
  await dialog('Run complete', summary + `<p class="dim">HALL OF FAME</p><table class="hall">${hall}</table>`,
    [['New run', true, 'primary']]);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || busy || b.disabled) return;
  busy = true;
  try {
    await ACTIONS[b.dataset.act](b.dataset.arg);
    await flushNotes();
    if (S.over) { await finish(); newGame(); }
    await levelUpCheck();
  } finally {
    busy = false;
  }
  render();
  save();
});

// ---------- self test: open index.html#selftest to auto-play random games ----------
// The Heat items, step by step: each one does what its description says at low, middle and high Heat, every
// limit holds, the black market sells them from a short stock at the right price, and saves keep them.
async function coolSelfTest() {
  const run = S, random = Math.random, keys = Object.keys(COOL), TEXT = k => GADGETS[k][3];
  const fail = (what, ...more) => { throw new Error(`Heat item test: ${what} ` + JSON.stringify(more)); };
  // A new run at the Bunker, carrying the most of every Heat item.
  const fresh = (heat, o) => { newGame(); S.heat = heat; for (const k of keys) S[k] = GADGETS[k][2]; Object.assign(S, o || {}); };
  try {
    for (const k of keys) {
      if (!GADGETS[k] || !MISC_ART[k] || !miscIcon(k) || typeof ACTIONS[k] !== 'function' || !COOL_SAY[k]) fail('half defined', k);
    }
    // Run one action with the dice fixed: 0.99 never trips the Log Wiper's alarm, 0 always does.
    const roll = async (value, fn) => { Math.random = () => value; try { await fn(); } finally { Math.random = random; } };
    for (const heat of [6, 30, 39, 40, 55, 74, 75, 90, 100]) {
      for (const k of keys.filter(key => COOL[key].drop)) {

          Object.values(S.grudge).some(g => !(g >= 0)) || !!career.syn !== !!quest() || (career.quest && !(career.quest.p >= 0)) || !Number.isInteger(S.drive) || S.contracts.some(c => !(c.qty > 0 && c.payout > 0)) ||
          (S.gig && !(CONTACTS[S.gig.who] && S.gig.t > 0 && S.gig.p >= 0 && S.gig.cash > 0 && S.gig.xp > 0 && S.gig.due <= DAYS)) ||
          Object.values(career.rep || {}).some(n => !(n >= 0 && n <= TRUST_MAX)) ||
          S.heat < 0 || S.heat > 100 || S.opsec < 0 || S.opsec > 100 || S.day > DAYS || !Number.isInteger(S.heat) ||
          !(Number.isInteger(S.tricks) && S.tricks >= 0) || !(Number.isInteger(S.fx.vpn) && S.fx.vpn >= 0 && S.fx.vpn <= COOL.vpn.days) ||
          !(Number.isInteger(S.fx.decoy) && S.fx.decoy >= 0 && S.fx.decoy <= COOL.decoy.nights) ||
          Object.values(S.markets).some(m => m.cool && Object.values(m.cool).some(q => !(q >= 0 && q <= 2))) ||
          Object.values(S.inv).some(q => !(q > 0)) || [S.cash, S.wallet, S.debt].some(v => !Number.isInteger(v));
        if (bad) throw new Error('invariant broken: ' + JSON.stringify(S));
      }
      if (S.over) {
        finished++;
        if (S.dead && !(S.dead === 'dysentery' && S.sick === SICK_DAYS && stuckTotal() && S.hp === 0)) throw new Error('died of nothing');
        if (S.busted) busted++; else if (!S.dead) best = Math.max(best, S.cash + S.wallet - S.debt);
        await finish();
      }
    }
    // A run of any length must have been through the whole of the prison pocket at least once.
    if (games >= 20 && !(pocketTally && stuckTally && extractTally && tagSales && sickTally && deadTally)) {
      throw new Error('prison pocket not exercised: ' + [pocketTally, stuckTally, extractTally, tagSales, sickTally, deadTally]);
    }
    // ...and the bot must have bought Heat items, used them, and used some while the FBI or the NSA wanted it.
    if (games >= 20 && !(coolBuys > coolBase[0] && coolUses > coolBase[1] && coolHot)) {
      throw new Error('Heat items not exercised: ' + [coolBuys - coolBase[0], coolUses - coolBase[1], coolHot]);
    }
    document.title = 'SELFTEST OK';
    document.body.textContent = `SELFTEST OK heatitems=${coolUses - coolBase[1]} heatbuys=${coolBuys - coolBase[0]} heatalarms=${coolFires - coolBase[2]} finished=${finished} busted=${busted} best=${best} contracts=${contractsSeen} raids=${raids} quests=${questTally} junkies=${junkTally} achievements=${achTally} gigs=${gigTally} jumps=${jumpTally} bagswaps=${bagSwaps} nobag=${noBag} toofull=${fullTally}` +
      ` pockets=${pocketTally} stuck=${stuckTally} extracted=${extractTally} tagsales=${tagSales} sicknights=${sickTally} dysentery=${deadTally}`;
  } catch (err) {
    document.title = 'SELFTEST FAIL';
    document.body.textContent = 'SELFTEST FAIL ' + (err && err.stack || err);
  }
}

// ---------- save files and the start menu ----------
// Make save file n the one in use and load it. Returns true if it had a run in progress.
function loadSave(n) {
  slot = n;
  career = newCareer();
  pendingLevel = 0; logs = []; notes = [];
  const record = store.get('zdh-career');
  if (record && Number.isInteger(record.xp) && record.xp >= 0) {
    career = {xp: record.xp, syn: SYNDICATES[record.syn] ? record.syn : null, quest: record.quest,
      gear: record.gear && typeof record.gear === 'object' ? record.gear : {},
      bag: Array.isArray(record.bag) ? record.bag : [],
      locker: Array.isArray(record.locker) ? record.locker : [],
      stats: record.stats, ach: record.ach,
      rep: record.rep && typeof record.rep === 'object' ? record.rep : {}};
    if (record.look && typeof record.look === 'object') career.look = record.look;
    reslotCareer();   // gas masks are face items now, watches and braces go on the wrist
  }
  fixCareer();   // members from before the questlines start at mission 1
  saveCareer();
  const saved = store.get('zdh-save');
  if (!(saved && saved.prices && !saved.over)) { newGame(); return false; }
  S = saved;
  // Fill in anything a save from an older version lacks.
  S.contracts = S.contracts || [];
  S.hp = Number.isInteger(S.hp) ? S.hp : 100;
  S.medkits = S.medkits || 0;
  S.stash = S.stash || {};
  S.markets = S.markets || {};
  if (!Number.isInteger(S.trips)) S.trips = TRIPS_PER_DAY;
  if (S.loc !== BUNKER && S.prices) S.markets[S.loc] = S.markets[S.loc] ||
    {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop};
  S.stashCost = S.stashCost || {};
  starterGear();   // also hands a basic backpack to anyone from before there were backpacks
  if (!S.kit) {
    // A run from before backpacks had a flat drive of 100. Part of that now comes from the bag and the
    // pockets instead, so take it off the drive, but never more than they give back: nobody loads a save
    // and finds they can carry less than before. Nothing is taken out of the inventory either way.
    if (!Number.isInteger(S.drive)) S.drive = OLD_START_DRIVE;
    S.drive -= Math.min(OLD_START_DRIVE - START_DRIVE, bagHolds() + pocketsHold());
    S.kit = 1;
  }
  S.shop = S.shop || [];
  for (const k of ['stuck', 'stuckCost', 'tag', 'stashTag']) S[k] = S[k] && typeof S[k] === 'object' ? S[k] : {};
  S.sick = Number.isInteger(S.sick) ? S.sick : 0;
  fixTags();
  for (const m of [S, ...Object.values(S.markets)]) { reslot(m.shop); reslot(m.store); }
  if (S.armor && !career.gear.body) {
    // The old vest becomes a gear item.
    career.gear.body = {slot: 'body', rar: 1, name: 'Tuned Armoured Vest', stats: {armor: 15}};
  }
  delete S.armor;
  S.weapon = S.weapon || 0;
  for (const k of Object.keys(GADGETS)) S[k] = Number.isInteger(S[k]) && S[k] > 0 ? Math.min(S[k], GADGETS[k][2]) : 0;
  // Heat items arrived in 1.24: an older run has none running and no fast fixes used.
  S.fx = {vpn: Math.max(0, Math.min(COOL.vpn.days, Math.floor(fx().vpn) || 0)), decoy: Math.max(0, Math.min(COOL.decoy.nights, Math.floor(fx().decoy) || 0))};
  S.tricks = Number.isInteger(S.tricks) && S.tricks > 0 ? S.tricks : 0;
  S.ammo = Object.assign(noAmmo(), S.ammo);
  if (!AMMO[S.loaded]) S.loaded = 'std';
  S.store = S.store || [];
  S.grudge = Object.assign(noGrudges(), S.grudge);
  S.raided = !!S.raided;
  log('Run resumed.');
  return true;
}

// One line about a save file, read straight from storage without loading it.
function saveCard(n, meta) {
  const c = store.get('zdh-career', n) || {}, r = store.get('zdh-save', n);
  const lvl = levelInfo(Number.isInteger(c.xp) ? c.xp : 0).level;
  const crew = c.syn && SYNDICATES[c.syn] ? ` &middot; ${SYNDICATES[c.syn][0]}` : '';
  const run = r && r.prices && !r.over ? `Day ${r.day}/${DAYS} &middot; ${money((r.cash || 0) + (r.wallet || 0) - (r.debt || 0))} net`
    : 'between runs';
  const earned = c.ach && typeof c.ach === 'object' ? Object.keys(ACH).filter(id => c.ach[id]).length : 0;
  const when = meta.t ? new Date(meta.t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';
  return `<b>${esc(meta.name || 'anon')}</b> <span class="dim">save ${n}${n === slot ? ' &middot; in use' : ''}</span><br>` +
    `<span class="lvl" style="color:var(--magenta)">LVL ${lvl}</span> ${titleFor(lvl)}${crew}<br>` +
    `<span class="dim">${run} &middot; ${earned}/${Object.keys(ACH).length} achievements${when ? ` &middot; ${when}` : ''}</span>`;
}

function introText() {
  return `<p>You have <b>${DAYS} days</b>, ${money(S.cash)} and a ${money(START_DEBT)} debt to the Fixer ` +
    `that grows ${pct(debtRate())}% a day.</p>` +
    '<p>Buy low, sell high, and tunnel between spots. You get ' + TRIPS_PER_DAY + ' trips a day, and prices only change when ' +
    'you go home to the Bunker and sleep. That is the only thing that ends a day.</p>' +
    '<p><span class="amber">Freelance jobs</span> use up your goods on a job. If it works it pays more than selling.</p>' +
    '<p>You earn <span class="cyan">XP</span> across runs. At level 10 you can join a syndicate, and its missions are the fastest way to level from there.</p>' +
    '<p><span class="amber">Achievements</span> pay XP too. One of them is a secret, and it opens a door.</p>' +
    '<p>Now and then a junkie will be waiting where you surface, selling tools and gear far below shop prices. ' +
    'Street contacts turn up the same way with <span class="amber">gigs</span>: side jobs with a deadline that pay cash and XP, and more as they come to trust you.</p>' +
    '<p>Big deals raise your <span class="amber">Heat</span>, and Heat decides who hunts you: police, then the FBI, ' +
    'then the NSA. Rival syndicates will try to rob you too, and you can raid them back.</p>' +
    '<p>Sleeping cools Heat. So do the things the black market sells for it: burner phones, log wipers, decoy traffic, a VPN, ' +
    'a week of noodles. Each says what it does and what it costs you. They are in short supply, and none of them work once the fight has started.</p>' +
    '<p>Not everyone waiting where you surface is selling. Sometimes street muscle <span class="red">jumps you</span>: they are there in person, ' +
    'so their hits always land on your Health, and they may get the first swing in. Speed gear makes an ambush less likely to land.</p>' +
    '<p>When cornered you can shoot, hack, run or pay.Shootouts cost <span class="green">Health</span>, hack fights cost ' +
    '<span class="green">OpSec</span>; lose either and you go down. Gear, a street doc and an arms dealer are at the black market; guns, ammo and a clothing store are at the ' + GUN_SPOT + '.</p>' +
    '<p>Firearms need <span class="amber">ammo</span>, and better rounds hit more often.</p>' +
    '<p>Cornered by the law, you can hide a few small goods in your <span class="amber">prison pocket</span>. Sometimes they get stuck. ' +
    'See the street doc before you sleep on it too many times.</p>' +
    '<p>How much you can carry depends on what you wear: a <span class="amber">backpack</span> and anything with pockets. ' +
    'The amount on your Drive takes the colour of the bag on your back.</p>' +
    '<p><span class="cyan">The Bunker</span> is your hideout: stash goods, lock up gear and sleep there. Rival crews cannot ' +
    'reach you at home, but the law can raid it.</p>' +
    '<p class="dim">Only cash and your cold wallet count at the end.</p>';
}

// The start menu: continue, start a new game, load a save or delete one. Returns once a save is in use.
async function startMenu() {
  for (;;) {
    const list = saveList(), ids = Object.keys(list).map(Number).filter(n => n >= 1 && n <= MAX_SAVES).sort((a, b) => a - b);
    const last = Number(store.get('zdh-last')), full = ids.length >= MAX_SAVES;
    const html = '<p class="dim">// UNDERGROUND MARKET UPLINK</p>' +
      (ids.length ? `<p class="dim">SAVES ${ids.length}/${MAX_SAVES}: tap one to load it</p>` +
        ids.map(n => `<div class="syn pickable" data-pick="load:${n}">${saveCard(n, list[n])}</div>`).join('')
        : '<p>No saves yet. Start a new game.</p>') +
      (full ? `<p class="amber">All ${MAX_SAVES} save files are in use. Delete one to start a new game.</p>` : '');
    const buttons = [];
    if (slot && list[slot]) buttons.push(['Back to the game', 'back', 'primary']);
    else if (ids.includes(last)) buttons.push([`Continue: ${list[last].name || 'anon'}`, `load:${last}`, 'primary']);
    if (!full) buttons.push(['New game', 'new', buttons.length ? '' : 'primary']);
    if (ids.length) buttons.push(['Delete a save', 'del', 'small']);
    const choice = await dialog('ZERO DAY HUSTLE', html, buttons);
    if (choice === 'back') return;
    if (choice === 'new') {
      const name = (await askText('New game', `<p>Your handle for this save (${ids.length + 1} of ${MAX_SAVES}):</p>`)) || 'anon';
      slot = [1, 2, 3, 4, 5].find(n => !list[n]);
      career = newCareer();
      pendingLevel = 0; logs = []; notes = [];
      newGame();
      touchSave(name.slice(0, 16));
      saveCareer();
      save();
      render();
      await alertDlg('ZERO DAY HUSTLE', introText());
      if (!career.look) await ACTIONS.look();
      return;
    }
    if (choice === 'del') {
      const pickOne = await dialog('Delete a save', '<p>Which save? Its levels, gear, achievements and run are gone for good.</p>' +
        ids.map(n => `<div class="syn">${saveCard(n, list[n])}</div>`).join(''),
        ids.map(n => [`Delete ${list[n].name || 'anon'} (save ${n})`, n, 'danger']).concat([['Cancel', null, 'primary']]), 'danger');
      if (pickOne && await confirmDlg('Delete a save', `<p>Delete <b>${esc(list[pickOne].name || 'anon')}</b> (save ${pickOne})? This cannot be undone.</p>`,
        'Delete it', 'Keep it')) {
        store.del('zdh-career', pickOne);
        store.del('zdh-save', pickOne);
        delete list[pickOne];
        store.set('zdh-slots', list);
        if (pickOne === slot) slot = 0;   // the game behind the menu no longer exists: pick another or start one
      }
      continue;
    }
    if (String(choice).startsWith('load:')) {
      const n = Number(choice.slice(5));
      if (n !== slot) { if (slot) save(); loadSave(n); }
      touchSave();
      render();
      return;
    }
  }
}

// ---------- boot ----------
(async function boot() {
  // Loading screen: plays for a moment, or tap to skip. The game sets itself up underneath.
  const bootEl = $('#boot');
  const endBoot = () => { bootEl.classList.add('gone'); setTimeout(() => bootEl.remove(), 400); };
  // #selftest plays 200 random games; #selftest=30 plays 30.
  if (location.hash.startsWith('#selftest')) { bootEl.remove(); return selfTest(Number(location.hash.split('=')[1]) || 200); }
  bootEl.onclick = endBoot;
  setTimeout(endBoot, 2600);
  // Web version only: keep a copy for offline play.
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  adoptOldSave();
  newGame();   // something to draw behind the menu; nothing is saved until a save file is chosen
  render();
  busy = true;
  await startMenu();
  render();
  busy = false;
  save();
})();
</script>
