        (it ? `<b class="r${it.rar}">${it.name}</b>` : '<b class="dim">empty</b>') +
        (spare ? `<i>${spare} in bag to swap</i>` : '') + '</div>';
    }).join('');
    const slot = await dialog('Loadout', `<div class="stage">${avatarSvg()}${tags}</div>` +
      '<p class="dim">Tap a slot to see it and change what you are wearing there. Yellow slots have something in your bag.</p>',
      [['Back', null, 'primary']]);
    if (!slot) return;
    await swapSlot(slot);
  }
}

// One slot: what is worn there, and everything in the bag that could replace it.
async function swapSlot(slot) {
  const label = SLOTS[slot][0], worn = career.gear[slot];
  const options = career.bag.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
  // How a bag item's stats differ from the worn item's.
  const change = it => {
    const keys = [...new Set([...Object.keys(it.stats), ...Object.keys(worn ? worn.stats : {})])];
    const parts = keys.map(k => {
      const d = (it.stats[k] || 0) - ((worn && worn.stats[k]) || 0);
      return d ? `<span class="${d > 0 ? 'green' : 'red'}">${d > 0 ? '+' : ''}${d}${STATS[k][3]} ${STATS[k][0]}</span>` : '';
    }).filter(Boolean);
    return parts.length ? `<br><span class="dim">If you swap:</span> ${parts.join(', ')}` : '';
  };
  const html = `<p class="dim">WEARING</p><div class="syn">${worn ? itemHtml(worn) : 'Nothing'}</div>` +
    (options.length
      ? '<p class="dim">IN YOUR BAG: tap one to wear it</p>' + options.map(([it, i]) =>
        `<div class="syn pickable" data-pick="${i}">${itemHtml(it)}${change(it)}</div>`).join('')
      : `<p>Nothing in your bag fits the ${label.toLowerCase()} slot. Rival crews drop gear and the black market sells it.</p>`);
  const buttons = options.map(([it, i]) => [`Wear ${it.name}`, String(i), 'r' + it.rar, gearIcon(it)]);
  if (worn && career.bag.length < BAG_SIZE) buttons.push(['Take it off', 'off']);
  buttons.push(['Back', null, 'primary']);
  const choice = await dialog(`${label} slot`, html, buttons);
  if (choice === null) return;
  if (choice === 'off') {   // back into the bag, leaving the slot empty
    career.bag.push(worn);
    delete career.gear[slot];
    log(`Took off <span class="r${worn.rar}">${worn.name}</span>.`);
    saveCareer();
    render();
    return;
  }
  const index = Number(choice), it = career.bag[index];
  career.bag.splice(index, 1);
  if (worn) career.bag.push(worn);
  career.gear[slot] = it;
  log(`Now wearing <span class="r${it.rar}">${it.name}</span>.`);
  saveCareer();
  render();
}

// ---------- rendering ----------
function render() {
  const last = S.day >= DAYS;
  const li = levelInfo();
  $('#career').innerHTML = `<span class="lvl">LVL ${li.level}</span><span>${titleFor(li.level)}</span>` +
    `<span class="bar"><i style="width:${Math.floor(li.into / li.need * 100)}%"></i></span>` +
    `<span class="xp">${career.syn ? SYNDICATES[career.syn][0] : `${li.into}/${li.need} XP`}</span>`;
  const Q = quest();
  $('#jobs').innerHTML = (!Q ? '' : `<h3>${SYNDICATES[career.syn][0].toUpperCase()} MISSION</h3>` +
    `<div class="job quest"><div><div class="what">${Q.title}</div><div class="sub">${questGoal(Q)}</div>` +
    `<div class="sub"><span class="cyan">${questStatus(Q)}</span> &middot; pays ${questReward(Q)}</div></div>` +
    '<button data-act="syndicate">Briefing</button></div>') +
    (!S.contracts.length ? '' : '<h3>FREELANCE JOBS HERE TODAY</h3>') + S.contracts.map((c, i) => {
    const held = S.inv[c.good] || 0;
    return `<div class="job"><div><div class="what">${c.job}</div>
      <div class="sub">for ${c.client} &middot; uses ${num(c.qty)} ${c.good} (you hold ${num(held)})</div>
      <div class="sub"><span class="amber">pays ${money(payoutFor(c))}</span> &middot; ${chanceFor(c)}% chance</div></div>
      <button data-act="contract" data-arg="${i}"${held >= c.qty ? '' : ' disabled'}>Run job</button></div>`;
  }).join('');
  $('#dayloc').innerHTML = `DAY <b>${S.day}</b>/${DAYS} &middot; <span class="cyan">${S.loc}</span>` +
    ` &middot; <span class="${S.trips ? '' : 'red'}">${S.trips} trip${S.trips === 1 ? '' : 's'} left</span>` +
    (last ? ' <span class="amber">&middot; FINAL DAY: sell what you hold</span>' : '');
  const chips = [
    ['Cash', money(S.cash), 'green'], ['Wallet', money(S.wallet), ''],
    ['Debt', money(S.debt), S.debt ? 'red' : ''],
    ['Drive', `${used()}/${cap()}`, free() <= 0 ? 'amber' : ''],
    ['Heat', S.heat + '%', S.heat >= 60 ? 'red' : S.heat >= 30 ? 'amber' : ''],
    ['Proxies', S.proxies, ''],
    ['Weapon', WEAPONS[S.weapon] ? WEAPONS[S.weapon][0] : 'None', ''],
    ['Ammo', !usesAmmo(WEAPONS[S.weapon]) ? 'n/a' : activeAmmo() ? `${AMMO[activeAmmo()][4]} x${S.ammo[activeAmmo()]}` : 'EMPTY',
      usesAmmo(WEAPONS[S.weapon]) && !activeAmmo() ? 'red' : ''],
    ['Gadgets', Object.keys(GADGETS).filter(k => S[k]).map(k => `${S[k]} ${GADGETS[k][4]}`).join(' ') || 'None', ''],
    ['Armour', bonus('armor') + '%', ''],
    ['Medkits', S.medkits, ''],
    ['Wanted by', '&#9733;'.repeat(LAW[lawTier()].stars) + ' ' + LAW[lawTier()].short,
      lawTier() === 2 ? 'red' : lawTier() === 1 ? 'amber' : ''],
  ];
  $('#vitals').innerHTML = vitals();
  $('#ava').innerHTML = avatarSvg({bust: true, fill: true});
  $('#stats').innerHTML = chips.map(([k, v, cls]) =>
    `<div class="chip"><small>${k}</small><b class="${cls}">${v}</b></div>`).join('');
  $('#news').innerHTML = S.news.map(n => `<div>${n}</div>`).join('');
  $('#market').innerHTML = GOODS.map(([name]) => {
    const price = S.prices[name], held = S.inv[name] || 0, flag = S.flags[name];
    const priceHtml = price
      ? `<span class="${flag === 'up' ? 'amber' : flag === 'down' ? 'cyan' : ''}">` +
        `${flag === 'up' ? '&#9650; ' : flag === 'down' ? '&#9660; ' : ''}${money(price)}</span>`
      : '<span class="dim">no market</span>';
    let sub = '';
    if (held) {
      const cls = !price ? '' : price > S.cost[name] ? 'green' : price < S.cost[name] ? 'red' : '';
      sub = `<div class="sub ${cls}">holding ${num(held)} @ ${money(S.cost[name] || 0)}</div>`;
    }
    const canBuy = price && free() > 0 && S.cash >= price;
    const second = held && !price
      ? `<button class="danger" data-act="dump" data-arg="${name}">Dump</button>`
      : `<button data-act="sell" data-arg="${name}"${held && price ? '' : ' disabled'}>Sell</button>`;
    return `<div class="row"><div><div class="name">${name}</div>${sub}</div>
      <div class="price">${priceHtml}</div>
      <div class="btns"><button data-act="buy" data-arg="${name}"${canBuy ? '' : ' disabled'}>Buy</button>${second}</div></div>`;
  }).join('');
  let acts = '<button class="primary" data-act="travel">Tunnel out</button>';
  if (S.loc === BUNKER) {
    acts += `<button data-act="sleep">${last ? 'Sleep (end the run)' : 'Sleep (end the day)'}</button>` +
      '<button data-act="locker">Gear locker</button>';
  }
  if (last) acts += '<button data-act="cashout">End run &amp; cash out</button>';
  acts += `<button data-act="raid"${S.raided ? ' disabled' : ''}>Hack a rival</button>`;
  acts += `<button data-act="gearmenu">Gear (${career.bag.length} in bag)</button>`;
  acts += `<button data-act="achievements">Achievements (${achCount()}/${Object.keys(ACH).length})</button>`;
  if (S.medkits) acts += `<button data-act="medkit"${S.hp >= 100 ? ' disabled' : ''}>Use medkit (${S.medkits})</button>`;
  if (S.fakeid) acts += `<button data-act="fakeid"${S.heat <= 0 ? ' disabled' : ''}>Use ${GADGETS.fakeid[0]} (${S.fakeid})</button>`;
  if (GEAR_SPOTS.includes(S.loc)) acts += '<button data-act="gear">Black market</button><button data-act="dealer">Arms dealer</button>';
  if (S.loc === GUN_SPOT) {
    acts += `<button data-act="gunstore">${GUN_STORE} (guns, ammo)</button>` +
      `<button data-act="outfitter">${OUTFITTER} (clothing, armour)</button>`;
  }
  if (Object.values(S.ammo).some(q => q > 0)) acts += '<button data-act="ammo">Change ammo</button>';
  if (S.loc === HOME) acts += '<button data-act="broker">The Fixer (debt)</button><button data-act="wallet">Cold wallet</button>';
  $('#actions').innerHTML = acts;
  $('#log').innerHTML = logs.join('');
  if (S.loc === BUNKER) $('#market').innerHTML = stashHtml();   // at home the market panel becomes your stash
}

// ---------- actions ----------
const ACTIONS = {
  async buy(name) {
    const price = S.prices[name];
    if (!price) return;
    const most = Math.min(Math.floor(S.cash / price), free());
    if (most <= 0) return;
    const qty = await askQty(`Buy ${name}`, `<p>${money(price)} each. You can take up to ${num(most)}.</p>`,
      most, {unit: price, ok: 'Buy'});
    if (!qty) return;
    S.cash -= qty * price;
    addItems(name, qty, price);
    addHeat(qty * price);
    log(`Bought ${num(qty)} ${name} for ${money(qty * price)}.`);
  },

  async sell(name) {
    const price = S.prices[name], held = S.inv[name] || 0;
    if (!price || !held) return;
    const qty = await askQty(`Sell ${name}`,
      `<p>Buyers pay ${money(price)} each. You hold ${num(held)}, bought at ${money(S.cost[name] || 0)}.</p>`,
      held, {unit: price, ok: 'Sell'});
    if (!qty) return;
    const profit = (price - (S.cost[name] || 0)) * qty;
    S.cash += qty * price;
    removeItems(name, qty);
    addHeat(qty * price);
    const xp = profit > 0 ? gainXp(Math.min(60, Math.sqrt(profit) / 4)) : '';
    if (profit > 0) { tally('profit', profit); if (S.flags[name] === 'up') tally('spike'); }
    S.mood = profit > 0 ? 'grin' : profit < 0 ? 'ouch' : S.mood;
    log(`Sold ${num(qty)} ${name} for ${money(qty * price)} ` +
      `(<span class="${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${money(profit)}</span>).${xp}`);
  },

  async contract(index) {
    const c = S.contracts[index];
    if (!c || (S.inv[c.good] || 0) < c.qty) return;
    const chance = chanceFor(c), pay = payoutFor(c), price = S.prices[c.good];
    const compare = price ? `Selling them here instead would bring ${money(price * c.qty)}.` : 'Nobody is buying them here today.';
    if (!await confirmDlg('Freelance job', `<p><b>${c.job}</b>, for ${c.client}.</p>` +
      `<p>Uses up ${num(c.qty)} ${c.good}. Pays <span class="amber">${money(pay)}</span> if it works. ${compare}</p>` +
      `<p>Chance of success: <b>${chance}%</b></p>` +
      '<p class="dim">If it fails the goods are burned, your Heat jumps, and you may be traced. ' +
      'Levels and proxies raise the chance; Heat lowers it.</p>', 'Run the job', 'Walk away')) return;
    removeItems(c.good, c.qty);
    S.contracts.splice(index, 1);
    const quiet = inSyn('ghost'), heatWas = S.heat;
    if (Math.random() * 100 < chance) {
      S.cash += pay;
      S.mood = 'grin';
      S.heat = Math.min(100, S.heat + (quiet ? 4 : 8));
      const xp = gainXp(40 + (100 - c.chance));
      tally('jobs');
      if (heatWas < 30) tally('quietjob');
      log(`<span class="green">Freelance job done: ${c.client} paid ${money(pay)}.</span>${xp}`);
      await alertDlg('Job done', `<p>Clean work. ${c.client} pays <b>${money(pay)}</b>.</p>`);
    } else {
      S.heat = Math.min(100, S.heat + (quiet ? 8 : 15));
      S.mood = 'ouch';
      const xp = gainXp(10);
      log(`<span class="red">Freelance job blown: ${num(c.qty)} ${c.good} burned.</span>${xp}`);
      await alertDlg('Job blown', `<p>It goes sideways. The ${c.good} are burned and ${c.client} stops answering.</p>`, 'danger');
      if (Math.random() < 0.35) await lawEncounter();
    }
  },

  // Break into a rival syndicate's node for loot. Once a day.
  async raid() {
    if (S.raided) return;
    if (!S.proxies && !S.inv['Zero-Days']) {
      return alertDlg('Hack a rival', '<p>You need at least one proxy chain or a Zero-Day to breach a rival node.</p>' +
        `<p class="dim">Proxy chains are sold at the black market (${GEAR_SPOTS.join(', ')}).</p>`);
    }
    const mood = g => g >= 3 ? '<span class="red">out for blood</span>' : g >= 1 ? '<span class="amber">watching you</span>' : 'ignoring you';
    const crews = rivals();
    const html = '<p>Breach a rival node and drain it. One raid a day. It is a hacking fight: weapons are no use, ' +
      'and if they win they rob you instead.</p>' +
      crews.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b> &middot; ${mood(S.grudge[k])}</div>`).join('') +
      '<p class="dim">Every raid makes that crew more likely to come after you.</p>';
    const buttons = crews.map(k => [SYNDICATES[k][0], k]);
    buttons.push(['Not today', null, 'small']);
    const key = await dialog('Hack a rival', html, buttons);
    if (!key) return;
    S.raided = true;
    await fight({kind: 'raid', gang: key, name: SYNDICATES[key][0], n: rnd(2, 3 + Math.floor(S.day / 6)),
      hit: 0.3, lo: 3, hi: 8});
  },

  async medkit() {
    if (!S.medkits || S.hp >= 100) return;
    S.medkits--;
    S.hp = Math.min(100, S.hp + MED_HEAL);
    log(`Used a medkit: Health back to ${S.hp}%.`);
  },

  // Wear, swap and scrap gear.
  async gearmenu() {
    for (;;) {
      const totals = Object.keys(STATS).filter(k => bonus(k)).map(k => statLine(k, bonus(k)));
      const html = `<div class="avatarbox"><div class="zoomable" data-pick="zoom">${avatarSvg()}<small>tap to zoom</small></div><div>` +
        Object.entries(SLOTS).map(([slot, [label]]) => {
        const it = career.gear[slot];
        return `<div class="slotline" data-pick="slot:${slot}">${it ? gearIcon(it) : ''}<span><span class="dim">${label}</span><br>` + (it
          ? `<b class="r${it.rar}">${it.name}</b><br>${Object.entries(it.stats).map(([k, v]) => statLine(k, v)).join(', ')}`
          : '<span class="dim">empty</span>') + '</span></div>';
      }).join('') + '</div></div>' +
        `<p><b>Total bonuses:</b> ${totals.length ? totals.join(', ') : 'none yet'}</p>` +
        `<p class="dim">BAG ${career.bag.length}/${BAG_SIZE}. Tap an item to wear or scrap it. Gear drops from rival crews, ` +
        'is sold at the black market, and stays with you between runs.</p>' +
        `<p class="dim">${RARITY.map((name, i) => `<span class="r${i}">${name}</span>`).join(' &middot; ')}</p>`;
      const buttons = career.bag.map((it, i) => [it.name, i, 'r' + it.rar, gearIcon(it)]);
      buttons.push(['Change your look', 'look'], ['Close', null, 'primary']);
      const index = await dialog('Gear', html, buttons);
      if (index === null) return;
      if (index === 'look') { await ACTIONS.look(); continue; }
      if (index === 'zoom') { await inspectGear(); continue; }
      if (typeof index === 'string' && index.startsWith('slot:')) { await swapSlot(index.slice(5)); continue; }
      const it = career.bag[index], worn = career.gear[it.slot];
      const act = await dialog(it.name, `<div class="syn">${itemHtml(it)}</div>` +
        (worn ? `<p class="dim">Replaces what you are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
          : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
        [['Wear it', 'e', 'primary'], [`Scrap for ${money(scrapValue(it))}`, 's', 'danger'], ['Back', null, 'small']]);
      if (act === 'e') {
        career.bag.splice(index, 1);
        if (worn) career.bag.push(worn);
        career.gear[it.slot] = it;
      } else if (act === 's') {
        career.bag.splice(index, 1);
        S.cash += scrapValue(it);
        log(`Scrapped ${it.name} for ${money(scrapValue(it))}.`);
      }
      saveCareer();
      render();
    }
  },

  // Character creator: skin, hair and streak. Saved with the career.
  async look() {
    const sizes = {skin: SKINS.length, hair: HAIRSTYLES.length, col: HAIRCOLS.length, streak: STREAKS.length};
    for (;;) {
      const L = getLook();
      const cmd = await dialog('Your look', `<div class="posebox">${avatarSvg({plain: true})}</div>` +
        '<p class="dim">Tap a button to step through the choices. Your look stays with you between runs, ' +
        'and you can change it any time from the Gear screen.</p>',
        [[`Skin: ${SKINS[L.skin][0]}`, 'skin'], [`Hair: ${HAIRSTYLES[L.hair]}`, 'hair'],
          [`Hair colour: ${HAIRCOLS[L.col][0]}`, 'col'], [`Streak: ${STREAKS[L.streak][0]}`, 'streak'],
          ['Surprise me', 'any'], ['Done', null, 'primary']]);
      if (!cmd) break;
      if (cmd === 'any') for (const key of Object.keys(sizes)) L[key] = rnd(0, sizes[key] - 1);
      else L[cmd] = (L[cmd] + 1) % sizes[cmd];
      career.look = L;
      saveCareer();
    }
    career.look = getLook();
    saveCareer();
  },

  // --- the Bunker: stash goods, lock up gear, sleep ---
  async store(name) {
    const held = S.inv[name] || 0, most = Math.min(held, STASH_CAP - stashTotal());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Stash ${name}`, `<p>Move them off your drive into the Bunker. You carry ${num(held)}.</p>`,
      most, {ok: 'Store'});
    if (!qty) return;
    const had = S.stash[name] || 0;
    S.stashCost[name] = Math.floor(((S.stashCost[name] || 0) * had + (S.cost[name] || 0) * qty) / (had + qty));
    S.stash[name] = had + qty;
    removeItems(name, qty);
    log(`Stashed ${num(qty)} ${name} in the Bunker.`);
  },

  async take(name) {
    const had = S.stash[name] || 0, most = Math.min(had, free());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Take ${name}`, `<p>Load them back onto your drive. The stash holds ${num(had)}.</p>`,
      most, {ok: 'Take'});
    if (!qty) return;
    addItems(name, qty, S.stashCost[name] || 0);
    S.stash[name] = had - qty;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
    log(`Took ${num(qty)} ${name} out of the stash.`);
  },

  // Sleeping is the only thing that ends the day. The law may come in the night.
  async sleep() {
    if (S.loc !== BUNKER) return;
    if (S.day >= DAYS) return ACTIONS.cashout();
    if (!await confirmDlg('Sleep', '<p>Sleep in the Bunker and end the day? You recover 35% Health and 15% OpSec, and your Heat cools.</p>' +
      '<p class="dim">Rival crews can\'t find you here, but the hotter you are, the more likely the law kicks the door in overnight.</p>',
      'Go to sleep', 'Stay up')) return;
    if (S.heat < 20) tally('cool');
    if (S.heat <= 0) tally('zeroheat');
    nextDay();
    S.hp = Math.min(100, S.hp + 35);
    S.opsec = Math.min(100, S.opsec + 15);
    S.heat = Math.max(0, S.heat - 20);
    log(`Day ${S.day}: you slept in the Bunker. New prices everywhere.`);
    render();
    if (Math.random() < Math.min(0.5, 0.03 + S.heat / 200) * (inSyn('ghost') ? 0.7 : 1)) await homeRaid(true);
  },

  // Gear you are not carrying can wait in the Bunker's locker.
  async locker() {
    if (S.loc !== BUNKER) return;
    career.locker = career.locker || [];
    for (;;) {
      const list = (items, empty) => items.length
        ? items.map(it => `<div class="syn">${itemHtml(it)}</div>`).join('') : `<p class="dim">${empty}</p>`;
      const html = `<p class="dim">IN YOUR BAG ${career.bag.length}/${BAG_SIZE}</p>${list(career.bag, 'Your bag is empty.')}` +
        `<p class="dim">IN THE LOCKER ${career.locker.length}/${LOCKER_SIZE}</p>${list(career.locker, 'The locker is empty.')}` +
        '<p class="dim">The locker has a hidden compartment: raids never find it.</p>';
      const buttons = [];
      if (career.locker.length < LOCKER_SIZE) career.bag.forEach((it, i) => buttons.push([`Store ${it.name}`, 'b' + i, 'r' + it.rar, gearIcon(it)]));
      if (career.bag.length < BAG_SIZE) career.locker.forEach((it, i) => buttons.push([`Take ${it.name}`, 'l' + i, 'r' + it.rar, gearIcon(it)]));
      buttons.push(['Close', null, 'primary']);
      const choice = await dialog('Gear locker', html, buttons);
      if (!choice) return;
      const index = Number(choice.slice(1));
      if (choice[0] === 'b') career.locker.push(career.bag.splice(index, 1)[0]);
      else career.bag.push(career.locker.splice(index, 1)[0]);
      saveCareer();
      render();
    }
  },

  // The legal gun store: blunt weapons, blades and firearms, with a background check on the guns.
  async gunstore() {
    if (S.loc !== GUN_SPOT) return;
    await weaponShop(GUN_STORE, '"Welcome to Pew Pew Emporium! Everything in here is legal. Mostly."',
      ['blunt', 'blade', 'gun'], 1, false);
  },

  // The black-market arms dealer: firearms at a markup and military hardware, no questions asked.
  async dealer() {
    if (!GEAR_SPOTS.includes(S.loc)) return;
    await weaponShop('Arms dealer', 'A van with no plates. "No paperwork, no questions. The prices reflect that."',
      ['gun', 'heavy'], 1.4, true);
  },

  // Clothing and body armour, at the Strip Mall.
  async outfitter() {
    if (S.loc !== GUN_SPOT) return;
    await outfitShop();
  },

  async ammo() {
    await pickAmmo();
  },

  // Burn a fake identity to cool your Heat.
  async fakeid() {
    if (!S.fakeid || S.heat <= 0) return;
    S.fakeid--;
    tally('fakeid');
    S.heat = Math.max(0, S.heat - 40);
    log(`You burned a ${GADGETS.fakeid[0]}: Heat down to ${S.heat}%.`);
  },

  // Black market: weapons, gadgets, proxy chains, medkits and gear.
  async gear() {
    for (;;) {
      const scale = 1 + Math.floor(S.day / 10) * 0.5;
      const offers = [];
      for (const [key, [name, price, most, what]] of Object.entries(GADGETS)) {
        if (S[key] < most) offers.push({key: 'x' + key, gadget: key, art: key, name, price: Math.round(price * scale),
          text: `single use: ${what} (you have ${S[key]})`});
      }
      if (S.proxies < MAX_PROXIES) offers.push({key: 'p', art: 'proxy', name: 'Proxy chain', price: Math.round(1500 * (1 + S.proxies) * scale),
        text: `for hacking back, raids and freelance jobs (you have ${S.proxies})`});
      if (S.medkits < MAX_MED) offers.push({key: 'm', art: 'medkit', name: 'Medkit', price: Math.round(600 * scale),
        text: `restores ${MED_HEAL}% Health any time, even mid-fight (you have ${S.medkits})`});
      S.shop.forEach((it, i) => offers.push({key: 'g' + i, name: it.name, price: Math.round(itemValue(it) * scale),
        item: it, cls: 'r' + it.rar}));
      if (S.hp < 100) offers.push({key: 'd', art: 'doc', name: 'Street doc', price: Math.round((100 - S.hp) * 40 * scale),
        text: `patches you up from ${S.hp}% to full Health`});
      const html = `<p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
        (offers.length ? offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">` +
          `${money(o.price)}</span>${o.item ? itemHtml(o.item) : withIcon(miscIcon(o.art), `<b>${o.name}</b><br>${o.text}`)}</div>`).join('')
          : '<p>You already own everything they sell.</p>') +
        `<p class="dim">Looking for weapons? The arms dealer is right here, and ${GUN_STORE} is at the ${GUN_SPOT}.</p>`;
      const buttons = offers.filter(o => S.cash >= o.price)
        .map(o => [o.key === 'd' ? 'See the street doc' : `Buy ${o.name}`, o.key, o.cls, o.item ? gearIcon(o.item) : miscIcon(o.art)]);
      buttons.push(['Leave', null, 'small']);
      const key = await dialog('Black market', html, buttons);
      if (!key) return;
      const o = offers.find(x => x.key === key);
      S.cash -= o.price;
      if (o.gadget) S[o.gadget]++;
      else if (key === 'm') S.medkits++;
      else if (key === 'd') S.hp = 100;
      else if (o.item) { S.shop.splice(S.shop.indexOf(o.item), 1); stash(o.item); saveCareer(); }
      else S.proxies++;
      log(key === 'd' ? `The street doc patched you up for ${money(o.price)}.` : `Bought: ${o.name} for ${money(o.price)}.`);
      render();
    }
  },

  async profile() {
    const li = levelInfo();
    let html = `<p>Level <b>${li.level}</b>: <span class="cyan">${titleFor(li.level)}</span><br>` +
      `${li.into} / ${li.need} XP to the next level (${num(career.xp)} total)</p>` +
      '<p class="dim">XP comes from profitable sales, freelance jobs, escaping or beating the law and rival crews, raids, clearing your debt, ' +
      'finishing a run and, most of all, syndicate missions. It carries over between runs.</p>' +
      '<p class="dim">Cyberware shows on your avatar as you level: ' + WARE.map(([at, what]) =>
        `<span class="${li.level >= at ? 'cyan' : ''}">${what} (${at})</span>`).join(', ') + '.</p>';
    const buttons = [['Close', null, 'primary']];
    buttons.unshift([`Achievements (${achCount()}/${Object.keys(ACH).length})`, 'ach']);
    if (career.ach[KEY_ACH] && !inSyn(HIDDEN_SYN) && career.syn) buttons.unshift(['Answer the unknown sender', 'hidden']);
    if (career.syn) {
      html += `<div class="syn"><b>${SYNDICATES[career.syn][0]}</b><br>${SYNDICATES[career.syn][1]}</div>`;
      buttons.unshift(['Syndicate missions', 'quest']);
    } else if (li.level >= 10) {
      html += '<p>You can join a syndicate. Each one has its own line of missions that pay big XP.</p>';
      buttons.unshift(['Choose a syndicate', 'join']);
    } else {
      html += '<p>Syndicates recruit at <b>level 10</b>, and each has its own line of missions.</p>';
    }
    const choice = await dialog('Your record', html, buttons);
    if (choice === 'join') await chooseSyndicate();
    else if (choice === 'quest') await ACTIONS.syndicate();
    else if (choice === 'ach') await ACTIONS.achievements();
    else if (choice === 'hidden') await hiddenInvite();
  },

  async achievements() {
    const ids = Object.keys(ACH);
    const html = `<p><b>${achCount()}</b> of ${ids.length} earned. Each one pays XP, and they belong to this save.</p>` +
      ids.map(id => {
        const [name, how, xp, , secret] = ACH[id], got = career.ach[id];
        return `<div class="syn"><b style="color:var(--${got ? 'yellow' : 'dim'})">${got ? '&#10003; ' : ''}${secret && !got ? '???' : name}</b> ` +
          `<span class="cyan">+${xp} XP</span><br><span class="${got ? '' : 'dim'}">${secret && !got ? 'A secret. Somebody is watching how you deal with the people who watch everyone.' : how}</span></div>`;
      }).join('');
    await dialog('Achievements', html, [['Close', null, 'primary']]);
  },

  // Back to the start menu, to switch to another save or start a new one.
  async menu() {
    save();
    await startMenu();
  },

  // Your syndicate's mission: the briefing, how far along you are, and anything you do from here
  // (handing over a delivery, starting the final breach).
  async syndicate() {
    const Q = quest();
    if (!Q) return;
    const key = career.syn, chain = QUESTS[key], q = career.quest, foe = NEMESIS[key];
    const held = S.inv[Q.good] || 0;
    let html = `<p class="dim">${SYNDICATES[key][0].toUpperCase()} &middot; handler: ${HANDLER[key]}</p>` +
      `<div class="syn"><b>${Q.order ? 'Standing orders' : `Mission ${q.n + 1} of ${chain.length}: ${Q.title}`}</b><br>"${Q.brief}"</div>` +
      `<p><b>${questGoal(Q)}</b><br><span class="cyan">${questStatus(Q)}</span></p><p>Reward: ${questReward(Q)}</p>`;
    const buttons = [];
    if (Q.kind === 'deliver') {
      if (S.loc === Q.place && held >= Q.t) buttons.push([`Hand over ${Q.t} ${Q.good}`, 'give', 'primary']);
      else html += `<p class="dim">${S.loc === Q.place ? `You are at ${Q.place}, but you need ${Q.t} ${Q.good} on your drive.`
        : `Carry ${Q.t} ${Q.good} to ${Q.place}, then open this briefing there to hand them over.`}</p>`;
    } else if (Q.kind === 'boss') {
      html += `<p class="dim">A hacking fight against the ${SYNDICATES[foe][0]} core: 7 operators, and they hit harder than a normal node. ` +
        'Only hacking tools work (proxies, Logic Bombs, Zero-Days). It uses up today\'s raid, and you can try again another day.</p>';
      if (S.raided) html += '<p class="amber">You have already raided today. Sleep first.</p>';
      else if (!S.proxies && !S.inv['Zero-Days']) html += '<p class="amber">You need at least one proxy chain or a Zero-Day to breach it.</p>';
      else buttons.push(['Launch the breach', 'boss', 'danger']);
    }
    html += '<p class="dim" style="margin-top:12px">THE LINE</p>' + chain.map((m, i) =>
      `<div class="${i < q.n ? 'green' : i === q.n ? 'cyan' : 'dim'}">${i < q.n ? '&#10003;' : i === q.n ? '&#9656;' : '&middot;'} ` +
      `${i + 1}. ${i <= q.n ? m[0] : '???'}</div>`).join('') +
      (q.n >= chain.length ? `<div class="cyan">&#9656; Standing orders (${q.n - chain.length} done)</div>` : '');
    buttons.push(['Close', null, buttons.length ? '' : 'primary']);
    const choice = await dialog('Syndicate mission', html, buttons);
    if (choice === 'give' && (S.inv[Q.good] || 0) >= Q.t) {
      removeItems(Q.good, Q.t);
      tally('deliver', Q.t);
      log(`Handed ${Q.t} ${Q.good} to ${SYNDICATES[key][0]} at ${Q.place}.`);
    } else if (choice === 'boss') {
      S.raided = true;
      const E = {kind: 'raid', gang: foe, name: SYNDICATES[foe][0], n: 7, hit: 0.34, lo: 4, hi: 9,
        intro: `You are inside the ${SYNDICATES[foe][0]} core. 7 of their best operators are jacked in, and they were expecting someone.`};
      await fight(E);
      if (E.result === 'won') tally('boss');
    }
  },

  async dump(name) {
    const held = S.inv[name] || 0;
    if (!held) return;
    const qty = await askQty(`Dump ${name}`, '<p>No buyers here. Wipe them to free drive space?</p>',
      held, {ok: 'Wipe'});
    if (!qty) return;
    removeItems(name, qty);
    log(`Securely wiped ${num(qty)} ${name}.`);
  },

  // Travelling does not end the day; only sleeping at the Bunker does. You get a set number of
  // trips each day, and the trip home is always free.
  async travel() {
    const tired = S.trips <= 0;
    if (tired && S.loc === BUNKER) {
      return alertDlg('Worn out', '<p>You have no trips left today. Sleep to start a new day.</p>');
    }
    const others = LOCATIONS.filter(l => l !== S.loc && (!tired || l === BUNKER));
    const buttons = others.map(l =>
      [l === HOME ? l + ' (Fixer, wallet)' : l === BUNKER ? l + ' (your hideout, free trip)'
        : GEAR_SPOTS.includes(l) ? l + ' (black market, arms dealer)' : l === GUN_SPOT ? l + ' (guns, ammo, clothing)' : l, l]);
    buttons.push(['Stay here', null, 'small']);
    const dest = await dialog('Tunnel out', tired
      ? '<p>You are worn out: no trips left today. You can still make it home to the Bunker to sleep.</p>'
      : `<p>Where to? You have <b>${S.trips}</b> trip${S.trips === 1 ? '' : 's'} left today. Prices stay put until you ` +
        'sleep at the Bunker, and the trip home is always free.</p>', buttons);
    if (!dest) return;
    await travelFx(S.loc, dest);
    S.loc = dest;
    if (dest !== BUNKER) {
      S.trips--;
      awayRaid(Math.min(0.08, S.heat / 1200));
    }
    rollMarket();
    log(`You surface at ${dest}.`);
    render();
    await randomEvent();
  },

  async cashout() {
    const warn = used() ? '<p class="amber">You are still holding goods. They count for nothing at the end.</p>' : '';
    if (await confirmDlg('Final day', warn + '<p>End the run and cash out?</p>', 'Cash out', 'Not yet')) S.over = true;
  },

  async broker() {
    const cmd = await dialog('The Fixer',
      `<p>You owe <span class="red">${money(S.debt)}</span>, growing ${pct(debtRate())}% a day.</p>`,
      [['Pay down', 'p', 'primary'], ['Borrow', 'b'], ['Leave', null, 'small']]);
    if (cmd === 'p') {
      const most = Math.min(S.cash, S.debt);
      if (most <= 0) return alertDlg('The Fixer', '<p>Nothing to pay, or nothing to pay with.</p>');
      const amt = await askQty('Pay down debt', '<p>How much?</p>', most, {cash: true, ok: 'Pay'});
      if (!amt) return;
      S.cash -= amt; S.debt -= amt;
      if (S.debt) {
        log(`Paid the Fixer ${money(amt)}.`);
      } else {
        const xp = S.cleared ? '' : gainXp(50);
        S.cleared = true;
        tally('debt');
        log(`<span class="green">You are clear with the Fixer!</span>${xp}`);
      }
    } else if (cmd === 'b') {
      const most = DEBT_LIMIT - S.debt;
      if (most <= 0) return alertDlg('The Fixer', '<p>"You\'re at your limit. Pay something back first."</p>');
      const amt = await askQty('Borrow', '<p>"Don\'t make us come looking for you."</p>', most, {cash: true, ok: 'Borrow'});
      if (!amt) return;
      S.cash += amt; S.debt += amt;
      log(`Borrowed ${money(amt)} from the Fixer.`);
    }
  },

  async wallet() {
    const cmd = await dialog('Cold wallet',
      `<p>Balance: ${money(S.wallet)}. Earns ${pct(walletRate())}% a day and can't be phished.</p>`,
      [['Deposit', 'd', 'primary'], ['Withdraw', 'w'], ['Leave', null, 'small']]);
    if (cmd === 'd') {
      if (S.cash <= 0) return alertDlg('Cold wallet', '<p>You have no cash to deposit.</p>');
      const amt = await askQty('Deposit', '<p>How much?</p>', S.cash, {cash: true, ok: 'Deposit'});
      if (!amt) return;
      S.cash -= amt; S.wallet += amt;
      log(`Moved ${money(amt)} into cold storage.`);
    } else if (cmd === 'w') {
      if (S.wallet <= 0) return alertDlg('Cold wallet', '<p>The wallet is empty.</p>');
      const amt = await askQty('Withdraw', '<p>How much?</p>', S.wallet, {cash: true, ok: 'Withdraw'});
      if (!amt) return;
      S.wallet -= amt; S.cash += amt;
      log(`Pulled ${money(amt)} out of cold storage.`);
    }
  },

  async restart() {
    if (await confirmDlg('New run', '<p>Abandon this run and start over?</p>', 'Start over', 'Cancel')) newGame();
  },
};

function nextDay() {
  S.day += 1;
  S.debt = Math.ceil(S.debt * (1 + debtRate()));
  const banked = S.wallet;
  S.wallet = Math.floor(S.wallet * (1 + walletRate()));
  if (S.wallet > banked) tally('interest', S.wallet - banked);
  S.heat = Math.max(0, S.heat - HEAT_DECAY);
  S.raided = false;
  S.mood = '';
  S.hp = Math.min(100, S.hp + 3 + bonus('regen'));
  S.trips = TRIPS_PER_DAY;
  S.markets = {};
  rollMarket();
  if (S.loc !== BUNKER) awayRaid(Math.min(0.25, S.heat / 400));   // days spent locked up or in a clinic
}

// While you are out, the law may raid the Bunker and take whatever is stashed there.
function awayRaid(chance) {
  if (stashTotal() && Math.random() < chance * (inSyn('ghost') ? 0.7 : 1)) {
    const who = LAW[lawTier()].name, lost = seizeStash(1);
    log(`<span class="red">${who[0].toUpperCase() + who.slice(1)} raided the Bunker while you were out: ${num(lost)} stashed goods seized.</span>`);
    notes.push(['Bunker raided', `<p>${who[0].toUpperCase() + who.slice(1)} hit the Bunker while you were out.</p>` +
      `<p>Everything in the stash is gone: <b>${num(lost)}</b> goods seized. Your gear locker's hidden compartment was not found.</p>` +
      '<p class="dim">The higher your Heat, the more likely a raid.</p>']);
  }
}

// ---------- the Bunker ----------
let notes = [];   // things that happened off-screen, shown as pop-ups after the current action
async function flushNotes() {
  while (notes.length) {
    const [title, html] = notes.shift();
    render();
    await alertDlg(title, html, 'danger');
  }
}
const stashTotal = () => Object.values(S.stash).reduce((a, b) => a + b, 0);

// The law takes a share of the stash (1 = all of it). Returns how many goods went.
function seizeStash(share) {
  let lost = 0;
  for (const name of Object.keys(S.stash)) {
    const take = Math.ceil(S.stash[name] * share);
    lost += take;
    S.stash[name] -= take;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
  }
  return lost;
}

function stashHtml() {
  const total = stashTotal();
  const names = GOODS.map(g => g[0]).filter(n => S.inv[n] || S.stash[n]);
  return `<div class="row"><div><div class="name cyan">THE BUNKER &middot; stash ${num(total)}/${STASH_CAP}</div>` +
    '<div class="sub">Store goods here to free up your drive. Rival crews can\'t touch you at home, but the law can raid ' +
    'the place whether you are in or out, and they take the stash.</div></div></div>' +
    (names.length ? names.map(n => `<div class="row"><div><div class="name">${n}</div>` +
      `<div class="sub">carrying ${num(S.inv[n] || 0)} &middot; stashed ${num(S.stash[n] || 0)}</div></div><div></div>` +
      `<div class="btns"><button data-act="store" data-arg="${n}"${S.inv[n] && total < STASH_CAP ? '' : ' disabled'}>Store</button>` +
      `<button data-act="take" data-arg="${n}"${S.stash[n] && free() > 0 ? '' : ' disabled'}>Take</button></div></div>`).join('')
      : '<div class="row"><div class="sub">Nothing to store yet. Bring goods here to keep them off your drive.</div></div>');
}

// The law comes to the Bunker while you are in it. Beat them and the stash is safe;
// slip away and they take half; get arrested and they take all of it.
async function homeRaid(asleep) {
  const tier = lawTier(), L = LAW[tier], who = L.name[0].toUpperCase() + L.name.slice(1);
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  const E = {kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi,
    intro: asleep ? `You wake to boots on the stairs. ${who} is raiding the Bunker: ${n} agent${n === 1 ? '' : 's'}.`
      : `${who} has the Bunker surrounded: ${n} agent${n === 1 ? '' : 's'}.`};
  await fight(E);
  if (S.busted || !stashTotal()) return;
  if (E.result === 'won') {
    log('<span class="green">The Bunker held. Your stash is safe.</span>');
    return;
  }
  const lost = seizeStash(E.result === 'lost' ? 1 : 0.5);
  log(`<span class="red">${who} searched the Bunker: ${num(lost)} stashed goods seized.</span>`);
  render();
  await alertDlg('Bunker searched', `<p>${who} tears the Bunker apart${E.result === 'lost' ? '' : ' after you slip away'}.</p>` +
    `<p><b>${num(lost)}</b> stashed goods seized${E.result === 'lost' ? '' : ' (half the stash)'}.</p>`, 'danger');
}

// ---------- events ----------
async function randomEvent() {
  // These odds are per trip. There are several trips in a day, so each one is fairly small.
  if (Math.random() < Math.min(0.25, 0.03 + S.heat / 600) * (inSyn('ghost') ? 0.7 : 1)) {
    return S.loc === BUNKER ? homeRaid(false) : lawEncounter();
  }
  // Rival syndicates come after you more often the more you have crossed them. Never at the Bunker.
  const crews = rivals(), anger = crews.reduce((sum, k) => sum + S.grudge[k], 0);
  if (S.loc !== BUNKER && Math.random() < Math.min(0.15, 0.02 + 0.015 * anger)) {
    let roll = Math.random() * (anger + crews.length);
    const key = crews.find(k => (roll -= S.grudge[k] + 1) < 0) || crews[0];
    return gangEncounter(key);
  }
  if (S.loc !== BUNKER && Math.random() < JUNKIE_ODDS) return junkie();
  if (Math.random() < 0.5) return;   // most trips are uneventful
  const r = Math.random();
  if (r < 0.10) {
    const name = GOODS[rnd(3, GOODS.length - 1)][0];
    const qty = Math.min(rnd(2, 8), free());
    if (qty > 0) {
      addItems(name, qty, 0);
      log(`<span class="cyan">Found an unlocked laptop in a ride share: ${qty} ${name}!</span>`);
      await alertDlg('Lucky find', `<p>Someone left an unlocked laptop in a ride share. You lift <b>${qty} ${name}</b>.</p>`);
    }
  } else if (r < 0.18) {
    const price = rnd(400, 1200) * (1 + Math.floor(S.day / 8));
    if (S.cash >= price && await confirmDlg('Drive upgrade',
      `<p>A hardware hacker offers an encrypted drive upgrade: <b>+50 slots</b> for ${money(price)}.</p>`, 'Buy it', 'Pass')) {
      S.cash -= price; S.drive += 50;
      log(`Drive upgraded to ${cap()} slots.`);
    }
  } else if (r < 0.27) {
    const price = rnd(700, 1500) * (1 + S.proxies);
    if (S.cash >= price && S.proxies < MAX_PROXIES && await confirmDlg('Proxy chain',
      `<p>A sysadmin with a grudge will sell you a proxy chain for ${money(price)}.</p>` +
      '<p class="dim">Proxies help you slip traces and let you counter-hack.</p>', 'Buy it', 'Pass')) {
      S.cash -= price; S.proxies += 1;
      log(`Proxy chain added. You now run ${S.proxies}.`);
    }
  } else if (r < 0.33) {
    if (S.cash > 100) {
      const loss = Math.floor(S.cash * rnd(10, 25) / 100);
      S.cash -= loss;
      S.mood = 'ouch';
      tally('phished');
      log(`<span class="red">Phished! Lost ${money(loss)} from your hot wallet.</span>`);
      await alertDlg('Phished', `<p>You clicked a link. YOU. Someone drained <b>${money(loss)}</b> from your hot wallet.</p>` +
        '<p class="dim">Cash in the cold wallet is safe from this.</p>', 'danger');
    }
  } else if (r < 0.40) {
    if (S.opsec < 100) {
      const price = (100 - S.opsec) * rnd(20, 45);
      if (S.cash >= price && await confirmDlg('OpSec audit',
        `<p>An old-timer offers a full OpSec audit for ${money(price)}. Restores OpSec to 100%.</p>`, 'Pay', 'Pass')) {
        S.cash -= price; S.opsec = 100;
        log('OpSec restored to 100%.');
      }
    }
  }
}

// ---------- junkies ----------
// Now and then a junkie is waiting where you surface, selling whatever they have lifted for a
// fraction of the going rate. Each one carries different kinds of things, and each thing sells once.
const JUNKIE_ODDS = 0.12, JUNKIE_RATE = [25, 45];   // chance per trip, and their price as a % of the shop price
// [name, what they say, what they carry (see junkOffer), skin, hair colour, hat, coat]
const JUNKIES = [
  ['Twitch', 'A twitchy kid with a backpack full of blinking boards. "Tools, man. Good tools. I just need bus fare."',
    ['gadget', 'gadget', 'proxy', 'gadget', 'drive'], 0, 4, 0, 1],
  ['Needles', 'A hollow-eyed ex-medic opens a coat lined with stolen hospital stock. "All sterile. Mostly."',
    ['medkit', 'medkit', 'gadget', 'gear', 'medkit'], 2, 1, 4, 6],
  ['Brass', 'His jacket rattles when he walks: loose rounds in every pocket. "Fell off a truck. A police truck."',
    ['ammo', 'ammo', 'weapon', 'ammo', 'weapon'], 3, 2, 1, 4],
  ['Ragpicker', 'She pushes a shopping trolley of clothes with the store tags still on. "Your size. Everything is your size."',
    ['gear', 'gear', 'gear', 'medkit', 'gear'], 4, 5, 0, 7],
  ['Dumpster Dave', 'A man climbs out of the skip behind a datacenter with an armful of drives. "They throw out the good stuff."',
    ['goods', 'goods', 'drive', 'proxy', 'goods'], 1, 3, 4, 2],
  ['Glitch', 'Someone in a tinfoil hat is selling things off a blanket. No two of them belong together.',
    ['weapon', 'gadget', 'gear', 'ammo', 'goods', 'proxy'], 5, 6, 4, 0],
];

function junkieSvg(J) {
  const [name, , , skin, col, hat, coat] = J, c = '#8a8fa8';
  const F = {look: {skin, hair: 2, col, streak: 4}, level: 1, weapon: 0, hp: 50, mood: '',
    gear: {head: {kind: hat, c, rar: 0}, body: {kind: coat, c, rar: 0}, hands: null, feet: null, deck: null}};
  return `<svg class="avatar foe" viewBox="50 0 100 116" role="img" aria-label="${esc(name)}">` +
    `<rect x="50" y="0" width="100" height="116" fill="#3dff9a" opacity=".1"/><g class="av-fig">${figure(F)}</g></svg>`;
}

// One thing a junkie might have. Returns null when you could not use it (already carrying the most you can).
// {name, text, list (the shop price), icon, cls, take()}
function junkOffer(kind) {
  const scale = 1 + Math.floor(S.day / 10) * 0.5;
  if (kind === 'gadget') {
    const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2]);
    if (!spare.length) return null;
    const k = pick(spare), [name, price, , what] = GADGETS[k];
    return {name, text: `single use: ${what} (you have ${S[k]})`, list: price * scale, icon: miscIcon(k), take() { S[k]++; }};
  }
  if (kind === 'proxy') {
    if (S.proxies >= MAX_PROXIES) return null;
    return {name: 'Proxy chain', text: `"borrowed" server logins: for hacking back, raids and freelance jobs (you have ${S.proxies})`,
      list: 1500 * (1 + S.proxies) * scale, icon: miscIcon('proxy'), take() { S.proxies++; }};
  }
  if (kind === 'medkit') {
    if (S.medkits >= MAX_MED) return null;
    return {name: 'Medkit', text: `restores ${MED_HEAL}% Health any time (you have ${S.medkits})`, list: 600 * scale,
      icon: miscIcon('medkit'), take() { S.medkits++; }};
  }
  if (kind === 'ammo') {
    const k = pick(Object.keys(AMMO));
    if (S.ammo[k] + AMMO_BOX > AMMO_MAX) return null;
    return {name: `${AMMO_BOX} ${AMMO[k][0]}`, text: `${hitChange(k)} (you have ${S.ammo[k]})`, list: AMMO[k][1] * scale, icon: ammoIcon(k),
      take() { S.ammo[k] += AMMO_BOX; if (!S.ammo[S.loaded]) S.loaded = k; }};
  }
  if (kind === 'weapon') {
    // Nothing too grand: what a junkie could plausibly have walked off with, a little better late in a run.
    const top = 20000 + S.day * 3000;
    const i = pick(WEAPONS.map((w, n) => n).filter(n => WEAPONS[n] && n !== S.weapon && WEAPONS[n][1] <= top));
    const w = WEAPONS[i], mine = WEAPONS[S.weapon];
    return {name: w[0], text: `${WTYPE[w[4]][0].toLowerCase()}, ${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit` +
      `${usesAmmo(w) ? ', no rounds included' : ''}${mine ? `. Replaces your ${mine[0]}` : ''}`, list: w[1] * scale, icon: weaponIcon(i),
      take() { S.weapon = i; }};
  }
  if (kind === 'gear') {
    const it = makeItem(Math.min(3, rollRarity(S.day * 0.3 + 5)));
    return {name: it.name, item: it, list: itemValue(it) * scale, icon: gearIcon(it), cls: 'r' + it.rar,
      take() { stash(it); saveCareer(); }};
  }
  if (kind === 'goods') {
    const [name, low, high] = GOODS[rnd(3, GOODS.length - 1)], qty = Math.min(rnd(3, 10), free());
    if (qty <= 0) return null;
    const list = Math.round((low + high) / 2) * qty;
    return {name: `${qty} ${name}`, text: 'still in the shrink wrap', list, icon: '', goods: [name, qty],
      take(paid) { addItems(name, qty, Math.floor(paid / qty)); }};
  }
  // 'drive': a pocketful of storage
  return {name: 'Loose drives', text: '+25 drive slots, wiped (he says)', list: 600 * (1 + Math.floor(S.day / 8)), icon: '',
    take() { S.drive += 25; }};
}

async function junkie() {
  const J = pick(JUNKIES), [name, line, kinds] = J;
  const offers = [];
  for (const kind of kinds.slice().sort(() => Math.random() - 0.5)) {
    const o = junkOffer(kind);
    if (!o || offers.some(x => x.name === o.name) || offers.length >= 4) continue;
    o.price = Math.max(10, Math.round(o.list * rnd(JUNKIE_RATE[0], JUNKIE_RATE[1]) / 1000) * 10);
    o.list = Math.round(o.list);
    offers.push(o);
  }
  if (!offers.length) return;
  junkTally++;
  log(`A junkie called ${name} was waiting at ${S.loc} with things to sell.`);
  let bought = 0;
  while (offers.length) {
    render();
    const html = `<div class="versus" style="grid-template-columns:86px"><div>${junkieSvg(J)}<small>${name.toUpperCase()}</small></div></div>` +
      `<p>${bought ? '"Anything else? I got more."' : line}</p><p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
      offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">${money(o.price)}</span> ` +
        `<span class="dim">(<s>${money(o.list)}</s>)</span>` +
        `${o.item ? itemHtml(o.item) : withIcon(o.icon, `<b>${o.name}</b><br>${o.text}`)}</div>`).join('') +
      '<p class="dim">Junkies sell for a fraction of what the shops charge. Walk away and they are gone.</p>';
    const buttons = offers.filter(o => S.cash >= o.price).map(o => [`Buy ${o.name}`, o.name, o.cls, o.icon]);
    buttons.push(['Walk on', null, buttons.length ? 'small' : 'primary']);
    const choice = await dialog('A junkie with a deal', html, buttons, '');
    const o = offers.find(x => x.name === choice);
    if (!o) break;
    S.cash -= o.price;
    o.take(o.price);
    offers.splice(offers.indexOf(o), 1);
    bought++;
    tally('junk');
    log(`Bought ${o.name} from ${name} for ${money(o.price)}.`);
  }
  if (!bought) log(`You left ${name} to it.`);
}

// ---------- confrontations: the law, rival syndicates, and raids on rivals ----------
function lawEncounter() {
  const tier = lawTier(), L = LAW[tier];
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  return fight({kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi});
}

function gangEncounter(key) {
  return fight({kind: 'gang', gang: key, name: SYNDICATES[key][0], n: rnd(1, 2 + Math.floor(S.day / 8)),
    hit: 0.3, lo: 3, hi: 8});
}

// One confrontation. E: {kind: 'law' | 'gang' | 'raid', name, n, hit, lo, hi, tier, gang}
async function fight(E) {
  const total = E.n, law = E.kind === 'law', raid = E.kind === 'raid', quiet = inSyn('ghost');
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;
  let n = E.n, violent = false, unhurt = true;
  const gotAway = () => { tally('law'); tally('escape'); if (used() >= 50) tally('smuggle'); };
  let msg = law ? `${E.name[0].toUpperCase() + E.name.slice(1)} has a lock on you: ${plural(n, 'agent')}.`
    : raid ? `You breach a ${E.name} node. ${plural(n, 'operator')} are jacked in and they see you.`
    : `${E.name} crackers are inside your rig: ${plural(n, 'intruder')}.`;
  const title = law ? `!! ${E.name.replace(/^the /, '').toUpperCase()} !!`
    : raid ? `RAID: ${E.name}` : `!! ${E.name.toUpperCase()} ATTACK !!`;
  const hint = law
    ? 'Shooting, EMPs and running risk your Health. Hacking risks your OpSec and keeps your Heat down. Wiping the drive loses your goods but always escapes.'
    : raid ? 'A remote fight: only hacking tools work and only your OpSec is at risk. Jack out any time to leave empty-handed.'
    : 'Shooting, EMPs and running risk your Health. Hacking back risks your OpSec. Or pay them to go away.';
  let physical = false;
  if (E.intro) msg = E.intro;
  for (;;) {
    render();
    const W = WEAPONS[S.weapon], zeroDays = S.inv['Zero-Days'] || 0;
    const payoff = Math.max(500, Math.floor(S.cash * 0.2));
    const buttons = [];
    const round = usesAmmo(W) ? activeAmmo() : null;
    if (!raid && W) {
      buttons.push([!usesAmmo(W) ? `Use ${W[0]}` : round ? `Fire ${W[0]} (${AMMO[round][4]} x${S.ammo[round]})`
        : `Club them with ${W[0]} (no ammo)`, 'shoot']);
      if (usesAmmo(W) && Object.values(S.ammo).filter(q => q > 0).length > 1) buttons.push(['Change ammo', 'ammo']);
    }
    if (!raid && S.emp) buttons.push([`${GADGETS.emp[0]} (${S.emp})`, 'emp']);
    if (S.proxies) buttons.push([raid ? 'Hack them' : 'Counter-hack', 'hack']);
    if (S.bomb) buttons.push([`${GADGETS.bomb[0]} (${S.bomb})`, 'bomb']);
    if (!raid && S.smoke) buttons.push([`${GADGETS.smoke[0]} (${S.smoke})`, 'smoke']);
    if (zeroDays) buttons.push([`Burn a Zero-Day (${zeroDays})`, 'zero']);
    if (S.medkits && S.hp < 100) buttons.push([`Medkit (${S.medkits})`, 'med']);
    buttons.push([raid ? 'Jack out' : 'Run', 'run']);
    if (law) buttons.push(['Wipe drive', 'wipe', 'danger']);
    if (E.kind === 'gang' && S.cash >= payoff) buttons.push([`Pay them ${money(payoff)}`, 'pay']);
    buttons[0][2] = 'primary';
    const cmd = await dialog(title,
      `<div class="versus"><div>${avatarSvg({bust: true})}<small>YOU</small></div><b>VS</b>` +
      `<div>${foeSvg(E)}<small>&times; ${n}</small></div></div>` +
      `<p>${msg}</p>${vitals()}${meter('Hostiles', n, total, `${n} / ${total}`, 'red')}` +
      `<p class="dim" style="margin-top:10px">${hint}</p>`, buttons, 'danger');

    if (cmd === 'ammo') { await pickAmmo(); continue; }   // swapping ammo does not cost a turn
    let kills = 0, stunned = false;
    physical = !raid && (cmd === 'shoot' || cmd === 'emp' || cmd === 'run' || cmd === 'med');
    if (cmd === 'shoot' && usesAmmo(W) && !activeAmmo()) {
      // No rounds left: all you can do is swing the thing.
      if (Math.random() < 0.3 + bonus('aim') / 100) kills = 1;
      violent = true;
      S.heat = Math.min(100, S.heat + (law ? 5 : 0));
      msg = kills ? `Click. Empty. You club one of them with the ${W[0]}.` : `Click. Empty. You swing the ${W[0]} and miss.`;
    } else if (cmd === 'shoot') {
      const kind = WTYPE[W[4]] || WTYPE.gun;
      const round = usesAmmo(W) ? activeAmmo() : null;                    // which ammo this volley uses
      const shots = round ? Math.min(W[2], S.ammo[round]) : W[2];
      const hit = W[3] + bonus('aim') / 100 + (round ? AMMO[round][2] / 100 : 0);   // better rounds hit more often
      for (let i = 0; i < shots; i++) if (Math.random() < hit) kills++;
      if (round) S.ammo[round] -= shots;
      kills = Math.min(n, kills);
      violent = true;
      S.heat = Math.min(100, S.heat + kind[law ? 2 : 3]);   // blades are silent, guns are loud
      stunned = W[4] === 'blunt' && kills > 0 && Math.random() < 0.4;
      msg = (kills ? `Your ${W[0]} drops ${kills} of them.` : `Your ${W[0]} misses.`) +
        (stunned && n - kills > 0 ? ' The rest are too rattled to hit back.' : '') +
        (round ? ` (${S.ammo[round]} ${AMMO[round][0]} left.)` : '');
    } else if (cmd === 'emp') {
      S.emp--;
      kills = Math.min(n, rnd(2, 3));
      violent = true;
      S.heat = Math.min(100, S.heat + (law ? 6 : 2));
      msg = `The EMP fries ${kills} of them.`;
    } else if (cmd === 'bomb') {
      S.bomb--;
      kills = Math.min(n, rnd(2, 3));
      msg = `The logic bomb goes off in their systems: ${kills} knocked offline.`;
    } else if (cmd === 'smoke') {
      S.smoke--;
      log(`<span class="green">You vanished in a cloud of ${GADGETS.smoke[0]}.</span>` + gainXp(10));
      if (law) gotAway();
      E.result = 'fled';
      return alertDlg('Escaped', '<p>You pop the smoke and you are gone before it clears.</p>');
    } else if (cmd === 'hack') {
      for (let i = 0; i < S.proxies; i++) if (Math.random() < 0.4 + bonus('hack') / 100) kills++;
      kills = Math.min(n, kills);
      msg = `You hit back through your proxies: ${kills} knocked offline.`;
    } else if (cmd === 'med') {
      S.medkits--;
      S.hp = Math.min(100, S.hp + MED_HEAL);
      msg = `You jab a medkit: Health back to ${S.hp}%.`;
    } else if (cmd === 'zero') {
      removeItems('Zero-Days', 1);
      kills = Math.min(n, 2);
      msg = `The Zero-Day tears through their gear: ${kills} knocked offline.`;
    } else if (cmd === 'run') {
      const chance = raid ? 1
        : Math.max(0.25, Math.min(0.9, 0.55 + 0.05 * S.proxies - 0.07 * (n - 1) + bonus('speed') / 100));
      if (Math.random() < chance) {
        if (raid) {
          log(`You jacked out of the ${E.name} node empty-handed.`);
          return;
        }
        if (law) { S.heat = Math.max(0, S.heat - 10); gotAway(); }
        log('<span class="green">You hopped three networks and vanished.</span>' + gainXp(law ? 20 : 10));
        E.result = 'fled';
        return alertDlg('Escaped', '<p>You hop three networks and vanish.</p>');
      }
      msg = 'They are still on you.';
    } else if (cmd === 'wipe') {
      S.inv = {}; S.cost = {};
      S.heat = Math.floor(S.heat / 2);
      log('<span class="amber">You nuked the drive. The trail went cold.</span>');
      E.result = 'fled';
      return alertDlg('Drive wiped', '<p>You nuke the drive. Nothing left to find. The trail goes cold.</p>');
    } else if (cmd === 'pay') {
      S.cash -= payoff;
      log(`<span class="amber">Paid ${E.name} ${money(payoff)} to back off.</span>`);
      return alertDlg('Paid off', `<p>${E.name} take ${money(payoff)} and log out. For now.</p>`);
    }

    n -= kills;
    if (n <= 0) {
      let loot, xp;
      if (law) {
        loot = total * rnd(400, 1500) * (1 + Math.floor(S.day / 10));
        if (!violent) S.heat = Math.max(0, S.heat - 25);
        xp = gainXp(30 * total);
      } else if (raid) {
        loot = total * rnd(1500, 4000) * (1 + Math.floor(S.day / 6));
        S.grudge[E.gang] += 2;
        S.heat = Math.min(100, S.heat + (quiet ? 5 : 10));
        xp = gainXp(40 * total);
      } else {
        loot = total * rnd(600, 2000) * (1 + Math.floor(S.day / 10));
        S.grudge[E.gang] += 1;
        xp = gainXp(30 * total);
      }
      loot = Math.round(loot * (1 + bonus('luck') / 100));
      S.cash += loot;
      if (law) {
        tally('law'); tally('lawwin');
        if (!violent) tally('cleanwin');
        if (E.tier >= 1) tally('fed');
        if (E.tier === 2) tally('nsawin');
      } else {
        tally('kills', total);
        if (raid) { tally('raid'); tally('loot', loot); questEvent('raidall', E.gang); } else tally('gangwin');
      }
      if (unhurt) tally('flawless');
      if (total >= 4) tally('bigwin');
      S.mood = 'grin';
      const what = law ? `You shook off ${E.name} and sold their tooling`
        : raid ? `You cleaned out a ${E.name} node` : `You beat back ${E.name} and drained their wallets`;
      log(`<span class="green">${what} for ${money(loot)}.</span>${xp}`);
      await alertDlg(raid ? 'Node looted' : 'You won', `<p>${what} for <b>${money(loot)}</b>.</p>` +
        (law ? '' : `<p class="dim">${E.name} will remember this.</p>`));
      if (!law) {
        // Rival crews drop medkits and gear. Raids and higher levels drop better.
        if (S.medkits < MAX_MED && Math.random() < 0.3) {
          S.medkits++;
          log('You pocket a medkit they left behind.');
        }
        const spare = Object.keys(GADGETS).filter(k => S[k] < GADGETS[k][2]);
        if (spare.length && Math.random() < 0.25) {
          const k = pick(spare);
          S[k]++;
          log(`You also grab a ${GADGETS[k][0]} off them.`);
        }
        if (Math.random() < 0.4) {
          const k = pick(['budget', 'std', 'std', 'hollow', 'hollow', 'ap', 'smart']), found = rnd(5, 15);
          S.ammo[k] = Math.min(AMMO_MAX, S.ammo[k] + found);
          log(`You scoop up ${found} ${AMMO[k][0]}.`);
        }
        if (Math.random() < (raid ? 0.85 : 0.6)) {
          await dropLoot(E.name, Math.min(30, level()) * 0.5 + S.day * 0.3 + (raid ? 5 : 0));
        }
      }
      E.result = 'won';
      return;
    }

    let dmg = 0;
    const theirAim = E.hit * (inSyn(HIDDEN_SYN) ? 0.75 : 1);   // the 404 are hard to pin down
    for (let i = 0; i < n && !stunned; i++) if (Math.random() < theirAim) dmg += rnd(E.lo, E.hi);
    if (dmg) unhurt = false;
    if (dmg && physical) {
      // In the open they hurt you, not your rig. Armour soaks up part of it.
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('armor') / 100)));
      S.hp -= dmg;
      msg += ` <span class="red">${law ? 'They open fire' : 'They jump you'}: Health -${dmg}%.</span>`;
    } else if (dmg) {
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('firewall') / 100)));
      S.opsec -= dmg;
      msg += ` <span class="red">They ${law ? 'unmask part of your trail' : 'tear into your defences'}: OpSec -${dmg}%.</span>`;
    } else {
      msg += ' Their attacks miss.';
    }
    if (S.opsec <= 0 || S.hp <= 0) { E.result = 'lost'; return lose(E); }
  }
}

// Health or OpSec hit zero.
async function lose(E) {
  const hurt = S.hp <= 0;
  S.opsec = Math.max(0, S.opsec);
  S.hp = Math.max(0, S.hp);
  if (E.kind !== 'law') {
    // Rival crews rob you but don't end the run.
    const cash = Math.floor(S.cash * 0.35);
    S.cash -= cash;
    let goods = 0;
    for (const name of Object.keys(S.inv)) {
      const take = Math.ceil(S.inv[name] / 2);
      goods += take;
      removeItems(name, take);
    }
    S.opsec = Math.max(S.opsec, 40);
    let clinic = '';
    if (hurt) {
      // Beaten unconscious: a day in a back-room clinic.
      S.hp = 50;
      if (S.day < DAYS) { nextDay(); clinic = '<p>You wake up a day later in a back-room clinic, stitched up to 50% Health.</p>'; }
    }
    log(`<span class="red">${E.name} cleaned you out: ${money(cash)} and ${num(goods)} goods.</span>`);
    S.mood = 'ouch';
    render();
    return alertDlg(hurt ? 'Beaten and robbed' : 'Robbed',
      (hurt ? `<div class="posebox wide">${avatarSvg({pose: 'down'})}</div>` : '') + `<p>${E.name} ${hurt ? 'leave you on the floor' : 'own your rig'}. They take <b>${money(cash)}</b> and ` +
      `<b>${num(goods)}</b> of your goods${hurt ? '' : ' before you pull the plug'}.</p>${clinic}`, 'danger');
  }
  if (E.tier === 2) {
    S.busted = S.over = true;
    return;
  }
  // Police and Feds: goods seized, a fine, and time inside. The run goes on.
  const fine = Math.floor(S.cash * (E.tier ? 0.5 : 0.25)), days = E.tier ? 4 : 2;
  S.cash -= fine;
  S.inv = {}; S.cost = {};
  let served = 0;
  while (served < days && S.day < DAYS) { nextDay(); served++; }
  S.opsec = Math.max(S.opsec, E.tier ? 50 : 60);
  S.hp = Math.max(S.hp, 50);
  S.heat = E.tier ? 20 : 10;
  S.arrests = (S.arrests || 0) + 1;
  tally('arrest');
  log(`<span class="red">Arrested by ${E.name}: goods seized, ${money(fine)} fine, ${served} day${served === 1 ? '' : 's'} inside.</span>`);
  S.mood = 'ouch';
  render();
  await alertDlg('Arrested', `<div class="posebox">${avatarSvg({pose: 'busted', label: E.tier ? 'FED TASK FORCE' : 'METRO CYBER'})}</div>` +
    `<p>${E.name[0].toUpperCase() + E.name.slice(1)} ` +
    `${hurt ? 'drags you out on a stretcher' : 'kicks the door in'}.</p>` +
    `<p>Your goods are seized, you pay <b>${money(fine)}</b> and lose <b>${served} day${served === 1 ? '' : 's'}</b> ` +
    'before a lawyer gets you out. Your debt kept growing.</p>' +
    '<p class="dim">The cold wallet was never found.</p>', 'danger');
}

// ---------- end of run ----------
async function finish() {
  store.del('zdh-save');
  render();
  if (S.busted) {
    await dialog('VANISHED', `<div class="posebox">${avatarSvg({pose: 'vanished'})}</div>` + '<p>The NSA does not arrest people like you. A van you never noticed was parked outside all week.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the disappeared.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  const score = S.cash + S.wallet - S.debt;
  tally('runs');
  if (!S.arrests) tally('cleanrun');
  tally('score', score);
  gainXp(100 + Math.min(400, Math.sqrt(Math.max(0, score)) / 5));
  const ranks = [[0, 'Owned by the Fixer'], [50000, 'Script Kiddie'], [250000, 'Gray Hat'],
    [1000000, 'Elite Operator'], [10000000, 'Ghost in the Wire']];
  const rank = (ranks.find(([limit]) => score < limit) || [0, 'Legend of the Underground'])[1];
  let scores = (!AUTO && store.get('zdh-scores')) || [];
  if (!Array.isArray(scores)) scores = [];
  // A big score ends the run draped in gold.
  const summary = `<div class="posebox">${avatarSvg(score >= 250000 ? {pose: 'rich'}
    : {plain: true, mood: score < 50000 ? 'ouch' : 'grin'})}</div>` + `<p>Cash ${money(S.cash)} + wallet ${money(S.wallet)} - debt ${money(S.debt)}</p>` +
    `<p>Final score: <b class="green">${money(score)}</b><br>Run rating: <b class="cyan">${rank}</b><br>` +
    `XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`;
  if (scores.length < 10 || score > Math.min(...scores.map(s => s.score))) {
    const handle = (await askText('New high score!', summary + '<p>Your handle:</p>')) || 'anon';
    scores.push({handle: handle.slice(0, 16), score});
    scores = scores.sort((a, b) => b.score - a.score).slice(0, 10);
    if (!AUTO) store.set('zdh-scores', scores);
  }
  const hall = scores.map((s, i) =>
    `<tr><td>${i + 1}.</td><td>${esc(s.handle)}</td><td>${money(s.score)}</td></tr>`).join('');
  await dialog('Run complete', summary + `<p class="dim">HALL OF FAME</p><table class="hall">${hall}</table>`,
    [['New run', true, 'primary']]);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || busy || b.disabled) return;
  busy = true;
  try {
    await ACTIONS[b.dataset.act](b.dataset.arg);
    await flushNotes();
    if (S.over) { await finish(); newGame(); }
    await levelUpCheck();
  } finally {
    busy = false;
  }
  render();
  save();
});

// ---------- self test: open index.html#selftest to auto-play random games ----------
async function selfTest(games) {
  AUTO = true;
  const names = GOODS.map(g => g[0]);
  let finished = 0, busted = 0, best = -Infinity, contractsSeen = 0, raids = 0;
  try {
    for (let game = 0; game < games; game++) {
      career = {xp: rnd(0, 9000), syn: pick([null, 'ghost', 'ledger', 'null', 'red', 'x404']), gear: {}, bag: [], locker: [],
        quest: pick([null, {n: rnd(0, 9), p: 0}])};
      fixCareer();
      for (let i = rnd(0, 4); i > 0; i--) { const it = makeItem(rnd(0, 4)); career.gear[it.slot] = it; }
      if (game % 2) career.look = {skin: rnd(0, 5), hair: rnd(0, 4), col: rnd(0, 6), streak: rnd(0, 4)};
      newGame();
      S.proxies = rnd(0, 3); S.weapon = rnd(0, WEAPONS.length - 1);
      S.emp = rnd(0, 2); S.smoke = rnd(0, 2); S.bomb = rnd(0, 2); S.fakeid = rnd(0, 2);
      for (const k of Object.keys(AMMO)) S.ammo[k] = pick([0, 0, rnd(1, 40)]);
      for (let step = 0; step < 600 && !S.over; step++) {
        const r = Math.random();
        const act = r < 0.3 ? 'buy' : r < 0.5 ? 'sell' : r < 0.6 ? 'contract' : r < 0.65 ? 'dump'
          : r < 0.8 ? 'travel' : r < 0.83 ? pick(['sleep', 'store', 'take', 'locker']) : r < 0.86 ? 'broker' : r < 0.89 ? 'wallet'
          : r < 0.93 ? 'raid' : r < 0.96 ? pick(['gear', 'dealer', 'gunstore', 'outfitter', 'ammo']) : r < 0.97 ? 'gearmenu' : r < 0.98 ? pick(['syndicate', 'syndicate', 'achievements']) : r < 0.99 ? pick(['medkit', 'fakeid']) : 'profile';
        if ((act === 'broker' || act === 'wallet') && S.loc !== HOME) continue;
        if ((act === 'gear' || act === 'dealer') && !GEAR_SPOTS.includes(S.loc)) continue;
        if ((act === 'gunstore' || act === 'outfitter') && S.loc !== GUN_SPOT) continue;
        if (act === 'raid') raids++;
        if (S.loc === BUNKER && Math.random() < 0.4) await ACTIONS.sleep();   // days only pass by sleeping
        if (act === 'gearmenu') {   // also exercise the loadout close-up and slot swapping
          stash(makeItem(rnd(0, 4)));
          await swapSlot(pick(Object.keys(SLOTS)));
          await inspectGear();
        }
        if (act === 'syndicate') {   // turn up with the goods so deliveries get handed over
          const Q = quest();
          if (Q && Q.kind === 'deliver' && free() >= Q.t) { addItems(Q.good, Q.t, 0); S.loc = Q.place; rollMarket(); }
        }
        if (act === 'contract') {
          // Stock up for a random contract first so jobs actually get run.
          const c = S.contracts[0];
          if (c && free() >= c.qty) addItems(c.good, c.qty, 0);
          await ACTIONS.contract(0);
          contractsSeen += c ? 1 : 0;
        } else {
          await ACTIONS[act](names[rnd(0, names.length - 1)]);
        }
        await flushNotes();
        await levelUpCheck();
        render();
        const bad = S.cash < 0 || S.wallet < 0 || S.debt < 0 || used() < 0 ||
          career.bag.length > BAG_SIZE || !AMMO[S.loaded] || Object.values(S.ammo).some(q => !(q >= 0 && q <= AMMO_MAX)) || !(S.trips >= 0 && S.trips <= TRIPS_PER_DAY) || career.locker.length > LOCKER_SIZE || stashTotal() > STASH_CAP ||
          Object.values(S.stash).some(q => !(q > 0)) || S.medkits < 0 || S.medkits > MAX_MED || S.shop.length > 3 ||
          Object.values(career.gear).some(it => !it || !RARITY[it.rar] || !Object.keys(it.stats).length) ||
          !Number.isInteger(career.xp) || !Number.isInteger(S.hp) || S.hp < 0 || S.hp > 100 || Object.keys(GADGETS).some(k => !(S[k] >= 0 && S[k] <= GADGETS[k][2])) || S.weapon >= WEAPONS.length || S.proxies > MAX_PROXIES ||
          Object.values(S.grudge).some(g => !(g >= 0)) || !!career.syn !== !!quest() || (career.quest && !(career.quest.p >= 0)) || !Number.isInteger(S.drive) || S.contracts.some(c => !(c.qty > 0 && c.payout > 0)) ||
          S.heat < 0 || S.heat > 100 || S.opsec < 0 || S.opsec > 100 || S.day > DAYS ||
          Object.values(S.inv).some(q => !(q > 0)) || [S.cash, S.wallet, S.debt].some(v => !Number.isInteger(v));
        if (bad) throw new Error('invariant broken: ' + JSON.stringify(S));
      }
      if (S.over) {
        finished++;
        if (S.busted) busted++; else best = Math.max(best, S.cash + S.wallet - S.debt);
        await finish();
      }
    }
    document.title = 'SELFTEST OK';
    document.body.textContent = `SELFTEST OK finished=${finished} busted=${busted} best=${best} contracts=${contractsSeen} raids=${raids} quests=${questTally} junkies=${junkTally} achievements=${achTally}`;
  } catch (err) {
    document.title = 'SELFTEST FAIL';
    document.body.textContent = 'SELFTEST FAIL ' + (err && err.stack || err);
  }
}

// ---------- save files and the start menu ----------
// Make save file n the one in use and load it. Returns true if it had a run in progress.
function loadSave(n) {
  slot = n;
  career = newCareer();
  pendingLevel = 0; logs = []; notes = [];
  const record = store.get('zdh-career');
  if (record && Number.isInteger(record.xp) && record.xp >= 0) {
    career = {xp: record.xp, syn: SYNDICATES[record.syn] ? record.syn : null, quest: record.quest,
      gear: record.gear && typeof record.gear === 'object' ? record.gear : {},
      bag: Array.isArray(record.bag) ? record.bag : [],
      locker: Array.isArray(record.locker) ? record.locker : [],
      stats: record.stats, ach: record.ach};
    if (record.look && typeof record.look === 'object') career.look = record.look;
    reslotCareer();   // gas masks are face items now, watches and braces go on the wrist
  }
  fixCareer();   // members from before the questlines start at mission 1
  saveCareer();
  const saved = store.get('zdh-save');
  if (!(saved && saved.prices && !saved.over)) { newGame(); return false; }
  S = saved;
  // Fill in anything a save from an older version lacks.
  S.contracts = S.contracts || [];
  S.hp = Number.isInteger(S.hp) ? S.hp : 100;
  S.medkits = S.medkits || 0;
  S.stash = S.stash || {};
  S.markets = S.markets || {};
  if (!Number.isInteger(S.trips)) S.trips = TRIPS_PER_DAY;
  if (S.loc !== BUNKER && S.prices) S.markets[S.loc] = S.markets[S.loc] ||
    {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop};
  S.stashCost = S.stashCost || {};
  starterGear();
  S.shop = S.shop || [];
  for (const m of [S, ...Object.values(S.markets)]) { reslot(m.shop); reslot(m.store); }
  if (S.armor && !career.gear.body) {
    // The old vest becomes a gear item.
    career.gear.body = {slot: 'body', rar: 1, name: 'Tuned Armoured Vest', stats: {armor: 15}};
  }
  delete S.armor;
  S.weapon = S.weapon || 0;
  for (const k of Object.keys(GADGETS)) S[k] = S[k] || 0;
  S.ammo = Object.assign(noAmmo(), S.ammo);
  if (!AMMO[S.loaded]) S.loaded = 'std';
  S.store = S.store || [];
  S.grudge = Object.assign(noGrudges(), S.grudge);
  S.raided = !!S.raided;
  log('Run resumed.');
  return true;
}

// One line about a save file, read straight from storage without loading it.
function saveCard(n, meta) {
  const c = store.get('zdh-career', n) || {}, r = store.get('zdh-save', n);
  const lvl = levelInfo(Number.isInteger(c.xp) ? c.xp : 0).level;
  const crew = c.syn && SYNDICATES[c.syn] ? ` &middot; ${SYNDICATES[c.syn][0]}` : '';
  const run = r && r.prices && !r.over ? `Day ${r.day}/${DAYS} &middot; ${money((r.cash || 0) + (r.wallet || 0) - (r.debt || 0))} net`
    : 'between runs';
  const earned = c.ach && typeof c.ach === 'object' ? Object.keys(ACH).filter(id => c.ach[id]).length : 0;
  const when = meta.t ? new Date(meta.t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';
  return `<b>${esc(meta.name || 'anon')}</b> <span class="dim">save ${n}${n === slot ? ' &middot; in use' : ''}</span><br>` +
    `<span class="lvl" style="color:var(--magenta)">LVL ${lvl}</span> ${titleFor(lvl)}${crew}<br>` +
    `<span class="dim">${run} &middot; ${earned}/${Object.keys(ACH).length} achievements${when ? ` &middot; ${when}` : ''}</span>`;
}

// The start menu: continue, start a new game, load a save or delete one. Returns once a save is in use.
async function startMenu() {
  for (;;) {
    const list = saveList(), ids = Object.keys(list).map(Number).filter(n => n >= 1 && n <= MAX_SAVES).sort((a, b) => a - b);
    const last = Number(store.get('zdh-last')), full = ids.length >= MAX_SAVES;
    const html = '<p class="dim">// UNDERGROUND MARKET UPLINK</p>' +
      (ids.length ? `<p class="dim">SAVES ${ids.length}/${MAX_SAVES}: tap one to load it</p>` +
        ids.map(n => `<div class="syn pickable" data-pick="load:${n}">${saveCard(n, list[n])}</div>`).join('')
        : '<p>No saves yet. Start a new game.</p>') +
      (full ? `<p class="amber">All ${MAX_SAVES} save files are in use. Delete one to start a new game.</p>` : '');
    const buttons = [];
    if (slot && list[slot]) buttons.push(['Back to the game', 'back', 'primary']);
    else if (ids.includes(last)) buttons.push([`Continue: ${list[last].name || 'anon'}`, `load:${last}`, 'primary']);
    if (!full) buttons.push(['New game', 'new', buttons.length ? '' : 'primary']);
    if (ids.length) buttons.push(['Delete a save', 'del', 'small']);
    const choice = await dialog('ZERO DAY HUSTLE', html, buttons);
    if (choice === 'back') return;
    if (choice === 'new') {
      const name = (await askText('New game', `<p>Your handle for this save (${ids.length + 1} of ${MAX_SAVES}):</p>`)) || 'anon';
      slot = [1, 2, 3, 4, 5].find(n => !list[n]);
      career = newCareer();
      pendingLevel = 0; logs = []; notes = [];
      newGame();
      touchSave(name.slice(0, 16));
      saveCareer();
      save();
      render();
      await alertDlg('ZERO DAY HUSTLE', introText());
      if (!career.look) await ACTIONS.look();
      return;
    }
    if (choice === 'del') {
      const pickOne = await dialog('Delete a save', '<p>Which save? Its levels, gear, achievements and run are gone for good.</p>' +
        ids.map(n => `<div class="syn">${saveCard(n, list[n])}</div>`).join(''),
        ids.map(n => [`Delete ${list[n].name || 'anon'} (save ${n})`, n, 'danger']).concat([['Cancel', null, 'primary']]), 'danger');
      if (pickOne && await confirmDlg('Delete a save', `<p>Delete <b>${esc(list[pickOne].name || 'anon')}</b> (save ${pickOne})? This cannot be undone.</p>`,
        'Delete it', 'Keep it')) {
        store.del('zdh-career', pickOne);
        store.del('zdh-save', pickOne);
        delete list[pickOne];
        store.set('zdh-slots', list);
        if (pickOne === slot) slot = 0;   // the game behind the menu no longer exists: pick another or start one
      }
      continue;
    }
    if (String(choice).startsWith('load:')) {
      const n = Number(choice.slice(5));
      if (n !== slot) { if (slot) save(); loadSave(n); }
      touchSave();
      render();
      return;
    }
  }
}

// ---------- boot ----------
(async function boot() {
  // Loading screen: plays for a moment, or tap to skip. The game sets itself up underneath.
  const bootEl = $('#boot');
  const endBoot = () => { bootEl.classList.add('gone'); setTimeout(() => bootEl.remove(), 400); };
  // #selftest plays 200 random games; #selftest=30 plays 30.
  if (location.hash.startsWith('#selftest')) { bootEl.remove(); return selfTest(Number(location.hash.split('=')[1]) || 200); }
  bootEl.onclick = endBoot;
  setTimeout(endBoot, 2600);
  // Web version only: keep a copy for offline play.
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  adoptOldSave();
  newGame();   // something to draw behind the menu; nothing is saved until a save file is chosen
  render();
  busy = true;
  await startMenu();
  render();
  busy = false;
  save();
})();
</script>
