    ['gear bonuses', bonus('storage')], ['Null Sector', inSyn('null') ? 60 : 0]].filter(([, n]) => n);
  return `<b>Carrying space:</b> <b class="${bagClass()}">${num(cap())}</b> = ` +
    parts.map(([what, n, cls]) => `<span class="${cls || ''}">${num(n)} ${what}</span>`).join(' + ') +
    (career.gear.back ? '' : ' <span class="dim">(no backpack)</span>');
}
const free = () => cap() - used();
const pick = list => list[rnd(0, list.length - 1)];
// A labelled bar: Health, OpSec, or the hostiles left in a fight.
function meter(label, value, max, text, color) {
  const width = Math.max(0, Math.min(100, Math.round(value / max * 100)));
  color = color || (width > 60 ? 'green' : width > 30 ? 'amber' : 'red');
  return `<div class="meter"><span>${label}</span><span class="track">` +
    `<i style="width:${width}%;background:var(--${color})"></i></span><b class="${color}">${text}</b></div>`;
}
const vitals = () => meter('Health', S.hp, 100, S.hp + '%') + meter('OpSec', S.opsec, 100, S.opsec + '%');
const lawTier = () => S.heat >= 75 ? 2 : S.heat >= 40 ? 1 : 0;
const rivals = () => Object.keys(SYNDICATES).filter(k => k !== career.syn && k !== HIDDEN_SYN);
const noGrudges = () => ({ghost: 0, ledger: 0, null: 0, red: 0});

// marked (optional): how many of them carry the "discount because reasons" tag. Leave it out for clean goods.
function addItems(name, qty, price, marked) {
  const held = S.inv[name] || 0;
  const paid = (S.cost[name] || 0) * held + price * qty;
  S.inv[name] = held + qty;
  S.cost[name] = Math.floor(paid / (held + qty));
  if (marked > 0) { S.tag = S.tag || {}; S.tag[name] = (S.tag[name] || 0) + Math.min(marked, qty); }
}
// Clean ones go first. marked (optional): true takes tagged ones instead (that is what selling them does).
function removeItems(name, qty, marked) {
  if (marked && S.tag && S.tag[name]) S.tag[name] -= Math.min(qty, S.tag[name]);
  S.inv[name] -= qty;
  if (S.inv[name] <= 0) { delete S.inv[name]; delete S.cost[name]; }
  fixTags();
}
function addHeat(value) {
  let gain = Math.min(10, Math.floor(value / 10000));
  if (inSyn('ghost')) gain = Math.ceil(gain / 2);
  gain = Math.ceil(gain * (1 - bonus('stealth') / 100));
  if (gain) heatUp(gain);
}
// What the Heat items leave running: {vpn: days of halved Heat gains left, decoy: nights of extra cooling left}.
const fx = () => (S.fx && typeof S.fx === 'object' ? S.fx : (S.fx = {vpn: 0, decoy: 0}));
// Everything that raises Heat comes through here, so a running VPN can halve it.
function heatUp(n) {
  if (n > 0 && fx().vpn > 0) n = Math.ceil(n / 2);
  S.heat = Math.min(100, S.heat + n);
}
// How much Heat a Heat item would take off if used right now (0 for the ones that work over time).
function coolDrop(key) {
  const c = COOL[key];
  if (!c.drop) return 0;
  const full = c.drop[lawTier()];
  return Math.min(S.heat, c.quick && S.tricks > 0 ? Math.ceil(full / 2) : full);
}
// Why a Heat item cannot be used right now, or '' when it can.
function coolBlock(key) {
  const c = COOL[key];
  if (c.drop && S.heat <= 0) return 'You have no Heat to drop.';
  if (c.hp && S.hp <= c.hp) return `It costs ${c.hp}% Health, and you only have ${S.hp}%.`;
  if (c.home && S.loc !== BUNKER) return 'It only works at the Bunker.';
  if (c.home && S.trips < c.trips) return `Too late in the day: you need ${c.trips} or more trips left to lie low.`;
  if (c.nights && fx().decoy >= c.nights) return 'One is already running, with all its nights left.';
  if (c.days && fx().vpn >= c.days) return 'One is already running, with all its days left.';
  return '';
}
// What is running, in words, for the status chips and the dialogs.
const coverText = () => [fx().vpn > 0 ? `VPN ${fx().vpn}d` : '', fx().decoy > 0 ? `Decoy ${fx().decoy}n` : ''].filter(Boolean).join(' &middot; ');
// Today's Heat items at this black market: four of the six kinds, one or two of each. Gone when sold.
function coolStock() {
  const m = S.markets && S.markets[S.loc];
  if (!m) return {};
  if (!m.cool || typeof m.cool !== 'object') {
    m.cool = {};
    for (const k of Object.keys(COOL).sort(() => Math.random() - 0.5).slice(0, 4)) m.cool[k] = rnd(1, 2);
  }
  return m.cool;
}
// What a Heat item would do if used right now, or why it cannot be. inline: for a line inside a list row.
function coolHint(key, inline) {
  const c = COOL[key], why = coolBlock(key);
  let text;
  if (why) text = `<span class="dim">${why}</span>`;
  else if (c.drop) {
    text = `<span class="green">Now: Heat ${S.heat}% &rarr; ${S.heat - coolDrop(key)}%</span>` +
      (c.quick && S.tricks > 0 ? ' <span class="amber">(half strength: not your first fast fix today)</span>' : '') +
      (c.backfire ? ` <span class="amber">or ${Math.min(100, S.heat + c.burn)}% if it trips the alarm</span>` : '') +
      (c.hp ? ` <span class="amber">&middot; Health ${S.hp}% &rarr; ${S.hp - c.hp}%</span>` : '') +
      (c.home ? ` <span class="amber">&middot; uses up your ${S.trips} trips</span>` : '');
  } else {
    const left = c.nights ? fx().decoy : fx().vpn, unit = c.nights ? 'night' : 'day';
    text = left > 0 ? `<span class="amber">One is running with ${left} ${unit}${left === 1 ? '' : 's'} left. Using another only tops it back up to ${c.nights || c.days}.</span>`
      : '<span class="green">Not running.</span>';
  }
  return inline ? '<br>' + text : `<p>${text}</p>`;
}
const heatClass = h => (h >= 60 ? 'red' : h >= 30 ? 'amber' : 'green');
const coolCount = () => Object.keys(COOL).reduce((sum, k) => sum + (S[k] || 0), 0);
let coolUses = 0, coolBuys = 0, coolFires = 0;   // counted for the self-test
const COOL_SAY = {
  burner: 'You move your whole life onto a phone that cost less than lunch. The old one goes in a river.',
  acid: 'It stings exactly as much as the label says it will not. Your fingertips are now smooth, legally speaking.',
  wiper: 'The script runs, the logs rotate, and for a moment several agencies are not sure who you are.',
  lielow: 'Curtains shut, phone off, noodles on. You finish a thousand-piece jigsaw of a lighthouse. Nobody sees you all day.',
  decoy: 'Somewhere a server starts pretending to be you, badly, in four countries at once.',
  vpn: 'The provider promises it keeps no logs. It says so in the logs.',
};
// Use a Heat item: the same thing whether it is tapped in the inventory or picked from "Lower Heat".
async function useCooler(key) {
  const g = GADGETS[key], c = COOL[key];
  if (!c || !S[key] || coolBlock(key)) return;
  const was = S.heat, tierWas = lawTier(), half = c.quick && S.tricks > 0;
  let fired = false, extra = '';
  S[key]--;
  coolUses++;
  tally('cooled');
  if (c.drop) {
    if (c.backfire && Math.random() < c.backfire) {
      fired = true;
      coolFires++;
      tally('honeypot');
      S.heat = Math.min(100, S.heat + c.burn);
    } else S.heat -= coolDrop(key);
    if (c.quick) S.tricks = (S.tricks || 0) + 1;
    if (c.hp) { S.hp -= c.hp; extra = ` Health down to ${S.hp}%.`; }
    if (c.home) { S.trips = 0; extra = ' No trips left today.'; }
    if (half && !fired) extra += ' (Half strength: not your first fast fix today.)';
  } else if (c.nights) {
    fx().decoy = c.nights;
    extra = ` Your Heat cools an extra ${c.cool}% a night for ${c.nights} nights.`;
  } else {
    fx().vpn = c.days;
    extra = ` Heat gains are halved for ${c.days} days, today included.`;
  }
  S.mood = fired ? 'ouch' : S.mood;
  SND.play(fired ? 'alarm' : c.home ? 'sleep' : c.drop ? 'heal' : 'hack');
  const change = S.heat === was ? `Heat stays at ${was}%.` : `Heat ${S.heat > was ? 'up' : 'down'} from ${was}% to ${S.heat}%.`;
  log(fired ? `<span class="red">Your ${g[0]} tripped an alarm: ${change}</span>${extra}` : `You used a ${g[0]}: ${change}${extra}`);
  render();
  const bar = (label, h) => meter(label, h, 100, h + '%', heatClass(h));
  const tier = lawTier() === tierWas ? `Still wanted by: <b>${LAW[tierWas].short}</b>.`
    : `Wanted by: ${LAW[tierWas].short} &rarr; <b class="${lawTier() < tierWas ? 'green' : 'red'}">${LAW[lawTier()].short}</b>.`;
  await alertDlg(g[0], `<div class="syn">${withIcon(miscIcon(key), `<b>${g[0]}</b><br>${g[3]}`)}</div>` +
    `<p>${fired ? 'The log server was a honeypot. It thanks you for your submission.' : COOL_SAY[key]}</p>` +
    (c.drop ? bar('Before', was) + bar('After', S.heat) : bar('Heat', S.heat)) +
    `<p>${fired ? `<span class="red">${change}</span>` : change}${extra} ${tier}</p>`, fired ? 'danger' : '');
}

// ---------- contracts ----------
function rollContracts() {
  S.contracts = [];
  const count = pick([0, 1, 1, 2, 2, 3]);
  const pool = GOODS.slice().sort(() => Math.random() - 0.5).slice(0, count);
  for (const [name, low, high] of pool) {
    const mid = (low + high) / 2;
    const lot = mid >= 10000 ? 3 : mid >= 2000 ? 8 : mid >= 500 ? 15 : mid >= 100 ? 30 : 50;
    const qty = Math.min(60, Math.max(1, Math.round(rnd(Math.ceil(lot / 3), lot) * (1 + S.day / 8))));
    const chance = rnd(50, 85);
    // Riskier jobs pay more. The unit price is never below today's local price,
    // so a job that works always beats selling the same goods here.
    const mult = 1.5 + (85 - chance) / 35 * 1.3 + Math.random() * 0.4;
    const unit = Math.max(S.prices[name] || 0, Math.round(mid));
    S.contracts.push({good: name, qty, chance, payout: Math.round(unit * qty * mult / 10) * 10,
      job: pick(JOBS[name]), client: pick(CLIENTS)});
  }
}
const payoutFor = c => Math.round(c.payout * (inSyn('red') ? 1.25 : 1));
const chanceFor = c => Math.max(10, Math.min(95,
  c.chance + Math.min(10, level()) + 2 * S.proxies - Math.floor(S.heat / 5) + (inSyn('red') ? 10 : 0) + bonus('charm')));
function log(text, cls) {
  logs.unshift(`<div${cls ? ` class="${cls}"` : ''}>${text}</div>`);
  logs.length = Math.min(logs.length, 14);
}

function rollMarket() {
  if (S.loc === BUNKER) {   // nobody trades at your hideout
    S.prices = {}; S.flags = {}; S.news = []; S.contracts = []; S.shop = []; S.store = [];
    return;
  }
  // Each place has one market per day: coming back the same day finds the same prices,
  // with any contracts you ran and gear you bought already gone.
  const today = S.markets[S.loc];
  if (today) {
    S.prices = today.prices; S.flags = today.flags; S.news = today.news;
    S.contracts = today.contracts; S.shop = today.shop; S.store = today.store || [];
    return;
  }
  for (;;) {
    S.prices = {}; S.flags = {}; S.news = [];
    for (const [name, low, high, scarce, flood] of GOODS) {
      if (Math.random() < 0.18) continue;   // nobody is dealing this here today
      let price = rnd(low, high);
      const r = Math.random();
      if (r < 0.06) { price *= rnd(3, 6); S.news.push(scarce); S.flags[name] = 'up'; }
      else if (r < 0.12) { price = Math.max(1, Math.floor(price / rnd(3, 5))); S.news.push(flood); S.flags[name] = 'down'; }
      S.prices[name] = price;
    }
    if (Object.keys(S.prices).length >= 4) break;
  }
  rollContracts();
  // Today's gear on the black market: up to Epic, never Legendary.
  S.shop = [0, 1, 2].map(() => makeItem(Math.min(3, rollRarity(S.day * 0.3))));
  S.store = S.loc === GUN_SPOT ? outfitStock() : [];
  S.markets[S.loc] = {prices: S.prices, flags: S.flags, news: S.news, contracts: S.contracts, shop: S.shop, store: S.store};
}

  S = {day: 1, loc: BUNKER, trips: TRIPS_PER_DAY, markets: {}, cash: START_CASH + (inSyn('null') ? 3000 : 0), debt: START_DEBT, wallet: 0,
    drive: START_DRIVE, opsec: 100, heat: 0, proxies: 0, inv: {}, cost: {}, prices: {}, flags: {}, news: [],
    kit: 1,   // marks a run started with backpacks: its drive is the new, smaller base

    contracts: [], xpRun: 0, cleared: false, stash: {}, stashCost: {}, hp: 100, medkits: 2, shop: [], weapon: 0, ammo: noAmmo(), loaded: 'std', store: [], emp: 0, smoke: 0, bomb: 0, fakeid: 0, grudge: noGrudges(), raided: false,

// ---------- dialogs ----------
const overlay = $('#overlay'), dlg = $('#dialog');
let autoPick = null;   // self-test only: (values on offer, dialog title) => the one to pick

function dialog(title, html, buttons, tone) {
  return new Promise(resolve => {
    dlg.className = tone || '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div><div class="dbtns"></div>`;
    const box = dlg.querySelector('.dbtns');
    for (const [label, value, cls, icon] of buttons) {   // icon: optional picture shown on the button
      const el = document.createElement('button');
      el.textContent = label;
      if (cls) el.className = cls;
      if (icon) { el.insertAdjacentHTML('afterbegin', icon); el.classList.add('hasico'); }
      el.onclick = () => { overlay.hidden = true; resolve(value); };
      box.appendChild(el);
    }
    // Anything in the body marked data-pick="value" also answers the dialog when tapped.
    dlg.querySelectorAll('.body [data-pick]').forEach(el => {
      el.onclick = () => { overlay.hidden = true; resolve(el.dataset.pick); };
    });
    if (AUTO) {   // the self-test picks any button or tappable thing at random
      const all = buttons.map(b => b[1]).concat([...dlg.querySelectorAll('.body [data-pick]')].map(el => el.dataset.pick));
      // ...unless it is steering: autoPick answers from what is on offer, or returns undefined to leave it to chance.
      const want = autoPick ? autoPick(all, title) : undefined;
      return resolve(want !== undefined ? want : all[rnd(0, all.length - 1)]);
    }
    overlay.hidden = false;
    dlg.scrollTop = 0;
  });
}
const confirmDlg = (title, html, yes, no) =>
  dialog(title, html, [[yes || 'Yes', true, 'primary'], [no || 'No', false]]);
const alertDlg = (title, html, tone) => dialog(title, html, [['OK', true, 'primary']], tone);

// Amount picker, 1..max. opts: unit (price each), cash (amount is money), ok (button label).
function askQty(title, html, max, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <div class="qty"><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="${max}">
      <input id="qs" type="range" min="1" max="${max}" value="${max}"></div>
      <div class="quick"><button data-q="1">Min</button><button data-q="h">Half</button><button data-q="m">Max</button></div>
      <div class="total" id="qt"></div>
      <div class="dbtns"><button id="qok" class="primary">${opts.ok || 'OK'}</button><button id="qcancel">Cancel</button></div>`;
    const qn = $('#qn'), qs = $('#qs'), qt = $('#qt');
    const value = () => Math.max(0, Math.min(max, Math.floor(Number(qn.value) || 0)));
    const show = () => {
      const v = value();
      qt.textContent = !v ? '' : opts.unit ? `${num(v)} x ${money(opts.unit)} = ${money(v * opts.unit)}`
        : opts.cash ? money(v) : num(v);
      $('#qok').disabled = !v;
    };
    const set = v => { qn.value = v; qs.value = v; show(); };
    qn.oninput = () => { qs.value = value(); show(); };
    qs.oninput = () => { qn.value = qs.value; show(); };
    dlg.querySelector('.quick').onclick = e => {
      const q = e.target.dataset.q;
      if (q) set(q === 'm' ? max : q === 'h' ? Math.max(1, Math.floor(max / 2)) : 1);
    };
    const done = v => { overlay.hidden = true; resolve(v); };
    $('#qok').onclick = () => done(value() || null);
    $('#qcancel').onclick = () => done(null);
    qn.onkeydown = e => { if (e.key === 'Enter' && value()) done(value()); };
    show();
    if (AUTO) return resolve([null, 1, max, rnd(1, max)][rnd(0, 3)]);
    overlay.hidden = false;
  });
}

function askText(title, html) {
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <input id="tx" type="text" maxlength="16" autocomplete="off" placeholder="anon">
      <div class="dbtns"><button id="tok" class="primary">OK</button></div>`;
    const done = () => { overlay.hidden = true; resolve($('#tx').value.trim()); };
    $('#tok').onclick = done;
    $('#tx').onkeydown = e => { if (e.key === 'Enter') done(); };
    if (AUTO) return resolve('bot');
    overlay.hidden = false;
    $('#tx').focus();
  });
}

// ---------- weapon shops ----------
// kinds: which weapon kinds this shop sells. markup: price multiplier on everything except military hardware.
// hot: true for the black-market dealer (no background check, and every purchase adds a little Heat).
async function weaponShop(title, blurb, kinds, markup, hot) {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5;
    const mine = WEAPONS[S.weapon], tradeIn = mine ? Math.round(mine[1] * 0.3) : 0;
    const priceOf = w => Math.max(0, Math.round(w[1] * scale * (w[4] === 'heavy' ? 1 : markup)) - tradeIn);
    let html = `<p>${blurb}</p><p>Cash: <span class="green">${money(S.cash)}</span>. You carry: ` +
      `<b>${mine ? mine[0] : 'nothing'}</b>${mine ? ` (worth ${money(tradeIn)} as a trade-in)` : ''}.</p>` +
      (mine ? `<div class="syn">${withIcon(weaponIcon(S.weapon), `<b>${mine[0]}</b><br>${mine[2] > 1 ? `${mine[2]} shots a round, ` : ''}${pct(mine[3])}% to hit`)}</div>` : '');
    for (const kind of kinds) {
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${WTYPE[kind][0].toUpperCase()}</b><br>${WTYPE[kind][1]}</p>`;
      if (!hot && kind === 'gun' && S.heat >= 40) {   // the legal store checks who it sells guns to
        html += '<p class="red">"Your background check came back... interesting. No firearms for you today."</p>' +
          '<p class="dim">Get your Heat under 40%, or try the arms dealer at the black market.</p>';
        continue;
      }
      WEAPONS.map((w, i) => [w, i]).filter(([w]) => w && w[4] === kind).sort((a, b) => a[0][1] - b[0][1]).forEach(([w, i]) => {
        const price = priceOf(w), owned = i === S.weapon, ok = !owned && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}>` + withIcon(weaponIcon(i),
          `<span class="${owned ? 'dim' : ok ? 'amber' : 'red'}">${owned ? 'yours' : money(price)}</span> &middot; <b>${w[0]}</b><br>` +
          `${w[2] > 1 ? `${w[2]} shots a round, ` : ''}${pct(w[3])}% to hit${usesAmmo(w) ? ' &middot; <span class="dim">uses ammo</span>' : ''}`) + '</div>';
      });
    }
    // Ammunition: the gun store stocks the ordinary kinds, the van has everything.
    html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">AMMUNITION</b><br>Sold in boxes of ${AMMO_BOX}. ` +
      'Firearms and military hardware use one round a shot; better rounds hit more often.</p>';
    for (const [key, [name, boxPrice, , legal]] of Object.entries(AMMO)) {
      if (!hot && !legal) continue;
      const price = Math.round(boxPrice * scale * (hot && legal ? markup : 1));
      const ok = S.cash >= price && S.ammo[key] + AMMO_BOX <= AMMO_MAX;
      html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="a:${key}"` : ''}>` + withIcon(ammoIcon(key),
        `<span class="${ok ? 'amber' : 'red'}">${money(price)}</span> &middot; <b>${name}</b><br>${hitChange(key)} &middot; you have ${S.ammo[key]}`) + '</div>';
    }
    html += '<p class="dim">Tap a weapon to buy it. You carry one at a time, and your old one is traded in.' +
      (hot ? ' Hardware from the van is hot: each purchase adds 5% Heat.' : '') + '</p>';
    const choice = await dialog(title, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    if (String(choice).startsWith('a:')) {   // a box of ammo
      const key = choice.slice(2), price = Math.round(AMMO[key][1] * scale * (hot && AMMO[key][3] ? markup : 1));
      if (S.cash < price) continue;
      S.cash -= price;
      S.ammo[key] += AMMO_BOX;
      if (!S.ammo[S.loaded]) S.loaded = key;
      log(`Bought ${AMMO_BOX} ${AMMO[key][0]} for ${money(price)}.`);
      render();
      continue;
    }
    const index = Number(choice), w = WEAPONS[index], price = priceOf(w);
    if (!w || index === S.weapon || S.cash < price) continue;
    S.cash -= price;
    S.weapon = index;
    if (usesAmmo(w)) {   // every firearm comes with a few rounds to get you started
      S.ammo.std = Math.min(AMMO_MAX, S.ammo.std + 10);
      if (!S.ammo[S.loaded]) S.loaded = 'std';
    }
    if (hot) heatUp(5);
    log(`Bought: ${w[0]} for ${money(price)}.`);
    render();
  }
}

// Choose which ammo to load. Costs nothing and takes no time.

          `<b class="${key === S.loaded && have ? 'amber' : have ? '' : 'dim'}">${name}</b>${key === active ? ' <span class="green">&larr; loaded</span>' : ''}` +

// ---------- clothing and armour store ----------
// Two items for every slot each day: one plain, one from the better rack.
function outfitStock() {
  const stock = [];
  for (const slot of Object.keys(SLOTS)) {
    stock.push(makeItem(pick([0, 0, 1]), slot));
    stock.push(makeItem(Math.min(3, Math.max(1, rollRarity(S.day * 0.3 + 5))), slot));
  }
  return stock;
}

async function outfitShop() {
  for (;;) {
    const scale = 1 + Math.floor(S.day / 10) * 0.5, full = career.bag.length >= BAG_SIZE;
    let html = '<p>"Welcome to Ctrl+Alt+Drip. Streetwear, body armour, and things with too many pockets."</p>' +
      `<p>Cash: <span class="green">${money(S.cash)}</span>. Bag ${career.bag.length}/${BAG_SIZE}.</p>` +
      (full ? '<p class="red">Your bag is full. Scrap or store something before you buy more.</p>' : '');
    for (const [slot, [label]] of Object.entries(SLOTS)) {
      const rack = S.store.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
      if (!rack.length) continue;
      html += `<p class="dim" style="margin:12px 0 4px"><b class="cyan">${label.toUpperCase()}</b></p>`;
      for (const [it, i] of rack) {
        const price = Math.round(itemValue(it) * scale * 0.9), ok = !full && S.cash >= price;
        html += `<div class="syn${ok ? ' pickable' : ''}"${ok ? ` data-pick="${i}"` : ''}><span class="${ok ? 'amber' : 'red'}">${money(price)}</span>${itemHtml(it)}</div>`;
      }
    }
    html += S.store.length ? '<p class="dim">Tap an item to buy it. It goes into your bag; put it on from the Gear screen. New stock arrives every day.</p>'
      : '<p>You bought everything on the racks. New stock arrives tomorrow.</p>';
    const choice = await dialog(OUTFITTER, html, [['Leave', null, 'primary']]);
    if (choice === null) return;
    const it = S.store[Number(choice)];
    if (!it) continue;
    const price = Math.round(itemValue(it) * scale * 0.9);
    if (S.cash < price || career.bag.length >= BAG_SIZE) continue;
    S.cash -= price;
    S.store.splice(Number(choice), 1);
    career.bag.push(it);
    saveCareer();
    log(`Bought: <span class="r${it.rar}">${it.name}</span> for ${money(price)}.`);
    render();
  }
}

// How a bag item's stats differ from the item worn in its slot.
function swapDiff(it) {
  const worn = career.gear[it.slot];
  const keys = [...new Set([...Object.keys(it.stats), ...Object.keys(worn ? worn.stats : {})])];
  const parts = keys.map(k => {
    const d = (it.stats[k] || 0) - ((worn && worn.stats[k]) || 0);
    return d ? `<span class="${d > 0 ? 'green' : 'red'}">${d > 0 ? '+' : ''}${d}${STATS[k][3]} ${STATS[k][0]}</span>` : '';
  }).filter(Boolean);
  const room = carries(it) - carries(worn);   // what the bag or the pockets hold
  if (room) parts.unshift(`<span class="${room > 0 ? 'green' : 'red'}">holds ${room > 0 ? '+' : ''}${room}</span>`);
  return parts.length ? `<br><span class="dim">If you swap:</span> ${parts.join(', ')}` : '';
}

// Wear or scrap one item from the bag.
async function bagItem(index) {
  const it = career.bag[index], worn = career.gear[it.slot];
  const act = await dialog(it.name, `<div class="syn">${itemHtml(it)}${swapDiff(it)}</div>` +
    (worn ? `<p class="dim">Replaces what you are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Wear it', 'e', 'primary'], [`Scrap for ${money(scrapValue(it))}`, 's', 'danger'], ['Back', null, 'small']]);
  if (act === 'e' && tooFull(it.slot, it)) {
    await alertDlg('Too much to carry', tooFull(it.slot, it));
  } else if (act === 'e') {
    career.bag.splice(index, 1);
    if (worn) career.bag.push(worn);
    career.gear[it.slot] = it;
    log(`Now wearing <span class="r${it.rar}">${it.name}</span>.`);
  } else if (act === 's') {
    career.bag.splice(index, 1);
    S.cash += scrapValue(it);
    log(`Scrapped ${it.name} for ${money(scrapValue(it))}.`);
  }
  saveCareer();
  render();
}

// Best gear first, then grouped by slot, so the bag reads the same every time you open it.
function sortBag() {
  const order = Object.keys(SLOTS);
  career.bag.sort((a, b) => b.rar - a.rar || order.indexOf(a.slot) - order.indexOf(b.slot) || a.name.localeCompare(b.name));
}

// One slot: what is worn there, and everything in the bag that could replace it.
async function swapSlot(slot) {
  const label = SLOTS[slot][0], worn = career.gear[slot];
  const options = career.bag.map((it, i) => [it, i]).filter(([it]) => it.slot === slot);
  const change = swapDiff;
  const html = `<p class="dim">WEARING</p><div class="syn">${worn ? itemHtml(worn) : 'Nothing'}</div>` +
    (options.length
      ? '<p class="dim">IN YOUR BAG: tap one to wear it</p>' + options.map(([it, i]) =>
        `<div class="syn pickable" data-pick="${i}">${itemHtml(it)}${change(it)}</div>`).join('')
      : `<p>Nothing in your bag fits the ${label.toLowerCase()} slot. Rival crews drop gear and the black market sells it.</p>`);
  const buttons = options.map(([it, i]) => [`Wear ${it.name}`, String(i), 'r' + it.rar, gearIcon(it)]);
  if (worn && career.bag.length < BAG_SIZE) buttons.push(['Take it off', 'off']);
  buttons.push(['Back', null, 'primary']);
  const choice = await dialog(`${label} slot`, html, buttons);
  if (choice === null) return;
  const swap = choice === 'off' ? null : career.bag[Number(choice)];
  if (tooFull(slot, swap)) return alertDlg('Too much to carry', tooFull(slot, swap));
  if (choice === 'off') {   // back into the bag, leaving the slot empty
    career.bag.push(worn);
    delete career.gear[slot];
    log(`Took off <span class="r${worn.rar}">${worn.name}</span>.`);
    saveCareer();
    render();
    return;
  }
  const index = Number(choice), it = career.bag[index];
  career.bag.splice(index, 1);
  if (worn) career.bag.push(worn);
  career.gear[slot] = it;
  log(`Now wearing <span class="r${it.rar}">${it.name}</span>.`);
  saveCareer();
  render();
}

  if (GEAR_SPOTS.includes(S.loc)) acts += '<button data-act="gear">Black market</button><button data-act="dealer">Arms dealer</button>';
  if (GEAR_SPOTS.includes(S.loc) && stuckTotal()) acts += `<button class="danger" data-act="clinic">Street doc: get them out (${stuckTotal()})</button>`;
  if (S.loc === GUN_SPOT) {

  $('#actions').innerHTML = acts;

// ---------- actions ----------
const ACTIONS = {
  async buy(name) {
    const price = S.prices[name];
    if (!price) return;
    const most = Math.min(Math.floor(S.cash / price), free());
    if (most <= 0) return;
    const qty = await askQty(`Buy ${name}`, `<p>${money(price)} each. You can take up to ${num(most)}.</p>`,
      most, {unit: price, ok: 'Buy'});
    if (!qty) return;
    S.cash -= qty * price;
    addItems(name, qty, price);
    addHeat(qty * price);
    SND.play('buy');
    log(`Bought ${num(qty)} ${name} for ${money(qty * price)}.`);
  },

  async sell(name) {
    const list = S.prices[name], all = S.inv[name] || 0;
    if (!list || !all) return;
    // Goods a street doc had to remove carry a tag and sell for less. They are sold apart from the clean ones.
    const marked = tagged(name), clean = all - marked, low = tagPrice(list);
    let cut = !clean;
    if (marked && clean) {
      const which = await dialog(`Sell ${name}`, `<p>You hold ${num(all)} ${name}. ${num(marked)} of them carry a tag:</p>` +
        `<div class="syn">${tagHtml}<br><span class="dim">Buyers pay ${pct(TAG_CUT)}% less for those: ` +
        `<s>${money(list)}</s> <b class="amber">${money(low)}</b> each. Nobody asks why. Everybody knows why.</span></div>`,
        [[`Sell clean ones (${num(clean)}) at ${money(list)}`, 'c', 'primary'], [`Sell tagged ones (${num(marked)}) at ${money(low)}`, 't'],
          ['Cancel', null, 'small']]);
      if (!which) return;
      cut = which === 't';
    }
    const price = cut ? low : list, held = cut ? marked : clean;
    const qty = await askQty(`Sell ${name}`,
      (cut ? `<p>${tagHtml}</p><p>Buyers pay <s>${money(list)}</s> <b class="amber">${money(price)}</b> each for these: ${pct(TAG_CUT)}% off.` : `<p>Buyers pay ${money(price)} each.`) +
      ` You hold ${num(held)}, bought at ${money(S.cost[name] || 0)}.</p>`,
      held, {unit: price, ok: 'Sell'});
    if (!qty) return;
    const profit = (price - (S.cost[name] || 0)) * qty;
    S.cash += qty * price;
    removeItems(name, qty, cut);
    if (cut) { tagSales += qty; tally('reasons', qty); }
    addHeat(qty * price);
    const xp = profit > 0 ? gainXp(Math.min(60, Math.sqrt(profit) / 4)) : '';
    if (profit > 0) { tally('profit', profit); if (S.flags[name] === 'up') tally('spike'); }
    S.mood = profit > 0 ? 'grin' : profit < 0 ? 'ouch' : S.mood;
    SND.play(profit >= 0 ? 'cash' : 'loss');
    log(`Sold ${num(qty)} ${name} for ${money(qty * price)} ` +
      `(<span class="${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${money(profit)}</span>).${cut ? ` ${tagHtml}` : ''}${xp}`);
  },

  async contract(index) {
    const c = S.contracts[index];
    if (!c || (S.inv[c.good] || 0) < c.qty) return;
    const chance = chanceFor(c), pay = payoutFor(c), price = S.prices[c.good];
    const compare = price ? `Selling them here instead would bring ${money(price * c.qty)}.` : 'Nobody is buying them here today.';
    if (!await confirmDlg('Freelance job', `<p><b>${c.job}</b>, for ${c.client}.</p>` +
      `<p>Uses up ${num(c.qty)} ${c.good}. Pays <span class="amber">${money(pay)}</span> if it works. ${compare}</p>` +
      `<p>Chance of success: <b>${chance}%</b></p>` +
      '<p class="dim">If it fails the goods are burned, your Heat jumps, and you may be traced. ' +
      'Levels and proxies raise the chance; Heat lowers it.</p>', 'Run the job', 'Walk away')) return;
    removeItems(c.good, c.qty);
    S.contracts.splice(index, 1);
    const quiet = inSyn('ghost'), heatWas = S.heat;
    if (Math.random() * 100 < chance) {
      S.cash += pay;
      S.mood = 'grin';
      heatUp(quiet ? 4 : 8);
      const xp = gainXp(40 + (100 - c.chance));
      tally('jobs');
      if (heatWas < 30) tally('quietjob');
      SND.play('hack'); SND.play('imin', 0.45); SND.play('cash', 1.2);
      log(`<span class="green">Freelance job done: ${c.client} paid ${money(pay)}.</span>${xp}`);
      await alertDlg('Job done', `<p>Clean work. ${c.client} pays <b>${money(pay)}</b>.</p>`);
    } else {
      heatUp(quiet ? 8 : 15);
      S.mood = 'ouch';
      const xp = gainXp(10);
      SND.play('hack'); SND.play('lose', 0.45);
      log(`<span class="red">Freelance job blown: ${num(c.qty)} ${c.good} burned.</span>${xp}`);
      await alertDlg('Job blown', `<p>It goes sideways. The ${c.good} are burned and ${c.client} stops answering.</p>`, 'danger');
      if (Math.random() < 0.35) await lawEncounter();
    }
  },

  // Break into a rival syndicate's node for loot. Once a day.
  async raid() {
    if (S.raided) return;
    if (!S.proxies && !S.inv['Zero-Days']) {
      return alertDlg('Hack a rival', '<p>You need at least one proxy chain or a Zero-Day to breach a rival node.</p>' +
        `<p class="dim">Proxy chains are sold at the black market (${GEAR_SPOTS.join(', ')}).</p>`);
    }
    const mood = g => g >= 3 ? '<span class="red">out for blood</span>' : g >= 1 ? '<span class="amber">watching you</span>' : 'ignoring you';
    const crews = rivals();
    const html = '<p>Breach a rival node and drain it. One raid a day. It is a hacking fight: weapons are no use, ' +
      'and if they win they rob you instead.</p>' +
      crews.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b> &middot; ${mood(S.grudge[k])}</div>`).join('') +
      '<p class="dim">Every raid makes that crew more likely to come after you.</p>';
    const buttons = crews.map(k => [SYNDICATES[k][0], k]);
    buttons.push(['Not today', null, 'small']);
    const key = await dialog('Hack a rival', html, buttons);
    if (!key) return;
    S.raided = true;
    await fight({kind: 'raid', gang: key, name: SYNDICATES[key][0], n: rnd(2, 3 + Math.floor(S.day / 6)),
      hit: 0.3, lo: 3, hi: 8});
  },

  async medkit() {
    if (!S.medkits || S.hp >= 100) return;
    S.medkits--;
    S.hp = Math.min(100, S.hp + MED_HEAL);
    SND.play('heal');
    log(`Used a medkit: Health back to ${S.hp}%.`);
  },

  // Wear, swap and scrap gear.
  async gearmenu() {
    for (;;) {
      const totals = Object.keys(STATS).filter(k => bonus(k)).map(k => statLine(k, bonus(k)));
      const html = `<div class="avatarbox"><div class="zoomable" data-pick="zoom">${avatarSvg()}<small>tap to zoom</small></div><div>` +
        Object.entries(SLOTS).map(([slot, [label]]) => {
        const it = career.gear[slot];
        return `<div class="slotline" data-pick="slot:${slot}">${it ? gearIcon(it) : ''}<span><span class="dim">${label}</span><br>` + (it
          ? `<b class="r${it.rar}">${it.name}</b><br>${itemStats(it)}`
          : '<span class="dim">empty</span>') + '</span></div>';
      }).join('') + '</div></div>' +
        `<p><b>Total bonuses:</b> ${totals.length ? totals.join(', ') : 'none yet'}</p>` +
        `<p>${capLines()}<br><span class="dim">Backpacks and anything with pockets add to what you can carry. ` +
        'The number takes the colour of your backpack.</span></p>' +
        `<p class="dim">BAG ${career.bag.length}/${BAG_SIZE}. Tap an item to wear or scrap it. Gear drops from rival crews, ` +
        'is sold at the black market, and stays with you between runs.</p>' +
        `<p class="dim">${RARITY.map((name, i) => `<span class="r${i}">${name}</span>`).join(' &middot; ')}</p>`;
      const buttons = career.bag.map((it, i) => [it.name, i, 'r' + it.rar, gearIcon(it)]);
      buttons.push(['Change your look', 'look'], ['Close', null, 'primary']);
      const index = await dialog('Gear', html, buttons);
      if (index === null) return;
      if (index === 'look') { await ACTIONS.look(); continue; }
      if (index === 'zoom') { await inspectGear(); continue; }
      if (typeof index === 'string' && index.startsWith('slot:')) { await swapSlot(index.slice(5)); continue; }
      await bagItem(index);
    }
  },

  // Everything you are carrying on one screen, as a grid of picture tiles:
  // goods, weapon and ammo, supplies, and the gear bag. Tapping a tile opens it.
  async inventory() {
    // pick: what the dialog answers when the tile is tapped. cls: extra classes (rarity, wide, state).
    const tile = (pick, art, label, count, cls) =>
      `<div class="tile ${cls || ''}"${pick ? ` data-pick="${pick}"` : ''}>${art}` +
      (count ? `<i>${count}</i>` : '') + `<small>${label}</small></div>`;
    const head = (title, note) => `<div class="invhead"><b>${title}</b><span>${note}</span></div>`;
    const none = text => `<p class="dim">${text}</p>`;
    const initials = name => {
      const words = name.split(/[\s-]+/);
      return (words.length > 1 ? words.map(word => word[0]).join('').slice(0, 3) : name.slice(0, 2)).toUpperCase();
    };
    for (;;) {
      sortBag();
      // --- goods on the drive: green when they sell here for more than you paid, red for less ---
      const goods = GOODS.map(g => g[0]).filter(n => S.inv[n]);
      let worth = 0, paid = 0;
      const goodsHtml = goods.map(n => {
        const q = S.inv[n], price = S.prices[n], cost = S.cost[n] || 0;
        paid += q * cost;
        if (price) worth += (q - tagged(n)) * price + tagged(n) * tagPrice(price);
        const cls = !price ? 'dim' : price > cost ? 'green' : price < cost ? 'red' : '';
        // Tagged ones get a tile of their own, next to the clean ones of the same kind.
        const marked = tagged(n), glyph = `<b class="glyph ${cls}">${initials(n)}</b>`;
        return (q > marked ? tile('g:' + n, glyph, n, 'x' + num(q - marked)) : '') +
          (marked ? tile('g:' + n, glyph, tagHtml, 'x' + num(marked) + ' &#9888;', 'tagged wide') : '');
      }).join('');
      // --- stuck in the prison pocket: listed, but locked ---
      const stuckHtml = Object.keys(S.stuck).map(n =>
        tile('k:' + n, `<b class="glyph">${initials(n)}</b>`, n, 'x' + num(S.stuck[n]) + ' &#128274;', 'stuck')).join('');
      // --- weapon and ammunition ---
      const w = WEAPONS[S.weapon], active = activeAmmo();
      const weaponHtml = (w ? tile('weapon', weaponIcon(S.weapon), w[0], '', 'wide')
        : tile('', '<b class="glyph dim">&mdash;</b>', 'Unarmed', '', 'wide empty')) +
        Object.keys(AMMO).filter(k => S.ammo[k] > 0).map(k =>
          tile('a:' + k, ammoIcon(k), AMMO[k][4], 'x' + S.ammo[k], k === active && usesAmmo(w) ? 'on' : '')).join('');
      // --- supplies: medkits, proxies and single-use gadgets ---

      if (S.proxies) supplies += tile('s:proxy', miscIcon('proxy'), 'Proxy', 'x' + S.proxies);
      for (const [k, g] of Object.entries(GADGETS)) if (S[k]) supplies += tile('s:' + k, miscIcon(k), g[0], 'x' + S[k]);
      // --- the gear bag: one tile per slot in the bag, filled or empty; yellow corner = better than what you wear ---
      const better = it => {
        const worn = career.gear[it.slot];

      };
      let bagHtml = career.bag.map((it, i) =>
        tile('b:' + i, gearIcon(it), SLOTS[it.slot][0], better(it) ? '&#9650;' : '', `r${it.rar}`)).join('');
      for (let i = career.bag.length; i < BAG_SIZE; i++) bagHtml += '<div class="tile empty"></div>';
      const junk = career.bag.filter(it => it.rar === 0);
      const junkCash = junk.reduce((sum, it) => sum + scrapValue(it), 0);
      const html = head('Goods', `drive ${driveHtml()}`) +
        (goods.length ? `<div class="tiles">${goodsHtml}</div>` + '<p class="dim">' +
          (goods.some(n => S.prices[n]) ? `Sells here for <b class="${worth > paid ? 'green' : worth < paid ? 'red' : ''}">${money(worth)}</b>`
            : 'No market here') + ` &middot; you paid ${money(paid)}</p>` +
          (goods.some(n => tagged(n)) ? `<p class="dim">&#9888; ${tagHtml}: these sell for ${pct(TAG_CUT)}% less.</p>` : '')
          : none('Your drive is empty.')) +
        (stuckHtml ? head('Prison pocket', `<span class="red">${stuckTotal()}/${POCKET_CAP} stuck</span>`) + `<div class="tiles">${stuckHtml}</div>` +
          `<p class="red">Stuck. They cannot be sold, used or moved until a street doc at the black market (${docSpots()}) takes them out. ` +
          `${sickLeft() <= 1 ? 'Sleep on them again and you die of dysentery.' : `You can sleep on them ${nights(sickLeft() - 1)}.`}</p>` : '') +
        head('Weapon &amp; ammo', w ? (WTYPE[w[4]] || [''])[0] : 'unarmed') + `<div class="tiles">${weaponHtml}</div>` +
        head('Supplies', '') + (supplies ? `<div class="tiles">${supplies}</div>` : none('No medkits, proxies or gadgets.')) +
        head('Gear bag', `${career.bag.length}/${BAG_SIZE}`) + `<div class="tiles">${bagHtml}</div>` +
        none('Tap anything to see it, use it, wear it or scrap it. &#9650; marks gear rarer than what you are wearing.');
      const buttons = [['Loadout', 'gear']];
      if (junk.length) buttons.push([`Scrap ${junk.length} Common for ${money(junkCash)}`, 'junk', 'danger']);
      buttons.push(['Close', null, 'primary']);
      const choice = await dialog('Inventory', html, buttons);
      if (choice === null) return;
      const arg = choice.slice(2);
      if (choice === 'gear') await ACTIONS.gearmenu();
      else if (choice === 'junk') {
        if (await confirmDlg('Scrap Common gear', `<p>Scrap every Common item in your bag (${junk.length}) for <b>${money(junkCash)}</b>?</p>` +
          '<p class="dim">What you are wearing and what is in the locker stay untouched.</p>', 'Scrap them', 'Keep them')) {
          career.bag = career.bag.filter(it => it.rar !== 0);
          S.cash += junkCash;
          log(`Scrapped ${junk.length} Common item${junk.length === 1 ? '' : 's'} for ${money(junkCash)}.`);
          saveCareer();
        }
      } else if (choice === 'weapon') {
        await dialog(w[0], `<div class="syn">${withIcon(weaponIcon(S.weapon), `<b>${w[0]}</b> <span class="dim">${(WTYPE[w[4]] || [''])[0]}</span><br>` +
          `${Math.round(w[3] * 100)}% to hit${w[2] > 1 ? ` &middot; ${w[2]} shots a round` : ''}`)}</div>` +
          (!usesAmmo(w) ? none('Needs no ammunition.')
            : active ? `<p>Loaded with <b>${AMMO[active][0]}</b>: ${hitChange(active)}, ${S.ammo[active]} rounds left.</p>`
              : '<p class="red">No ammunition. It will not fire until you buy some.</p>'),
          [['Back', null, 'primary']]);
      } else if (choice.startsWith('a:')) {
        const [name, , , , short] = AMMO[arg];
        const act = await dialog(name, `<div class="syn">${withIcon(ammoIcon(arg), `<b>${name}</b> <span class="dim">${short}</span><br>` +
          `${hitChange(arg)} &middot; ${S.ammo[arg]} rounds`)}</div>` +
          (arg === active ? '<p class="green">This is what your weapon fires.</p>'
            : none('If the loaded kind runs out, your weapon falls back to the best kind you have left.')),
          arg === S.loaded ? [['Back', null, 'primary']] : [['Load it', 'load', 'primary'], ['Back', null]]);
        if (act === 'load') S.loaded = arg;
      } else if (choice.startsWith('s:')) {
        const [name, text, have, most, usable] = arg === 'medkit'
          ? ['Medkit', `heals ${MED_HEAL}% Health, even in the middle of a fight`, S.medkits, MAX_MED, S.hp < 100]
          : arg === 'proxy' ? ['Proxy chain', 'powers your counter-hacks; more proxies, better odds', S.proxies, MAX_PROXIES, false]
            : [GADGETS[arg][0], GADGETS[arg][3], S[arg], GADGETS[arg][2], COOL[arg] ? !coolBlock(arg) : arg === 'fakeid' && S.heat > 0];
        const fightOnly = arg !== 'medkit' && arg !== 'fakeid' && !COOL[arg];
        const act = await dialog(name, `<div class="syn">${withIcon(miscIcon(arg), `<b>${name}</b><br>${text}`)}</div>` +
          `<p>You carry <b>${have}</b> of ${most}.</p>` + (COOL[arg] ? coolHint(arg) : '') +
          (fightOnly ? none('Used from the fight screen.')
            : usable || COOL[arg] ? '' : none(arg === 'medkit' ? 'Your Health is already full.' : 'You have no Heat to drop.')),
          usable ? [['Use it', 'use', 'primary'], ['Back', null]] : [['Back', null, 'primary']]);
        if (act === 'use') await ACTIONS[arg]();
      } else if (choice.startsWith('g:')) {
        const q = S.inv[arg], price = S.prices[arg], cost = S.cost[arg] || 0;
        const act = await dialog(arg, `<div class="syn"><b>${arg}</b> x${num(q)}<br>paid ${money(cost)} each, ${money(q * cost)} in all</div>` +
          (price ? `<p>Sells here for <b class="${price > cost ? 'green' : price < cost ? 'red' : ''}">${money(price)}</b> each, ` +
            `${money((q - tagged(arg)) * price + tagged(arg) * tagPrice(price))} for the lot.</p>` : none('Nobody is buying these here.')) +
          (tagged(arg) ? `<div class="syn">${num(tagged(arg))} of them carry a tag: ${tagHtml}<br><span class="dim">Those sell for ${pct(TAG_CUT)}% less` +
            `${price ? `: ${money(tagPrice(price))} each here` : ''}. A street doc had to remove them. That is all anyone needs to know.</span></div>` : ''),
          [price ? ['Sell', 'sell', 'primary'] : ['Dump', 'dump', 'danger'], ['Back', null]]);
        if (act) await ACTIONS[act](arg);
      } else if (choice.startsWith('k:')) {
        await dialog(arg, `<div class="syn"><b class="red">${arg}</b> x${num(S.stuck[arg])} &#128274;<br>stuck in your prison pocket</div>` +
          `<p>They cannot be sold, used, stashed or dumped until a street doc at the black market (${docSpots()}) takes them out. ` +
          'He also patches you up to full Health while he is in there.</p>' +
          `<p class="amber">${sickLeft() <= 1 ? 'Sleep on them again and you die of dysentery.' : `You can sleep on them ${nights(sickLeft() - 1)} before the one that kills you.`}</p>`,
          [['Back', null, 'primary']]);
      } else if (choice.startsWith('b:')) await bagItem(Number(arg));
      render();
    }
  },

  // Character creator: skin, hair and streak. Saved with the career.
  async look() {
    const sizes = {skin: SKINS.length, hair: HAIRSTYLES.length, col: HAIRCOLS.length, streak: STREAKS.length};
    for (;;) {
      const L = getLook();
      const cmd = await dialog('Your look', `<div class="posebox">${avatarSvg({plain: true})}</div>` +
        '<p class="dim">Tap a button to step through the choices. Your look stays with you between runs, ' +
        'and you can change it any time from the Gear screen.</p>',
        [[`Skin: ${SKINS[L.skin][0]}`, 'skin'], [`Hair: ${HAIRSTYLES[L.hair]}`, 'hair'],
          [`Hair colour: ${HAIRCOLS[L.col][0]}`, 'col'], [`Streak: ${STREAKS[L.streak][0]}`, 'streak'],
          ['Surprise me', 'any'], ['Done', null, 'primary']]);
      if (!cmd) break;
      if (cmd === 'any') for (const key of Object.keys(sizes)) L[key] = rnd(0, sizes[key] - 1);
      else L[cmd] = (L[cmd] + 1) % sizes[cmd];
      career.look = L;
      saveCareer();
    }
    career.look = getLook();
    saveCareer();
  },

  // --- the Bunker: stash goods, lock up gear, sleep ---
  async store(name) {
    const held = S.inv[name] || 0, most = Math.min(held, STASH_CAP - stashTotal());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Stash ${name}`, `<p>Move them off your drive into the Bunker. You carry ${num(held)}.</p>`,
      most, {ok: 'Store'});
    if (!qty) return;
    const had = S.stash[name] || 0;
    S.stashCost[name] = Math.floor(((S.stashCost[name] || 0) * had + (S.cost[name] || 0) * qty) / (had + qty));
    S.stash[name] = had + qty;
    const tagWas = tagged(name);
    removeItems(name, qty);   // clean ones first; any tagged ones that go keep their tag in the stash
    if (tagWas > tagged(name)) S.stashTag[name] = (S.stashTag[name] || 0) + tagWas - tagged(name);
    log(`Stashed ${num(qty)} ${name} in the Bunker.`);
  },

  async take(name) {
    const had = S.stash[name] || 0, most = Math.min(had, free());
    if (S.loc !== BUNKER || most <= 0) return;
    const qty = await askQty(`Take ${name}`, `<p>Load them back onto your drive. The stash holds ${num(had)}.</p>`,
      most, {ok: 'Take'});
    if (!qty) return;
    const stTag = Math.min(S.stashTag[name] || 0, had), back = Math.max(0, qty - (had - stTag));   // clean ones first
    addItems(name, qty, S.stashCost[name] || 0, back);
    if (back) S.stashTag[name] = stTag - back;
    S.stash[name] = had - qty;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
    fixTags();
    log(`Took ${num(qty)} ${name} out of the stash.`);
  },

  // Sleeping is the only thing that ends the day. The law may come in the night.
  async sleep() {
    if (S.loc !== BUNKER) return;
    if (S.day >= DAYS) return ACTIONS.cashout();
    const gut = !stuckTotal() ? '' : sickLeft() <= 1
      ? '<p class="red"><b>You still have goods stuck in your prison pocket. If you sleep now, you will die of dysentery.</b> ' +
        `The street doc is at ${docSpots()}.</p>`
      : `<p class="amber">You still have goods stuck in your prison pocket. Sleeping on them makes you sicker: ${nights(sickLeft() - 1)} ` +
        `and then the one that kills you. The street doc is at ${docSpots()}.</p>`;
    if (!await confirmDlg('Sleep', gut + '<p>Sleep in the Bunker and end the day? You recover 35% Health and 15% OpSec, and your Heat cools.</p>' +
      '<p class="dim">Rival crews can\'t find you here, but the hotter you are, the more likely the law kicks the door in overnight.</p>',
      'Go to sleep', 'Stay up')) return;
    if (S.heat < 20) tally('cool');
    if (S.heat <= 0) tally('zeroheat');
    SND.play('sleep');
    nextDay();
    // Sleeping on stuck goods makes you ill: less rest at first, then none, then dysentery.
    const ill = stuckTotal() ? ++S.sick : (S.sick = 0);
    S.hp = Math.min(100, S.hp + (ill >= 3 ? 0 : ill ? 15 : 35));
    S.opsec = Math.min(100, S.opsec + 15);
    S.heat = Math.max(0, S.heat - 20);
    log(`Day ${S.day}: you slept in the Bunker. New prices everywhere.`);
    render();
    if (ill) await sickNight(ill);
    if (S.over) return;
    if (Math.random() < Math.min(0.5, 0.03 + S.heat / 200) * (inSyn('ghost') ? 0.7 : 1)) await homeRaid(true);
  },

  async locker() {

        `<p class="dim">IN THE LOCKER ${career.locker.length}/${LOCKER_SIZE}</p>${list(career.locker, 'The locker is empty.')}` +
        '<p class="dim">The locker has a hidden compartment: raids never find it.</p>';
      const buttons = [];
      if (career.locker.length < LOCKER_SIZE) career.bag.forEach((it, i) => buttons.push([`Store ${it.name}`, 'b' + i, 'r' + it.rar, gearIcon(it)]));
      if (career.bag.length < BAG_SIZE) career.locker.forEach((it, i) => buttons.push([`Take ${it.name}`, 'l' + i, 'r' + it.rar, gearIcon(it)]));

  // The street doc at the black market takes out whatever is stuck in your prison pocket. It always can be
  // done: if you are short, the fee goes on your tab with the Fixer. The goods come back tagged.
  async clinic() {
    if (!GEAR_SPOTS.includes(S.loc) || !stuckTotal()) return;
    const fee = Math.round(EXTRACT_FEE * (1 + Math.floor(S.day / 10) * 0.5)), paid = Math.min(fee, S.cash), owed = fee - paid;
    const n = stuckTotal();
    if (!await confirmDlg('Street doc', `<div class="syn">${withIcon(miscIcon('doc'), '<b>Extraction</b><br>' +
      `removes what is stuck in your prison pocket, and patches you up from ${S.hp}% to full Health`)}</div>` +
      '<p>The street doc looks at you, then at the scan, then at you again. "I am not going to ask. I am going to charge."</p>' +
      `<p>Stuck: <b>${stuckList()}</b>.</p>` +
      `<p>Fee: <span class="amber">${money(fee)}</span>. You have <span class="green">${money(S.cash)}</span>.` +
      (owed ? ` <span class="amber">"I know the Fixer. The other ${money(owed)} goes on your tab."</span>` : '') + '</p>' +
      `<p class="dim">You get the goods back. They will sell for ${pct(TAG_CUT)}% less from now on, with a tag that reads: ${tagHtml}</p>`,
      'Get them out', 'Keep them in')) return;
    S.cash -= paid;
    S.debt += owed;
    for (const [name, qty] of Object.entries(S.stuck)) addItems(name, qty, S.stuckCost[name] || 0, qty);
    S.stuck = {}; S.stuckCost = {}; S.sick = 0;
    S.hp = 100;
    extractTally++;
    tally('extract');
    SND.play('heal');
    log(`<span class="green">The street doc got ${num(n)} goods out for ${money(fee)}${owed ? ` (${money(owed)} of it on the Fixer's tab)` : ''}. ` +
      `Health back to 100%.</span> ${tagHtml}`);
    render();
    await alertDlg('Extracted', `<p>Ten minutes, one pair of tongs, no eye contact. All <b>${num(n)}</b> are out, and you are patched up to <b>100% Health</b>.</p>` +
      `<p>He rinses them, bags them, and staples a tag to the bag: ${tagHtml}</p>` +
      `<p class="dim">Tagged goods sell for ${pct(TAG_CUT)}% less, wherever you sell them. Word gets around.</p>`);
  },

            (k === 'fakeid' ? (ok ? `<br><span class="green">Now: Heat ${S.heat}% &rarr; ${Math.max(0, S.heat - 40)}%</span>` : '<br><span class="dim">You have no Heat to drop.</span>')

  // Black market: weapons, gadgets, proxy chains, medkits and gear.
  async gear() {
    for (;;) {
      const scale = 1 + Math.floor(S.day / 10) * 0.5;
      const offers = [];
      // Heat items are in short supply (see coolStock) and cost more the hotter you are.
      const stock = coolStock(), hot = HOT_MARKUP[lawTier()];
      for (const [key, [name, price, most, what]] of Object.entries(GADGETS)) {
        if (COOL[key] && !stock[key]) continue;
        if (S[key] < most) offers.push({key: 'x' + key, gadget: key, art: key, name, price: Math.round(price * scale * (COOL[key] ? hot : 1)),
          text: `single use: ${what} (you have ${S[key]}${COOL[key] ? `; ${stock[key]} left here today` : ''})`});
      }
      if (S.proxies < MAX_PROXIES) offers.push({key: 'p', art: 'proxy', name: 'Proxy chain', price: Math.round(1500 * (1 + S.proxies) * scale),
        text: `for hacking back, raids and freelance jobs (you have ${S.proxies})`});
      if (S.medkits < MAX_MED) offers.push({key: 'm', art: 'medkit', name: 'Medkit', price: Math.round(600 * scale),
        text: `restores ${MED_HEAL}% Health any time, even mid-fight (you have ${S.medkits})`});
      S.shop.forEach((it, i) => offers.push({key: 'g' + i, name: it.name, price: Math.round(itemValue(it) * scale),
        item: it, cls: 'r' + it.rar}));
      if (S.hp < 100) offers.push({key: 'd', art: 'doc', name: 'Street doc', price: Math.round((100 - S.hp) * 40 * scale),
        text: `patches you up from ${S.hp}% to full Health`});
      const html = `<p>Cash: <span class="green">${money(S.cash)}</span>.</p>` +
        (offers.length ? offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">` +
          `${money(o.price)}</span>${o.item ? itemHtml(o.item) : withIcon(miscIcon(o.art), `<b>${o.name}</b><br>${o.text}`)}</div>`).join('')
          : '<p>You already own everything they sell.</p>') +
        (Object.keys(stock).some(k => stock[k]) ? (hot > 1 ? `<p class="amber">"${LAW[lawTier()].short} are asking about you. ` +
          `So anything that makes them stop asking costs ${Math.round((hot - 1) * 100)}% more today."</p>` : '') +
          `<p class="dim">Whatever lowers Heat is in short supply: each market gets a few a day. ${QUICK_NOTE}</p>` : '') +
        `<p class="dim">Looking for weapons? The arms dealer is right here, and ${GUN_STORE} is at the ${GUN_SPOT}.</p>`;
      const buttons = offers.filter(o => S.cash >= o.price)
        .map(o => [o.key === 'd' ? 'See the street doc' : `Buy ${o.name}`, o.key, o.cls, o.item ? gearIcon(o.item) : miscIcon(o.art)]);
      if (stuckTotal()) buttons.unshift([`Street doc: get them out (${stuckTotal()})`, 'clinic', 'danger', miscIcon('doc')]);
      buttons.push(['Leave', null, 'small']);
      const key = await dialog('Black market', html, buttons);
      if (!key) return;
      if (key === 'clinic') { await ACTIONS.clinic(); continue; }
      const o = offers.find(x => x.key === key);
      S.cash -= o.price;
      if (o.gadget) {
        S[o.gadget]++;
        if (COOL[o.gadget]) { stock[o.gadget]--; coolBuys++; }
      } else if (key === 'm') S.medkits++;
      else if (key === 'd') S.hp = 100;
      else if (o.item) { S.shop.splice(S.shop.indexOf(o.item), 1); stash(o.item); saveCareer(); }
      else S.proxies++;
      log(key === 'd' ? `The street doc patched you up for ${money(o.price)}.` : `Bought: ${o.name} for ${money(o.price)}.`);
      render();
    }
  },

    let html = `<p>Level <b>${li.level}</b>: <span class="cyan">${titleFor(li.level)}</span><br>` +
      `${li.into} / ${li.need} XP to the next level (${num(career.xp)} total)</p>` +

      'finishing a run and, most of all, syndicate missions. It carries over between runs.</p>' +
      '<p class="dim">Cyberware shows on your avatar as you level: ' + WARE.map(([at, what]) =>

    if (career.syn) {
      html += `<div class="syn"><b>${SYNDICATES[career.syn][0]}</b><br>${SYNDICATES[career.syn][1]}</div>`;

  },

  async menu() {

  },

  // Your syndicate's mission: the briefing, how far along you are, and anything you do from here
  // (handing over a delivery, starting the final breach).
  async syndicate() {
    const Q = quest();
    if (!Q) return;
    const key = career.syn, chain = QUESTS[key], q = career.quest, foe = NEMESIS[key];
    const held = S.inv[Q.good] || 0;
    let html = `<p class="dim">${SYNDICATES[key][0].toUpperCase()} &middot; handler: ${HANDLER[key]}</p>` +
      `<div class="syn"><b>${Q.order ? 'Standing orders' : `Mission ${q.n + 1} of ${chain.length}: ${Q.title}`}</b><br>"${Q.brief}"</div>` +
      `<p><b>${questGoal(Q)}</b><br><span class="cyan">${questStatus(Q)}</span></p><p>Reward: ${questReward(Q)}</p>`;
    const buttons = [];
    if (Q.kind === 'deliver') {
      if (S.loc === Q.place && held >= Q.t) buttons.push([`Hand over ${Q.t} ${Q.good}`, 'give', 'primary']);
      else html += `<p class="dim">${S.loc === Q.place ? `You are at ${Q.place}, but you need ${Q.t} ${Q.good} on your drive.`
        : `Carry ${Q.t} ${Q.good} to ${Q.place}, then open this briefing there to hand them over.`}</p>`;
    } else if (Q.kind === 'boss') {
      html += `<p class="dim">A hacking fight against the ${SYNDICATES[foe][0]} core: 7 operators, and they hit harder than a normal node. ` +
        'Only hacking tools work (proxies, Logic Bombs, Zero-Days). It uses up today\'s raid, and you can try again another day.</p>';
      if (S.raided) html += '<p class="amber">You have already raided today. Sleep first.</p>';
      else if (!S.proxies && !S.inv['Zero-Days']) html += '<p class="amber">You need at least one proxy chain or a Zero-Day to breach it.</p>';
      else buttons.push(['Launch the breach', 'boss', 'danger']);
    }
    html += '<p class="dim" style="margin-top:12px">THE LINE</p>' + chain.map((m, i) =>
      `<div class="${i < q.n ? 'green' : i === q.n ? 'cyan' : 'dim'}">${i < q.n ? '&#10003;' : i === q.n ? '&#9656;' : '&middot;'} ` +
      `${i + 1}. ${i <= q.n ? m[0] : '???'}</div>`).join('') +
      (q.n >= chain.length ? `<div class="cyan">&#9656; Standing orders (${q.n - chain.length} done)</div>` : '');
    buttons.push(['Close', null, buttons.length ? '' : 'primary']);
    const choice = await dialog('Syndicate mission', html, buttons);
    if (choice === 'give' && (S.inv[Q.good] || 0) >= Q.t) {
      removeItems(Q.good, Q.t);
      tally('deliver', Q.t);
      log(`Handed ${Q.t} ${Q.good} to ${SYNDICATES[key][0]} at ${Q.place}.`);
    } else if (choice === 'boss') {
      S.raided = true;
      const E = {kind: 'raid', gang: foe, name: SYNDICATES[foe][0], n: 7, hit: 0.34, lo: 4, hi: 9,
        intro: `You are inside the ${SYNDICATES[foe][0]} core. 7 of their best operators are jacked in, and they were expecting someone.`};
      await fight(E);
      if (E.result === 'won') tally('boss');
    }
  },

  // The street gig you are holding: who gave it, how far along it is, and handing over a delivery.
  async gig() {
    const G = S.gig;
    if (!G || !CONTACTS[G.who]) return;
    const held = S.inv[G.good] || 0, here = S.loc === G.place;
    let html = contactHead(G.who) + `<p class="dim">${CONTACTS[G.who][0]}. Trust: ${trustStars(G.who)}</p>` +
      `<div class="syn"><b>${G.title}</b><br>"${G.pitch}"</div>` +
      `<p><b>${gigGoal(G)}</b><br><span class="amber">${gigStatus(G)}</span> &middot; ${gigDue(G)} (end of day ${G.due})</p>` +
      `<p>Pays: ${questReward(G)}</p>`;
    const buttons = [];
    if (G.kind === 'deliver') {
      if (here && held >= G.t) buttons.push([`Hand over ${G.t} ${G.good}`, 'give', 'primary']);
      else html += `<p class="dim">${here ? `You are at ${G.place}, but you need ${G.t} ${G.good} on your drive.`
        : `Carry ${G.t} ${G.good} to ${G.place}, then open this there to hand them over.`}</p>`;
    } else if (G.kind === 'courier') {
      if (here) buttons.push(['Hand over the package', 'give', 'primary']);
      else html += `<p class="dim">Get to ${G.place}, then open this there to hand the package over.</p>`;
    } else html += '<p class="dim">It pays out by itself as soon as it is done.</p>';
    buttons.push(['Drop the gig', 'drop', 'small'], ['Close', null, buttons.length ? '' : 'primary']);
    const choice = await dialog('Street gig', html, buttons);
    if (choice === 'give' && S.gig === G && S.loc === G.place && (G.kind === 'courier' || (S.inv[G.good] || 0) >= G.t)) {
      if (G.kind === 'deliver') removeItems(G.good, G.t);
      G.p = G.t;   // gigCheck pays it out
      log(G.kind === 'deliver' ? `Handed ${G.t} ${G.good} to ${G.who}'s people at ${G.place}.`
        : `Handed ${G.who}'s package over at ${G.place}.`);
    } else if (choice === 'drop' && await confirmDlg('Drop the gig',
      `<p>Walk away from <b>${G.title}</b>? ${G.who} will trust you less.</p>`, 'Drop it', 'Keep it')) {
      S.gig = null;
      addTrust(G.who, -1);
      log(`You dropped ${G.who}'s gig.`);
    }
  },

  async dump(name) {
    const held = S.inv[name] || 0;
    if (!held) return;
    const qty = await askQty(`Dump ${name}`, '<p>No buyers here. Wipe them to free drive space?</p>',
      held, {ok: 'Wipe'});
    if (!qty) return;
    removeItems(name, qty);
    log(`Securely wiped ${num(qty)} ${name}.`);
  },

  // Travelling does not end the day; only sleeping at the Bunker does. You get a set number of
  // trips each day, and the trip home is always free.
  async travel() {
    const tired = S.trips <= 0;
    if (tired && S.loc === BUNKER) {
      return alertDlg('Worn out', '<p>You have no trips left today. Sleep to start a new day.</p>');
    }
    const others = LOCATIONS.filter(l => l !== S.loc && (!tired || l === BUNKER));
    const buttons = others.map(l =>
      [l === HOME ? l + ' (Fixer, wallet)' : l === BUNKER ? l + ' (your hideout, free trip)'
        : GEAR_SPOTS.includes(l) ? l + ' (black market, arms dealer)' : l === GUN_SPOT ? l + ' (guns, ammo, clothing, bags)' : l, l]);
    buttons.push(['Stay here', null, 'small']);
    const dest = await dialog('Tunnel out', tired
      ? '<p>You are worn out: no trips left today. You can still make it home to the Bunker to sleep.</p>'
      : `<p>Where to? You have <b>${S.trips}</b> trip${S.trips === 1 ? '' : 's'} left today. Prices stay put until you ` +
        'sleep at the Bunker, and the trip home is always free.</p>', buttons);
    if (!dest) return;
    await travelFx(S.loc, dest);
    S.loc = dest;
    if (dest !== BUNKER) {
      S.trips--;
      awayRaid(Math.min(0.08, S.heat / 1200));
    }
    rollMarket();
    log(`You surface at ${dest}.`);
    render();
    await randomEvent();
  },

  async cashout() {
    const warn = used() ? '<p class="amber">You are still holding goods. They count for nothing at the end.</p>' : '';
    if (await confirmDlg('Final day', warn + '<p>End the run and cash out?</p>', 'Cash out', 'Not yet')) S.over = true;
  },

  async broker() {
    const cmd = await dialog('The Fixer',
      `<p>You owe <span class="red">${money(S.debt)}</span>, growing ${pct(debtRate())}% a day.</p>`,
      [['Pay down', 'p', 'primary'], ['Borrow', 'b'], ['Leave', null, 'small']]);
    if (cmd === 'p') {
      const most = Math.min(S.cash, S.debt);
      if (most <= 0) return alertDlg('The Fixer', '<p>Nothing to pay, or nothing to pay with.</p>');
      const amt = await askQty('Pay down debt', '<p>How much?</p>', most, {cash: true, ok: 'Pay'});
      if (!amt) return;
      S.cash -= amt; S.debt -= amt;
      if (S.debt) {
        log(`Paid the Fixer ${money(amt)}.`);
      } else {
        const xp = S.cleared ? '' : gainXp(50);
        S.cleared = true;
        tally('debt');
        log(`<span class="green">You are clear with the Fixer!</span>${xp}`);
      }
    } else if (cmd === 'b') {
      const most = DEBT_LIMIT - S.debt;
      if (most <= 0) return alertDlg('The Fixer', '<p>"You\'re at your limit. Pay something back first."</p>');
      const amt = await askQty('Borrow', '<p>"Don\'t make us come looking for you."</p>', most, {cash: true, ok: 'Borrow'});
      if (!amt) return;
      S.cash += amt; S.debt += amt;
      log(`Borrowed ${money(amt)} from the Fixer.`);
    }
  },

  async wallet() {
    const cmd = await dialog('Cold wallet',
      `<p>Balance: ${money(S.wallet)}. Earns ${pct(walletRate())}% a day and can't be phished.</p>`,
      [['Deposit', 'd', 'primary'], ['Withdraw', 'w'], ['Leave', null, 'small']]);
    if (cmd === 'd') {
      if (S.cash <= 0) return alertDlg('Cold wallet', '<p>You have no cash to deposit.</p>');
      const amt = await askQty('Deposit', '<p>How much?</p>', S.cash, {cash: true, ok: 'Deposit'});
      if (!amt) return;
      S.cash -= amt; S.wallet += amt;
      log(`Moved ${money(amt)} into cold storage.`);
    } else if (cmd === 'w') {
      if (S.wallet <= 0) return alertDlg('Cold wallet', '<p>The wallet is empty.</p>');
      const amt = await askQty('Withdraw', '<p>How much?</p>', S.wallet, {cash: true, ok: 'Withdraw'});
      if (!amt) return;
      S.wallet -= amt; S.cash += amt;
      log(`Pulled ${money(amt)} out of cold storage.`);
    }

  async sound() {
    for (;;) {

        [[`Music: ${p.music ? 'ON' : 'OFF'}`, 'music'], [`Sound effects and voice: ${p.sfx ? 'ON' : 'OFF'}`, 'sfx'],
          ['Close', null, 'primary']]);

  async restart() {
    if (await confirmDlg('New run', '<p>Abandon this run and start over?</p>', 'Start over', 'Cancel')) newGame();

function nextDay() {
  S.day += 1;
  S.debt = Math.ceil(S.debt * (1 + debtRate()));
  const banked = S.wallet;
  S.wallet = Math.floor(S.wallet * (1 + walletRate()));
  if (S.wallet > banked) tally('interest', S.wallet - banked);
  S.heat = Math.max(0, S.heat - HEAT_DECAY);
  // Heat items: decoy traffic cools a little more each night, a VPN runs down, and fast fixes are fresh again.
  if (fx().decoy > 0) { S.heat = Math.max(0, S.heat - COOL.decoy.cool); S.fx.decoy--; }
  if (S.fx.vpn > 0) S.fx.vpn--;
  S.tricks = 0;
  S.raided = false;
  S.mood = '';
  S.hp = Math.min(100, S.hp + 3 + bonus('regen'));
  S.trips = TRIPS_PER_DAY;
  S.markets = {};
  rollMarket();
  if (S.loc !== BUNKER) awayRaid(Math.min(0.25, S.heat / 400));   // days spent locked up or in a clinic
}

// While you are out, the law may raid the Bunker and take whatever is stashed there.
function awayRaid(chance) {
  if (stashTotal() && Math.random() < chance * (inSyn('ghost') ? 0.7 : 1)) {
    const who = LAW[lawTier()].name, lost = seizeStash(1);
    log(`<span class="red">${who[0].toUpperCase() + who.slice(1)} raided the Bunker while you were out: ${num(lost)} stashed goods seized.</span>`);
    notes.push(['Bunker raided', `<p>${who[0].toUpperCase() + who.slice(1)} hit the Bunker while you were out.</p>` +
      `<p>Everything in the stash is gone: <b>${num(lost)}</b> goods seized. Your gear locker's hidden compartment was not found.</p>` +
      '<p class="dim">The higher your Heat, the more likely a raid.</p>']);
  }
}

// ---------- the Bunker ----------
let notes = [];   // things that happened off-screen, shown as pop-ups after the current action
async function flushNotes() {
  while (notes.length) {
    const [title, html] = notes.shift();
    render();
    await alertDlg(title, html, 'danger');
  }
}
const stashTotal = () => Object.values(S.stash).reduce((a, b) => a + b, 0);

// The law takes a share of the stash (1 = all of it). Returns how many goods went.
function seizeStash(share) {
  let lost = 0;
  for (const name of Object.keys(S.stash)) {
    const take = Math.ceil(S.stash[name] * share);
    lost += take;
    S.stash[name] -= take;
    if (S.stash[name] <= 0) { delete S.stash[name]; delete S.stashCost[name]; }
  }
  return lost;
}

function stashHtml() {
  const total = stashTotal();
  const names = GOODS.map(g => g[0]).filter(n => S.inv[n] || S.stash[n] || S.stuck[n]);
  return `<div class="row"><div><div class="name cyan">THE BUNKER &middot; stash ${num(total)}/${STASH_CAP} &middot; carrying ${driveHtml()}</div>` +
    '<div class="sub">Store goods here to free up your drive. Rival crews can\'t touch you at home, but the law can raid ' +
    'the place whether you are in or out, and they take the stash.</div></div></div>' +
    (names.length ? names.map(n => `<div class="row"><div><div class="name">${n}</div>` +
      `<div class="sub">carrying ${num(S.inv[n] || 0)} &middot; stashed ${num(S.stash[n] || 0)}</div>` +
      (tagged(n) || S.stashTag[n] ? `<div class="sub">${tagHtml} ${[tagged(n) ? `${num(tagged(n))} carried` : '',
        S.stashTag[n] ? `${num(S.stashTag[n])} stashed` : ''].filter(Boolean).join(', ')}</div>` : '') +
      (S.stuck[n] ? `<div class="sub red">${num(S.stuck[n])} stuck in your prison pocket: they are not going in the stash</div>` : '') +
      '</div><div></div>' +
      `<div class="btns"><button data-act="store" data-arg="${n}"${S.inv[n] && total < STASH_CAP ? '' : ' disabled'}>Store</button>` +
      `<button data-act="take" data-arg="${n}"${S.stash[n] && free() > 0 ? '' : ' disabled'}>Take</button></div></div>`).join('')
      : '<div class="row"><div class="sub">Nothing to store yet. Bring goods here to keep them off your drive.</div></div>');
}

// The law comes to the Bunker while you are in it. Beat them and the stash is safe;
// slip away and they take half; get arrested and they take all of it.
async function homeRaid(asleep) {
  const tier = lawTier(), L = LAW[tier], who = L.name[0].toUpperCase() + L.name.slice(1);
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  const E = {kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi,
    intro: asleep ? `You wake to boots on the stairs. ${who} is raiding the Bunker: ${n} agent${n === 1 ? '' : 's'}.`
      : `${who} has the Bunker surrounded: ${n} agent${n === 1 ? '' : 's'}.`};
  await fight(E);
  if (S.busted || !stashTotal()) return;
  if (E.result === 'won') {
    log('<span class="green">The Bunker held. Your stash is safe.</span>');
    return;
  }
  const lost = seizeStash(E.result === 'lost' ? 1 : 0.5);
  log(`<span class="red">${who} searched the Bunker: ${num(lost)} stashed goods seized.</span>`);
  render();
  await alertDlg('Bunker searched', `<p>${who} tears the Bunker apart${E.result === 'lost' ? '' : ' after you slip away'}.</p>` +
    `<p><b>${num(lost)}</b> stashed goods seized${E.result === 'lost' ? '' : ' (half the stash)'}.</p>`, 'danger');
}

// ---------- events ----------
async function randomEvent() {
  // These odds are per trip. There are several trips in a day, so each one is fairly small.
  if (Math.random() < Math.min(0.25, 0.03 + S.heat / 600) * (inSyn('ghost') ? 0.7 : 1)) {
    return S.loc === BUNKER ? homeRaid(false) : lawEncounter();
  }
  // Rival syndicates come after you more often the more you have crossed them. Never at the Bunker.
  const crews = rivals(), anger = crews.reduce((sum, k) => sum + S.grudge[k], 0);
  if (S.loc !== BUNKER && Math.random() < Math.min(0.15, 0.02 + 0.015 * anger)) {
    let roll = Math.random() * (anger + crews.length);
    const key = crews.find(k => (roll -= S.grudge[k] + 1) < 0) || crews[0];
    return gangEncounter(key);
  }
  if (S.loc !== BUNKER && Math.random() < JUMP_ODDS) return jumped();   // street muscle, waiting where you come up
  if (S.loc !== BUNKER && Math.random() < JUNKIE_ODDS) return junkie();
  // A street contact with a gig: only when you are free to take one and there is time left to do it.
  if (S.loc !== BUNKER && !S.gig && S.day <= DAYS - 2 && Math.random() < CONTACT_ODDS) return contact();
  if (Math.random() < 0.5) return;   // most trips are uneventful
  const r = Math.random();
  if (r < 0.10) {
    const name = GOODS[rnd(3, GOODS.length - 1)][0];
    const qty = Math.min(rnd(2, 8), free());
    if (qty > 0) {
      addItems(name, qty, 0);
      log(`<span class="cyan">Found an unlocked laptop in a ride share: ${qty} ${name}!</span>`);
      await alertDlg('Lucky find', `<p>Someone left an unlocked laptop in a ride share. You lift <b>${qty} ${name}</b>.</p>`);
    }
  } else if (r < 0.18) {
    const price = rnd(400, 1200) * (1 + Math.floor(S.day / 8));
    if (S.cash >= price && await confirmDlg('Drive upgrade',
      `<p>A hardware hacker offers an encrypted drive upgrade: <b>+50 slots</b> for ${money(price)}.</p>`, 'Buy it', 'Pass')) {
      S.cash -= price; S.drive += 50;
      log(`Drive upgraded to ${cap()} slots.`);
    }
  } else if (r < 0.27) {
    const price = rnd(700, 1500) * (1 + S.proxies);
    if (S.cash >= price && S.proxies < MAX_PROXIES && await confirmDlg('Proxy chain',
      `<p>A sysadmin with a grudge will sell you a proxy chain for ${money(price)}.</p>` +
      '<p class="dim">Proxies help you slip traces and let you counter-hack.</p>', 'Buy it', 'Pass')) {
      S.cash -= price; S.proxies += 1;
      log(`Proxy chain added. You now run ${S.proxies}.`);
    }
  } else if (r < 0.33) {
    if (S.cash > 100) {
      const loss = Math.floor(S.cash * rnd(10, 25) / 100);
      S.cash -= loss;
      S.mood = 'ouch';
      tally('phished');
      log(`<span class="red">Phished! Lost ${money(loss)} from your hot wallet.</span>`);
      await alertDlg('Phished', `<p>You clicked a link. YOU. Someone drained <b>${money(loss)}</b> from your hot wallet.</p>` +
        '<p class="dim">Cash in the cold wallet is safe from this.</p>', 'danger');
    }
  } else if (r < 0.40) {
    if (S.opsec < 100) {
      const price = (100 - S.opsec) * rnd(20, 45);
      if (S.cash >= price && await confirmDlg('OpSec audit',
        `<p>An old-timer offers a full OpSec audit for ${money(price)}. Restores OpSec to 100%.</p>`, 'Pay', 'Pass')) {
        S.cash -= price; S.opsec = 100;
        log('OpSec restored to 100%.');
      }
    }
  }
}

// ---------- junkies ----------

const JUNKIE_ODDS = 0.12, JUNKIE_RATE = [25, 45];   // chance per trip, and their price as a % of the shop price
