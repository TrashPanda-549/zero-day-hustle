<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0Day Hustle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Zero Day Hustle</title>
<style>
:root{--bg:#04070a;--panel:#0a1310;--line:#153326;--fg:#b8f5c8;--green:#39ff7a;--dim:#5f8f70;
  --amber:#ffc24a;--red:#ff5566;--cyan:#5fe3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 ui-monospace,Consolas,"Cascadia Mono",Menlo,"Roboto Mono",monospace;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{max-width:760px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:19px;letter-spacing:3px;color:var(--green);text-shadow:0 0 8px rgba(57,255,122,.5)}
h2{margin:0 0 10px;font-size:17px;color:var(--green);letter-spacing:1px}
#dayloc{margin:6px 0 10px;font-size:16px}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.cyan{color:var(--cyan)}.dim{color:var(--dim)}
button{font:inherit;color:var(--green);background:transparent;border:1px solid var(--green);border-radius:6px;
  padding:8px 12px;min-height:40px;cursor:pointer}
button:active:not(:disabled){background:var(--green);color:#000}
button:disabled{opacity:.28;cursor:default}
button.primary{background:var(--green);color:#00140a;font-weight:bold}
button.danger{border-color:var(--red);color:var(--red)}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-color:var(--line);color:var(--dim)}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chip small{display:block;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.chip b{font-size:15px;font-weight:600;white-space:nowrap}
#news{margin:10px 0 0}
#news div{color:var(--amber);padding:2px 0}
#news div::before{content:">> "}
#market{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 9px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{font-size:12px;color:var(--dim)}
.row .price{text-align:right;white-space:nowrap}
.row .btns{display:flex;gap:6px}
.row .btns button{padding:6px 10px;min-width:52px}
#career{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:7px 9px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px}
#career .lvl{color:var(--cyan);font-weight:bold;white-space:nowrap}
#career .bar{flex:1;height:8px;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:40px}
#career .bar i{display:block;height:100%;background:var(--cyan)}
#career .xp{color:var(--dim);white-space:nowrap}
#vitals{margin:6px 0 8px}
.meter{display:grid;grid-template-columns:64px 1fr 58px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.meter span:first-child{color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.meter .track{height:11px;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter .track i{display:block;height:100%;transition:width .25s}
.meter b{text-align:right;white-space:nowrap}
/* gear rarity colours: common, uncommon, rare, epic, legendary */
.r0,.syn b.r0{color:#c9d1d5}.r1,.syn b.r1{color:#39ff7a}.r2,.syn b.r2{color:#4da3ff}
.r3,.syn b.r3{color:#c77dff}.r4,.syn b.r4{color:#ff9d2e}
button.r0{border-color:#c9d1d5}button.r1{border-color:#39ff7a}button.r2{border-color:#4da3ff}
button.r3{border-color:#c77dff}button.r4{border-color:#ff9d2e}
#jobs{margin-top:10px}
#jobs h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--dim);font-weight:normal}
.job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 9px;margin-bottom:6px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px}
.job .what{font-weight:600}
.job .sub{font-size:12px;color:var(--dim)}
.job button{border-color:var(--amber);color:var(--amber)}
.job button:active:not(:disabled){background:var(--amber);color:#000}
.syn{margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.syn b{color:var(--cyan)}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
#actions button{min-height:46px}
#log{margin-top:14px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
#log div{padding:1px 0}
#log div:first-child{color:var(--fg)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:10}
#overlay[hidden]{display:none}
#dialog{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#07100c;border:1px solid var(--green);
  border-radius:10px;padding:16px;box-shadow:0 0 24px rgba(57,255,122,.25)}
#dialog.danger{border-color:var(--red);box-shadow:0 0 24px rgba(255,85,102,.3)}
#dialog.danger h2{color:var(--red)}
#dialog p{margin:0 0 10px}
.dbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.qty{display:flex;flex-direction:column;gap:10px;margin-top:6px}
input[type=number],input[type=text]{font:inherit;font-size:18px;color:var(--green);background:#000;
  border:1px solid var(--green);border-radius:6px;padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--green);height:28px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.total{margin-top:10px;color:var(--amber);min-height:1.35em}
.hall{width:100%;border-collapse:collapse;margin-top:6px}
.hall td{padding:2px 4px}.hall td:last-child{text-align:right}
</style>
</head>
<body>
<div id="app">
  <header><h1>ZERO DAY HUSTLE</h1><button class="small" data-act="restart">New run</button></header>
  <div id="career" data-act="profile"></div>
  <div id="dayloc"></div>
  <section id="vitals"></section>
  <section id="stats"></section>
  <section id="news"></section>
  <section id="market"></section>
  <section id="jobs"></section>
  <nav id="actions"></nav>
  <section id="log"></section>
</div>
<div id="overlay" hidden><div id="dialog"></div></div>
<script>
'use strict';
const DAYS = 30, START_CASH = 2000, START_DEBT = 5500, DEBT_RATE = 0.08, WALLET_RATE = 0.03,
  DEBT_LIMIT = 25000, START_DRIVE = 100, HEAT_DECAY = 8, MAX_PROXIES = 8;

// name, low, high, news when scarce, news when flooded
const GOODS = [
  ['Zero-Days', 15000, 29000,
    'Bug bounties are paying triple. Nobody is selling Zero-Days!',
    'A broker got doxxed and is fire-selling Zero-Days!'],
  ['Rootkits', 5000, 13000,
    'New kernel protections broke most Rootkits. Working ones cost a fortune!',
    'A rootkit crew leaked their own source. Rootkits are dirt cheap!'],
  ['Botnet Hours', 1500, 4400,
    'A big takedown wiped out half the bots. Botnet Hours are scarce!',
    'Millions of cheap smart cameras just came online. Botnet Hours are flooding in!'],
  ['Leaked Databases', 1000, 3500,
    'Everyone rotated their passwords. Fresh Leaked Databases are gold!',
    'A mega-breach dropped overnight. Leaked Databases everywhere!'],
  ['Phishing Kits', 600, 1300,
    'Tax season! Phishing Kits are selling out!',
    'Mail filters got smarter. Nobody wants Phishing Kits!'],
  ['Rogue APs', 300, 900,
    'A big conference is in town. Rogue APs are in demand!',
    'A hardware shop is clearing out Rogue APs!'],
  ['Cracked Accounts', 200, 700,
    'Streaming prices went up again. Cracked Accounts are hot!',
    'A combo list went public. Cracked Accounts are nearly worthless!'],
  ['USB Droppers', 90, 250,
    'Customs seized a shipment. USB Droppers are hard to find!',
    'Somebody found a pallet of USB Droppers behind a warehouse!'],
  ['Burner SIMs', 30, 120,
    'New ID laws hit the kiosks. Burner SIMs are scarce!',
    'A carrier is dumping Burner SIMs by the box!'],
  ['Warez', 10, 60,
    'The big tracker went down. Warez prices are up!',
    'A release group dumped its whole archive. Warez are basically free!'],
];
const LOCATIONS = ['The Hackerspace', 'Tor Bazaar', 'IRC Backchannel', 'Con Hallway', 'Campus Lab',
  'Datacenter Dock', 'Cyber Cafe', 'Paste Alley'];
const HOME = LOCATIONS[0];

// Crews you can join at level 10. The choice is permanent and applies to every run.
const SYNDICATES = {
  ghost: ['Ghost Shell', 'Stealth crew. Deals and contracts raise half the Heat, and traces find you less often.'],
  ledger: ['Black Ledger', 'Money people. The Fixer charges you 4% a day instead of 8%, and your cold wallet earns 6%.'],
  null: ['Null Sector', 'Smugglers. +60 drive slots and an extra $3,000 at the start of every run.'],
  red: ['Red Team Zero', 'Operators. Contracts succeed 10% more often and pay 25% more.'],
};
const TITLES = ['Script Kiddie', 'Lurker', 'Packet Monkey', 'Phreak', 'Cracker', 'Gray Hat', 'Exploit Dev',
  'Netrunner', 'Black Hat', 'Syndicate Operator'];
const titleFor = l => l >= 30 ? 'Legend of the Wire' : l >= 25 ? 'Root' : l >= 20 ? 'Ghost in the Wire'
  : l >= 15 ? 'Zero-Day Broker' : TITLES[Math.min(l, 10) - 1];

// Contract jobs for each kind of goods.
const JOBS = {
  'Zero-Days': ['Crack the vault firewall of a crooked crypto exchange', 'Get inside a defence contractor\'s test lab'],
  'Rootkits': ['Dig into a rival crew\'s build server and stay there', 'Keep a quiet foothold in a casino\'s back office'],
  'Botnet Hours': ['Knock a scam call centre offline for the weekend', 'Bury a ticket-scalper site on launch day'],
  'Leaked Databases': ['Prove a cover-up for an investigative reporter', 'Unmask the sock puppets behind a smear campaign'],
  'Phishing Kits': ['Phish the board of a smug startup for a red-team gig', 'Bait a crew of romance scammers with their own trick'],
  'Rogue APs': ['Blanket a trade-show hall in fake Wi-Fi', 'Shadow the guest network of a lobbyists\' hotel'],
  'Cracked Accounts': ['Swing the vote in a rigged talent show', 'Flood a price-gouger\'s store with bogus orders'],
  'USB Droppers': ['Seed a corporate car park with loaded drives', 'Leave "lost" drives all over a bank\'s lobby'],
  'Burner SIMs': ['Kit out a crew for a one-night job', 'Give a whistleblower clean lines for a month'],
  'Warez': ['Stock a pirate cinema for an off-grid festival', 'Load up a school lab the district forgot to fund'],
};
// name, price, shots per round, chance to hit
const WEAPONS = [null, ['Stun gun', 1200, 1, 0.45], ['Pistol', 4500, 1, 0.6], ['Shotgun', 12000, 2, 0.6]];
const EMP_PRICE = 2000, MAX_EMP = 5;
const GEAR_SPOTS = ['Tor Bazaar', 'Datacenter Dock'];   // where the black market trades
// Who comes for you depends on your Heat.
const LAW = [
  {name: 'the Metro Cyber Unit', short: 'Police', stars: 1, hit: 0.3, lo: 3, hi: 7},
  {name: 'the Federal Cyber Task Force', short: 'Feds', stars: 2, hit: 0.35, lo: 3, hi: 9},
  {name: 'the NSA', short: 'NSA', stars: 3, hit: 0.38, lo: 4, hi: 10},
];
const CLIENTS = ['n0va', 'Mr. Static', 'the Librarian', 'K-9', 'Sister Hex', 'a nervous intern', 'Old Baud', 'DeadDrop'];

const $ = s => document.querySelector(s);
const money = n => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US');
const num = n => n.toLocaleString('en-US');
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/[&<>"']/g,
  ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));

let S, logs = [], busy = false, AUTO = false;

// ---------- storage ----------
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
  del(key) { try { localStorage.removeItem(key); } catch (e) {} },
};
const save = () => { if (!AUTO) store.set('zdh-save', S); };

// ---------- career: XP, levels and syndicate carry over between runs ----------
let career = {xp: 0, syn: null, gear: {}, bag: []}, pendingLevel = 0;

function levelInfo() {
  let xp = career.xp, level = 1, need = 100;
  while (xp >= need) { xp -= need; level++; need = 100 * level; }
  return {level, into: xp, need};
}
const level = () => levelInfo().level;
const inSyn = key => career.syn === key;
const debtRate = () => inSyn('ledger') ? 0.04 : DEBT_RATE;
const walletRate = () => inSyn('ledger') ? 0.06 : WALLET_RATE;
const pct = rate => Math.round(rate * 100);

// Adds XP and returns a snippet to append to a log line.
function gainXp(n) {
  n = Math.floor(n);
  if (n <= 0) return '';
  const before = level();
  career.xp += n;
  S.xpRun = (S.xpRun || 0) + n;
  if (!AUTO) store.set('zdh-career', career);
  if (level() > before) pendingLevel = level();
  return ` <span class="cyan">+${n} XP</span>`;
}

async function chooseSyndicate() {
  const html = '<p>You are level 10. Four syndicates want you. The choice is permanent.</p>' +
    Object.values(SYNDICATES).map(([name, perk]) => `<div class="syn"><b>${name}</b><br>${perk}</div>`).join('');
  const buttons = Object.entries(SYNDICATES).map(([key, [name]]) => [name, key]);
  buttons.push(['Decide later', null, 'small']);
  const key = await dialog('Join a syndicate', html, buttons);
  if (!key) return;
  career.syn = key;
  if (!AUTO) store.set('zdh-career', career);
  log(`<span class="cyan">You joined ${SYNDICATES[key][0]}.</span>`);
  await alertDlg(SYNDICATES[key][0], `<p>You're in. ${SYNDICATES[key][1]}</p>`);
}

async function levelUpCheck() {
  if (pendingLevel) {
    const l = pendingLevel;
    pendingLevel = 0;
    log(`<span class="cyan">LEVEL UP: level ${l}, ${titleFor(l)}.</span>`);
    render();
    await alertDlg('LEVEL UP', `<p>You reached <b>level ${l}</b>: <span class="cyan">${titleFor(l)}</span>.</p>` +
      '<p class="dim">Each level (up to 10) adds 1% to your contract success chance.</p>');
    if (l >= 10 && !career.syn) await chooseSyndicate();
  }
}

// ---------- gear: clothing and equipment in five colour-coded rarities ----------
// Gear belongs to the career, so it carries over between runs.
const RARITY = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
const RARITY_MULT = [1, 1.5, 2.2, 3, 4];
const RARITY_PREFIX = ['Worn', 'Tuned', 'Custom', 'Prototype', 'Mythic'];
// slot: [label, item names, stats this slot can roll]
const SLOTS = {
  head: ['Head', ['Beanie', 'Hood', 'AR Visor', 'Neural Band'], ['firewall', 'hack', 'stealth', 'charm']],
  body: ['Body', ['Denim Jacket', 'Kevlar Hoodie', 'Trench Coat', 'Armoured Vest'], ['armor', 'storage', 'stealth', 'regen']],
  hands: ['Hands', ['Fingerless Gloves', 'Haptic Gloves', 'Shock Knuckles'], ['aim', 'hack', 'luck']],
  feet: ['Feet', ['Sneakers', 'Combat Boots', 'Courier Runners'], ['speed', 'armor', 'regen']],
  deck: ['Deck', ['Burner Laptop', 'Cyberdeck', 'Mesh Rig'], ['hack', 'firewall', 'storage', 'charm', 'luck']],
};
// stat: [what it does, value on a Common item, cap on your total, unit]
const STATS = {
  armor: ['less Health damage', 6, 70, '%'],
  firewall: ['less OpSec damage', 6, 70, '%'],
  aim: ['weapon hit chance', 4, 30, '%'],
  hack: ['hack chance per proxy', 4, 35, '%'],
  speed: ['escape chance', 5, 35, '%'],
  stealth: ['less Heat gained', 6, 60, '%'],
  charm: ['contract success', 3, 20, '%'],
  storage: ['drive slots', 10, 150, ''],
  regen: ['Health a day', 1, 15, '%'],
  luck: ['fight loot', 8, 100, '%'],
};
const BAG_SIZE = 12, MAX_MED = 5, MED_HEAL = 40;

function makeItem(rar) {
  const slot = pick(Object.keys(SLOTS));
  const [, names, pool] = SLOTS[slot];
  const count = Math.min(pool.length, [1, pick([1, 2]), 2, 3, pick([3, 4])][rar]);
  const stats = {};
  for (const key of pool.slice().sort(() => Math.random() - 0.5).slice(0, count)) {
    stats[key] = Math.max(1, Math.round(STATS[key][1] * RARITY_MULT[rar] * (0.8 + Math.random() * 0.4)));
  }
  return {slot, rar, name: `${RARITY_PREFIX[rar]} ${pick(names)}`, stats};
}
// boost shifts the odds toward rarer items
function rollRarity(boost) {
  const r = Math.random() * 100 - boost;
  return r < 1 ? 4 : r < 5 ? 3 : r < 15 ? 2 : r < 40 ? 1 : 0;
}
const itemValue = it => 800 * [1, 3, 8, 20, 60][it.rar];
const scrapValue = it => Math.round(itemValue(it) * 0.25);
const bonus = key => Math.min(STATS[key][2],
  Object.values(career.gear).reduce((sum, it) => sum + ((it && it.stats[key]) || 0), 0));
const statLine = (key, v) => `+${v}${STATS[key][3]} ${STATS[key][0]}`;
const itemHtml = it => `<b class="r${it.rar}">${it.name}</b> <span class="dim">${RARITY[it.rar]} &middot; ` +
  `${SLOTS[it.slot][0]}</span><br>${Object.entries(it.stats).map(([k, v]) => statLine(k, v)).join(', ')}`;
const saveCareer = () => { if (!AUTO) store.set('zdh-career', career); };

// Put an item in the bag, or scrap it for cash if the bag is full.
function stash(it) {
  if (career.bag.length < BAG_SIZE) return career.bag.push(it);
  S.cash += scrapValue(it);
  log(`Bag full: scrapped ${it.name} for ${money(scrapValue(it))}.`);
}

async function dropLoot(from, boost) {
  const it = makeItem(rollRarity(boost));
  const worn = career.gear[it.slot];
  log(`Loot from ${from}: <span class="r${it.rar}">${it.name}</span> (${RARITY[it.rar]}).`);
  const choice = await dialog('Loot!', `<p>${from} left something behind:</p><div class="syn">${itemHtml(it)}</div>` +
    (worn ? `<p class="dim">You are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Equip it', 'e', 'primary'], ['Put it in the bag', 'b']]);
  if (choice === 'e') {
    if (worn) stash(worn);
    career.gear[it.slot] = it;
  } else {
    stash(it);
  }
  saveCareer();
}

// ---------- state helpers ----------
const used = () => Object.values(S.inv).reduce((a, b) => a + b, 0);
const cap = () => S.drive + (inSyn('null') ? 60 : 0) + bonus('storage');
const free = () => cap() - used();
const pick = list => list[rnd(0, list.length - 1)];
// A labelled bar: Health, OpSec, or the hostiles left in a fight.
function meter(label, value, max, text, color) {
  const width = Math.max(0, Math.min(100, Math.round(value / max * 100)));
  color = color || (width > 60 ? 'green' : width > 30 ? 'amber' : 'red');
  return `<div class="meter"><span>${label}</span><span class="track">` +
    `<i style="width:${width}%;background:var(--${color})"></i></span><b class="${color}">${text}</b></div>`;
}
const vitals = () => meter('Health', S.hp, 100, S.hp + '%') + meter('OpSec', S.opsec, 100, S.opsec + '%');
const lawTier = () => S.heat >= 75 ? 2 : S.heat >= 40 ? 1 : 0;
const rivals = () => Object.keys(SYNDICATES).filter(k => k !== career.syn);
const noGrudges = () => ({ghost: 0, ledger: 0, null: 0, red: 0});

function addItems(name, qty, price) {
  const held = S.inv[name] || 0;
  const paid = (S.cost[name] || 0) * held + price * qty;
  S.inv[name] = held + qty;
  S.cost[name] = Math.floor(paid / (held + qty));
}
function removeItems(name, qty) {
  S.inv[name] -= qty;
  if (S.inv[name] <= 0) { delete S.inv[name]; delete S.cost[name]; }
}
function addHeat(value) {
  let gain = Math.min(10, Math.floor(value / 10000));
  if (inSyn('ghost')) gain = Math.ceil(gain / 2);
  gain = Math.ceil(gain * (1 - bonus('stealth') / 100));
  if (gain) S.heat = Math.min(100, S.heat + gain);
}

// ---------- contracts ----------
function rollContracts() {
  S.contracts = [];
  const count = pick([0, 1, 1, 2, 2, 3]);
  const pool = GOODS.slice().sort(() => Math.random() - 0.5).slice(0, count);
  for (const [name, low, high] of pool) {
    const mid = (low + high) / 2;
    const lot = mid >= 10000 ? 3 : mid >= 2000 ? 8 : mid >= 500 ? 15 : mid >= 100 ? 30 : 50;
    const qty = Math.min(60, Math.max(1, Math.round(rnd(Math.ceil(lot / 3), lot) * (1 + S.day / 8))));
    const chance = rnd(50, 85);
    // Riskier jobs pay more. The unit price is never below today's local price,
    // so a job that works always beats selling the same goods here.
    const mult = 1.5 + (85 - chance) / 35 * 1.3 + Math.random() * 0.4;
    const unit = Math.max(S.prices[name] || 0, Math.round(mid));
    S.contracts.push({good: name, qty, chance, payout: Math.round(unit * qty * mult / 10) * 10,
      job: pick(JOBS[name]), client: pick(CLIENTS)});
  }
}
const payoutFor = c => Math.round(c.payout * (inSyn('red') ? 1.25 : 1));
const chanceFor = c => Math.max(10, Math.min(95,
  c.chance + Math.min(10, level()) + 2 * S.proxies - Math.floor(S.heat / 5) + (inSyn('red') ? 10 : 0) + bonus('charm')));
function log(text, cls) {
  logs.unshift(`<div${cls ? ` class="${cls}"` : ''}>${text}</div>`);
  logs.length = Math.min(logs.length, 14);
}

function rollMarket() {
  for (;;) {
    S.prices = {}; S.flags = {}; S.news = [];
    for (const [name, low, high, scarce, flood] of GOODS) {
      if (Math.random() < 0.18) continue;   // nobody is dealing this here today
      let price = rnd(low, high);
      const r = Math.random();
      if (r < 0.06) { price *= rnd(3, 6); S.news.push(scarce); S.flags[name] = 'up'; }
      else if (r < 0.12) { price = Math.max(1, Math.floor(price / rnd(3, 5))); S.news.push(flood); S.flags[name] = 'down'; }
      S.prices[name] = price;
    }
    if (Object.keys(S.prices).length >= 4) break;
  }
  rollContracts();
  // Today's gear on the black market: up to Epic, never Legendary.
  S.shop = [0, 1, 2].map(() => makeItem(Math.min(3, rollRarity(S.day * 0.3))));
}

function newGame() {
  S = {day: 1, loc: HOME, cash: START_CASH + (inSyn('null') ? 3000 : 0), debt: START_DEBT, wallet: 0,
    drive: START_DRIVE, opsec: 100, heat: 0, proxies: 0, inv: {}, cost: {}, prices: {}, flags: {}, news: [],
    contracts: [], xpRun: 0, cleared: false, hp: 100, medkits: 0, shop: [], weapon: 0, emp: 0, grudge: noGrudges(), raided: false,
    over: false, busted: false};
  logs = [];
  rollMarket();
  log('New run. Buy low, sell high, stay off the radar.');
}

// ---------- dialogs ----------
const overlay = $('#overlay'), dlg = $('#dialog');

function dialog(title, html, buttons, tone) {
  return new Promise(resolve => {
    dlg.className = tone || '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div><div class="dbtns"></div>`;
    const box = dlg.querySelector('.dbtns');
    for (const [label, value, cls] of buttons) {
      const el = document.createElement('button');
      el.textContent = label;
      if (cls) el.className = cls;
      el.onclick = () => { overlay.hidden = true; resolve(value); };
      box.appendChild(el);
    }
    if (AUTO) return resolve(buttons[rnd(0, buttons.length - 1)][1]);
    overlay.hidden = false;
    dlg.scrollTop = 0;
  });
}
const confirmDlg = (title, html, yes, no) =>
  dialog(title, html, [[yes || 'Yes', true, 'primary'], [no || 'No', false]]);
const alertDlg = (title, html, tone) => dialog(title, html, [['OK', true, 'primary']], tone);

// Amount picker, 1..max. opts: unit (price each), cash (amount is money), ok (button label).
function askQty(title, html, max, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <div class="qty"><input id="qn" type="number" inputmode="numeric" min="1" max="${max}" value="${max}">
      <input id="qs" type="range" min="1" max="${max}" value="${max}"></div>
      <div class="quick"><button data-q="1">Min</button><button data-q="h">Half</button><button data-q="m">Max</button></div>
      <div class="total" id="qt"></div>
      <div class="dbtns"><button id="qok" class="primary">${opts.ok || 'OK'}</button><button id="qcancel">Cancel</button></div>`;
    const qn = $('#qn'), qs = $('#qs'), qt = $('#qt');
    const value = () => Math.max(0, Math.min(max, Math.floor(Number(qn.value) || 0)));
    const show = () => {
      const v = value();
      qt.textContent = !v ? '' : opts.unit ? `${num(v)} x ${money(opts.unit)} = ${money(v * opts.unit)}`
        : opts.cash ? money(v) : num(v);
      $('#qok').disabled = !v;
    };
    const set = v => { qn.value = v; qs.value = v; show(); };
    qn.oninput = () => { qs.value = value(); show(); };
    qs.oninput = () => { qn.value = qs.value; show(); };
    dlg.querySelector('.quick').onclick = e => {
      const q = e.target.dataset.q;
      if (q) set(q === 'm' ? max : q === 'h' ? Math.max(1, Math.floor(max / 2)) : 1);
    };
    const done = v => { overlay.hidden = true; resolve(v); };
    $('#qok').onclick = () => done(value() || null);
    $('#qcancel').onclick = () => done(null);
    qn.onkeydown = e => { if (e.key === 'Enter' && value()) done(value()); };
    show();
    if (AUTO) return resolve([null, 1, max, rnd(1, max)][rnd(0, 3)]);
    overlay.hidden = false;
  });
}

function askText(title, html) {
  return new Promise(resolve => {
    dlg.className = '';
    dlg.innerHTML = `<h2>${title}</h2><div class="body">${html}</div>
      <input id="tx" type="text" maxlength="16" autocomplete="off" placeholder="anon">
      <div class="dbtns"><button id="tok" class="primary">OK</button></div>`;
    const done = () => { overlay.hidden = true; resolve($('#tx').value.trim()); };
    $('#tok').onclick = done;
    $('#tx').onkeydown = e => { if (e.key === 'Enter') done(); };
    if (AUTO) return resolve('bot');
    overlay.hidden = false;
    $('#tx').focus();
  });
}

// ---------- rendering ----------
function render() {
  const last = S.day >= DAYS;
  const li = levelInfo();
  $('#career').innerHTML = `<span class="lvl">LVL ${li.level}</span><span>${titleFor(li.level)}</span>` +
    `<span class="bar"><i style="width:${Math.floor(li.into / li.need * 100)}%"></i></span>` +
    `<span class="xp">${career.syn ? SYNDICATES[career.syn][0] : `${li.into}/${li.need} XP`}</span>`;
  $('#jobs').innerHTML = !S.contracts.length ? '' : '<h3>CONTRACTS HERE TODAY</h3>' + S.contracts.map((c, i) => {
    const held = S.inv[c.good] || 0;
    return `<div class="job"><div><div class="what">${c.job}</div>
      <div class="sub">for ${c.client} &middot; uses ${num(c.qty)} ${c.good} (you hold ${num(held)})</div>
      <div class="sub"><span class="amber">pays ${money(payoutFor(c))}</span> &middot; ${chanceFor(c)}% chance</div></div>
      <button data-act="contract" data-arg="${i}"${held >= c.qty ? '' : ' disabled'}>Run job</button></div>`;
  }).join('');
  $('#dayloc').innerHTML = `DAY <b>${S.day}</b>/${DAYS} &middot; <span class="cyan">${S.loc}</span>` +
    (last ? ' <span class="amber">&middot; FINAL DAY: sell what you hold</span>' : '');
  const chips = [
    ['Cash', money(S.cash), 'green'], ['Wallet', money(S.wallet), ''],
    ['Debt', money(S.debt), S.debt ? 'red' : ''],
    ['Drive', `${used()}/${cap()}`, free() <= 0 ? 'amber' : ''],
    ['Heat', S.heat + '%', S.heat >= 60 ? 'red' : S.heat >= 30 ? 'amber' : ''],
    ['Proxies', S.proxies, ''],
    ['Weapon', (WEAPONS[S.weapon] ? WEAPONS[S.weapon][0] : 'None') + (S.emp ? ` +${S.emp} EMP` : ''), ''],
    ['Armour', bonus('armor') + '%', ''],
    ['Medkits', S.medkits, ''],
    ['Wanted by', '&#9733;'.repeat(LAW[lawTier()].stars) + ' ' + LAW[lawTier()].short,
      lawTier() === 2 ? 'red' : lawTier() === 1 ? 'amber' : ''],
  ];
  $('#vitals').innerHTML = vitals();
  $('#stats').innerHTML = chips.map(([k, v, cls]) =>
    `<div class="chip"><small>${k}</small><b class="${cls}">${v}</b></div>`).join('');
  $('#news').innerHTML = S.news.map(n => `<div>${n}</div>`).join('');
  $('#market').innerHTML = GOODS.map(([name]) => {
    const price = S.prices[name], held = S.inv[name] || 0, flag = S.flags[name];
    const priceHtml = price
      ? `<span class="${flag === 'up' ? 'amber' : flag === 'down' ? 'cyan' : ''}">` +
        `${flag === 'up' ? '&#9650; ' : flag === 'down' ? '&#9660; ' : ''}${money(price)}</span>`
      : '<span class="dim">no market</span>';
    let sub = '';
    if (held) {
      const cls = !price ? '' : price > S.cost[name] ? 'green' : price < S.cost[name] ? 'red' : '';
      sub = `<div class="sub ${cls}">holding ${num(held)} @ ${money(S.cost[name] || 0)}</div>`;
    }
    const canBuy = price && free() > 0 && S.cash >= price;
    const second = held && !price
      ? `<button class="danger" data-act="dump" data-arg="${name}">Dump</button>`
      : `<button data-act="sell" data-arg="${name}"${held && price ? '' : ' disabled'}>Sell</button>`;
    return `<div class="row"><div><div class="name">${name}</div>${sub}</div>
      <div class="price">${priceHtml}</div>
      <div class="btns"><button data-act="buy" data-arg="${name}"${canBuy ? '' : ' disabled'}>Buy</button>${second}</div></div>`;
  }).join('');
  let acts = last
    ? '<button class="primary" data-act="cashout">End run &amp; cash out</button>'
    : '<button class="primary" data-act="travel">Tunnel out</button><button data-act="laylow">Lay low</button>';
  acts += `<button data-act="raid"${S.raided ? ' disabled' : ''}>Hack a rival</button>`;
  acts += `<button data-act="gearmenu">Gear (${career.bag.length} in bag)</button>`;
  if (S.medkits) acts += `<button data-act="medkit"${S.hp >= 100 ? ' disabled' : ''}>Use medkit (${S.medkits})</button>`;
  if (GEAR_SPOTS.includes(S.loc)) acts += '<button data-act="gear">Black market</button>';
  if (S.loc === HOME) acts += '<button data-act="broker">The Fixer (debt)</button><button data-act="wallet">Cold wallet</button>';
  $('#actions').innerHTML = acts;
  $('#log').innerHTML = logs.join('');
}

// ---------- actions ----------
const ACTIONS = {
  async buy(name) {
    const price = S.prices[name];
    if (!price) return;
    const most = Math.min(Math.floor(S.cash / price), free());
    if (most <= 0) return;
    const qty = await askQty(`Buy ${name}`, `<p>${money(price)} each. You can take up to ${num(most)}.</p>`,
      most, {unit: price, ok: 'Buy'});
    if (!qty) return;
    S.cash -= qty * price;
    addItems(name, qty, price);
    addHeat(qty * price);
    log(`Bought ${num(qty)} ${name} for ${money(qty * price)}.`);
  },

  async sell(name) {
    const price = S.prices[name], held = S.inv[name] || 0;
    if (!price || !held) return;
    const qty = await askQty(`Sell ${name}`,
      `<p>Buyers pay ${money(price)} each. You hold ${num(held)}, bought at ${money(S.cost[name] || 0)}.</p>`,
      held, {unit: price, ok: 'Sell'});
    if (!qty) return;
    const profit = (price - (S.cost[name] || 0)) * qty;
    S.cash += qty * price;
    removeItems(name, qty);
    addHeat(qty * price);
    const xp = profit > 0 ? gainXp(Math.min(60, Math.sqrt(profit) / 4)) : '';
    log(`Sold ${num(qty)} ${name} for ${money(qty * price)} ` +
      `(<span class="${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${money(profit)}</span>).${xp}`);
  },

  async contract(index) {
    const c = S.contracts[index];
    if (!c || (S.inv[c.good] || 0) < c.qty) return;
    const chance = chanceFor(c), pay = payoutFor(c), price = S.prices[c.good];
    const compare = price ? `Selling them here instead would bring ${money(price * c.qty)}.` : 'Nobody is buying them here today.';
    if (!await confirmDlg('Contract', `<p><b>${c.job}</b>, for ${c.client}.</p>` +
      `<p>Uses up ${num(c.qty)} ${c.good}. Pays <span class="amber">${money(pay)}</span> if it works. ${compare}</p>` +
      `<p>Chance of success: <b>${chance}%</b></p>` +
      '<p class="dim">If it fails the goods are burned, your Heat jumps, and you may be traced. ' +
      'Levels and proxies raise the chance; Heat lowers it.</p>', 'Run the job', 'Walk away')) return;
    removeItems(c.good, c.qty);
    S.contracts.splice(index, 1);
    const quiet = inSyn('ghost');
    if (Math.random() * 100 < chance) {
      S.cash += pay;
      S.heat = Math.min(100, S.heat + (quiet ? 4 : 8));
      const xp = gainXp(40 + (100 - c.chance));
      log(`<span class="green">Contract done: ${c.client} paid ${money(pay)}.</span>${xp}`);
      await alertDlg('Job done', `<p>Clean work. ${c.client} pays <b>${money(pay)}</b>.</p>`);
    } else {
      S.heat = Math.min(100, S.heat + (quiet ? 8 : 15));
      const xp = gainXp(10);
      log(`<span class="red">Contract blown: ${num(c.qty)} ${c.good} burned.</span>${xp}`);
      await alertDlg('Job blown', `<p>It goes sideways. The ${c.good} are burned and ${c.client} stops answering.</p>`, 'danger');
      if (Math.random() < 0.35) await lawEncounter();
    }
  },

  // Break into a rival syndicate's node for loot. Once a day.
  async raid() {
    if (S.raided) return;
    if (!S.proxies && !S.inv['Zero-Days']) {
      return alertDlg('Hack a rival', '<p>You need at least one proxy chain or a Zero-Day to breach a rival node.</p>' +
        `<p class="dim">Proxy chains are sold at the black market (${GEAR_SPOTS.join(', ')}).</p>`);
    }
    const mood = g => g >= 3 ? '<span class="red">out for blood</span>' : g >= 1 ? '<span class="amber">watching you</span>' : 'ignoring you';
    const crews = rivals();
    const html = '<p>Breach a rival node and drain it. One raid a day. It is a hacking fight: weapons are no use, ' +
      'and if they win they rob you instead.</p>' +
      crews.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b> &middot; ${mood(S.grudge[k])}</div>`).join('') +
      '<p class="dim">Every raid makes that crew more likely to come after you.</p>';
    const buttons = crews.map(k => [SYNDICATES[k][0], k]);
    buttons.push(['Not today', null, 'small']);
    const key = await dialog('Hack a rival', html, buttons);
    if (!key) return;
    S.raided = true;
    await fight({kind: 'raid', gang: key, name: SYNDICATES[key][0], n: rnd(2, 3 + Math.floor(S.day / 6)),
      hit: 0.3, lo: 3, hi: 8});
  },

  async medkit() {
    if (!S.medkits || S.hp >= 100) return;
    S.medkits--;
    S.hp = Math.min(100, S.hp + MED_HEAL);
    log(`Used a medkit: Health back to ${S.hp}%.`);
  },

  // Wear, swap and scrap gear.
  async gearmenu() {
    for (;;) {
      const totals = Object.keys(STATS).filter(k => bonus(k)).map(k => statLine(k, bonus(k)));
      const html = '<p class="dim">WEARING</p>' + Object.entries(SLOTS).map(([slot, [label]]) => {
        const it = career.gear[slot];
        return `<div class="syn"><span class="dim">${label}:</span> ${it ? itemHtml(it) : '<span class="dim">empty</span>'}</div>`;
      }).join('') +
        `<p><b>Total bonuses:</b> ${totals.length ? totals.join(', ') : 'none yet'}</p>` +
        `<p class="dim">BAG ${career.bag.length}/${BAG_SIZE}. Tap an item to wear or scrap it. Gear drops from rival crews, ` +
        'is sold at the black market, and stays with you between runs.</p>' +
        `<p class="dim">${RARITY.map((name, i) => `<span class="r${i}">${name}</span>`).join(' &middot; ')}</p>`;
      const buttons = career.bag.map((it, i) => [it.name, i, 'r' + it.rar]);
      buttons.push(['Close', null, 'primary']);
      const index = await dialog('Gear', html, buttons);
      if (index === null) return;
      const it = career.bag[index], worn = career.gear[it.slot];
      const act = await dialog(it.name, `<div class="syn">${itemHtml(it)}</div>` +
        (worn ? `<p class="dim">Replaces what you are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
          : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
        [['Wear it', 'e', 'primary'], [`Scrap for ${money(scrapValue(it))}`, 's', 'danger'], ['Back', null, 'small']]);
      if (act === 'e') {
        career.bag.splice(index, 1);
        if (worn) career.bag.push(worn);
        career.gear[it.slot] = it;
      } else if (act === 's') {
        career.bag.splice(index, 1);
        S.cash += scrapValue(it);
        log(`Scrapped ${it.name} for ${money(scrapValue(it))}.`);
      }
      saveCareer();
      render();
    }
  },

  // Black market: weapons, EMP grenades, proxy chains, medkits and gear.
  async gear() {
    for (;;) {
      const scale = 1 + Math.floor(S.day / 10) * 0.5;
      const next = WEAPONS[S.weapon + 1];
      const offers = [];
      if (next) offers.push({key: 'w', name: next[0], price: Math.round(next[1] * scale),
        text: next[2] > 1 ? `${next[2]} shots a round, ${pct(next[3])}% to hit` : `${pct(next[3])}% to drop one hostile a round`});
      if (S.emp < MAX_EMP) offers.push({key: 'e', name: 'EMP grenade', price: Math.round(EMP_PRICE * scale),
        text: `single use, fries 2 to 3 hostiles (you have ${S.emp})`});
      if (S.proxies < MAX_PROXIES) offers.push({key: 'p', name: 'Proxy chain', price: Math.round(1500 * (1 + S.proxies) * scale),
        text: `for hacking back, raids and contracts (you have ${S.proxies})`});
      if (S.medkits < MAX_MED) offers.push({key: 'm', name: 'Medkit', price: Math.round(600 * scale),
        text: `restores ${MED_HEAL}% Health any time, even mid-fight (you have ${S.medkits})`});
      S.shop.forEach((it, i) => offers.push({key: 'g' + i, name: it.name, price: Math.round(itemValue(it) * scale),
        item: it, cls: 'r' + it.rar}));
      if (S.hp < 100) offers.push({key: 'd', name: 'Street doc', price: Math.round((100 - S.hp) * 40 * scale),
        text: `patches you up from ${S.hp}% to full Health`});
      const have = WEAPONS[S.weapon] ? WEAPONS[S.weapon][0] : 'nothing';
      const html = `<p>Cash: <span class="green">${money(S.cash)}</span>. You carry: ${have}.</p>` +
        (offers.length ? offers.map(o => `<div class="syn"><span class="${S.cash >= o.price ? 'amber' : 'red'}">` +
          `${money(o.price)}</span> &middot; ${o.item ? itemHtml(o.item) : `<b>${o.name}</b><br>${o.text}`}</div>`).join('')
          : '<p>You already own everything they sell.</p>') +
        '<p class="dim">Weapons work on the law and on rival crews. Using them on the law raises your Heat.</p>';
      const buttons = offers.filter(o => S.cash >= o.price)
        .map(o => [o.key === 'd' ? 'See the street doc' : `Buy ${o.name}`, o.key, o.cls]);
      buttons.push(['Leave', null, 'small']);
      const key = await dialog('Black market', html, buttons);
      if (!key) return;
      const o = offers.find(x => x.key === key);
      S.cash -= o.price;
      if (key === 'w') S.weapon++;
      else if (key === 'e') S.emp++;
      else if (key === 'm') S.medkits++;
      else if (key === 'd') S.hp = 100;
      else if (o.item) { S.shop.splice(S.shop.indexOf(o.item), 1); stash(o.item); saveCareer(); }
      else S.proxies++;
      log(key === 'd' ? `The street doc patched you up for ${money(o.price)}.` : `Bought: ${o.name} for ${money(o.price)}.`);
      render();
    }
  },

  async profile() {
    const li = levelInfo();
    let html = `<p>Level <b>${li.level}</b>: <span class="cyan">${titleFor(li.level)}</span><br>` +
      `${li.into} / ${li.need} XP to the next level (${num(career.xp)} total)</p>` +
      '<p class="dim">XP comes from profitable sales, contracts, escaping or beating the law and rival crews, raids, clearing your debt and ' +
      'finishing a run. It carries over between runs.</p>';
    const buttons = [['Close', null, 'primary']];
    if (career.syn) {
      html += `<div class="syn"><b>${SYNDICATES[career.syn][0]}</b><br>${SYNDICATES[career.syn][1]}</div>`;
    } else if (li.level >= 10) {
      html += '<p>You can join a syndicate.</p>';
      buttons.unshift(['Choose a syndicate', 'join']);
    } else {
      html += '<p>Syndicates recruit at <b>level 10</b>.</p>';
    }
    if (await dialog('Your record', html, buttons) === 'join') await chooseSyndicate();
  },

  async dump(name) {
    const held = S.inv[name] || 0;
    if (!held) return;
    const qty = await askQty(`Dump ${name}`, '<p>No buyers here. Wipe them to free drive space?</p>',
      held, {ok: 'Wipe'});
    if (!qty) return;
    removeItems(name, qty);
    log(`Securely wiped ${num(qty)} ${name}.`);
  },

  async travel() {
    if (S.day >= DAYS) return ACTIONS.cashout();
    const others = LOCATIONS.filter(l => l !== S.loc);
    const buttons = others.map(l =>
      [l === HOME ? l + ' (Fixer, wallet)' : GEAR_SPOTS.includes(l) ? l + ' (black market)' : l, l]);
    buttons.push(['Stay here', null, 'small']);
    const dest = await dialog('Tunnel out', '<p>Where to? The trip takes a day.</p>', buttons);
    if (!dest) return;
    S.loc = dest;
    nextDay();
    log(`Day ${S.day}: you surface at ${dest}.`);
    render();
    await randomEvent();
  },

  async laylow() {
    if (S.day >= DAYS) return ACTIONS.cashout();
    if (!await confirmDlg('Lay low', '<p>Go dark for a day? Heat drops by a lot, and you recover 20% Health and 10% OpSec. ' +
      'Prices will change and your debt still grows.</p>', 'Go dark', 'Cancel')) return;
    nextDay();
    S.heat = Math.max(0, S.heat - 30);
    S.opsec = Math.min(100, S.opsec + 10);
    S.hp = Math.min(100, S.hp + 20);
    log(`Day ${S.day}: you unplugged everything, slept and read paperbacks.`);
  },

  async cashout() {
    const warn = used() ? '<p class="amber">You are still holding goods. They count for nothing at the end.</p>' : '';
    if (await confirmDlg('Final day', warn + '<p>End the run and cash out?</p>', 'Cash out', 'Not yet')) S.over = true;
  },

  async broker() {
    const cmd = await dialog('The Fixer',
      `<p>You owe <span class="red">${money(S.debt)}</span>, growing ${pct(debtRate())}% a day.</p>`,
      [['Pay down', 'p', 'primary'], ['Borrow', 'b'], ['Leave', null, 'small']]);
    if (cmd === 'p') {
      const most = Math.min(S.cash, S.debt);
      if (most <= 0) return alertDlg('The Fixer', '<p>Nothing to pay, or nothing to pay with.</p>');
      const amt = await askQty('Pay down debt', '<p>How much?</p>', most, {cash: true, ok: 'Pay'});
      if (!amt) return;
      S.cash -= amt; S.debt -= amt;
      if (S.debt) {
        log(`Paid the Fixer ${money(amt)}.`);
      } else {
        const xp = S.cleared ? '' : gainXp(50);
        S.cleared = true;
        log(`<span class="green">You are clear with the Fixer!</span>${xp}`);
      }
    } else if (cmd === 'b') {
      const most = DEBT_LIMIT - S.debt;
      if (most <= 0) return alertDlg('The Fixer', '<p>"You\'re at your limit. Pay something back first."</p>');
      const amt = await askQty('Borrow', '<p>"Don\'t make us come looking for you."</p>', most, {cash: true, ok: 'Borrow'});
      if (!amt) return;
      S.cash += amt; S.debt += amt;
      log(`Borrowed ${money(amt)} from the Fixer.`);
    }
  },

  async wallet() {
    const cmd = await dialog('Cold wallet',
      `<p>Balance: ${money(S.wallet)}. Earns ${pct(walletRate())}% a day and can't be phished.</p>`,
      [['Deposit', 'd', 'primary'], ['Withdraw', 'w'], ['Leave', null, 'small']]);
    if (cmd === 'd') {
      if (S.cash <= 0) return alertDlg('Cold wallet', '<p>You have no cash to deposit.</p>');
      const amt = await askQty('Deposit', '<p>How much?</p>', S.cash, {cash: true, ok: 'Deposit'});
      if (!amt) return;
      S.cash -= amt; S.wallet += amt;
      log(`Moved ${money(amt)} into cold storage.`);
    } else if (cmd === 'w') {
      if (S.wallet <= 0) return alertDlg('Cold wallet', '<p>The wallet is empty.</p>');
      const amt = await askQty('Withdraw', '<p>How much?</p>', S.wallet, {cash: true, ok: 'Withdraw'});
      if (!amt) return;
      S.wallet -= amt; S.cash += amt;
      log(`Pulled ${money(amt)} out of cold storage.`);
    }
  },

  async restart() {
    if (await confirmDlg('New run', '<p>Abandon this run and start over?</p>', 'Start over', 'Cancel')) newGame();
  },
};

function nextDay() {
  S.day += 1;
  S.debt = Math.ceil(S.debt * (1 + debtRate()));
  S.wallet = Math.floor(S.wallet * (1 + walletRate()));
  S.heat = Math.max(0, S.heat - HEAT_DECAY);
  S.raided = false;
  S.hp = Math.min(100, S.hp + 3 + bonus('regen'));
  rollMarket();
}

// ---------- events ----------
async function randomEvent() {
  if (Math.random() < Math.min(0.45, 0.07 + S.heat / 300) * (inSyn('ghost') ? 0.7 : 1)) return lawEncounter();
  // Rival syndicates come after you more often the more you have crossed them.
  const crews = rivals(), anger = crews.reduce((sum, k) => sum + S.grudge[k], 0);
  if (Math.random() < Math.min(0.3, 0.05 + 0.03 * anger)) {
    let roll = Math.random() * (anger + crews.length);
    const key = crews.find(k => (roll -= S.grudge[k] + 1) < 0) || crews[0];
    return gangEncounter(key);
  }
  const r = Math.random();
  if (r < 0.10) {
    const name = GOODS[rnd(3, GOODS.length - 1)][0];
    const qty = Math.min(rnd(2, 8), free());
    if (qty > 0) {
      addItems(name, qty, 0);
      log(`<span class="cyan">Found an unlocked laptop in a ride share: ${qty} ${name}!</span>`);
      await alertDlg('Lucky find', `<p>Someone left an unlocked laptop in a ride share. You lift <b>${qty} ${name}</b>.</p>`);
    }
  } else if (r < 0.18) {
    const price = rnd(400, 1200) * (1 + Math.floor(S.day / 8));
    if (S.cash >= price && await confirmDlg('Drive upgrade',
      `<p>A hardware hacker offers an encrypted drive upgrade: <b>+50 slots</b> for ${money(price)}.</p>`, 'Buy it', 'Pass')) {
      S.cash -= price; S.drive += 50;
      log(`Drive upgraded to ${cap()} slots.`);
    }
  } else if (r < 0.27) {
    const price = rnd(700, 1500) * (1 + S.proxies);
    if (S.cash >= price && S.proxies < MAX_PROXIES && await confirmDlg('Proxy chain',
      `<p>A sysadmin with a grudge will sell you a proxy chain for ${money(price)}.</p>` +
      '<p class="dim">Proxies help you slip traces and let you counter-hack.</p>', 'Buy it', 'Pass')) {
      S.cash -= price; S.proxies += 1;
      log(`Proxy chain added. You now run ${S.proxies}.`);
    }
  } else if (r < 0.33) {
    if (S.cash > 100) {
      const loss = Math.floor(S.cash * rnd(10, 25) / 100);
      S.cash -= loss;
      log(`<span class="red">Phished! Lost ${money(loss)} from your hot wallet.</span>`);
      await alertDlg('Phished', `<p>You clicked a link. YOU. Someone drained <b>${money(loss)}</b> from your hot wallet.</p>` +
        '<p class="dim">Cash in the cold wallet is safe from this.</p>', 'danger');
    }
  } else if (r < 0.40) {
    if (S.opsec < 100) {
      const price = (100 - S.opsec) * rnd(20, 45);
      if (S.cash >= price && await confirmDlg('OpSec audit',
        `<p>An old-timer offers a full OpSec audit for ${money(price)}. Restores OpSec to 100%.</p>`, 'Pay', 'Pass')) {
        S.cash -= price; S.opsec = 100;
        log('OpSec restored to 100%.');
      }
    }
  }
}

// ---------- confrontations: the law, rival syndicates, and raids on rivals ----------
function lawEncounter() {
  const tier = lawTier(), L = LAW[tier];
  const n = [rnd(1, 2 + Math.floor(S.day / 10)), rnd(2, 3 + Math.floor(S.day / 8)),
    rnd(2, 3 + Math.floor(S.day / 8))][tier];
  return fight({kind: 'law', tier, name: L.name, n, hit: L.hit, lo: L.lo, hi: L.hi});
}

function gangEncounter(key) {
  return fight({kind: 'gang', gang: key, name: SYNDICATES[key][0], n: rnd(1, 2 + Math.floor(S.day / 8)),
    hit: 0.3, lo: 3, hi: 8});
}

// One confrontation. E: {kind: 'law' | 'gang' | 'raid', name, n, hit, lo, hi, tier, gang}
async function fight(E) {
  const total = E.n, law = E.kind === 'law', raid = E.kind === 'raid', quiet = inSyn('ghost');
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;
  let n = E.n, violent = false;
  let msg = law ? `${E.name[0].toUpperCase() + E.name.slice(1)} has a lock on you: ${plural(n, 'agent')}.`
    : raid ? `You breach a ${E.name} node. ${plural(n, 'operator')} are jacked in and they see you.`
    : `${E.name} crackers are inside your rig: ${plural(n, 'intruder')}.`;
  const title = law ? `!! ${E.name.replace(/^the /, '').toUpperCase()} !!`
    : raid ? `RAID: ${E.name}` : `!! ${E.name.toUpperCase()} ATTACK !!`;
  const hint = law
    ? 'Shooting, EMPs and running risk your Health. Hacking risks your OpSec and keeps your Heat down. Wiping the drive loses your goods but always escapes.'
    : raid ? 'A remote fight: only hacking tools work and only your OpSec is at risk. Jack out any time to leave empty-handed.'
    : 'Shooting, EMPs and running risk your Health. Hacking back risks your OpSec. Or pay them to go away.';
  let physical = false;
  for (;;) {
    render();
    const W = WEAPONS[S.weapon], zeroDays = S.inv['Zero-Days'] || 0;
    const payoff = Math.max(500, Math.floor(S.cash * 0.2));
    const buttons = [];
    if (!raid && W) buttons.push([`Fire ${W[0]}`, 'shoot']);
    if (!raid && S.emp) buttons.push([`EMP grenade (${S.emp})`, 'emp']);
    if (S.proxies) buttons.push([raid ? 'Hack them' : 'Counter-hack', 'hack']);
    if (zeroDays) buttons.push([`Burn a Zero-Day (${zeroDays})`, 'zero']);
    if (S.medkits && S.hp < 100) buttons.push([`Medkit (${S.medkits})`, 'med']);
    buttons.push([raid ? 'Jack out' : 'Run', 'run']);
    if (law) buttons.push(['Wipe drive', 'wipe', 'danger']);
    if (E.kind === 'gang' && S.cash >= payoff) buttons.push([`Pay them ${money(payoff)}`, 'pay']);
    buttons[0][2] = 'primary';
    const cmd = await dialog(title,
      `<p>${msg}</p>${vitals()}${meter('Hostiles', n, total, `${n} / ${total}`, 'red')}` +
      `<p class="dim" style="margin-top:10px">${hint}</p>`, buttons, 'danger');

    let kills = 0;
    physical = !raid && (cmd === 'shoot' || cmd === 'emp' || cmd === 'run' || cmd === 'med');
    if (cmd === 'shoot') {
      for (let i = 0; i < W[2]; i++) if (Math.random() < W[3] + bonus('aim') / 100) kills++;
      kills = Math.min(n, kills);
      violent = true;
      S.heat = Math.min(100, S.heat + (law ? 12 : 3));
      msg = kills ? `Your ${W[0]} drops ${kills} of them.` : `Your ${W[0]} misses.`;
    } else if (cmd === 'emp') {
      S.emp--;
      kills = Math.min(n, rnd(2, 3));
      violent = true;
      S.heat = Math.min(100, S.heat + (law ? 6 : 2));
      msg = `The EMP fries ${kills} of them.`;
    } else if (cmd === 'hack') {
      for (let i = 0; i < S.proxies; i++) if (Math.random() < 0.4 + bonus('hack') / 100) kills++;
      kills = Math.min(n, kills);
      msg = `You hit back through your proxies: ${kills} knocked offline.`;
    } else if (cmd === 'med') {
      S.medkits--;
      S.hp = Math.min(100, S.hp + MED_HEAL);
      msg = `You jab a medkit: Health back to ${S.hp}%.`;
    } else if (cmd === 'zero') {
      removeItems('Zero-Days', 1);
      kills = Math.min(n, 2);
      msg = `The Zero-Day tears through their gear: ${kills} knocked offline.`;
    } else if (cmd === 'run') {
      const chance = raid ? 1
        : Math.max(0.25, Math.min(0.9, 0.55 + 0.05 * S.proxies - 0.07 * (n - 1) + bonus('speed') / 100));
      if (Math.random() < chance) {
        if (raid) {
          log(`You jacked out of the ${E.name} node empty-handed.`);
          return;
        }
        if (law) S.heat = Math.max(0, S.heat - 10);
        log('<span class="green">You hopped three networks and vanished.</span>' + gainXp(law ? 20 : 10));
        return alertDlg('Escaped', '<p>You hop three networks and vanish.</p>');
      }
      msg = 'They are still on you.';
    } else if (cmd === 'wipe') {
      S.inv = {}; S.cost = {};
      S.heat = Math.floor(S.heat / 2);
      log('<span class="amber">You nuked the drive. The trail went cold.</span>');
      return alertDlg('Drive wiped', '<p>You nuke the drive. Nothing left to find. The trail goes cold.</p>');
    } else if (cmd === 'pay') {
      S.cash -= payoff;
      log(`<span class="amber">Paid ${E.name} ${money(payoff)} to back off.</span>`);
      return alertDlg('Paid off', `<p>${E.name} take ${money(payoff)} and log out. For now.</p>`);
    }

    n -= kills;
    if (n <= 0) {
      let loot, xp;
      if (law) {
        loot = total * rnd(400, 1500) * (1 + Math.floor(S.day / 10));
        if (!violent) S.heat = Math.max(0, S.heat - 25);
        xp = gainXp(30 * total);
      } else if (raid) {
        loot = total * rnd(1500, 4000) * (1 + Math.floor(S.day / 6));
        S.grudge[E.gang] += 2;
        S.heat = Math.min(100, S.heat + (quiet ? 5 : 10));
        xp = gainXp(40 * total);
      } else {
        loot = total * rnd(600, 2000) * (1 + Math.floor(S.day / 10));
        S.grudge[E.gang] += 1;
        xp = gainXp(30 * total);
      }
      loot = Math.round(loot * (1 + bonus('luck') / 100));
      S.cash += loot;
      const what = law ? `You shook off ${E.name} and sold their tooling`
        : raid ? `You cleaned out a ${E.name} node` : `You beat back ${E.name} and drained their wallets`;
      log(`<span class="green">${what} for ${money(loot)}.</span>${xp}`);
      await alertDlg(raid ? 'Node looted' : 'You won', `<p>${what} for <b>${money(loot)}</b>.</p>` +
        (law ? '' : `<p class="dim">${E.name} will remember this.</p>`));
      if (!law) {
        // Rival crews drop medkits and gear. Raids and higher levels drop better.
        if (S.medkits < MAX_MED && Math.random() < 0.3) {
          S.medkits++;
          log('You pocket a medkit they left behind.');
        }
        if (Math.random() < (raid ? 0.85 : 0.6)) {
          await dropLoot(E.name, Math.min(30, level()) * 0.5 + S.day * 0.3 + (raid ? 5 : 0));
        }
      }
      return;
    }

    let dmg = 0;
    for (let i = 0; i < n; i++) if (Math.random() < E.hit) dmg += rnd(E.lo, E.hi);
    if (dmg && physical) {
      // In the open they hurt you, not your rig. Armour soaks up part of it.
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('armor') / 100)));
      S.hp -= dmg;
      msg += ` <span class="red">${law ? 'They open fire' : 'They jump you'}: Health -${dmg}%.</span>`;
    } else if (dmg) {
      dmg = Math.max(1, Math.ceil(dmg * (1 - bonus('firewall') / 100)));
      S.opsec -= dmg;
      msg += ` <span class="red">They ${law ? 'unmask part of your trail' : 'tear into your defences'}: OpSec -${dmg}%.</span>`;
    } else {
      msg += ' Their attacks miss.';
    }
    if (S.opsec <= 0 || S.hp <= 0) return lose(E);
  }
}

// Health or OpSec hit zero.
async function lose(E) {
  const hurt = S.hp <= 0;
  S.opsec = Math.max(0, S.opsec);
  S.hp = Math.max(0, S.hp);
  if (E.kind !== 'law') {
    // Rival crews rob you but don't end the run.
    const cash = Math.floor(S.cash * 0.35);
    S.cash -= cash;
    let goods = 0;
    for (const name of Object.keys(S.inv)) {
      const take = Math.ceil(S.inv[name] / 2);
      goods += take;
      removeItems(name, take);
    }
    S.opsec = Math.max(S.opsec, 40);
    let clinic = '';
    if (hurt) {
      // Beaten unconscious: a day in a back-room clinic.
      S.hp = 50;
      if (S.day < DAYS) { nextDay(); clinic = '<p>You wake up a day later in a back-room clinic, stitched up to 50% Health.</p>'; }
    }
    log(`<span class="red">${E.name} cleaned you out: ${money(cash)} and ${num(goods)} goods.</span>`);
    render();
    return alertDlg(hurt ? 'Beaten and robbed' : 'Robbed',
      `<p>${E.name} ${hurt ? 'leave you on the floor' : 'own your rig'}. They take <b>${money(cash)}</b> and ` +
      `<b>${num(goods)}</b> of your goods${hurt ? '' : ' before you pull the plug'}.</p>${clinic}`, 'danger');
  }
  if (E.tier === 2) {
    S.busted = S.over = true;
    return;
  }
  // Police and Feds: goods seized, a fine, and time inside. The run goes on.
  const fine = Math.floor(S.cash * (E.tier ? 0.5 : 0.25)), days = E.tier ? 4 : 2;
  S.cash -= fine;
  S.inv = {}; S.cost = {};
  let served = 0;
  while (served < days && S.day < DAYS) { nextDay(); served++; }
  S.opsec = Math.max(S.opsec, E.tier ? 50 : 60);
  S.hp = Math.max(S.hp, 50);
  S.heat = E.tier ? 20 : 10;
  log(`<span class="red">Arrested by ${E.name}: goods seized, ${money(fine)} fine, ${served} day${served === 1 ? '' : 's'} inside.</span>`);
  render();
  await alertDlg('Arrested', `<p>${E.name[0].toUpperCase() + E.name.slice(1)} ` +
    `${hurt ? 'drags you out on a stretcher' : 'kicks the door in'}.</p>` +
    `<p>Your goods are seized, you pay <b>${money(fine)}</b> and lose <b>${served} day${served === 1 ? '' : 's'}</b> ` +
    'before a lawyer gets you out. Your debt kept growing.</p>' +
    '<p class="dim">The cold wallet was never found.</p>', 'danger');
}

// ---------- end of run ----------
async function finish() {
  store.del('zdh-save');
  render();
  if (S.busted) {
    await dialog('VANISHED', '<p>The NSA does not arrest people like you. A van you never noticed was parked outside all week.</p>' +
      `<p>Your run ends on day ${S.day}. No score for the disappeared.</p>` +
      `<p>XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`, [['New run', true, 'primary']], 'danger');
    return;
  }
  const score = S.cash + S.wallet - S.debt;
  gainXp(100 + Math.min(400, Math.sqrt(Math.max(0, score)) / 5));
  const ranks = [[0, 'Owned by the Fixer'], [50000, 'Script Kiddie'], [250000, 'Gray Hat'],
    [1000000, 'Elite Operator'], [10000000, 'Ghost in the Wire']];
  const rank = (ranks.find(([limit]) => score < limit) || [0, 'Legend of the Underground'])[1];
  let scores = (!AUTO && store.get('zdh-scores')) || [];
  if (!Array.isArray(scores)) scores = [];
  const summary = `<p>Cash ${money(S.cash)} + wallet ${money(S.wallet)} - debt ${money(S.debt)}</p>` +
    `<p>Final score: <b class="green">${money(score)}</b><br>Run rating: <b class="cyan">${rank}</b><br>` +
    `XP earned this run: <b class="cyan">${num(S.xpRun || 0)}</b></p>`;
  if (scores.length < 10 || score > Math.min(...scores.map(s => s.score))) {
    const handle = (await askText('New high score!', summary + '<p>Your handle:</p>')) || 'anon';
    scores.push({handle: handle.slice(0, 16), score});
    scores = scores.sort((a, b) => b.score - a.score).slice(0, 10);
    if (!AUTO) store.set('zdh-scores', scores);
  }
  const hall = scores.map((s, i) =>
    `<tr><td>${i + 1}.</td><td>${esc(s.handle)}</td><td>${money(s.score)}</td></tr>`).join('');
  await dialog('Run complete', summary + `<p class="dim">HALL OF FAME</p><table class="hall">${hall}</table>`,
    [['New run', true, 'primary']]);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || busy || b.disabled) return;
  busy = true;
  try {
    await ACTIONS[b.dataset.act](b.dataset.arg);
    if (S.over) { await finish(); newGame(); }
    await levelUpCheck();
  } finally {
    busy = false;
  }
  render();
  save();
});

// ---------- self test: open index.html#selftest to auto-play random games ----------
async function selfTest() {
  AUTO = true;
  const names = GOODS.map(g => g[0]);
  let finished = 0, busted = 0, best = -Infinity, contractsSeen = 0, raids = 0;
  try {
    for (let game = 0; game < 200; game++) {
      career = {xp: rnd(0, 9000), syn: pick([null, 'ghost', 'ledger', 'null', 'red']), gear: {}, bag: []};
      for (let i = rnd(0, 4); i > 0; i--) { const it = makeItem(rnd(0, 4)); career.gear[it.slot] = it; }
      newGame();
      S.proxies = rnd(0, 3); S.weapon = rnd(0, 3); S.emp = rnd(0, 2);
      for (let step = 0; step < 600 && !S.over; step++) {
        const r = Math.random();
        const act = r < 0.3 ? 'buy' : r < 0.5 ? 'sell' : r < 0.6 ? 'contract' : r < 0.65 ? 'dump'
          : r < 0.8 ? 'travel' : r < 0.83 ? 'laylow' : r < 0.86 ? 'broker' : r < 0.89 ? 'wallet'
          : r < 0.93 ? 'raid' : r < 0.96 ? 'gear' : r < 0.98 ? 'gearmenu' : r < 0.99 ? 'medkit' : 'profile';
        if ((act === 'broker' || act === 'wallet') && S.loc !== HOME) continue;
        if (act === 'gear' && !GEAR_SPOTS.includes(S.loc)) continue;
        if (act === 'raid') raids++;
        if (act === 'contract') {
          // Stock up for a random contract first so jobs actually get run.
          const c = S.contracts[0];
          if (c && free() >= c.qty) addItems(c.good, c.qty, 0);
          await ACTIONS.contract(0);
          contractsSeen += c ? 1 : 0;
        } else {
          await ACTIONS[act](names[rnd(0, names.length - 1)]);
        }
        await levelUpCheck();
        render();
        const bad = S.cash < 0 || S.wallet < 0 || S.debt < 0 || used() < 0 ||
          career.bag.length > BAG_SIZE || S.medkits < 0 || S.medkits > MAX_MED || S.shop.length > 3 ||
          Object.values(career.gear).some(it => !it || !RARITY[it.rar] || !Object.keys(it.stats).length) ||
          !Number.isInteger(career.xp) || !Number.isInteger(S.hp) || S.hp < 0 || S.hp > 100 || S.emp < 0 || S.emp > MAX_EMP || S.weapon > 3 || S.proxies > MAX_PROXIES ||
          Object.values(S.grudge).some(g => !(g >= 0)) || S.contracts.some(c => !(c.qty > 0 && c.payout > 0)) ||
          S.heat < 0 || S.heat > 100 || S.opsec < 0 || S.opsec > 100 || S.day > DAYS ||
          Object.values(S.inv).some(q => !(q > 0)) || [S.cash, S.wallet, S.debt].some(v => !Number.isInteger(v));
        if (bad) throw new Error('invariant broken: ' + JSON.stringify(S));
      }
      if (S.over) {
        finished++;
        if (S.busted) busted++; else best = Math.max(best, S.cash + S.wallet - S.debt);
        await finish();
      }
    }
    document.title = 'SELFTEST OK';
    document.body.textContent = `SELFTEST OK finished=${finished} busted=${busted} best=${best} contracts=${contractsSeen} raids=${raids}`;
  } catch (err) {
    document.title = 'SELFTEST FAIL';
    document.body.textContent = 'SELFTEST FAIL ' + (err && err.stack || err);
  }
}

// ---------- boot ----------
(async function boot() {
  if (location.hash === '#selftest') return selfTest();
  // Web version only: keep a copy for offline play.
  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const record = store.get('zdh-career');
  if (record && Number.isInteger(record.xp) && record.xp >= 0) {
    career = {xp: record.xp, syn: SYNDICATES[record.syn] ? record.syn : null,
      gear: record.gear && typeof record.gear === 'object' ? record.gear : {},
      bag: Array.isArray(record.bag) ? record.bag : []};
  }
  const saved = store.get('zdh-save');
  if (saved && saved.prices && !saved.over) {
    S = saved;
    // Fill in anything a save from an older version lacks.
    S.contracts = S.contracts || [];
    S.hp = Number.isInteger(S.hp) ? S.hp : 100;
    S.medkits = S.medkits || 0;
    S.shop = S.shop || [];
    if (S.armor && !career.gear.body) {
      // The old vest becomes a gear item.
      career.gear.body = {slot: 'body', rar: 1, name: 'Tuned Armoured Vest', stats: {armor: 15}};
    }
    delete S.armor;
    S.weapon = S.weapon || 0;
    S.emp = S.emp || 0;
    S.grudge = Object.assign(noGrudges(), S.grudge);
    S.raided = !!S.raided;
    log('Run resumed.');
    render();
    return;
  }
  newGame();
  render();
  busy = true;
  await alertDlg('ZERO DAY HUSTLE',
    `<p>You have <b>${DAYS} days</b>, ${money(S.cash)} and a ${money(START_DEBT)} debt to the Fixer ` +
    `that grows ${pct(debtRate())}% a day.</p>` +
    '<p>Buy low, sell high, and tunnel between spots. Every trip takes a day and reshuffles the prices.</p>' +
    '<p><span class="amber">Contracts</span> use up your goods on a job. If it works it pays more than selling.</p>' +
    '<p>You earn <span class="cyan">XP</span> across runs. At level 10 you can join a syndicate.</p>' +
    '<p>Big deals raise your <span class="amber">Heat</span>, and Heat decides who hunts you: police, then the Feds, ' +
    'then the NSA. Rival syndicates will try to rob you too, and you can raid them back.</p>' +
    '<p>When cornered you can shoot, hack, run or pay. Shootouts cost <span class="green">Health</span>, hack fights cost ' +
    '<span class="green">OpSec</span>; lose either and you go down. Gear and a street doc are at the black market.</p>' +
    '<p class="dim">Only cash and your cold wallet count at the end.</p>');
  busy = false;
  save();
})();
</script>
