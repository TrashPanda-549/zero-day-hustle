<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0Day Hustle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Zero Day Hustle</title>
<style>
:root{--bg:#06050d;--panel:#0f0d1f;--panel2:#17142e;--line:#2b2752;--fg:#d9e2ff;--dim:#7c81ab;
  --accent:#00e5ff;--cyan:#00e5ff;--pink:#ff2a6d;--magenta:#ff4fd8;--yellow:#fcee0a;--amber:#fcee0a;
  --green:#3dff9a;--red:#ff3b5c;
  --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 ui-monospace,Consolas,"Cascadia Mono",Menlo,"Roboto Mono",monospace;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;min-height:100vh;
  background:
    radial-gradient(900px 420px at 90% -8%,rgba(255,42,109,.17),transparent 70%),
    radial-gradient(700px 380px at 0% 0%,rgba(0,229,255,.13),transparent 70%),
    linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px) 0 0/34px 100%,
    var(--bg)}
/* scanlines over everything */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#app{max-width:760px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtns{display:flex;gap:6px}
h1{margin:0;font-size:18px;letter-spacing:3px;font-weight:800;font-style:italic;color:#000;background:var(--yellow);
  padding:5px 22px 5px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  animation:glitch 4.5s infinite steps(1)}
@keyframes glitch{0%,91%,100%{text-shadow:none;transform:none}
  92%{text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);transform:translateX(1px)}
  94%{text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);transform:translateX(-2px) skewX(-6deg)}
  96%{text-shadow:1px 0 var(--pink);transform:none}}
h2{margin:0 0 10px;font-size:16px;color:var(--yellow);letter-spacing:2px;text-transform:uppercase}
#dayloc{margin:6px 0 4px;font-size:15px;letter-spacing:1px}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.cyan{color:var(--cyan)}.dim{color:var(--dim)}
button{font:inherit;color:var(--accent);background:rgba(0,229,255,.06);border:1px solid var(--accent);
  padding:8px 12px;min-height:40px;cursor:pointer;clip-path:var(--cut);letter-spacing:.5px;
  text-shadow:0 0 6px rgba(0,229,255,.5)}
button:active:not(:disabled){background:var(--accent);color:#000;text-shadow:none}
button:disabled{opacity:.28;cursor:default;text-shadow:none}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:bold;text-shadow:none}
button.primary:active:not(:disabled){background:#fff}
button.danger{border-color:var(--pink);color:var(--pink);background:rgba(255,42,109,.08);text-shadow:0 0 6px rgba(255,42,109,.5)}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-color:var(--line);color:var(--dim);
  background:transparent;text-shadow:none}

/* heads-up panel: avatar, level, health */
#hud{display:grid;grid-template-columns:66px 1fr;gap:10px;margin-top:10px;align-items:stretch}
#ava{cursor:pointer;background:linear-gradient(#0b0a1c,#17132f);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta);position:relative;overflow:hidden;min-height:76px}
#ava .avatar{position:absolute;left:0;top:0;width:100%;height:100%}
.avatar{display:block;width:100%;height:auto}
/* the pixel model: a small bitmap shown with big square pixels; the body above the legs bobs one pixel */
.av-px{image-rendering:crisp-edges;image-rendering:pixelated}
.av-bob{animation:avbob 1.7s steps(1) infinite}
@keyframes avbob{0%,100%{transform:none}55%{transform:translateY(6.25px)}}
/* avatar effects: breathing, blinking, rarity glows, glitches, sirens */
.av-fig{transform-origin:100px 336px;animation:avbreathe 3.6s ease-in-out infinite}
@keyframes avbreathe{50%{transform:scaleY(1.012)}}
.av-blink{opacity:0;animation:avblink 5.2s infinite}
@keyframes avblink{0%,93%{opacity:0}94%,96%{opacity:1}97%,100%{opacity:0}}
.av-streak{animation:avflick 4.1s infinite steps(1)}
@keyframes avflick{0%,100%{opacity:1}47%{opacity:.35}49%{opacity:1}52%{opacity:.5}54%{opacity:1}}
.av-epic{animation:avpulse 1.7s ease-in-out infinite alternate}
@keyframes avpulse{from{filter:drop-shadow(0 0 1px var(--rc))}to{filter:drop-shadow(0 0 6px var(--rc))}}
.av-leg{animation:avshimmer 1.2s ease-in-out infinite alternate}
@keyframes avshimmer{from{filter:drop-shadow(0 0 3px var(--rc)) brightness(1)}
  to{filter:drop-shadow(0 0 8px #fff3b0) brightness(1.45)}}
.av-spark{opacity:0;animation:avspark 2.2s linear infinite}
@keyframes avspark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.av-shake{animation:avshake 2.6s infinite steps(1)}
.av-shake.bad{animation-duration:1.3s}
@keyframes avshake{0%,100%{transform:none}8%{transform:translateX(3px)}10%{transform:translateX(-4px) skewX(-4deg)}
  12%{transform:none}61%{transform:translateX(-3px)}63%{transform:none}}
.av-static rect{opacity:0;animation:avstatic 1.7s infinite steps(1)}
.av-static rect:nth-child(2n){animation-duration:2.3s;animation-delay:-.6s}
@keyframes avstatic{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}30%{opacity:0;transform:translateY(22px)}
  55%{opacity:.45}62%{opacity:0;transform:translateY(-14px)}85%{opacity:.4}92%,100%{opacity:0}}
.av-cops ellipse{opacity:.15}
.av-cops .a{animation:avcop 1s infinite steps(1)}
.av-cops .b{animation:avcop 1s -.5s infinite steps(1)}
@keyframes avcop{0%{opacity:.8}50%{opacity:.15}}
.av-search{transform-origin:100px 0;animation:avsearch 4.5s ease-in-out infinite alternate}
@keyframes avsearch{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.av-reticle{transform-origin:100px 40px;animation:avret 1.3s ease-in-out infinite alternate}
@keyframes avret{from{transform:scale(1.3);opacity:.45}to{transform:scale(.92);opacity:1}}
.av-aura,.av-eye{animation:avglow 2.4s ease-in-out infinite alternate}
@keyframes avglow{from{opacity:.5}to{opacity:1}}
.av-ring{animation:avdash 3s linear infinite}
@keyframes avdash{to{stroke-dashoffset:-44}}
.av-zap{animation:blink .35s infinite steps(1)}
.av-bill{animation:avfall 3.3s linear infinite}
@keyframes avfall{from{transform:translateY(-20px)}to{transform:translateY(370px)}}
@media (prefers-reduced-motion:reduce){.avatar *{animation:none!important}}
#career{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--magenta);cursor:pointer;font-size:13px}
#career .lvl{color:var(--magenta);font-weight:bold;white-space:nowrap;text-shadow:0 0 8px rgba(255,79,216,.6)}
#career .bar{flex:1;height:8px;background:#000;border:1px solid var(--line);overflow:hidden;min-width:30px}
#career .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--cyan))}
#career .xp{color:var(--dim);white-space:nowrap}
#vitals{margin:2px 0 0}
.meter{display:grid;grid-template-columns:64px 1fr 58px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.meter span:first-child{color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.meter .track{height:11px;background:#000;border:1px solid var(--line);overflow:hidden;transform:skewX(-18deg)}
.meter .track i{display:block;height:100%;transition:width .25s;box-shadow:0 0 8px currentColor}
.meter b{text-align:right;white-space:nowrap}

#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:6px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);padding:6px 8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.chip small{display:block;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.chip b{font-size:15px;font-weight:600;white-space:nowrap}
#news{margin:10px 0 0}
#news div{color:var(--yellow);padding:2px 0}
#news div::before{content:">> ";color:var(--pink)}
#market{margin-top:10px;border:1px solid var(--line);border-top:2px solid var(--accent);background:rgba(15,13,31,.92)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 9px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .sub{font-size:12px;color:var(--dim)}
.row .price{text-align:right;white-space:nowrap}
.row .btns{display:flex;gap:6px}
.row .btns button{padding:6px 10px;min-width:52px}
.fold>summary{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;list-style:none;
  font-size:13px;letter-spacing:2px;color:var(--accent);user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8"}
.fold[open]>summary::before{content:"\25BE"}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold>summary small{margin-left:auto;font-size:12px;letter-spacing:0;color:var(--dim)}
#jobs .fold{margin-bottom:6px;border:1px solid var(--line);border-top:2px solid var(--yellow);background:rgba(15,13,31,.92)}
#jobs .fold>summary{color:var(--yellow)}
#jobs .fold .job{margin:6px}
#jobs .fold .none{padding:8px 10px;font-size:12px;color:var(--dim)}
#jobs{margin-top:12px}
#jobs h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--pink);font-weight:normal}
.job{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 9px;margin-bottom:6px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yellow)}
.job .what{font-weight:600}
.job .sub{font-size:12px;color:var(--dim)}
.job button{border-color:var(--yellow);color:var(--yellow);background:rgba(252,238,10,.06);text-shadow:none}
.job button:active:not(:disabled){background:var(--yellow);color:#000}
.job.quest{border-left-color:var(--cyan)}
.job.gig{border-left-color:var(--magenta)}
.job.quest button{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.06)}
.job.quest button:active:not(:disabled){background:var(--cyan);color:#000}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
#actions button{min-height:46px}
#log{margin-top:14px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
#log div{padding:1px 0}
#log div:first-child{color:var(--fg)}

/* dialogs */
#overlay{position:fixed;inset:0;background:rgba(3,2,10,.84);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:10}
#overlay[hidden]{display:none}
#dialog{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#0b0a19;border:1px solid var(--accent);
  border-top:3px solid var(--yellow);padding:16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
  animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96) skewX(-2deg);opacity:0}to{transform:none;opacity:1}}
#dialog.danger{border-color:var(--pink);border-top-color:var(--pink)}
#dialog.danger h2{color:var(--pink);text-shadow:0 0 10px rgba(255,42,109,.6)}
#dialog p{margin:0 0 10px}
.dbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.qty{display:flex;flex-direction:column;gap:10px;margin-top:6px}
input[type=number],input[type=text]{font:inherit;font-size:18px;color:var(--yellow);background:#000;
  border:1px solid var(--accent);padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--yellow);height:28px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.total{margin-top:10px;color:var(--yellow);min-height:1.35em}
.hall{width:100%;border-collapse:collapse;margin-top:6px}
.hall td{padding:2px 4px}.hall td:last-child{text-align:right}
.syn{margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-left:2px solid var(--accent);background:rgba(23,20,46,.6)}
.syn b{color:var(--cyan)}

/* gear screen */
.avatarbox{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.avatarbox .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);border-bottom:2px solid var(--magenta)}
/* a posed avatar in a dialog, and the two sides of a fight */
.posebox{max-width:150px;margin:0 auto 12px}
.posebox.wide{max-width:280px}
.posebox .avatar,.versus .avatar{background:linear-gradient(#0b0a1c,#1a1535);border:1px solid var(--line);
  border-bottom:2px solid var(--magenta)}
.versus{display:grid;grid-template-columns:86px auto 86px;gap:14px;align-items:center;justify-content:center;margin-bottom:10px}
.versus .foe{border-bottom-color:var(--pink)}
.versus b{color:var(--pink);font-style:italic;font-size:20px;text-shadow:0 0 10px rgba(255,42,109,.6)}
.versus small{display:block;text-align:center;color:var(--dim);font-size:11px;letter-spacing:1px;margin-top:3px}

/* battle screen: a side-on stage with the hostiles on the left and you on the right, windows underneath */
#battle{position:fixed;inset:0;z-index:9;background:#04030b;overflow:auto;
  padding:calc(8px + env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom))}
#battle[hidden]{display:none}
.bwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:100%}
.bstage{position:relative;width:100%;aspect-ratio:16/10;max-height:48vh;overflow:hidden;border:2px solid #aeb8ff;border-radius:7px;
  --sky:#2a0f4d;--glow:#ff4fd8;--grid:rgba(255,79,216,.55);
  background:linear-gradient(#05040f 0,var(--sky) 44%,var(--glow) 55%,#0a0716 55.5%,#05040f 100%)}
.bstage.raid{--sky:#03312a;--glow:#3dff9a;--grid:rgba(61,255,154,.5)}
.bstage.law{--sky:#0e2152;--glow:#4da3ff;--grid:rgba(77,163,255,.55)}
.bstage.thug{--sky:#3d1408;--glow:#ff9d2e;--grid:rgba(255,157,46,.5)}
.bstage::before{content:"";position:absolute;left:-60%;right:-60%;top:55.5%;height:90%;transform-origin:50% 0;
  transform:perspective(220px) rotateX(62deg);
  background:linear-gradient(var(--grid) 2px,transparent 2px) 0 0/100% 26px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 50% 0/52px 100%}
.bstage::after{content:"";position:absolute;left:0;right:0;top:30%;height:25.5%;opacity:.85;background:#05040f;
  clip-path:polygon(0 30%,6% 30%,6% 100%,8% 100%,8% 0,17% 0,17% 100%,19% 100%,19% 45%,24% 45%,24% 100%,29% 100%,29% 15%,41% 15%,
    41% 100%,44% 100%,44% 55%,50% 55%,50% 100%,53% 100%,53% 5%,66% 5%,66% 100%,68% 100%,68% 40%,75% 40%,75% 100%,80% 100%,
    80% 20%,91% 20%,91% 100%,93% 100%,93% 50%,100% 50%,100% 100%,0 100%)}
.bspr{position:absolute;z-index:2;aspect-ratio:200/352;transition:transform .2s ease-out,opacity .3s}
.bspr .avatar{width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(0,0,0,.9))}
.bspr.step{transform:translateX(-45%)}
.bspr.lunge{transform:translateX(38%)}
.bspr.hit{animation:bhit .42s steps(1)}
@keyframes bhit{0%,40%,80%{filter:brightness(4) saturate(0);transform:translateX(5%)}20%,60%{filter:none;transform:translateX(-5%)}100%{filter:none;transform:none}}
.bspr.glitch{animation:bglitch .5s steps(1)}
@keyframes bglitch{0%,50%{filter:hue-rotate(120deg) brightness(2);transform:skewX(14deg)}25%,75%{filter:invert(1);transform:skewX(-14deg) translateX(-4%)}
  100%{filter:none;transform:none}}
.bspr.dead{animation:bdead .7s linear forwards}
@keyframes bdead{0%{filter:brightness(3) saturate(0)}35%{filter:sepia(1) saturate(9) hue-rotate(250deg);opacity:.9}
  100%{filter:sepia(1) saturate(9) hue-rotate(250deg);opacity:0;transform:scaleX(1.25) scaleY(.92)}}
.bspr.cheer{animation:bcheer .34s ease-out 3}
@keyframes bcheer{50%{transform:translateY(-16%)}}
.bspr.ko{transition:transform .5s ease-in,opacity .5s;transform:translateY(8%) rotate(84deg);transform-origin:50% 92%;opacity:.55}
.bspr.flee{transition:transform .4s ease-in;transform:translateX(260%)}
.bspr.heal{animation:bheal .6s ease-out}
@keyframes bheal{50%{filter:brightness(1.7) drop-shadow(0 0 10px var(--green))}}
.bpop{position:absolute;z-index:6;transform:translate(-50%,0);font-weight:800;font-size:19px;font-style:italic;color:#fff;white-space:nowrap;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:bpop .9s ease-out forwards;pointer-events:none}
.bpop.red{color:#ff6b84}.bpop.green{color:var(--green)}.bpop.yellow{color:var(--yellow)}
.bpop small{font-size:11px;font-style:normal;margin-left:3px}
@keyframes bpop{0%{transform:translate(-50%,10px);opacity:0}18%{transform:translate(-50%,-14px);opacity:1}32%{transform:translate(-50%,-4px)}
  75%{transform:translate(-50%,-8px);opacity:1}100%{transform:translate(-50%,-22px);opacity:0}}
.bflash{position:absolute;inset:0;z-index:5;opacity:0;pointer-events:none}
.bflash.on{animation:bflash .45s ease-out}
@keyframes bflash{0%{opacity:.85}100%{opacity:0}}
.bstage.shake{animation:bshake .3s steps(1)}
@keyframes bshake{0%,50%{transform:translate(4px,-2px)}25%,75%{transform:translate(-4px,2px)}100%{transform:none}}
.bwin{border:2px solid #aeb8ff;border-radius:7px;padding:7px 10px;color:#eef1ff;
  background:linear-gradient(#1b1f6b,#0a0c33);box-shadow:inset 0 0 0 1px #05061c,0 2px 0 #000}
.bban{position:absolute;z-index:7;top:6px;left:50%;transform:translateX(-50%);max-width:92%;padding:4px 16px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px}
.bban[hidden]{display:none}
.bmsg{min-height:62px;font-size:14px}
.brow{display:grid;grid-template-columns:2fr 3fr;gap:6px}
.bfoes{font-size:13px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bfoes div{display:flex;justify-content:space-between;gap:6px}
.bfoes b{color:var(--yellow)}
.bstat{font-size:13px;display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center}
.bstat .who{grid-column:1/-1;letter-spacing:2px;color:var(--cyan)}
.bstat span.lbl{color:#9aa6ff;letter-spacing:1px}
.bstat .track{height:7px;background:#05061c;border:1px solid #4a52b8;border-radius:4px;overflow:hidden}
.bstat .track i{display:block;height:100%;transition:width .35s}
.bstat b{text-align:right;font-variant-numeric:tabular-nums}
.bcmd{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;padding:5px 6px}
.bcmd.off{opacity:.35;pointer-events:none}
.bcmd button{position:relative;min-height:38px;padding:5px 6px 5px 24px;border:0;background:none;clip-path:none;text-align:left;
  color:#eef1ff;text-shadow:1px 1px 0 #000;letter-spacing:0;font-size:14px;border-radius:4px;outline:0}
.bcmd button.danger{color:#ff8fa3}
.bcmd button:focus-visible,.bcmd button:hover,.bcmd button.cur{background:rgba(174,184,255,.16)}
.bcmd button:focus-visible::before,.bcmd button:hover::before,.bcmd button.cur::before{content:"\25B6";position:absolute;left:6px;top:50%;
  transform:translateY(-50%);color:var(--yellow);font-size:12px;animation:blink .7s infinite steps(1)}
.bcmd button:active{background:rgba(174,184,255,.4);color:#fff}
.bhint{font-size:11px;color:var(--dim);padding:0 4px}
@media (prefers-reduced-motion:reduce){.bspr,.bpop,.bflash,.bstage{animation-duration:.01s!important;transition:none!important}}
.slotline{font-size:12px;margin-bottom:7px;line-height:1.3}
.slotline .dim{letter-spacing:1px;text-transform:uppercase;font-size:10px}
/* the tag on goods a street doc had to remove */
.tagmark{display:inline-block;border:1px dashed var(--yellow);color:var(--yellow);font-size:10px;line-height:1.3;letter-spacing:.5px;
  padding:0 4px;text-transform:none;font-weight:400;white-space:nowrap}

</head>

// ---------- storage ----------
// There are up to MAX_SAVES save files. Each has its own career and its own run in progress, stored
// under 'zdh-career-<n>' and 'zdh-save-<n>'. 'zdh-slots' lists them ({n: {name, t: last played}}) and
// 'zdh-last' is the one played most recently. The hall of fame ('zdh-scores') is shared.
const MAX_SAVES = 5;
let slot = 0;   // the save file in use; 0 until one is chosen from the start menu, and nothing is saved until then
const perSave = key => key === 'zdh-save' || key === 'zdh-career';
const store = {
  // n: read or write another save file's copy instead of the one in use.
  get(key, n) { try { return JSON.parse(localStorage.getItem(perSave(key) ? `${key}-${n || slot}` : key)); } catch (e) { return null; } },
  set(key, value, n) {
    if (perSave(key) && !(n || slot)) return;
    try { localStorage.setItem(perSave(key) ? `${key}-${n || slot}` : key, JSON.stringify(value)); } catch (e) {}
  },
  del(key, n) { try { localStorage.removeItem(perSave(key) ? `${key}-${n || slot}` : key); } catch (e) {} },
};
function saveList() {
  const m = store.get('zdh-slots');
  return m && typeof m === 'object' && !Array.isArray(m) ? m : {};
}
// Note that the save file in use was just played (and name it, when it is new).
function touchSave(name) {
  if (!slot) return;
  const m = saveList();
  m[slot] = {name: name || (m[slot] && m[slot].name) || 'anon', t: Date.now()};
  store.set('zdh-slots', m);
  store.set('zdh-last', slot);
}
const save = () => { if (!AUTO && slot) { store.set('zdh-save', S); touchSave(); } };
// A game from before there were save files becomes save 1.
// The old copy is left where it was, so a build from before save files still finds its game.
function adoptOldSave() {
  try {
    if (localStorage.getItem('zdh-slots')) return;
    const c = localStorage.getItem('zdh-career'), r = localStorage.getItem('zdh-save');
    if (!c && !r) return;
    if (c) localStorage.setItem('zdh-career-1', c);
    if (r) localStorage.setItem('zdh-save-1', r);
    localStorage.setItem('zdh-slots', JSON.stringify({1: {name: 'anon', t: Date.now()}}));
    localStorage.setItem('zdh-last', '1');
  } catch (e) {}
}

const SND = (() => {
  const prefs = Object.assign({music: true, sfx: true}, store.get('zdh-sound') || {});
  const MUSIC_VOL = 0.2, SFX_VOL = 0.55;   // the music sits well under the effects
  let ctx = null, musicBus, sfxBus, echo, noiseBuf, voiceBuf = null;
  let mood = 'calm', step = 0, nextAt = 0;
  const hz = note => 440 * Math.pow(2, (note - 69) / 12);

  // Browsers only allow sound after a tap or a key press, so this runs on the first one.
  function wake() {
    if (AUTO) return false;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { ctx = new AC(); } catch (e) { return false; }
      const out = ctx.createDynamicsCompressor();
      out.connect(ctx.destination);
      musicBus = ctx.createGain(); sfxBus = ctx.createGain();
      musicBus.gain.value = prefs.music ? MUSIC_VOL : 0;
      sfxBus.gain.value = prefs.sfx ? SFX_VOL : 0;
      musicBus.connect(out); sfxBus.connect(out);
      // A dark echo for the arpeggios.
      echo = ctx.createDelay(1); echo.delayTime.value = 0.3;
      const damp = ctx.createBiquadFilter(), back = ctx.createGain();
      damp.type = 'lowpass'; damp.frequency.value = 1800; back.gain.value = 0.4;
      echo.connect(damp); damp.connect(back); back.connect(echo); damp.connect(musicBus);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      try {
        const raw = atob(VOICE_IM_IN), bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        ctx.decodeAudioData(bytes.buffer, buf => { voiceBuf = buf; }, () => {});
      } catch (e) {}
      setInterval(tick, 50);
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume();
    return true;
  }

  // One note. o: type, vol, to (glide to this pitch), cut / cutTo (low-pass), attack, echo
  function tone(bus, t, freq, dur, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = osc;
    if (o.cut) {
      const flt = ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(o.cut, t);
      if (o.cutTo) flt.frequency.exponentialRampToValueAtTime(o.cutTo, t + dur);
      osc.connect(flt);
      last = flt;
    }
    last.connect(g); g.connect(bus);
    if (o.echo) g.connect(echo);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  // A burst of filtered noise. o: type (filter), f, to (sweep the filter), q, vol, attack
  function hiss(bus, t, dur, o = {}) {
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    flt.type = o.type || 'highpass';
    flt.frequency.setValueAtTime(o.f || 6000, t);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.q) flt.Q.value = o.q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  // ----- music: a step sequencer that schedules a little ahead of the clock -----
  function playStep(t) {
    const M = MOODS[mood], i = step % 16, bar = Math.floor(step / 16), len = 60 / M.bpm / 4;
    const [root, third] = M.prog[bar % M.prog.length];
    const parts = M.parts[Math.floor(bar / 4) % M.parts.length];
    const base = M.key + root;
    if (parts.includes('d')) {
      if (M.kick[i] === 'x') tone(musicBus, t, 150, 0.2, {type: 'sine', to: 42, vol: 0.6});
      if (M.snare[i] === 'x') {
        hiss(musicBus, t, 0.13, {type: 'bandpass', f: 1900, q: 0.8, vol: 0.28});
        tone(musicBus, t, 190, 0.08, {type: 'triangle', to: 110, vol: 0.18});
      }
      if (M.hat[i] === 'x') hiss(musicBus, t, 0.03, {f: 8000, vol: i % 4 === 2 ? 0.1 : 0.05});
    }
    if (parts.includes('b') && M.bass[i] >= '0') {
      tone(musicBus, t, hz(base + 12 * M.bass[i]), len * 1.8, {type: 'sawtooth', cut: 520, cutTo: 160, vol: 0.3});
    }
    if (parts.includes('a') && M.arp[i] >= '0') {
      tone(musicBus, t, hz(base + 24 + [0, third, 7, 12][M.arp[i]]), len * 1.6,
        {type: M.wave, vol: M.wave === 'sine' ? 0.16 : 0.055, cut: 2600, echo: true});
    }
    if (parts.includes('p') && i === 0) {
      for (const n of [0, third, 7]) {
        for (const detune of [-7, 7]) {
          tone(musicBus, t, hz(base + 12 + n), len * 17, {type: 'sawtooth', detune, cut: 700, vol: 0.035, attack: len * 5});
        }
      }
    }
  }
  function tick() {
    if (!ctx || ctx.state !== 'running' || !prefs.music) return;
    if (nextAt < ctx.currentTime) nextAt = ctx.currentTime + 0.05;
    while (nextAt < ctx.currentTime + 0.25) {
      playStep(nextAt);
      nextAt += 60 / MOODS[mood].bpm / 4;
      step++;
    }
  }

  // ----- effects -----
  const run = (t, notes, gap, dur, o) => notes.forEach((f, i) => tone(sfxBus, t + i * gap, f, dur, o));
  const FX = {
    click: t => tone(sfxBus, t, 1500, 0.03, {vol: 0.05}),
    buy: t => run(t, [330, 247], 0.06, 0.09, {type: 'triangle', vol: 0.25}),
    cash: t => { tone(sfxBus, t, 988, 0.07, {vol: 0.12}); tone(sfxBus, t + 0.07, 1319, 0.3, {vol: 0.12}); },
    loss: t => tone(sfxBus, t, 220, 0.28, {type: 'sawtooth', to: 104, cut: 1200, vol: 0.2}),
    deny: t => tone(sfxBus, t, 110, 0.2, {vol: 0.14, cut: 900}),
    travel: t => {
      hiss(sfxBus, t, 1.0, {type: 'bandpass', f: 300, to: 4200, q: 2, vol: 0.3, attack: 0.5});
      tone(sfxBus, t, 70, 1.0, {type: 'sawtooth', to: 300, cut: 700, vol: 0.14, attack: 0.3});
    },
    shoot: t => {
      hiss(sfxBus, t, 0.22, {type: 'lowpass', f: 6000, to: 300, vol: 0.5});
      tone(sfxBus, t, 170, 0.15, {type: 'sine', to: 40, vol: 0.45});
    },
    thud: t => { tone(sfxBus, t, 110, 0.14, {type: 'sine', to: 45, vol: 0.5}); hiss(sfxBus, t, 0.06, {type: 'lowpass', f: 900, vol: 0.3}); },
    miss: t => hiss(sfxBus, t, 0.14, {type: 'bandpass', f: 2200, to: 6500, q: 3, vol: 0.14}),
    emp: t => {
      tone(sfxBus, t, 1900, 0.7, {type: 'sawtooth', to: 40, vol: 0.2});
      hiss(sfxBus, t, 0.6, {type: 'bandpass', f: 3500, to: 200, q: 1, vol: 0.25});
    },
    hack: t => { for (let i = 0; i < 9; i++) tone(sfxBus, t + i * 0.045, 600 + Math.random() * 2400, 0.04, {vol: 0.09}); },
    bomb: t => {
      FX.hack(t);
      tone(sfxBus, t + 0.4, 90, 0.5, {type: 'sine', to: 30, vol: 0.6});
      hiss(sfxBus, t + 0.4, 0.4, {type: 'lowpass', f: 2500, to: 150, vol: 0.4});
    },
    hurt: t => {
      tone(sfxBus, t, 230, 0.3, {type: 'sawtooth', to: 55, cut: 900, vol: 0.28});
      hiss(sfxBus, t, 0.1, {type: 'lowpass', f: 1200, vol: 0.3});
    },
    heal: t => run(t, [440, 554, 659, 880], 0.08, 0.2, {type: 'triangle', vol: 0.18}),
    alarm: t => run(t, [880, 660, 880, 660], 0.15, 0.14, {vol: 0.11, cut: 3000}),
    win: t => { run(t, [523, 659, 784], 0.1, 0.12, {vol: 0.12}); tone(sfxBus, t + 0.3, 1047, 0.5, {vol: 0.12}); },
    lose: t => run(t, [392, 330, 262, 196], 0.16, 0.3, {type: 'sawtooth', cut: 1100, vol: 0.2}),
    level: t => {
      run(t, [523, 659, 784, 1047, 1319], 0.09, 0.16, {vol: 0.1});
      run(t, [262, 330, 392, 523, 659], 0.09, 0.3, {type: 'triangle', vol: 0.18});
    },
    loot: t => run(t, [1319, 1568, 2093], 0.07, 0.25, {type: 'triangle', vol: 0.16}),
    sleep: t => run(t, [440, 330, 262], 0.35, 0.6, {type: 'sine', vol: 0.2, attack: 0.05}),
    gone: t => tone(sfxBus, t, 160, 2.2, {type: 'sawtooth', to: 35, cut: 800, cutTo: 120, vol: 0.3, attack: 0.1}),
    // The recorded line, with one quiet echo behind it.
    imin: t => {
      if (!voiceBuf) return;
      const src = ctx.createBufferSource(), g = ctx.createGain(), late = ctx.createDelay(0.5), wet = ctx.createGain();
      src.buffer = voiceBuf;
      g.gain.value = 1; late.delayTime.value = 0.17; wet.gain.value = 0.28;
      src.connect(g); g.connect(sfxBus); g.connect(late); late.connect(wet); wet.connect(sfxBus);
      src.start(t);
    },
  };

  document.addEventListener('pointerdown', e => {
    if (!wake()) return;
    const el = e.target.closest && e.target.closest('button,[data-pick],[data-act]');
    if (el && !el.disabled) api.play('click');
  }, true);
  document.addEventListener('keydown', wake, true);
  // Go quiet when the game is in the background (phone locked, app switched away).
  document.addEventListener('visibilitychange', () => {
    if (ctx) document.hidden ? ctx.suspend() : ctx.resume();
  });

  const api = {
    prefs,
    battle: null,   // 'fight' or 'raid' while a confrontation is on
    state: () => ({audio: ctx ? ctx.state : 'off', mood, step, voice: !!voiceBuf}),   // for testing
    play(name, delay) {
      if (AUTO || !ctx || !prefs.sfx || ctx.state !== 'running') return;
      FX[name](ctx.currentTime + (delay || 0));
    },
    // Pick the music for what is going on right now.
    sync() {
      if (AUTO) return;
      const want = api.battle || (S.loc === BUNKER ? 'bunker' : S.heat >= 60 || S.day >= DAYS ? 'tense' : 'calm');
      if (want !== mood) { mood = want; step = 0; }
    },
    toggle(key) {
      prefs[key] = !prefs[key];
      store.set('zdh-sound', prefs);
      if (!wake()) return;
      const bus = key === 'music' ? musicBus : sfxBus, vol = key === 'music' ? MUSIC_VOL : SFX_VOL;
      bus.gain.setTargetAtTime(prefs[key] ? vol : 0, ctx.currentTime, 0.05);
    },
  };
  return api;
})();

// ---------- career: XP, levels and syndicate carry over between runs ----------
// stats: running counts of things you have done (see tally()). ach: achievements earned, {id: when}.
const newCareer = () => ({xp: 0, syn: null, gear: {}, bag: [], locker: [], stats: {}, ach: {}, rep: {}});
let career = newCareer(), pendingLevel = 0;

function levelInfo(total) {
  let xp = total === undefined ? career.xp : total, level = 1, need = 100;
  while (xp >= need) { xp -= need; level++; need = 100 * level; }
  return {level, into: xp, need};
}
const level = () => levelInfo().level;
const inSyn = key => career.syn === key;
const debtRate = () => inSyn('ledger') ? 0.04 : DEBT_RATE;
const walletRate = () => inSyn('ledger') ? 0.06 : WALLET_RATE;
const pct = rate => Math.round(rate * 100);

// Adds XP and returns a snippet to append to a log line.
function gainXp(n) {
  n = Math.floor(n * (inSyn(HIDDEN_SYN) ? 1.25 : 1));
  if (n <= 0) return '';
  const before = level();
  career.xp += n;
  S.xpRun = (S.xpRun || 0) + n;
  if (!AUTO) store.set('zdh-career', career);
  if (level() > before) pendingLevel = level();
  return ` <span class="cyan">+${n} XP</span>`;
}

// The crews you can see: the hidden one only once you hold the achievement that reveals it.
const openSyns = () => Object.keys(SYNDICATES).filter(k => k !== HIDDEN_SYN || career.ach[KEY_ACH]);

async function joinSyndicate(key) {
  career.syn = key;
  career.quest = null;
  fixQuest();
  if (!AUTO) store.set('zdh-career', career);
  log(`<span class="cyan">You joined ${SYNDICATES[key][0]}.</span>`);
  await alertDlg(SYNDICATES[key][0], `<p>You're in. ${SYNDICATES[key][1]}</p>` +
    `<p>Your handler is <b>${HANDLER[key]}</b>. The crew has work for you: its missions pay big XP, cash and gear.</p>`);
  await questBrief();
}

async function chooseSyndicate() {
  const keys = openSyns();
  const html = `<p>You are level 10. ${keys.length === 4 ? 'Four' : 'Five'} syndicates want you. The choice is permanent.</p>` +
    keys.map(k => `<div class="syn"><b>${SYNDICATES[k][0]}</b>${k === HIDDEN_SYN ? ' <span class="amber">hidden</span>' : ''}<br>${SYNDICATES[k][1]}</div>`).join('');
  const buttons = keys.map(k => [SYNDICATES[k][0], k]);
  buttons.push(['Decide later', null, 'small']);
  const key = await dialog('Join a syndicate', html, buttons);
  if (key) await joinSyndicate(key);
}

// The hidden syndicate gets in touch once you have earned its achievement. It is the one crew you can
// leave another crew for.
async function hiddenInvite() {
  const name = SYNDICATES[HIDDEN_SYN][0];
  if (inSyn(HIDDEN_SYN)) return;
  if (level() < 10) {
    return alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Reach level 10 and we will talk."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, will be on the list when you choose a crew.</p>`);
  }
  if (!career.syn) {
    await alertDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. There is a place for you."</p>` +
      `<p class="dim">A hidden syndicate, the <b>${name}</b>, is now on the list.</p>`);
    return chooseSyndicate();
  }
  const old = SYNDICATES[career.syn][0];
  if (await confirmDlg('UNKNOWN SENDER', `<p>A message with no headers: "We saw what you did. Walk away from ${old}. There is a place for you."</p>` +
    `<div class="syn"><b>${name}</b><br>${SYNDICATES[HIDDEN_SYN][1]}</div>` +
    `<p class="dim">Leaving ${old} is permanent: you lose its perk and its missions, and start the ${name} line from the top. ` +
    'You can also answer later, from your record.</p>', `Join the ${name}`, 'Not now')) await joinSyndicate(HIDDEN_SYN);
}

async function levelUpCheck() {
  await questCheck();
  await gigCheck();
  if (pendingLevel) {
    const l = pendingLevel;
    pendingLevel = 0;
    SND.play('level');
    log(`<span class="cyan">LEVEL UP: level ${l}, ${titleFor(l)}.</span>`);
    render();
    await alertDlg('LEVEL UP', `<p>You reached <b>level ${l}</b>: <span class="cyan">${titleFor(l)}</span>.</p>` +
      '<p class="dim">Each level (up to 10) adds 1% to your freelance job success chance.</p>');
    if (l >= 10 && !career.syn) await chooseSyndicate();
  }
  await achCheck();
  if (pendingLevel) return levelUpCheck();   // an achievement's XP was enough for another level
}

// Award anything newly earned. Runs after every action.
async function achCheck() {
  for (const [id, [name, how, xp, test]] of Object.entries(ACH)) {
    if (career.ach[id]) continue;
    let earned = false;
    try { earned = !!test(); } catch (e) {}
    if (!earned) continue;
    career.ach[id] = Date.now();
    achTally++;
    const got = gainXp(xp);

  }
}

function fixQuest() {
  const q = career.quest;
  if (!career.syn) career.quest = null;
  else if (!q || !Number.isInteger(q.n) || q.n < 0 || !(q.p >= 0)) career.quest = {n: 0, p: 0, v: 2};
  else if (q.v !== 2) { q.p = 0; q.v = 2; }   // the lines were rewritten: keep the place, restart that mission's count
}
// Fill in whatever a career from an older version lacks.
function fixCareer() {
  if (!career.stats || typeof career.stats !== 'object') career.stats = {};
  if (!career.ach || typeof career.ach !== 'object') career.ach = {};
  if (!Array.isArray(career.locker)) career.locker = [];
  fixQuest();
}
// A standing order: a repeatable job once the chain is done.
const newOrder = () => pick([{kind: 'jobs', t: rnd(2, 4)}, {kind: 'profit', t: rnd(2, 6) * 50000}, {kind: 'law', t: rnd(2, 3)},
  {kind: 'raid', t: rnd(2, 3)}, {kind: 'kills', t: rnd(6, 12)}, {kind: 'cool', t: rnd(2, 4)}]);
// The mission you are on, or null if you are not in a syndicate.
function quest() {
  const q = career.quest;
  if (!career.syn || !q) return null;
  const chain = QUESTS[career.syn];
  if (q.n < chain.length) {
    const [title, brief, kind, t, good, place] = chain[q.n], [xp, cash, rar] = QUEST_PAY[q.n];
    return {title, brief, kind, t, good, place, xp, cash, rar};
  }
  if (!q.o || !q.o.kind || !(q.o.t > 0)) q.o = newOrder();
  // A standing order is worth 60% of the level you are working on, so it stays useful however high you climb.
  return {title: 'Standing orders', brief: 'You have done everything I asked. The crew still has work, and it still pays.',
    kind: q.o.kind, t: q.o.t, xp: 60 * level(), cash: 10000, rar: -1, order: true};
}
function questGoal(Q) {
  const t = Q.t, times = `${t} time${t === 1 ? '' : 's'}`, s = t === 1 ? '' : 's';
  const text = {
    jobs: `Pull off ${t} freelance job${s}`,
    quietjob: `Pull off ${t} freelance job${s} while your Heat is under 30%`,
    profit: `Make ${money(t)} profit selling goods`,
    spike: `Sell at a profit into a price spike (&#9650;), ${times}`,
    interest: `Earn ${money(t)} in cold wallet interest`,
    loot: `Take ${money(t)} out of rival nodes (Hack a rival)`,
    law: `Beat the law or get away from it ${times}`,
    escape: `Get away from the law ${times}, by running or with smoke`,
    smuggle: `Get away from the law ${times} while carrying 50 or more goods`,
    lawwin: `Beat the law in a fight ${times}`,
    cleanwin: `Beat the law ${times} without a weapon or an EMP`,
    fed: `Beat the FBI or the NSA in a fight ${times}`,
    nsawin: `Beat the NSA in a fight ${times}`,
    raid: `Clean out ${t} rival node${s} (Hack a rival)`,
    raidall: `Clean out a node belonging to ${t} different rival crews`,
    kills: `Knock ${t} rival operators offline, in fights you win`,
    gangwin: `Beat back ${t} rival crew attack${s}`,

    cool: `Go to sleep with your Heat under 20%, ${times}`,
    zeroheat: `Go to sleep with 0% Heat, ${times}`,
    fakeid: `Burn ${t} Fake ID${s}`,

  };
  return text[Q.kind] || Q.kind;
}
// How far along the current mission is. Some missions look at where you stand now, not at a count.
const QUEST_NOW = {wallet: () => S.wallet, debt: () => (S.debt ? 0 : 1), drive: () => cap(), stash: () => stashTotal(),
  proxies: () => S.proxies};
const questProg = Q => (QUEST_NOW[Q.kind] ? QUEST_NOW[Q.kind]() : career.quest.p);
function questStatus(Q) {
  const p = Math.min(Q.t, questProg(Q));
  return Q.kind === 'deliver' ? `you carry ${num(S.inv[Q.good] || 0)} / ${Q.t}`
    : Q.kind === 'boss' ? 'start it from the briefing'
    : Q.kind === 'debt' ? (S.debt ? `you owe ${money(S.debt)}` : 'paid')
    : Q.kind === 'score' ? `best so far ${money(p)}`
    : ['profit', 'wallet', 'interest', 'loot'].includes(Q.kind) ? `${money(p)} / ${money(Q.t)}`
    : `${p} / ${Q.t}`;
}
const questReward = Q => `<span class="cyan">+${num(Q.xp)} XP</span>, ${money(Q.cash)}` +
  (Q.rar >= 0 ? ` and <span class="r${Q.rar}">${RARITY[Q.rar]} gear</span>` : '');
// Something happened that may count toward the current mission.
function questEvent(kind, amount) {
  gigEvent(kind, amount);
  const Q = quest();
  if (!Q || Q.kind !== kind) return;
  const q = career.quest;
  if (kind === 'raidall') {   // amount is the crew that was raided: count each crew once
    q.set = q.set || {};
    q.set[amount] = 1;
    q.p = Object.keys(q.set).length;
  } else {
    q.p = kind === 'score' ? Math.max(q.p, amount) : q.p + amount;
  }
  saveCareer();
}
async function questBrief() {
  const Q = quest();
  if (!Q) return;
  await alertDlg(Q.order ? 'Standing orders' : `Mission ${career.quest.n + 1}: ${Q.title}`,
    `<p class="dim">${HANDLER[career.syn][0].toUpperCase() + HANDLER[career.syn].slice(1)}, ${SYNDICATES[career.syn][0]}:</p><p>"${Q.brief}"</p>` +
    `<div class="syn"><b>${questGoal(Q)}</b><br>Reward: ${questReward(Q)}</div>` +
    '<p class="dim">Your mission is always shown on the main screen. Progress carries over between runs.</p>');
}
// Pay out the current mission if it is done, and hand over the next one.
async function questCheck() {
  for (let Q = quest(); Q && questProg(Q) >= Q.t; Q = quest()) {
    const q = career.quest, crew = SYNDICATES[career.syn][0], who = HANDLER[career.syn];
    const last = !Q.order && q.n === QUESTS[career.syn].length - 1;
    q.n++; q.p = 0; q.o = null; delete q.set;
    questTally++;
    S.cash += Q.cash;
    const xp = gainXp(Q.xp);
    saveCareer();
    log(`<span class="cyan">${crew} mission done: ${Q.title}.</span> Paid ${money(Q.cash)}.${xp}`);
    render();
    await alertDlg('MISSION COMPLETE', `<p><b>${Q.title}</b></p><p>${who[0].toUpperCase() + who.slice(1)} wires you ` +
      `<b>${money(Q.cash)}</b> and the crew's respect: <span class="cyan">+${num(Q.xp)} XP</span>.</p>`);
    if (Q.rar >= 0) await dropLoot(who[0].toUpperCase() + who.slice(1), 0, makeItem(Q.rar));
    else if (Q.order && Math.random() < 0.35) await dropLoot(who[0].toUpperCase() + who.slice(1), 0, makeItem(Math.max(1, rollRarity(25))));
    if (last) {
      await alertDlg(crew, `<p>That was the last thing ${who} had to ask of you. You are inner circle now.</p>` +
        '<p class="dim">From here on the crew hands out standing orders: repeatable jobs that pay more XP the higher your level.</p>');
    }
    await questBrief();
  }
}

// ---------- street contacts: side gigs from people you run into ----------

// one, at any level. You hold one gig at a time and each has a deadline; the gig belongs to the run (S.gig).
// What carries over is how far each contact trusts you (career.rep = gigs done for them): every gig done
// adds 10% to what they pay, up to +50%. Letting one down costs a point of trust.
const CONTACT_ODDS = 0.12, TRUST_MAX = 5;
// name: [who they are, what they say when they stop you, [skin, hair colour, hat, coat], their gigs].
// A gig is [title, pitch, kind]. The kinds are the syndicate mission kinds plus 'courier' (see gigGoal()).
const CONTACTS = {

      ['The tithe', 'The congregation needs an offering. Earn it honestly. Well. Earn it.', 'profit'],

};
let gigTally = 0;   // counted for the self-test

const trust = name => Math.max(0, Math.min(TRUST_MAX, (career.rep && career.rep[name]) || 0));
const trustStars = name => `<span class="amber">${'&#9733;'.repeat(trust(name))}</span>${'&#9734;'.repeat(TRUST_MAX - trust(name))}`;
function addTrust(name, n) {
  career.rep = career.rep && typeof career.rep === 'object' ? career.rep : {};
  career.rep[name] = Math.max(0, Math.min(TRUST_MAX, trust(name) + n));
  saveCareer();
}
const contactSvg = name => junkieSvg([name, 0, 0, ...CONTACTS[name][2]]);
const contactHead = name => `<div class="versus" style="grid-template-columns:86px"><div>${contactSvg(name)}` +
  `<small>${name.toUpperCase()}</small></div></div>`;

// A gig from this contact, sized for where the run is: {who, title, pitch, kind, t (target), p (progress),
// good and place (deliveries), due (the last day it can be done), cash, xp, rar (gear on top, or -1)}.
function makeGig(name) {
  const [title, pitch, kind] = pick(CONTACTS[name][3]);
  const G = {who: name, title, pitch, kind, t: 1, p: 0};
  const elsewhere = () => pick(LOCATIONS.filter(l => l !== BUNKER && l !== S.loc));
  let hard = 1, days = 3, worth = 0;   // how much it pays next to a plain gig, days allowed, and the goods you give up
  if (kind === 'deliver') {
    const [good, low, high] = GOODS[rnd(4, GOODS.length - 1)], avg = (low + high) / 2;
    G.good = good;
    G.t = Math.max(3, Math.min(40, Math.floor(cap() / 2), Math.round((1500 + S.day * 300) / avg)));
    G.place = elsewhere();
    worth = avg * G.t * 1.5;
  } else if (kind === 'courier') { G.place = elsewhere(); days = 2; hard = 0.7; }
  else if (kind === 'jobs') { G.t = rnd(1, 2); hard = G.t; }
  else if (kind === 'law') { days = 5; hard = 1.4; }
  else if (kind === 'raid') { days = 4; hard = 1.5; }
  else if (kind === 'kills') { G.t = rnd(2, 4); days = 5; hard = 0.5 * G.t; }
  else if (kind === 'profit') G.t = (2 + Math.floor(S.day / 3)) * 2500;
  else { G.t = rnd(1, 2); days = G.t + 2; hard = 0.6 * G.t; }   // 'cool'
  G.due = Math.min(DAYS, S.day + days);
  G.cash = Math.round(((1200 + S.day * 350) * hard + worth) * (1 + trust(name) / 10) / 10) * 10;
  G.xp = Math.round((60 + 12 * level()) * Math.max(0.7, hard));
  G.rar = Math.random() < 0.25 ? Math.max(1, Math.min(3, rollRarity(S.day * 0.3 + 10))) : -1;
  return G;
}
const gigGoal = G => G.kind === 'deliver' ? `Bring ${G.t} ${G.good} to ${G.place}`
  : G.kind === 'courier' ? `Carry the package to ${G.place}` : questGoal(G);
const gigStatus = G => G.kind === 'deliver' ? `you carry ${num(S.inv[G.good] || 0)} / ${G.t}`
  : G.kind === 'courier' ? (S.loc === G.place ? 'you are here' : 'not delivered yet')
  : G.kind === 'profit' ? `${money(Math.min(G.t, G.p))} / ${money(G.t)}` : `${Math.min(G.t, G.p)} / ${G.t}`;
const gigDue = G => G.due <= S.day ? '<span class="red">due today</span>'
  : `${G.due - S.day} day${G.due - S.day === 1 ? '' : 's'} left`;
// Something happened that may count toward the gig. Deliveries are handed over by hand instead (ACTIONS.gig).
function gigEvent(kind, amount) {
  const G = S.gig;
  if (G && G.kind === kind && kind !== 'deliver') G.p += amount;
}

// Somebody is waiting where you surface, with work. Take it or leave it.
async function contact() {
  const name = pick(Object.keys(CONTACTS)), [role, line] = CONTACTS[name];
  const G = makeGig(name);
  log(`${name} was waiting for you at ${S.loc}.`);
  render();
  const html = contactHead(name) + `<p class="dim">${role}. Trust: ${trustStars(name)}</p><p>${line}</p>` +
    `<div class="syn"><b>${G.title}</b><br>"${G.pitch}"</div>` +
    `<p><b>${gigGoal(G)}</b><br><span class="amber">You have until the end of day ${G.due}.</span></p>` +
    `<p>Pays: ${questReward(G)}</p>` +
    '<p class="dim">You can hold one gig at a time. Finish it and they trust you more, and pay more next time. ' +
    'Let it run out and they remember that too.</p>';
  const took = await dialog('Someone wants a word', html, [['Take the gig', true, 'primary'], ['Not today', false, 'small']]);
  if (!took) return log(`You told ${name} you were busy.`);
  S.gig = G;
  log(`<span class="amber">Gig taken from ${name}: ${G.title}.</span> ${gigGoal(G)} by the end of day ${G.due}.`);
}

// Pay out the gig if it is done, or lose it if its time ran out.
async function gigCheck() {
  const G = S.gig;
  if (!G) return;
  if (!CONTACTS[G.who] || !(G.t > 0)) { S.gig = null; return; }
  if (G.p >= G.t) {
    S.gig = null;
    gigTally++;
    S.cash += G.cash;
    const xp = gainXp(G.xp), before = trust(G.who);
    addTrust(G.who, 1);
    SND.play('cash');
    log(`<span class="green">Gig done for ${G.who}: ${G.title}.</span> Paid ${money(G.cash)}.${xp}`);
    render();
    await alertDlg('GIG DONE', contactHead(G.who) + `<p><b>${G.title}</b></p><p>${G.who} pays you <b>${money(G.cash)}</b>: ` +
      `<span class="cyan">+${num(G.xp)} XP</span>.</p><p class="dim">Trust: ${trustStars(G.who)}` +
      `${trust(G.who) > before ? '. They will pay more next time.' : ''}</p>`);
    if (G.rar >= 0) await dropLoot(G.who, 0, makeItem(G.rar));
  } else if (S.day > G.due) {
    S.gig = null;
    addTrust(G.who, -1);
    log(`<span class="red">You ran out of time on ${G.who}'s gig: ${G.title}.</span>`);
    render();
    await alertDlg('Gig lost', `<p>The deadline for <b>${G.title}</b> has passed. ${G.who} found someone else, and will remember it.</p>` +
      `<p class="dim">Trust: ${trustStars(G.who)}</p>`, 'danger');
  }
}

// How many goods each item type holds at Common, in the same order as the names in SLOTS. Rarer items
// hold more (x RARITY_MULT). Backpacks hold the most; clothes hold what their pockets would.
// It is worked out from the item's type and rarity, so gear from older saves has it too.
const POCKETS = {
  back: [24, 14, 18, 22, 30, 28, 32, 26],
  legs: [10, 4, 3, 9, 1, 7, 2, 3],
  body: [5, 4, 8, 3, 4, 9, 2, 1],

function carries(it) {
  const table = it && POCKETS[it.slot];
  if (!table) return 0;
  const kind = SLOTS[it.slot][1].findIndex(name => String(it.name).endsWith(name));
  return kind < 0 ? 0 : Math.round(table[kind] * RARITY_MULT[it.rar]);
}
// stat: [what it does, value on a Common item, cap on your total, unit]
const STATS = {
  armor: ['less Health damage', 6, 70, '%'],
  firewall: ['less OpSec damage', 6, 70, '%'],
  aim: ['weapon hit chance', 4, 30, '%'],
  hack: ['hack chance per proxy', 4, 35, '%'],
  speed: ['escape chance', 5, 35, '%'],

  charm: ['freelance job success', 3, 20, '%'],
  storage: ['drive slots', 10, 150, ''],
  regen: ['Health a day', 1, 15, '%'],
  luck: ['fight loot', 8, 100, '%'],
};
const BAG_SIZE = 12, MAX_MED = 5, MED_HEAL = 40;

function makeItem(rar, slot) {
  slot = slot || pick(Object.keys(SLOTS));
  const [, names, pool] = SLOTS[slot];
  const count = Math.min(pool.length, [1, pick([1, 2]), 2, 3, pick([3, 4])][rar]);
  const stats = {};
  for (const key of pool.slice().sort(() => Math.random() - 0.5).slice(0, count)) {
    stats[key] = Math.max(1, Math.round(STATS[key][1] * RARITY_MULT[rar] * (0.8 + Math.random() * 0.4)));
  }
  return {slot, rar, name: `${pick(GEAR_NAMES[rar])} ${pick(names)}`, stats};
}
// boost shifts the odds toward rarer items
function rollRarity(boost) {
  const r = Math.random() * 100 - boost;
  return r < 1 ? 4 : r < 5 ? 3 : r < 15 ? 2 : r < 40 ? 1 : 0;
}
const itemValue = it => 800 * [1, 3, 8, 20, 60][it.rar];
const scrapValue = it => Math.round(itemValue(it) * 0.25);
const bonus = key => Math.min(STATS[key][2],
  Object.values(career.gear).reduce((sum, it) => sum + ((it && it.stats[key]) || 0), 0));
const statLine = (key, v) => `+${v}${STATS[key][3]} ${STATS[key][0]}`;
// What the backpack and the clothes you are wearing hold between them, and the pieces of that.
const bagHolds = () => carries(career.gear.back);
const pocketsHold = () => Object.values(career.gear).reduce((sum, it) => sum + (it && it.slot !== 'back' ? carries(it) : 0), 0);
// The colour for the amount you can carry: the rarity of the backpack you wear, or plain with no bag.
const bagClass = () => (career.gear.back ? 'r' + career.gear.back.rar : 'dim');
// "holds 24" in the item's rarity colour, then its rolled stats.
const holdsLine = it => (POCKETS[it.slot] ? `<span class="r${it.rar}">holds ${carries(it)}</span> ` +
  `<span class="dim">(${it.slot === 'back' ? 'bag' : 'pockets'})</span>` : '');
const itemStats = it => [holdsLine(it)].concat(Object.entries(it.stats).map(([k, v]) => statLine(k, v))).filter(Boolean).join(', ');
const itemHtml = it => withIcon(gearIcon(it), `<b class="r${it.rar}">${it.name}</b> <span class="dim">${RARITY[it.rar]} &middot; ` +
  `${SLOTS[it.slot][0]}</span><br>${itemStats(it)}`);
const saveCareer = () => { if (!AUTO) store.set('zdh-career', career); };

// Item types that used to belong to another slot: [name, old slot, new slot].
const MOVED = [['Gas Mask', 'head', 'face'], ['Smart Watches', 'hands', 'wrist'], ['Carpal Tunnel Braces', 'hands', 'wrist']];
const movedTo = it => (MOVED.find(([name, from]) => it && it.slot === from && String(it.name).endsWith(name)) || [])[2];
// Re-slot moved items in a list (the bag, the locker, a shop's stock).
function reslot(list) {
  for (const it of Array.isArray(list) ? list : []) if (movedTo(it)) it.slot = movedTo(it);
}
// The same for the career: anything worn in its old slot moves to the new one, or into the bag if that is taken.
function reslotCareer() {
  reslot(career.bag); reslot(career.locker);
  for (const [slot, it] of Object.entries(career.gear)) {
    const to = movedTo(it);
    if (!to) continue;
    delete career.gear[slot];
    it.slot = to;
    if (!career.gear[to]) career.gear[to] = it;
    else if (career.bag.length >= BAG_SIZE && career.locker && career.locker.length < LOCKER_SIZE) career.locker.push(it);
    else career.bag.push(it);   // never thrown away, even if that overfills the bag
  }
}

// Everyone starts with a basic item in every slot except the face and the coat, which stay empty until you find something.
const STARTER = {head: [0, 'firewall'], body: [0, 'armor'], hands: [0, 'aim'], feet: [0, 'speed'], deck: [0, 'hack'],
  legs: [0, 'storage'], wrist: [0, 'luck'], shirt: [0, 'regen'], back: [0, 'regen']};
function starterGear() {
  for (const [slot, [index, stat]] of Object.entries(STARTER)) {
    if (!career.gear[slot]) {
      career.gear[slot] = {slot, rar: 0, name: `n00b ${SLOTS[slot][1][index]}`, stats: {[stat]: STATS[stat][1]}};
    }
  }
  saveCareer();
}

// Put an item in the bag, or scrap it for cash if the bag is full.
function stash(it) {
  if (career.bag.length < BAG_SIZE) return career.bag.push(it);
  S.cash += scrapValue(it);
  log(`Bag full: scrapped ${it.name} for ${money(scrapValue(it))}.`);
}

// Pass an item to hand over that exact one (a mission reward) instead of rolling loot.
async function dropLoot(from, boost, gift) {
  const it = gift || makeItem(rollRarity(boost));
  const worn = career.gear[it.slot];
  SND.play('loot');
  log(`${gift ? 'Reward' : 'Loot'} from ${from}: <span class="r${it.rar}">${it.name}</span> (${RARITY[it.rar]}).`);
  const choice = await dialog(gift ? 'Reward!' : 'Loot!', `<p>${from} ${gift ? 'hands you your cut' : 'left something behind'}:</p><div class="syn">${itemHtml(it)}</div>` +
    (worn ? `<p class="dim">You are wearing:</p><div class="syn">${itemHtml(worn)}</div>`
      : `<p class="dim">Your ${SLOTS[it.slot][0].toLowerCase()} slot is empty.</p>`),
    [['Equip it', 'e', 'primary'], ['Put it in the bag', 'b']]);
  const full = choice === 'e' ? tooFull(it.slot, it) : '';
  if (full) {   // it holds less than what you have on, and you are loaded up: it goes in the bag instead
    stash(it);
    await alertDlg('Too much to carry', full + '<p>It goes in your gear bag for now.</p>');
  } else if (choice === 'e') {
    if (worn) stash(worn);
    career.gear[it.slot] = it;
  } else {
    stash(it);
  }
  saveCareer();
}

// ---------- avatar: a figure that wears your gear and shows the state of the run ----------
const RCOL = ['#c9d1d5', '#39ff7a', '#4da3ff', '#c77dff', '#ff9d2e'];
// Looks the player can choose. They belong to the career, so they carry over between runs.
const SKINS = [['Pale', '#f1c9a5', '#d3a27c'], ['Fair', '#e0ac84', '#bd8760'], ['Tan', '#c98f6b', '#a8704f'],
  ['Brown', '#a56c4a', '#855235'], ['Deep', '#7a4a30', '#5e3722'], ['Dark', '#4f2f20', '#3a2115']];
const HAIRSTYLES = ['Crop', 'Mohawk', 'Long', 'Buzz', 'Bald'];
const HAIRCOLS = [['Violet', '#2b1b3f'], ['Black', '#15131c'], ['Brown', '#4a2c1a'], ['Blonde', '#d9b45a'],
  ['Red', '#a8321f'], ['Silver', '#b9c0d0'], ['Teal', '#0f6f78']];
const STREAKS = [['Magenta', '#ff4fd8'], ['Cyan', '#00e5ff'], ['Yellow', '#fcee0a'], ['Green', '#3dff9a'], ['None', null]];
const SYN_COL = {ghost: '#00e5ff', ledger: '#ffd24a', null: '#3dff9a', red: '#ff3b5c', x404: '#c77dff'};
// Cyberware that appears on the avatar as you level up.
const WARE = [[8, 'optic implant'], [9, 'wired forearm'], [20, 'aura'], [25, 'brighter aura'], [30, 'full aura and halo']];
let avSeq = 0;

// The pixel model. figure() draws a person as shapes; sprite() turns that drawing into a small bitmap with big
// square pixels and chunky proportions (big head, wide body, short legs) and shows it scaled up.
// The bitmap is made in the background, so a figure not seen before appears a moment after the rest of the page.
const PX = 6.25, PXW = 32, PXH = 54;   // one pixel in figure units; the sprite's size in pixels (200 x 337.5 units)
const PXTOP = 250;                  // everything above this line bobs
let pxOff = false;                  // set if the browser will not hand back pixels: figures then stay smooth
let pxSeq = 0;
const pxDone = new Map(), pxWait = new Map();   // drawing -> bitmap URL; drawing -> number of the job making it
const pxOn = () => !pxOff && !AUTO;
// Where a height on the drawing ends up on the sprite: the head nearly doubles, the legs shrink.
const pxY = y => !pxOn() ? y : y <= 78 ? y * 150 / 78 : y <= 190 ? 150 + (y - 78) * 100 / 112 : 250 + (y - 190) * 86 / 146;
const pxSrcY = y => y <= 150 ? y * 78 / 150 : y <= 250 ? 78 + (y - 150) * 112 / 100 : 190 + (y - 250) * 146 / 86;
// How much wider things get at a height on the drawing: the head most of all.
const pxWide = y => y <= 64 ? 2 : y >= 92 ? 1.2 : 2 - (y - 64) / 28 * 0.8;
// Moves something drawn around the old head (centre 100,40) onto the sprite's bigger one.
const pxHead = svg => pxOn() ? `<g transform="translate(100 ${pxY(40)}) scale(1.95) translate(-100 -40)">${svg}</g>` : svg;

function pxMake(markup, job) {
  const SS = 2, W = 200 * SS, H = 352 * SS, img = new Image();
  const finish = url => {
    pxWait.delete(markup);
    pxDone.set(markup, url);
    if (pxDone.size > 80) pxDone.delete(pxDone.keys().next().value);
    const fill = () => document.querySelectorAll(`image[data-px="${job}"]`).forEach(el => {
      if (url) { el.setAttribute('href', url); el.removeAttribute('data-px'); return; }
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');   // no bitmap: fall back to the drawing
      g.innerHTML = markup;
      el.replaceWith(g);
    });
    fill(); setTimeout(fill, 80); setTimeout(fill, 500);
  };
  img.onerror = () => { console.warn('pixel avatar: drawing would not load'); finish(''); };
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d', {willReadFrequently: true});
      g.drawImage(img, 0, 0, W, H);
      const from = g.getImageData(0, 0, W, H).data;
      const to = new Uint8ClampedArray(PXW * PXH * 4), solid = new Uint8Array(PXW * PXH), N = 5;
      for (let py = 0; py < PXH; py++) {
        for (let px = 0; px < PXW; px++) {
          // Look at N x N points inside this pixel and keep the colour most of them agree on.
          const votes = new Map();
          let filled = 0;
          for (let j = 0; j < N; j++) {
            const y = pxSrcY((py + (j + 0.5) / N) * PX), sy = Math.round(y * SS);
            if (sy < 0 || sy >= H) continue;
            const wide = pxWide(y);
            for (let i = 0; i < N; i++) {
              const sx = Math.round((100 + ((px + (i + 0.5) / N) * PX - 100) / wide) * SS);
              if (sx < 0 || sx >= W) continue;
              const at = (sy * W + sx) * 4;
              if (from[at + 3] < 128) continue;
              filled++;
              const key = (from[at] >> 4) << 8 | (from[at + 1] >> 4) << 4 | from[at + 2] >> 4;
              const v = votes.get(key) || [0, 0, 0, 0];
              v[0]++; v[1] += from[at]; v[2] += from[at + 1]; v[3] += from[at + 2];
              votes.set(key, v);
            }
          }
          if (filled * 2 < N * N) continue;
          let best = null;
          for (const v of votes.values()) if (!best || v[0] > best[0]) best = v;
          const o = (py * PXW + px) * 4;
          to[o] = best[1] / best[0]; to[o + 1] = best[2] / best[0]; to[o + 2] = best[3] / best[0]; to[o + 3] = 255;
          solid[py * PXW + px] = 1;
        }
      }
      // Small things a vote would lose: the eyes, and the mouth when it shows.
      const spot = (x, y) => { const at = (Math.round(y * SS) * W + Math.round(x * SS)) * 4; return [from[at], from[at + 1], from[at + 2], from[at + 3]]; };
      const cell = (x, y) => Math.floor(pxY(y) / PX) * PXW + Math.floor((100 + (x - 100) * pxWide(y)) / PX);
      for (const x of [93.4, 107.4]) {
        const [r, g, b, a] = spot(x, 40), i = cell(x, 40);
        if (a > 127 && solid[i]) to.set([r, g, b, 255], i * 4);
      }
      for (const x of [96.5, 100, 103.5]) {
        for (let y = 52; y <= 57.5; y += 0.5) {
          const [r, g, b, a] = spot(x, y), i = cell(x, 55);
          if (a > 127 && solid[i] && Math.abs(r - 138) + Math.abs(g - 74) + Math.abs(b - 60) < 40) { to.set([r, g, b, 255], i * 4); break; }
        }
      }
      // A dark outline, one pixel thick, around the whole figure.
      for (let py = 0; py < PXH; py++) {
        for (let px = 0; px < PXW; px++) {
          const i = py * PXW + px;
          if (solid[i]) continue;
          if ((px > 0 && solid[i - 1]) || (px < PXW - 1 && solid[i + 1]) || (py > 0 && solid[i - PXW]) || (py < PXH - 1 && solid[i + PXW])) {
            to.set([11, 10, 25, 255], i * 4);
          }
        }
      }
      const small = document.createElement('canvas');
      small.width = PXW; small.height = PXH;
      small.getContext('2d').putImageData(new ImageData(to, PXW, PXH), 0, 0);
      finish(small.toDataURL());
    } catch (err) {
      console.warn('pixel avatar: off', err);
      pxOff = true;
      finish('');
    }
  };
  // Blinking eyelids are hidden by the page's stylesheet, which a picture does not see.
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 200 352"><style>.av-blink{display:none}.av-w{stroke-width:.6px}.av-w.av-trim{stroke-width:5.4px}.av-w [fill="none"],.av-w [fill="none"] *{stroke-width:.6px}</style>${markup}</svg>`);
}

// The picture for a drawing made by figure(). bob: let the upper body bob (not for poses).
function sprite(markup, bob) {
  if (!pxOn()) return markup;
  const url = pxDone.get(markup);
  if (url === '') return markup;
  let ref;
  if (url) {
    ref = `href="${url}"`;
  } else {
    let job = pxWait.get(markup);
    if (!job) { job = ++pxSeq; pxWait.set(markup, job); pxMake(markup, job); }
    ref = `data-px="${job}"`;
  }
  const im = `<image class="av-px" ${ref} x="0" y="0" width="${PXW * PX}" height="${PXH * PX}" preserveAspectRatio="none"/>`;
  if (!bob) return im;
  // Two windows onto the same picture: the legs stay put, the rest sinks one pixel onto them and comes back.
  const low = PXH * PX - PXTOP;
  return `<svg x="0" y="${PXTOP}" width="200" height="${low}" viewBox="0 ${PXTOP} 200 ${low}">${im}</svg>` +
    `<g class="av-bob"><svg x="0" y="0" width="200" height="${PXTOP}" viewBox="0 0 200 ${PXTOP}">${im}</svg></g>`;
}
// The breathing animation is for the smooth drawing only.
const figClass = () => pxOn() ? '' : ' class="av-fig"';
// Head-and-shoulders crop of the figure's box.
const bustBox = fill => pxOn() ? (fill ? '30 0 140 210' : '30 0 140 162') : fill ? '50 0 100 150' : '50 0 100 116';

function getLook() {
  const L = career.look || {}, ok = (v, n, d) => Number.isInteger(v) && v >= 0 && v < n ? v : d;
  return {skin: ok(L.skin, SKINS.length, 2), hair: ok(L.hair, HAIRSTYLES.length, 0),
    col: ok(L.col, HAIRCOLS.length, 0), streak: ok(L.streak, STREAKS.length, 0)};
}

// Draws one person in a 200 x 352 box. Used for the player and for everyone who comes after them.
// F: {look, gear: {slot: {kind, c, rar, fill}}, syn, level, weapon, emp, hp, mood, gold, ko, cuffs}
function figure(F) {
  const INK = '#0b0a19', EYE = '#1b1426', GOLD = '#ffd24a', CYAN = '#00e5ff';
  const [, SKIN, SHADE] = SKINS[F.look.skin];

  const {head, body, hands, feet, deck, face, legs, wrist, shirt, coat, back} = F.gear;

  const hurt = F.hp <= 35 && !F.ko;
  // A shape and its mirror image, for the left and right side of the body.
  const both = d => `<path d="${d}"/><path d="${d}" transform="translate(200 0) scale(-1 1)"/>`;
  const flip = s => `<g transform="translate(200 0) scale(-1 1)">${s}</g>`;

      '<rect x="38" y="80" width="124" height="42" rx="20"/><path d="M52 81 v40 M148 81 v40" fill="none"/>',
      // Tactical Rucksack: square, with a pouch on each side
      '<path d="M58 58 h84 v106 h-84 z"/>' + both('M46 98 h12 v42 h-12 z') + both('M46 106 h12'),
      // Hiking Pack: taller than you are, with a bedroll on top

    '<path d="M87 200 Q86 250 86 318 M113 200 Q114 250 114 318" stroke="#1d2540" stroke-width="2" fill="none"/>' +

  if (legs) {
    // One fill colour and one drawing per name in SLOTS.legs, in the same order. Long coats hang over them.
    const LEG = 'M74 184 L100 184 L99 200 Q98 250 95 322 L79 322 Q76 250 74 200 Z';
    const SHORT = 'M74 184 L100 184 L99 200 Q98.5 232 98 262 L75.5 262 Q74.5 232 74 200 Z';
    const shin = `<g fill="${SKIN}" stroke="${INK}" stroke-width="1">${both('M76 258 L98 258 Q97 290 95 322 L79 322 Q77 290 76 258 Z')}</g>`;
    out += wear(legs, ['#4a5238', '#3d5f94', '#1d1d26', '#2a2e3f', '#8fb7d9', '#b9a36b', '#15131c', '#a8321f'][legs.kind], [
      // Cargo Pants: a big pocket on each thigh
      both(LEG) + both('M74.5 234 h13 v19 h-13 z') + both('M74.5 240 h13'),
      // Ripped Jeans: knees showing
      both(LEG) + `<g fill="${SKIN}" stroke-width=".8">${both('M80 248 q7 -4 13 0 q-6 5 -13 0 z')}${both('M82 222 q4 -2 8 0 q-4 3 -8 0 z')}</g>` +
        both('M78 300 l6 -2 M80 306 l5 -1'),
      // Track Pants: a stripe down each side
      both(LEG) + `<g fill="none" stroke-width="2.6">${both('M77.5 190 Q78.5 250 81.5 320')}</g>`,
      // Tactical Trousers: knee pads and a thigh strap
      both(LEG) + `<g fill="#151827">${both('M79 250 h17 v15 q-8.5 5 -17 0 z')}</g>` + both('M75 214 h24 M75 219 h24'),
      // Pyjama Bottoms: baggy, striped
      both('M72 184 L100 184 L100 200 Q100 250 98 322 L77 322 Q73 250 72 200 Z') +
        `<g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2">${both('M79 188 Q80 250 82 320 M86 188 Q87 250 88 320 M93 188 Q93 250 93 320')}</g>`,
      // Cargo Shorts, bare shins
      shin + both(SHORT) + both('M75 232 h12 v17 h-12 z') + both('M75 238 h12'),
      // Leather Trousers: tight, shiny
      both(LEG) + `<g fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6">${both('M81 196 Q82 250 84 314')}</g>`,

    // One fill colour and one drawing per name in SLOTS.head, in the same order.
    out += wear(head, ['#3b3f5e', '#2b2f48', head.c, '#1b1e30', '#c9d1d5', '#1d1d26', head.c][head.kind], [

      '<path d="M82 35 Q100 31 118 35 L117 45 Q100 48 83 45 Z" fill-opacity=".6"/>' +
        '<path d="M86 38 h10" stroke="#fff" stroke-opacity=".7" fill="none"/>',
      // Neural Band
      '<path d="M83 27 Q100 22 117 27 L117 33 Q100 28 83 33 Z"/>' +
        `<circle cx="83" cy="30" r="3" fill="${head.c}"/><circle cx="117" cy="30" r="3" fill="${head.c}"/>`,
      // Tinfoil Hat: a crumpled foil cone
      '<path d="M80 31 L91 9 L99 15 L106 2 L112 17 L120 31 Q100 24 80 31 Z"/>' +
        '<path d="M91 9 L95 27 M106 2 L104 26 M112 17 L113 28 M99 15 L99 26" fill="none" stroke-width="1"/>',
      // Gamer Headset with a boom mic
      '<path d="M81 38 Q79 7 100 7 Q121 7 119 38" fill="none" stroke-width="4"/>' +
        '<rect x="76" y="33" width="9" height="16" rx="3.5"/><rect x="115" y="33" width="9" height="16" rx="3.5"/>' +

      '<path d="M85 37 h13 v5 q-6.5 4 -13 0 z M102 37 h13 v5 q-6.5 4 -13 0 z" fill-opacity=".9" stroke-width="1"/>' +
        '<path d="M98 38.5 h4 M85 38 L82 37 M115 38 L118 37" fill="none" stroke-width="1"/>' +
        '<path d="M87.5 38.5 l4 3 M104.5 38.5 l4 3" stroke="#fff" stroke-opacity=".8" fill="none" stroke-width="1"/>',
    ][head.kind]);

  if (F.gold) {   // gold-rimmed shades for a big score
    out += `<path d="M86 37 h12 v4.5 q-6 3.5 -12 0 z M102 37 h12 v4.5 q-6 3.5 -12 0 z" fill="#05060a" stroke="${GOLD}" stroke-width="1.2"/>` +
      `<path d="M98 38.5 h4" stroke="${GOLD}" stroke-width="1.2"/>`;
  }
  if (F.ko) {   // seeing stars
    const star = (x, y) => `<path d="M${x} ${y} l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z"/>`;
    out += `<g fill="#fcee0a" class="av-zap">${star(70, 12)}${star(129, 10)}${star(100, 3)}</g>`;
  }

  // --- Legendary gear throws off sparks ---
  const anchor = {head: [100, 22], body: [100, 120], hands: [49, 206], feet: [100, 322], deck: [152, 182],
    face: [100, 46], legs: [100, 250], wrist: [151, 182], shirt: [100, 150], coat: [72, 232], back: [140, 96]};
  for (const [slot, [x, y]] of Object.entries(anchor)) {
    const p = F.gear[slot];

    for (let i = 0; i < 4; i++) {

        `style="animation-delay:${(-i * 0.55 - x / 90).toFixed(2)}s"/>`;
    }
  }
  return out;
}

// The player. o: {bust} crops to a portrait, {pose} is 'busted', 'down', 'rich' or 'vanished',
// {plain} ignores the state of the run, {mood} forces an expression.
function avatarSvg(o) {
  o = o || {};
  const pose = o.pose || '', quiet = !!pose || !!o.plain, st = S || {}, id = 'av' + (++avSeq);
  const part = slot => {
    const it = career.gear[slot];
    if (!it) return null;
    return {kind: Math.max(0, SLOTS[slot][1].findIndex(name => it.name.endsWith(name))), c: RCOL[it.rar], rar: it.rar};
  };
  const lvl = level(), rich = pose === 'rich';
  const hp = quiet || !Number.isInteger(st.hp) ? 100 : st.hp;
  const opsec = quiet || !Number.isInteger(st.opsec) ? 100 : st.opsec;
  const heat = quiet ? 0 : st.heat || 0;
  // One canister on the belt for each kind of gadget carried, then spares.
  const kinds = [['emp', '#00e5ff'], ['smoke', '#c9d1d5'], ['bomb', '#ff4fd8'], ['fakeid', '#fcee0a']];
  const belt = kinds.filter(([k]) => st[k] > 0).map(([, c]) => c)
    .concat(kinds.flatMap(([k, c]) => Array(Math.max(0, (st[k] || 0) - 1)).fill(c)));
  const F = {look: getLook(), syn: career.syn, level: lvl, weapon: weaponArt(st.weapon || 0), belt, hp,
    gear: Object.fromEntries(Object.keys(SLOTS).map(slot => [slot, part(slot)])),
    mood: pose === 'busted' ? 'ouch' : rich ? 'grin' : o.mood || (quiet ? '' : st.mood) || '',
    gold: rich, ko: pose === 'down', cuffs: pose === 'busted'};
  const grad = (name, c) => `<radialGradient id="${id}${name}"><stop offset="0" stop-color="${c}"/>` +
    `<stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  let defs = '', back = '', front = '', box = '0 0 200 352';

  if (!quiet) back += backdrop(st.loc);
  // Heat: police lights, then a Fed searchlight, then the NSA's crosshair.
  if (heat >= 75) {
    defs += grad('n', '#ff3b5c');
    back += `<ellipse cx="100" cy="352" rx="150" ry="240" fill="url(#${id}n)" opacity=".5"/>`;
    front += pxHead('<g class="av-reticle" fill="none" stroke="#ff3b5c" stroke-width="1.6"><circle cx="100" cy="40" r="27"/>' +
      '<path d="M100 5 v17 M100 58 v17 M65 40 h17 M118 40 h17"/><circle cx="100" cy="40" r="2" fill="#ff3b5c"/></g>');
  } else if (heat >= 40) {
    defs += grad('c', '#4da3ff');
    back += `<ellipse cx="100" cy="0" rx="150" ry="150" fill="url(#${id}c)" opacity=".3"/>` +
      '<path class="av-search" d="M100 -12 L34 352 L138 352 Z" fill="#dfe8ff" opacity=".13"/>';
  } else if (heat >= 20) {
    defs += grad('r', '#ff3b5c') + grad('c', '#4da3ff');
    back += `<g class="av-cops"><ellipse class="a" cx="10" cy="60" rx="120" ry="170" fill="url(#${id}r)"/>` +
      `<ellipse class="b" cx="190" cy="60" rx="120" ry="170" fill="url(#${id}c)"/></g>`;
  }
  // Level aura: Ghost in the Wire (20), Root (25), Legend of the Wire (30). A big score gets a gold one.
  const aura = pose && !rich ? 0 : rich || lvl >= 30 ? 3 : lvl >= 25 ? 2 : lvl >= 20 ? 1 : 0;
  if (aura) {
    defs += grad('a', rich ? '#ffd24a' : '#ff4fd8');
    back += `<g class="av-aura"><ellipse cx="100" cy="150" rx="${75 + aura * 10}" ry="${150 + aura * 14}" ` +
      `fill="url(#${id}a)" opacity="${(0.3 + aura * 0.13).toFixed(2)}"/></g>`;
    if (aura === 3) {
      back += pxHead(`<ellipse class="av-ring" cx="100" cy="40" rx="34" ry="34" fill="none" stroke="${rich ? '#ffd24a' : '#00e5ff'}" ` +
        'stroke-width="1.6" stroke-dasharray="4 7" opacity=".8"/>');
    }
  }

  const ghost = career.syn === 'ghost' && pose !== 'vanished'
    ? ' style="opacity:.78;filter:drop-shadow(0 0 2.5px #00e5ff)"' : '';
  const shadow = '<ellipse cx="100" cy="337" rx="60" ry="8" fill="rgba(255,79,216,.2)"/>';
  let fig = sprite(figure(F), !pose);
  if (pose === 'down') {
    // Flat on the ground.
    box = '0 0 352 200';
    fig = '<ellipse cx="176" cy="190" rx="165" ry="8" fill="rgba(255,79,216,.2)"/>' +
      `<g transform="translate(0 232) rotate(-90)"${ghost}>${fig}</g>`;
  } else if (pose === 'vanished') {
    // Nothing left but an outline and a file stamp.
    fig = `<g style="filter:brightness(0) drop-shadow(0 0 2px #ff3b5c);opacity:.9">${fig}</g>`;
    front += '<g class="av-static"><rect x="0" y="34" width="200" height="4" fill="#ff3b5c"/><rect x="0" y="150" width="200" height="3" fill="#00e5ff"/>' +
      '<rect x="0" y="250" width="200" height="6" fill="#ff3b5c"/></g>' +
      pxHead('<rect x="78" y="34" width="44" height="11" fill="#000" stroke="#ff3b5c"/>') +
      '<g transform="rotate(-8 100 150)"><rect x="42" y="138" width="116" height="24" fill="#000" stroke="#ff3b5c" stroke-width="2"/>' +
      '<text x="100" y="156" text-anchor="middle" fill="#ff3b5c" font-size="18" font-weight="bold" font-family="monospace">REDACTED</text></g>';
  } else {
    fig = `<g${figClass()}${ghost}>${fig}</g>`;
    if (opsec <= 50) {
      // Your cover is failing: the picture tears.
      fig = `<g class="av-shake${opsec <= 25 ? ' bad' : ''}">${fig}</g>`;
      const bars = opsec <= 25 ? [[34, 5, '#00e5ff'], [70, 3, '#ff2a6d'], [118, 6, '#00e5ff'], [176, 4, '#ff2a6d'], [238, 7, '#00e5ff'], [296, 4, '#ff2a6d']]
        : [[46, 4, '#00e5ff'], [96, 3, '#ff2a6d'], [210, 5, '#00e5ff']];

// ---------- state helpers ----------
// ---------- the prison pocket ----------
// Cornered by the law, you can hide a few small goods where nobody wants to look: they survive a search,
// an arrest and a drive wipe. Each time, some of them may not come back out. Stuck goods (S.stuck) still
// count as carried but cannot be sold, used or moved until a street doc removes them; left in, they give
// you dysentery (S.sick counts the nights slept on them). Goods a doc has removed are tagged for good:
// S.tag[name] says how many of S.inv[name] carry the tag (S.stashTag the same for the Bunker stash), so
// tagged and clean ones of a kind share one stack, and the tagged ones sell for less.
const POCKET_CAP = 6, STUCK_ODDS = 0.35, EXTRACT_FEE = 2000, SICK_DAYS = 6;
const TAG = 'discount because reasons', TAG_CUT = 0.2;
// What fits, and why the rest does not.
const POCKET_NO = {'Botnet Hours': 'you cannot hide time', 'Phishing Kits': 'the kit includes a laminator',
  'Rogue APs': 'it has antennas'};
const stuckTotal = () => Object.values(S.stuck || {}).reduce((a, b) => a + b, 0);
const tagged = name => Math.min((S.tag && S.tag[name]) || 0, S.inv[name] || 0);
const tagPrice = price => Math.floor(price * (1 - TAG_CUT));
const tagHtml = `<span class="tagmark">${TAG}</span>`;
// Keep the tag counts inside what is actually held: goods can leave in bulk (a wipe, an arrest, a robbery).
function fixTags() {
  for (const [tags, held] of [[S.tag, S.inv], [S.stashTag, S.stash]]) {
    for (const name of Object.keys(tags || {})) {
      tags[name] = Math.min(tags[name], held[name] || 0);
      if (!(tags[name] > 0)) delete tags[name];
    }
  }
}
const sickLeft = () => SICK_DAYS - (S.sick || 0);
const nights = n => `${n} more night${n === 1 ? '' : 's'}`;
const stuckList = () => Object.entries(S.stuck).map(([name, q]) => `${num(q)} ${name}`).join(', ');
const docSpots = () => GEAR_SPOTS.join(' or ');

const used = () => Object.values(S.inv).reduce((a, b) => a + b, 0) + stuckTotal();
// What you can carry: the drive in your pocket, plus what your backpack and your clothes hold.
const cap = () => S.drive + (inSyn('null') ? 60 : 0) + bonus('storage') + bagHolds() + pocketsHold();
// What you could carry with `it` worn in `slot` instead of what is there now (null: with nothing there).
function capWith(slot, it) {
  const worn = career.gear[slot];
  if (it) career.gear[slot] = it; else delete career.gear[slot];
  const n = cap();
  if (worn) career.gear[slot] = worn; else delete career.gear[slot];
  return n;
}
let fullTally = 0;   // counted for the self-test
// Changing clothes cannot leave you holding more than you can carry. Returns the reason, or '' if it is fine.
function tooFull(slot, it) {
  const room = capWith(slot, it), over = used() - room;
  if (over <= 0) return '';
  fullTally++;
  const worn = career.gear[slot];
  return `<p>You are carrying <b>${num(used())}</b> goods. ${it ? `In the ${it.name}` : `Without the ${worn.name}`} ` +
    `you could only carry <b>${num(room)}</b>.</p>` +
    `<p class="dim">Sell, stash or dump ${num(over)} first. Nobody is going to hold them for you while you change.</p>`;
}
// The amount carried, coloured by the backpack. The total after it, the same way.
const driveHtml = () => `<b class="${bagClass()}">${num(used())}/${num(cap())}</b>`;
// Where the carrying space comes from, piece by piece.
function capLines() {
